<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);font-family:'Inter',system-ui,sans-serif;">

  <div style="width:360px;background:#ffffff;border-radius:24px;overflow:hidden;box-shadow:0 32px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(255,255,255,0.05);position:relative;">

    <!-- Cover Banner -->
    <div style="height:110px;background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);position:relative;overflow:hidden;">
      <div style="position:absolute;top:-30px;right:-30px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.08);"></div>
      <div style="position:absolute;bottom:-50px;left:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,0.06);"></div>
      <!-- Menu icon -->
      <button style="position:absolute;top:16px;right:16px;background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:6px 8px;cursor:pointer;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:3px;align-items:center;">
        <span style="display:block;width:14px;height:1.5px;background:#fff;border-radius:2px;"></span>
        <span style="display:block;width:14px;height:1.5px;background:#fff;border-radius:2px;"></span>
        <span style="display:block;width:14px;height:1.5px;background:#fff;border-radius:2px;"></span>
      </button>
    </div>

    <!-- Avatar -->
    <div style="display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px;margin-top:-40px;position:relative;z-index:2;">
      <div style="position:relative;">
        <div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#f093fb,#f5576c);border:4px solid #fff;box-shadow:0 8px 20px rgba(240,93,251,0.35);display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" style="width:80px;height:80px;">
            <rect width="80" height="80" fill="url(#avatarGrad)"/>
            <defs>
              <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#f093fb"/>
                <stop offset="100%" style="stop-color:#764ba2"/>
              </linearGradient>
            </defs>
            <circle cx="40" cy="30" r="14" fill="rgba(255,255,255,0.9)"/>
            <ellipse cx="40" cy="68" rx="22" ry="16" fill="rgba(255,255,255,0.9)"/>
          </svg>
        </div>
        <!-- Online badge -->
        <span style="position:absolute;bottom:4px;right:4px;width:14px;height:14px;background:#22c55e;border-radius:50%;border:2.5px solid #fff;box-shadow:0 0 0 3px rgba(34,197,94,0.2);"></span>
      </div>
      <!-- Follow button -->
      <button style="margin-bottom:8px;padding:9px 22px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:50px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.3px;box-shadow:0 6px 16px rgba(102,126,234,0.45);transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 10px 24px rgba(102,126,234,0.55)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 6px 16px rgba(102,126,234,0.45)'">
        + Follow
      </button>
    </div>

    <!-- Name & Title -->
    <div style="padding:14px 24px 0;">
      <div style="display:flex;align-items:center;gap:8px;">
        <h2 style="margin:0;font-size:20px;font-weight:700;color:#0f172a;letter-spacing:-0.4px;">Aria Nakamura</h2>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" stroke="#667eea" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p style="margin:4px 0 0;font-size:13px;font-weight:500;color:#7c3aed;letter-spacing:0.2px;">Product Designer & Creative Lead</p>
      <div style="display:flex;align-items:center;gap:5px;margin-top:6px;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
          <path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke="#94a3b8" stroke-width="2"/>
        </svg>
        <span style="font-size:12px;color:#94a3b8;font-weight:400;">San Francisco, CA</span>
      </div>
    </div>

    <!-- Bio -->
    <div style="padding:16px 24px 0;">
      <p style="margin:0;font-size:13.5px;line-height:1.7;color:#475569;font-weight:400;">Crafting intuitive experiences that live at the intersection of art and function. 5× Dribbble award winner. Open to collaborations. ✦</p>
    </div>

    <!-- Tags -->
    <div style="display:flex;gap:7px;flex-wrap:wrap;padding:14px 24px 0;">
      <span style="padding:4px 11px;background:#f1f5f9;border-radius:50px;font-size:11.5px;font-weight:500;color:#475569;">UI/UX</span>
      <span style="padding:4px 11px;background:#ede9fe;border-radius:50px;font-size:11.5px;font-weight:500;color:#7c3aed;">Figma</span>
      <span style="padding:4px 11px;background:#fdf2f8;border-radius:50px;font-size:11.5px;font-weight:500;color:#be185d;">Brand</span>
      <span style="padding:4px 11px;background:#f0fdf4;border-radius:50px;font-size:11.5px;font-weight:500;color:#15803d;">Motion</span>
    </div>

    <!-- Divider -->
    <div style="margin:20px 24px 0;height:1px;background:linear-gradient(to right,transparent,#e2e8f0,transparent);"></div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:18px 12px;">
      <div style="padding:0 8px;">
        <div style="font-size:21px;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">2.4K</div>
        <div style="font-size:11.5px;font-weight:500;color:#94a3b8;margin-top:2px;letter-spacing:0.2px;">Followers</div>
      </div>
      <div style="padding:0 8px;border-left:1px solid #f1f5f9;border-right:1px solid #f1f5f9;">
        <div style="font-size:21px;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">348</div>
        <div style="font-size:11.5px;font-weight:500;color:#94a3b8;margin-top:2px;letter-spacing:0.2px;">Following</div>
      </div>
      <div style="padding:0 8px;">
        <div style="font-size:21px;font-weight:700;color:#0f172a;letter-spacing:-0.5px;">91</div>
        <div style="font-size:11.5px;font-weight:500;color:#94a3b8;margin-top:2px;letter-spacing:0.2px;">Projects</div>
      </div>
    </div>

    <!-- Divider -->
    <div style="margin:0 24px;height:1px;background:linear-gradient(to right,transparent,#e2e8f0,transparent);"></div>

    <!-- Action Buttons -->
    <div style="display:flex;gap:10px;padding:20px 24px 24px;">
      <button style="flex:1;padding:12px 0;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:14px;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.2px;box-shadow:0 6px 18px rgba(102,126,234,0.4);display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.2s;" onmouseover="this.style.transform='translateY(-1px)';this.style.boxShadow='0 10px 28px rgba(102,126,234,0.55)'" onmouseout="this.style.transform='translateY(0)';this.style.boxShadow='0 6px 18px rgba(102,126,234,0.4)'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Message
      </button>
      <button style="flex:1;padding:12px 0;background:#f8fafc;color:#334155;border:1.5px solid #e2e8f0;border-radius:14px;font-size:13.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.2px;display:flex;align-items:center;justify-content:center;gap:7px;transition:all 0.2s;" onmouseover="this.style.background='#f1f5f9';this.style.borderColor='#cbd5e1'" onmouseout="this.style.background='#f8fafc';this.style.borderColor='#e2e8f0'">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Share
      </button>
    </div>

  </div>

</body>
</html>
