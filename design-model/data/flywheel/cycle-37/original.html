<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toast Notifications</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
    background: #0f1117;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 24px;
  }

  /* ── Trigger buttons ── */
  .btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: transform 80ms ease, opacity 120ms ease;
    outline: none;
  }
  .btn:active { transform: scale(0.97); }
  .btn-success { background: #22c55e; color: #fff; }
  .btn-info    { background: #3b82f6; color: #fff; }
  .btn-warning { background: #f59e0b; color: #fff; }
  .btn-error   { background: #ef4444; color: #fff; }

  /* ── Toast container ── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    display: flex;
    flex-direction: column-reverse;
    gap: 10px;
    z-index: 9999;
    pointer-events: none;
  }

  /* ── Individual toast ── */
  .toast {
    pointer-events: all;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 360px;
    padding: 14px 16px 14px 16px;
    border-radius: 12px;
    border: 1px solid transparent;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 4px 6px -1px rgba(0,0,0,0.3),
      0 10px 15px -3px rgba(0,0,0,0.2),
      0 0 0 1px rgba(255,255,255,0.04) inset;

    /* Entry animation */
    animation: toastIn 320ms cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .toast.removing {
    animation: toastOut 260ms cubic-bezier(0.4, 0, 0.2, 1) both;
  }

  @keyframes toastIn {
    from {
      opacity: 0;
      transform: translateX(calc(100% + 24px)) scale(0.95);
    }
    to {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  @keyframes toastOut {
    from {
      opacity: 1;
      transform: translateX(0) scale(1);
      max-height: 120px;
      margin-bottom: 0;
    }
    to {
      opacity: 0;
      transform: translateX(calc(100% + 24px)) scale(0.96);
      max-height: 0;
      margin-bottom: -10px;
      padding-top: 0;
      padding-bottom: 0;
    }
  }

  /* ── Type themes ── */
  .toast-success {
    background: rgba(15, 23, 18, 0.92);
    border-color: rgba(34, 197, 94, 0.2);
  }
  .toast-info {
    background: rgba(10, 17, 30, 0.92);
    border-color: rgba(59, 130, 246, 0.2);
  }
  .toast-warning {
    background: rgba(20, 16, 8, 0.92);
    border-color: rgba(245, 158, 11, 0.2);
  }
  .toast-error {
    background: rgba(22, 10, 10, 0.92);
    border-color: rgba(239, 68, 68, 0.2);
  }

  /* ── Icon wrapper ── */
  .toast-icon {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 1px;
  }

  .toast-success .toast-icon { background: rgba(34, 197, 94, 0.15); }
  .toast-info    .toast-icon { background: rgba(59, 130, 246, 0.15); }
  .toast-warning .toast-icon { background: rgba(245, 158, 11, 0.15); }
  .toast-error   .toast-icon { background: rgba(239, 68, 68, 0.15); }

  .toast-icon svg { display: block; }

  /* ── Text area ── */
  .toast-body {
    flex: 1;
    min-width: 0;
    padding-top: 2px;
  }

  .toast-title {
    font-size: 13.5px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -0.01em;
    margin-bottom: 3px;
  }

  .toast-message {
    font-size: 12.5px;
    font-weight: 400;
    line-height: 1.5;
    opacity: 0.72;
  }

  .toast-success .toast-title { color: #86efac; }
  .toast-info    .toast-title { color: #93c5fd; }
  .toast-warning .toast-title { color: #fcd34d; }
  .toast-error   .toast-title { color: #fca5a5; }

  .toast-success .toast-message { color: #d1fae5; }
  .toast-info    .toast-message { color: #dbeafe; }
  .toast-warning .toast-message { color: #fef3c7; }
  .toast-error   .toast-message { color: #fee2e2; }

  /* ── Close button ── */
  .toast-close {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 6px;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.45;
    transition: opacity 120ms ease, background 120ms ease;
    margin-top: 1px;
    padding: 0;
  }
  .toast-close:hover { opacity: 0.85; background: rgba(255,255,255,0.08); }
  .toast-close svg { display: block; }

  /* ── Progress bar ── */
  .toast-progress {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 2px;
    border-radius: 0 0 12px 12px;
    transform-origin: left;
    animation: progressShrink linear both;
  }

  .toast-success .toast-progress { background: rgba(34, 197, 94, 0.6); }
  .toast-info    .toast-progress { background: rgba(59, 130, 246, 0.6); }
  .toast-warning .toast-progress { background: rgba(245, 158, 11, 0.6); }
  .toast-error   .toast-progress { background: rgba(239, 68, 68, 0.6); }

  @keyframes progressShrink {
    from { width: 100%; }
    to   { width: 0%; }
  }
</style>
</head>
<body>

<button class="btn btn-success" onclick="showToast('success')">Success Toast</button>
<button class="btn btn-info"    onclick="showToast('info')">Info Toast</button>
<button class="btn btn-warning" onclick="showToast('warning')">Warning Toast</button>
<button class="btn btn-error"   onclick="showToast('error')">Error Toast</button>

<div id="toast-container"></div>

<script>
const TOASTS = {
  success: {
    title: 'Changes saved',
    message: 'Your project has been saved successfully.',
    icon: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <path d="M11.5 3.5L6 10 3.5 7.5" stroke="#22c55e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`
  },
  info: {
    title: 'New update available',
    message: 'Version 2.4.0 is ready to install when convenient.',
    icon: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <circle cx="7.5" cy="7.5" r="5.5" stroke="#3b82f6" stroke-width="1.5"/>
      <path d="M7.5 5v.5M7.5 7v3" stroke="#3b82f6" stroke-width="1.6" stroke-linecap="round"/>
    </svg>`
  },
  warning: {
    title: 'Storage almost full',
    message: 'You\'ve used 92% of your storage quota.',
    icon: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <path d="M7.5 2L13.5 12.5H1.5L7.5 2Z" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M7.5 6v3M7.5 10.5v.5" stroke="#f59e0b" stroke-width="1.6" stroke-linecap="round"/>
    </svg>`
  },
  error: {
    title: 'Connection failed',
    message: 'Unable to reach the server. Check your network.',
    icon: `<svg width="15" height="15" viewBox="0 0 15 15" fill="none">
      <circle cx="7.5" cy="7.5" r="5.5" stroke="#ef4444" stroke-width="1.5"/>
      <path d="M5.5 5.5l4 4M9.5 5.5l-4 4" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round"/>
    </svg>`
  }
};

const DURATION = 4500;

function showToast(type) {
  const container = document.getElementById('toast-container');
  const data = TOASTS[type];
  const id = 'toast-' + Date.now();

  const toast = document.createElement('div');
  toast.id = id;
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `
    <div class="toast-icon">${data.icon}</div>
    <div class="toast-body">
      <div class="toast-title">${data.title}</div>
      <div class="toast-message">${data.message}</div>
    </div>
    <button class="toast-close" onclick="removeToast('${id}')">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
        <path d="M1.5 1.5l7 7M8.5 1.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="toast-progress" style="animation-duration: ${DURATION}ms;"></div>
  `;

  container.appendChild(toast);

  const timer = setTimeout(() => removeToast(id), DURATION);
  toast.dataset.timer = timer;
}

function removeToast(id) {
  const toast = document.getElementById(id);
  if (!toast || toast.classList.contains('removing')) return;

  clearTimeout(parseInt(toast.dataset.timer));
  toast.classList.add('removing');

  toast.addEventListener('animationend', () => {
    toast.remove();
  }, { once: true });
}

// Demo: show one of each on load
window.addEventListener('DOMContentLoaded', () => {
  setTimeout(() => showToast('info'),    200);
  setTimeout(() => showToast('success'), 550);
  setTimeout(() => showToast('warning'), 900);
});
</script>
</body>
</html>
