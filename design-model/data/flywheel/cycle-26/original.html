<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body style="margin:0;padding:0;min-height:100vh;background:#0c0c0f;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding:48px 24px;box-sizing:border-box;">

<div style="width:100%;max-width:1080px;">

  <!-- Header -->
  <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:32px;">
    <div>
      <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;margin-bottom:8px;">Q2 2026</div>
      <h1 style="margin:0;font-family:'Playfair Display',serif;font-size:32px;font-weight:400;color:#f2ede6;letter-spacing:-0.01em;line-height:1;">Project Tracker</h1>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="font-family:'DM Mono',monospace;font-size:11px;color:#5a5768;letter-spacing:0.08em;">24 entries</div>
      <button style="background:#1e1c26;border:1px solid #2e2b3a;color:#a09cb0;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;padding:8px 16px;border-radius:8px;cursor:pointer;letter-spacing:0.02em;transition:all 0.15s ease;" onmouseover="this.style.background='#252330';this.style.color='#f2ede6'" onmouseout="this.style.background='#1e1c26';this.style.color='#a09cb0'">+ New Entry</button>
    </div>
  </div>

  <!-- Table Container -->
  <div style="background:#131218;border:1px solid #1e1c26;border-radius:16px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,0.5),0 0 0 1px rgba(255,255,255,0.03);">

    <!-- Table -->
    <table id="dataTable" style="width:100%;border-collapse:collapse;">
      <thead>
        <tr style="background:#0f0e14;border-bottom:1px solid #1e1c26;">
          <th onclick="sortTable(0)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;white-space:nowrap;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">ID <span id="sort-0" style="opacity:0.4;">↕</span></span>
          </th>
          <th onclick="sortTable(1)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">Member <span id="sort-1" style="opacity:0.4;">↕</span></span>
          </th>
          <th onclick="sortTable(2)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">Project <span id="sort-2" style="opacity:0.4;">↕</span></span>
          </th>
          <th onclick="sortTable(3)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">Status <span id="sort-3" style="opacity:0.4;">↕</span></span>
          </th>
          <th onclick="sortTable(4)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">Priority <span id="sort-4" style="opacity:0.4;">↕</span></span>
          </th>
          <th onclick="sortTable(5)" style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;cursor:pointer;user-select:none;transition:color 0.15s;" onmouseover="this.style.color='#a09cb0'" onmouseout="this.style.color='#5a5768'">
            <span style="display:flex;align-items:center;gap:6px;">Due Date <span id="sort-5" style="opacity:0.4;">↕</span></span>
          </th>
          <th style="padding:14px 20px;text-align:left;font-family:'DM Mono',monospace;font-size:10px;font-weight:400;letter-spacing:0.12em;color:#5a5768;text-transform:uppercase;"></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>

    <!-- Footer -->
    <div style="padding:14px 20px;border-top:1px solid #1a1820;display:flex;align-items:center;justify-content:space-between;">
      <div style="font-family:'DM Mono',monospace;font-size:10px;color:#3e3c4a;letter-spacing:0.08em;">Showing 8 of 24</div>
      <div style="display:flex;gap:4px;">
        <button style="background:transparent;border:1px solid #2e2b3a;color:#5a5768;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;" onmouseover="this.style.color='#a09cb0';this.style.borderColor='#4a4758'" onmouseout="this.style.color='#5a5768';this.style.borderColor='#2e2b3a'">Prev</button>
        <button style="background:#1e1c26;border:1px solid #2e2b3a;color:#e8c17a;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:0.06em;">1</button>
        <button style="background:transparent;border:1px solid #2e2b3a;color:#5a5768;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;" onmouseover="this.style.color='#a09cb0';this.style.borderColor='#4a4758'" onmouseout="this.style.color='#5a5768';this.style.borderColor='#2e2b3a'">2</button>
        <button style="background:transparent;border:1px solid #2e2b3a;color:#5a5768;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;" onmouseover="this.style.color='#a09cb0';this.style.borderColor='#4a4758'" onmouseout="this.style.color='#5a5768';this.style.borderColor='#2e2b3a'">3</button>
        <button style="background:transparent;border:1px solid #2e2b3a;color:#5a5768;font-family:'DM Mono',monospace;font-size:10px;padding:5px 12px;border-radius:6px;cursor:pointer;letter-spacing:0.06em;transition:all 0.15s;" onmouseover="this.style.color='#a09cb0';this.style.borderColor='#4a4758'" onmouseout="this.style.color='#5a5768';this.style.borderColor='#2e2b3a'">Next</button>
      </div>
    </div>

  </div>
</div>

<script>
const avatarColors = [
  { bg: '#2d1f3d', text: '#c084fc' },
  { bg: '#1a2d3a', text: '#60bfff' },
  { bg: '#2d2a1a', text: '#e8c17a' },
  { bg: '#1a2d23', text: '#4ade80' },
  { bg: '#2d1a20', text: '#f87171' },
  { bg: '#1a1f2d', text: '#818cf8' },
  { bg: '#2d261a', text: '#fb923c' },
  { bg: '#1a2d2d', text: '#2dd4bf' },
];

const statusConfig = {
  'Active':    { bg: 'rgba(74,222,128,0.1)',  text: '#4ade80', dot: '#4ade80', border: 'rgba(74,222,128,0.2)' },
  'Review':    { bg: 'rgba(232,193,122,0.1)', text: '#e8c17a', dot: '#e8c17a', border: 'rgba(232,193,122,0.2)' },
  'Blocked':   { bg: 'rgba(248,113,113,0.1)', text: '#f87171', dot: '#f87171', border: 'rgba(248,113,113,0.2)' },
  'Planned':   { bg: 'rgba(148,163,184,0.1)', text: '#94a3b8', dot: '#94a3b8', border: 'rgba(148,163,184,0.15)' },
  'Complete':  { bg: 'rgba(129,140,248,0.1)', text: '#818cf8', dot: '#818cf8', border: 'rgba(129,140,248,0.2)' },
};

const priorityConfig = {
  'Critical': { color: '#f87171' },
  'High':     { color: '#fb923c' },
  'Medium':   { color: '#e8c17a' },
  'Low':      { color: '#5a5768' },
};

const data = [
  { id: '#0024', name: 'Mara Linden',    role: 'Lead Designer',     project: 'Orion Rebrand',      status: 'Active',   priority: 'Critical', date: 'Apr 18, 2026' },
  { id: '#0019', name: 'Jonas Reeves',   role: 'Frontend Eng.',     project: 'API Gateway v3',     status: 'Review',   priority: 'High',     date: 'Apr 22, 2026' },
  { id: '#0031', name: 'Sofía Aldana',   role: 'Product Manager',   project: 'Mobile Onboarding',  status: 'Blocked',  priority: 'Critical', date: 'Apr 15, 2026' },
  { id: '#0008', name: 'Eli Thornton',   role: 'Backend Eng.',      project: 'Auth Refactor',      status: 'Active',   priority: 'High',     date: 'May 01, 2026' },
  { id: '#0042', name: 'Yuki Nishida',   role: 'Data Scientist',    project: 'Forecast Model',     status: 'Planned',  priority: 'Medium',   date: 'May 12, 2026' },
  { id: '#0015', name: 'Ren Okafor',     role: 'DevOps',            project: 'Infra Migration',    status: 'Active',   priority: 'High',     date: 'Apr 28, 2026' },
  { id: '#0057', name: 'Clara Hesse',    role: 'UX Researcher',     project: 'User Study Q2',      status: 'Complete', priority: 'Low',      date: 'Apr 10, 2026' },
  { id: '#0033', name: 'Arjun Mehta',    role: 'Full-Stack Eng.',   project: 'Dashboard Metrics',  status: 'Review',   priority: 'Medium',   date: 'Apr 30, 2026' },
];

let sortCol = -1, sortDir = 1;

function initials(name) {
  return name.split(' ').map(n => n[0]).join('').slice(0,2);
}

function renderRows(rows) {
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  rows.forEach((row, i) => {
    const color = avatarColors[i % avatarColors.length];
    const status = statusConfig[row.status];
    const priority = priorityConfig[row.priority];
    const tr = document.createElement('tr');
    tr.style.cssText = `border-bottom:1px solid #1a1820;transition:background 0.12s ease;cursor:pointer;`;
    tr.onmouseover = () => { tr.style.background = 'rgba(255,255,255,0.025)'; };
    tr.onmouseout = () => { tr.style.background = 'transparent'; };

    tr.innerHTML = `
      <td style="padding:16px 20px;">
        <span style="font-family:'DM Mono',monospace;font-size:11px;color:#3e3c4a;letter-spacing:0.06em;">${row.id}</span>
      </td>
      <td style="padding:16px 20px;">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:34px;height:34px;border-radius:10px;background:${color.bg};color:${color.text};display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:400;letter-spacing:0.04em;flex-shrink:0;border:1px solid ${color.text}20;">${initials(row.name)}</div>
          <div>
            <div style="font-size:13.5px;font-weight:500;color:#e8e4dc;letter-spacing:-0.01em;line-height:1.2;">${row.name}</div>
            <div style="font-size:11.5px;color:#5a5768;margin-top:2px;font-weight:300;">${row.role}</div>
          </div>
        </div>
      </td>
      <td style="padding:16px 20px;">
        <span style="font-size:13px;color:#a09cb0;font-weight:400;">${row.project}</span>
      </td>
      <td style="padding:16px 20px;">
        <span style="display:inline-flex;align-items:center;gap:6px;background:${status.bg};color:${status.text};border:1px solid ${status.border};font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;letter-spacing:0.04em;white-space:nowrap;">
          <span style="width:5px;height:5px;border-radius:50%;background:${status.dot};flex-shrink:0;"></span>
          ${row.status}
        </span>
      </td>
      <td style="padding:16px 20px;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="width:8px;height:8px;border-radius:2px;background:${priority.color};flex-shrink:0;opacity:0.8;"></span>
          <span style="font-size:12.5px;color:${priority.color};font-weight:400;opacity:0.9;">${row.priority}</span>
        </div>
      </td>
      <td style="padding:16px 20px;">
        <span style="font-family:'DM Mono',monospace;font-size:11.5px;color:#5a5768;letter-spacing:0.03em;">${row.date}</span>
      </td>
      <td style="padding:16px 20px;">
        <button style="background:transparent;border:1px solid #2e2b3a;color:#5a5768;padding:5px 12px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;cursor:pointer;transition:all 0.15s;letter-spacing:0.02em;" onmouseover="this.style.borderColor='#4a4758';this.style.color='#c0bcd0'" onmouseout="this.style.borderColor='#2e2b3a';this.style.color='#5a5768'">View</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function sortTable(col) {
  if (sortCol === col) { sortDir *= -1; }
  else { sortCol = col; sortDir = 1; }

  document.querySelectorAll('[id^="sort-"]').forEach(el => { el.textContent = '↕'; el.style.opacity = '0.3'; });
  const indicator = document.getElementById('sort-' + col);
  if (indicator) { indicator.textContent = sortDir === 1 ? '↑' : '↓'; indicator.style.opacity = '0.8'; }

  const keys = ['id','name','project','status','priority','date'];
  const key = keys[col];
  const sorted = [...data].sort((a, b) => {
    const av = a[key], bv = b[key];
    return av < bv ? -sortDir : av > bv ? sortDir : 0;
  });
  renderRows(sorted);
}

renderRows(data);
</script>
</body>
</html>
