<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-page:        #0C0B09;
      --bg-card:        #181410;
      --bg-card-inner:  #1E1A15;
      --border:         #2C2820;
      --border-light:   #342E27;
      --gold:           #C4A35A;
      --gold-dim:       #8A6E3A;
      --gold-glow:      rgba(196,163,90,0.12);
      --text-primary:   #EDE8DF;
      --text-secondary: #8A8070;
      --text-tertiary:  #504840;
      --btn-follow-bg:  #C4A35A;
      --btn-follow-fg:  #0C0B09;
      --btn-msg-bg:     transparent;
      --btn-msg-fg:     #C4A35A;
    }

    body {
      background: var(--bg-page);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 40px 20px;
    }

    /* Subtle radial ambient behind card */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 600px 500px at 50% 50%, rgba(196,163,90,0.04) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      width: 360px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(196,163,90,0.05),
        0 32px 64px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
      position: relative;
    }

    /* Header band */
    .card-header {
      height: 88px;
      background: linear-gradient(135deg, #1E1A15 0%, #14110D 60%, #1A150E 100%);
      border-bottom: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    .card-header::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 200px 120px at 30% 80%, rgba(196,163,90,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 160px 80px at 80% 20%, rgba(196,163,90,0.05) 0%, transparent 60%);
    }

    /* Decorative lines */
    .card-header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 24px; right: 24px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,163,90,0.2), transparent);
    }

    /* Horizontal rule ornament */
    .header-ornament {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0.25;
    }

    .header-ornament-line {
      width: 48px;
      height: 1px;
      background: var(--gold);
    }

    .header-ornament-diamond {
      width: 5px;
      height: 5px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* Avatar */
    .avatar-wrap {
      position: absolute;
      bottom: -36px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
    }

    .avatar-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      padding: 2.5px;
      background: conic-gradient(from 180deg, var(--gold) 0deg, #7A5E2A 120deg, var(--gold) 240deg, #7A5E2A 360deg);
      box-shadow: 0 0 0 3px var(--bg-card), 0 4px 20px rgba(196,163,90,0.2);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: linear-gradient(135deg, #2E2418 0%, #1A1410 100%);
      overflow: hidden;
    }

    /* SVG avatar placeholder */
    .avatar-svg {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    /* Card body */
    .card-body {
      padding: 48px 28px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(196,163,90,0.1);
      border: 1px solid rgba(196,163,90,0.2);
      border-radius: 100px;
      padding: 3px 10px;
      margin-bottom: 10px;
    }

    .badge-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 6px var(--gold);
    }

    .badge-text {
      font-family: 'DM Sans', sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gold);
    }

    /* Name */
    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 500;
      color: var(--text-primary);
      letter-spacing: 0.01em;
      text-align: center;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .name em {
      font-style: italic;
      color: var(--gold);
    }

    /* Handle */
    .handle {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.04em;
      margin-bottom: 20px;
    }

    /* Stats row */
    .stats {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg-card-inner);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 8px;
      position: relative;
    }

    .stat + .stat::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 1px;
      background: var(--border-light);
    }

    .stat-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    /* Divider */
    .divider {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border-light), transparent);
      margin-bottom: 20px;
    }

    /* Bio */
    .bio {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15.5px;
      font-weight: 300;
      font-style: italic;
      line-height: 1.7;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 16px;
      padding: 0 4px;
    }

    /* Meta info */
    .meta {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }

    .meta-item svg {
      opacity: 0.5;
      flex-shrink: 0;
    }

    .meta-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--text-tertiary);
    }

    /* Buttons */
    .actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .btn {
      flex: 1;
      height: 40px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.03em;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      overflow: hidden;
    }

    .btn::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.97); }

    .btn-follow {
      background: var(--gold);
      color: var(--btn-follow-fg);
      box-shadow: 0 4px 16px rgba(196,163,90,0.25);
    }

    .btn-follow::after {
      background: rgba(255,255,255,0.1);
    }

    .btn-follow:hover {
      box-shadow: 0 6px 24px rgba(196,163,90,0.35);
      transform: translateY(-1px);
    }

    .btn-message {
      background: var(--bg-card-inner);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
    }

    .btn-message:hover {
      background: #232018;
      border-color: rgba(196,163,90,0.25);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .btn-message::after {
      background: rgba(196,163,90,0.04);
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div class="header-ornament">
      <div class="header-ornament-line"></div>
      <div class="header-ornament-diamond"></div>
      <div class="header-ornament-line"></div>
    </div>
    <div class="avatar-wrap">
      <div class="avatar-ring">
        <div class="avatar-img">
          <svg class="avatar-svg" viewBox="0 0 75 75" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="75" height="75" fill="url(#avatarBg)"/>
            <circle cx="37.5" cy="29" r="12" fill="url(#skinGrad)"/>
            <ellipse cx="37.5" cy="58" rx="20" ry="14" fill="url(#skinGrad)"/>
            <defs>
              <linearGradient id="avatarBg" x1="0" y1="0" x2="75" y2="75" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#2A2218"/>
                <stop offset="100%" stop-color="#1A1410"/>
              </linearGradient>
              <linearGradient id="skinGrad" x1="0" y1="0" x2="75" y2="75" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#7A6040"/>
                <stop offset="100%" stop-color="#5A4830"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <div class="badge">
      <div class="badge-dot"></div>
      <span class="badge-text">Available for work</span>
    </div>

    <h1 class="name">Isabelle <em>Renard</em></h1>
    <p class="handle">@isabelle.renard</p>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">2.4k</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat">
        <span class="stat-value">18.2k</span>
        <span class="stat-label">Followers</span>
      </div>
      <div class="stat">
        <span class="stat-value">341</span>
        <span class="stat-label">Following</span>
      </div>
    </div>

    <div class="divider"></div>

    <p class="bio">
      Senior product designer crafting digital experiences at the intersection of clarity and craft. Previously at Figma &amp; Vercel.
    </p>

    <div class="meta">
      <div class="meta-item">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M6 1C4.067 1 2.5 2.567 2.5 4.5c0 2.917 3.5 6.5 3.5 6.5s3.5-3.583 3.5-6.5C9.5 2.567 7.933 1 6 1zm0 4.75a1.25 1.25 0 110-2.5 1.25 1.25 0 010 2.5z" fill="currentColor"/>
        </svg>
        Paris, France
      </div>
      <div class="meta-dot"></div>
      <div class="meta-item">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
          <path d="M1 6a5 5 0 1010 0A5 5 0 001 6zm4.5-2.5v2.25l1.75 1.75-.88.88L4.25 6.25V3.5h1.25z" fill="currentColor"/>
        </svg>
        Joined 2019
      </div>
    </div>

    <div class="actions">
      <button class="btn btn-follow">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M6.5 1v11M1 6.5h11" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
        </svg>
        Follow
      </button>
      <button class="btn btn-message">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
          <path d="M11 1.5H2A1 1 0 001 2.5v6a1 1 0 001 1h2v2l3-2h4a1 1 0 001-1v-6a1 1 0 00-1-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        </svg>
        Message
      </button>
    </div>
  </div>
</div>

</body>
</html>
