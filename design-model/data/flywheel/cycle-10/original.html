<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e0e10;
    font-family: 'DM Sans', sans-serif;
    padding: 2rem;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 30% 20%, rgba(201, 155, 90, 0.07) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 80% 80%, rgba(120, 90, 160, 0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  .card {
    width: 380px;
    background: #16161a;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 20px;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.03),
      0 24px 60px rgba(0,0,0,0.6),
      0 4px 16px rgba(0,0,0,0.4);
    position: relative;
  }

  .card-banner {
    height: 120px;
    background:
      linear-gradient(135deg, #1a1408 0%, #2a1f0a 40%, #1e1610 100%);
    position: relative;
    overflow: hidden;
  }

  .card-banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.15'/%3E%3C/svg%3E");
    opacity: 0.4;
    mix-blend-mode: overlay;
  }

  .card-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 120%, rgba(201, 155, 90, 0.18) 0%, transparent 70%);
  }

  .banner-lines {
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 18px,
        rgba(201,155,90,0.03) 18px,
        rgba(201,155,90,0.03) 19px
      );
  }

  .card-body {
    padding: 0 28px 28px;
  }

  .avatar-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-top: -36px;
    margin-bottom: 18px;
  }

  .avatar-wrap {
    position: relative;
    width: 76px;
    height: 76px;
  }

  .avatar-ring {
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg,
      #c99b5a 0deg,
      #e8c882 90deg,
      #a07030 180deg,
      #c99b5a 360deg
    );
    z-index: 0;
  }

  .avatar-inner {
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    background: #16161a;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .avatar-svg {
    width: 100%;
    height: 100%;
  }

  .status-dot {
    position: absolute;
    bottom: 4px;
    right: 4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #3ecf8e;
    border: 2.5px solid #16161a;
    z-index: 2;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(201, 155, 90, 0.1);
    border: 1px solid rgba(201, 155, 90, 0.25);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 500;
    color: #c99b5a;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .badge-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #c99b5a;
    opacity: 0.8;
  }

  .name {
    font-family: 'Playfair Display', serif;
    font-size: 24px;
    font-weight: 500;
    color: #f0ece4;
    letter-spacing: -0.01em;
    line-height: 1.2;
    margin-bottom: 3px;
  }

  .handle {
    font-size: 13px;
    font-weight: 400;
    color: rgba(240, 236, 228, 0.35);
    letter-spacing: 0.01em;
    margin-bottom: 14px;
  }

  .bio {
    font-size: 13.5px;
    font-weight: 300;
    color: rgba(240, 236, 228, 0.55);
    line-height: 1.65;
    margin-bottom: 22px;
    letter-spacing: 0.01em;
  }

  .bio em {
    font-style: normal;
    color: rgba(201, 155, 90, 0.8);
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.06);
    margin-bottom: 22px;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0;
    margin-bottom: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 14px 0;
    position: relative;
  }

  .stat + .stat::before {
    content: '';
    position: absolute;
    left: 0;
    top: 20%;
    height: 60%;
    width: 1px;
    background: rgba(255,255,255,0.07);
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 500;
    color: #f0ece4;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 400;
    color: rgba(240, 236, 228, 0.3);
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 24px;
  }

  .tag {
    font-size: 11.5px;
    font-weight: 400;
    color: rgba(240, 236, 228, 0.4);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 4px 10px;
    letter-spacing: 0.02em;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
    cursor: default;
  }

  .tag:hover {
    color: rgba(201, 155, 90, 0.9);
    border-color: rgba(201, 155, 90, 0.25);
    background: rgba(201, 155, 90, 0.07);
  }

  .actions {
    display: flex;
    gap: 10px;
  }

  .btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 11px 18px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    border: none;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.15s;
    position: relative;
    overflow: hidden;
  }

  .btn:active {
    transform: scale(0.97);
  }

  .btn-primary {
    background: linear-gradient(135deg, #c99b5a 0%, #e8c882 50%, #c99b5a 100%);
    background-size: 200% 100%;
    color: #1a1408;
    box-shadow: 0 4px 16px rgba(201, 155, 90, 0.25);
  }

  .btn-primary:hover {
    background-position: 100% 0;
    box-shadow: 0 6px 20px rgba(201, 155, 90, 0.35);
    transform: translateY(-1px);
  }

  .btn-secondary {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(240, 236, 228, 0.65);
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.14);
    color: rgba(240, 236, 228, 0.85);
    transform: translateY(-1px);
  }

  .btn-icon {
    width: 36px;
    height: 36px;
    flex: none;
    border-radius: 9px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(240, 236, 228, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.15s, background 0.15s;
    padding: 0;
  }

  .btn-icon:hover {
    background: rgba(255,255,255,0.08);
    color: rgba(240, 236, 228, 0.8);
    transform: translateY(-1px);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="card">
  <div class="card-banner">
    <div class="banner-lines"></div>
  </div>

  <div class="card-body">
    <div class="avatar-row">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar-inner">
          <svg class="avatar-svg" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="76" height="76" fill="#2a1f0a"/>
            <circle cx="38" cy="30" r="13" fill="#c99b5a" opacity="0.9"/>
            <ellipse cx="38" cy="62" rx="22" ry="16" fill="#c99b5a" opacity="0.7"/>
          </svg>
        </div>
        <div class="status-dot"></div>
      </div>
      <div class="badge">
        <span class="badge-dot"></span>
        Pro Member
      </div>
    </div>

    <div class="name">Elara Voss</div>
    <div class="handle">@elara.voss · San Francisco</div>

    <p class="bio">
      Product designer obsessed with the space between <em>clarity and craft.</em>
      Previously at Linear and Vercel — now building tools that respect human attention.
    </p>

    <div class="divider"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value">4.2k</span>
        <span class="stat-label">Followers</span>
      </div>
      <div class="stat">
        <span class="stat-value">318</span>
        <span class="stat-label">Projects</span>
      </div>
      <div class="stat">
        <span class="stat-value">97%</span>
        <span class="stat-label">Rating</span>
      </div>
    </div>

    <div class="tags">
      <span class="tag">Design Systems</span>
      <span class="tag">Motion</span>
      <span class="tag">Figma</span>
      <span class="tag">TypeScript</span>
      <span class="tag">Open Source</span>
    </div>

    <div class="actions">
      <button class="btn btn-primary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Follow
      </button>
      <button class="btn btn-secondary">
        Message
      </button>
      <button class="btn-icon" aria-label="More options">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="2" cy="7" r="1.2" fill="currentColor"/>
          <circle cx="7" cy="7" r="1.2" fill="currentColor"/>
          <circle cx="12" cy="7" r="1.2" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>
</div>

</body>
</html>
