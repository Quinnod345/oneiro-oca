<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delete Confirmation</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Blurred background page content */
    .page-bg {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(120, 80, 255, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
        #0f1117;
      filter: blur(0px);
      transition: filter 0.3s ease;
    }

    .page-bg.blurred { filter: blur(3px); }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px) saturate(0.8);
      -webkit-backdrop-filter: blur(6px) saturate(0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.18s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1);    }
    }

    /* Modal card */
    .modal {
      width: 100%;
      max-width: 420px;
      margin: 16px;
      background: #16181f;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 20px;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.03),
        0 24px 60px rgba(0, 0, 0, 0.7),
        0 8px 24px rgba(0, 0, 0, 0.4);
      animation: slideUp 0.24s cubic-bezier(0.34, 1.2, 0.64, 1);
      overflow: hidden;
    }

    /* Top danger strip */
    .modal-danger-strip {
      height: 3px;
      background: linear-gradient(90deg, #ef4444 0%, #f97316 50%, #ef4444 100%);
      background-size: 200% 100%;
      animation: shimmer 2.5s linear infinite;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .modal-body {
      padding: 32px 32px 28px;
    }

    /* Icon */
    .icon-wrap {
      width: 52px;
      height: 52px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }

    .icon-wrap svg {
      width: 24px;
      height: 24px;
      color: #ef4444;
    }

    /* Text */
    .modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #f1f1f3;
      letter-spacing: -0.3px;
      line-height: 1.3;
      margin-bottom: 10px;
    }

    .modal-desc {
      font-size: 14px;
      font-weight: 400;
      color: #8b8d99;
      line-height: 1.65;
      margin-bottom: 8px;
    }

    /* Affected item pill */
    .affected-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(239, 68, 68, 0.07);
      border: 1px solid rgba(239, 68, 68, 0.15);
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 16px;
      margin-bottom: 24px;
      width: 100%;
    }

    .affected-item-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .affected-item-name {
      font-size: 13px;
      font-weight: 500;
      color: #e5e7eb;
      letter-spacing: -0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .affected-item-meta {
      font-size: 12px;
      color: #6b7280;
      margin-left: auto;
      flex-shrink: 0;
    }

    /* Warning note */
    .warning-note {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.14);
      border-radius: 10px;
      padding: 11px 13px;
      margin-bottom: 28px;
    }

    .warning-note svg {
      width: 14px;
      height: 14px;
      color: #f59e0b;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .warning-note-text {
      font-size: 12.5px;
      color: #9ca3af;
      line-height: 1.6;
    }

    .warning-note-text strong {
      color: #d1b36a;
      font-weight: 500;
    }

    /* Divider */
    .modal-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.06);
      margin: 0 -32px;
      margin-bottom: 20px;
    }

    /* Buttons */
    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      height: 40px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.1px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      outline: none;
    }

    .btn:focus-visible {
      box-shadow: 0 0 0 2px #16181f, 0 0 0 4px rgba(99, 102, 241, 0.5);
    }

    /* Cancel */
    .btn-cancel {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: #9ca3af;
    }

    .btn-cancel:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #e5e7eb;
      border-color: rgba(255, 255, 255, 0.14);
    }

    .btn-cancel:active {
      background: rgba(255, 255, 255, 0.04);
      transform: scale(0.98);
    }

    /* Confirm / Delete */
    .btn-delete {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: #fff;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 4px 12px rgba(220, 38, 38, 0.28);
      flex: 1.4;
    }

    .btn-delete:hover {
      background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.1) inset,
        0 6px 18px rgba(220, 38, 38, 0.4);
      transform: translateY(-1px);
    }

    .btn-delete:active {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      transform: translateY(0) scale(0.98);
      box-shadow: 0 2px 6px rgba(220, 38, 38, 0.2);
    }

    .btn-delete svg,
    .btn-cancel svg {
      width: 15px;
      height: 15px;
    }
  </style>
</head>
<body>

<div class="page-bg blurred"></div>

<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">
    <div class="modal-danger-strip"></div>
    <div class="modal-body">

      <div class="icon-wrap" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          <path d="M10 11v6"/>
          <path d="M14 11v6"/>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </svg>
      </div>

      <p class="modal-title" id="modal-title">Delete this project permanently?</p>
      <p class="modal-desc">
        This will immediately remove the project and all of its data from our servers.
        This action cannot be undone.
      </p>

      <div class="affected-item" aria-label="Affected item">
        <div class="affected-item-dot"></div>
        <span class="affected-item-name">oneiro-core / cognitive</span>
        <span class="affected-item-meta">1,340 files</span>
      </div>

      <div class="warning-note" role="alert">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <span class="warning-note-text">
          <strong>All collaborators</strong> will lose access instantly and any active
          sessions will be terminated.
        </span>
      </div>

      <div class="modal-divider"></div>

      <div class="modal-actions">
        <button class="btn btn-cancel" type="button" onclick="this.closest('.overlay').style.display='none'">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
          Cancel
        </button>
        <button class="btn btn-delete" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
          </svg>
          Delete Project
        </button>
      </div>

    </div>
  </div>
</div>

</body>
</html>
