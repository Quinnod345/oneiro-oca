<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organism Monitor</title>
    <style>
        :root {
            --bg-primary: #0a0c0f;
            --bg-secondary: #141821;
            --bg-tertiary: #1e2330;
            --accent-healthy: #4ade80;
            --accent-warning: #fbbf24;
            --accent-danger: #f87171;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border-subtle: #334155;
            --glow-healthy: rgba(74, 222, 128, 0.3);
            --glow-warning: rgba(251, 191, 36, 0.3);
            --glow-danger: rgba(248, 113, 113, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .monitor-container {
            width: 100%;
            height: 100%;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr auto;
            gap: 32px;
        }

        .header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .system-time {
            font-size: 16px;
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
        }

        .organism-card {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 32px;
            position: relative;
            border: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 24px;
            transition: all 0.3s ease;
        }

        .organism-core {
            width: 200px;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .organism-body {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            position: relative;
            background: var(--bg-tertiary);
            border: 3px solid var(--accent-healthy);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        .organism-body::before {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-healthy) 0%, transparent 70%);
            z-index: -1;
            opacity: 0.6;
        }

        .organism-pulse {
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            border: 2px solid var(--accent-healthy);
            opacity: 0;
        }

        .cpu-organism .organism-body {
            animation: cpu-breathe 3s ease-in-out infinite;
        }

        .cpu-organism .organism-pulse {
            animation: cpu-pulse 3s ease-out infinite;
        }

        .memory-organism .organism-body {
            animation: memory-breathe 2.5s ease-in-out infinite;
        }

        .memory-organism .organism-pulse {
            animation: memory-pulse 2.5s ease-out infinite;
        }

        .organism-vitals {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .vital-percentage {
            font-size: 32px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-bottom: 4px;
        }

        .vital-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 500;
        }

        .organism-info {
            text-align: center;
            width: 100%;
        }

        .organism-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .organism-status {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .organism-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            width: 100%;
        }

        .metric {
            background: var(--bg-tertiary);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .footer {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Stress states */
        .organism-card.stressed .organism-body {
            border-color: var(--accent-warning);
            animation-duration: 1.2s;
        }

        .organism-card.stressed .organism-body::before {
            background: radial-gradient(circle, var(--glow-warning) 0%, transparent 70%);
        }

        .organism-card.stressed .organism-pulse {
            border-color: var(--accent-warning);
            animation-duration: 1.2s;
        }

        .organism-card.critical .organism-body {
            border-color: var(--accent-danger);
            animation-duration: 0.8s;
        }

        .organism-card.critical .organism-body::before {
            background: radial-gradient(circle, var(--glow-danger) 0%, transparent 70%);
        }

        .organism-card.critical .organism-pulse {
            border-color: var(--accent-danger);
            animation-duration: 0.8s;
        }

        @keyframes cpu-breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes cpu-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        @keyframes memory-breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        @keyframes memory-pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 0; }
        }

        .system-nodes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .node {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--accent-healthy);
            border-radius: 50%;
            opacity: 0.3;
            animation: node-float 8s ease-in-out infinite;
        }

        .node:nth-child(1) { top: 20%; left: 15%; animation-delay: 0s; }
        .node:nth-child(2) { top: 60%; left: 85%; animation-delay: 2s; }
        .node:nth-child(3) { top: 80%; left: 25%; animation-delay: 4s; }
        .node:nth-child(4) { top: 30%; left: 75%; animation-delay: 6s; }

        @keyframes node-float {
            0%, 100% { transform: translateY(0px); opacity: 0.3; }
            50% { transform: translateY(-20px); opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="system-nodes">
        <div class="node"></div>
        <div class="node"></div>
        <div class="node"></div>
        <div class="node"></div>
    </div>

    <div class="monitor-container">
        <header class="header">
            <h1>Organism Monitor</h1>
            <div class="system-time" id="systemTime">00:00:00</div>
        </header>

        <div class="organism-card cpu-organism" id="cpuOrganism">
            <div class="organism-core">
                <div class="organism-body">
                    <div class="organism-vitals">
                        <div class="vital-percentage" id="cpuPercentage">23%</div>
                        <div class="vital-label">Load</div>
                    </div>
                </div>
                <div class="organism-pulse"></div>
            </div>
            <div class="organism-info">
                <h2 class="organism-title">CPU Core</h2>
                <p class="organism-status">Healthy • Breathing steadily</p>
                <div class="organism-metrics">
                    <div class="metric">
                        <div class="metric-label">Frequency</div>
                        <div class="metric-value">2.4 GHz</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Temperature</div>
                        <div class="metric-value">42°C</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="organism-card memory-organism" id="memoryOrganism">
            <div class="organism-core">
                <div class="organism-body">
                    <div class="organism-vitals">
                        <div class="vital-percentage" id="memoryPercentage">67%</div>
                        <div class="vital-label">Used</div>
                    </div>
                </div>
                <div class="organism-pulse"></div>
            </div>
            <div class="organism-info">
                <h2 class="organism-title">Memory Bank</h2>
                <p class="organism-status">Moderate • Pulse elevated</p>
                <div class="organism-metrics">
                    <div class="metric">
                        <div class="metric-label">Available</div>
                        <div class="metric-value">5.3 GB</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Cached</div>
                        <div class="metric-value">2.1 GB</div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <span>System vitals monitored in real-time</span>
            <span>Last updated: just now</span>
        </footer>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-US', { hour12: false });
            document.getElementById('systemTime').textContent = timeString;
        }

        function simulateSystemLoad() {
            // Simulate CPU load changes
            const cpuLoad = Math.floor(Math.random() * 100);
            const cpuElement = document.getElementById('cpuPercentage');
            const cpuCard = document.getElementById('cpuOrganism');
            
            cpuElement.textContent = cpuLoad + '%';
            
            cpuCard.className = 'organism-card cpu-organism';
            if (cpuLoad > 80) {
                cpuCard.classList.add('critical');
            } else if (cpuLoad > 60) {
                cpuCard.classList.add('stressed');
            }

            // Simulate memory usage changes
            const memoryUsage = Math.floor(Math.random() * 100);
            const memoryElement = document.getElementById('memoryPercentage');
            const memoryCard = document.getElementById('memoryOrganism');
            
            memoryElement.textContent = memoryUsage + '%';
            
            memoryCard.className = 'organism-card memory-organism';
            if (memoryUsage > 85) {
                memoryCard.classList.add('critical');
            } else if (memoryUsage > 70) {
                memoryCard.classList.add('stressed');
            }
        }

        // Update time every second
        setInterval(updateTime, 1000);
        updateTime();

        // Simulate system load changes every 3 seconds
        setInterval(simulateSystemLoad, 3000);
        simulateSystemLoad();
    </script>
</body>
</html>
