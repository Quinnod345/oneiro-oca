<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromonic - Color Harmony Generator</title>
    <style>
        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #141414;
            --bg-tertiary: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;
            --accent-primary: #4285f4;
            --accent-secondary: #34a853;
            --border-primary: #2a2a2a;
            --border-secondary: #404040;
            --shadow-primary: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-secondary: 0 2px 12px rgba(0, 0, 0, 0.3);
            --border-radius: 12px;
            --font-system: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            --font-mono: "SF Mono", "Monaco", "Inconsolata", "Roboto Mono", Consolas, monospace;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-system);
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .app-container {
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            height: 100vh;
            gap: 0;
        }

        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-primary);
            padding: 24px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
        }

        .harmony-selector {
            margin-bottom: 32px;
        }

        .harmony-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 24px;
        }

        .harmony-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            color: var(--text-secondary);
            padding: 12px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 13px;
            font-weight: 500;
            text-align: center;
        }

        .harmony-btn:hover {
            background: var(--bg-primary);
            border-color: var(--border-secondary);
            color: var(--text-primary);
        }

        .harmony-btn.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            color: white;
        }

        .color-wheel {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 24px;
            position: relative;
            background: conic-gradient(
                hsl(0, 100%, 50%),
                hsl(60, 100%, 50%),
                hsl(120, 100%, 50%),
                hsl(180, 100%, 50%),
                hsl(240, 100%, 50%),
                hsl(300, 100%, 50%),
                hsl(360, 100%, 50%)
            );
            cursor: crosshair;
            border: 3px solid var(--border-secondary);
            box-shadow: var(--shadow-secondary);
        }

        .color-wheel::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, transparent 30%, var(--bg-primary) 70%);
            border-radius: 50%;
        }

        .wheel-pointer {
            position: absolute;
            width: 16px;
            height: 16px;
            background: white;
            border: 3px solid var(--bg-primary);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: var(--shadow-primary);
            z-index: 10;
            transition: var(--transition);
        }

        .sliders-section {
            margin-top: 32px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .slider-value {
            font-family: var(--font-mono);
            color: var(--text-primary);
            font-size: 12px;
        }

        .slider {
            width: 100%;
            height: 6px;
            background: var(--border-primary);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent-primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: var(--shadow-secondary);
        }

        .canvas-area {
            background: var(--bg-primary);
            position: relative;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .harmony-display {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }

        .color-note {
            width: 80px;
            height: 120px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            box-shadow: var(--shadow-secondary);
            border: 2px solid transparent;
        }

        .color-note:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-primary);
        }

        .color-note.playing {
            border-color: white;
            transform: translateY(-8px) scale(1.05);
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.3);
        }

        .color-note::after {
            content: attr(data-note);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .keyboard-hint {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .key-hint {
            background: var(--bg-tertiary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
        }

        .panels-section {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-primary);
            padding: 24px;
            overflow-y: auto;
        }

        .export-panel {
            margin-bottom: 32px;
        }

        .export-panel h3 {
            font-size: 16px;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .color-codes {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .color-code-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-tertiary);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-primary);
        }

        .color-code-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .color-code-value {
            font-family: var(--font-mono);
            font-size: 13px;
            color: var(--text-primary);
        }

        .copy-btn {
            background: var(--accent-primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            transition: var(--transition);
        }

        .copy-btn:hover {
            background: #3367d6;
        }

        .presets-section {
            margin-top: 32px;
        }

        .preset-grid {
            display: grid;
            gap: 8px;
        }

        .preset-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-item:hover {
            background: var(--bg-primary);
            border-color: var(--border-secondary);
        }

        .preset-colors {
            display: flex;
            gap: 4px;
        }

        .preset-color {
            width: 16px;
            height: 16px;
            border-radius: 3px;
            border: 1px solid var(--border-primary);
        }

        .preset-name {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .volume-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border: 3px solid transparent;
            border-radius: 50%;
            pointer-events: none;
            transition: var(--transition);
            opacity: 0;
        }

        .volume-indicator.active {
            opacity: 1;
            border-color: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%) scale(1.2);
        }

        .header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .main-content {
            margin-top: 60px;
            height: calc(100vh - 60px);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">Chromonic</div>
    </div>
    
    <div class="main-content">
        <div class="app-container">
            <div class="sidebar">
                <div class="harmony-selector">
                    <h2>Harmony Mode</h2>
                    <div class="harmony-grid">
                        <button class="harmony-btn active" data-harmony="complementary">Complementary</button>
                        <button class="harmony-btn" data-harmony="triadic">Triadic</button>
                        <button class="harmony-btn" data-harmony="tetradic">Tetradic</button>
                        <button class="harmony-btn" data-harmony="analogous">Analogous</button>
                        <button class="harmony-btn" data-harmony="split">Split Comp</button>
                        <button class="harmony-btn" data-harmony="monochromatic">Monochrome</button>
                    </div>
                </div>

                <div class="color-wheel" id="colorWheel">
                    <div class="wheel-pointer" id="wheelPointer"></div>
                </div>

                <div class="sliders-section">
                    <div class="slider-group">
                        <div class="slider-label">
                            Saturation
                            <span class="slider-value" id="satValue">75%</span>
                        </div>
                        <input type="range" class="slider" id="satSlider" min="0" max="100" value="75">
                    </div>
                    <div class="slider-group">
                        <div class="slider-label">
                            Lightness
                            <span class="slider-value" id="lightValue">50%</span>
                        </div>
                        <input type="range" class="slider" id="lightSlider" min="0" max="100" value="50">
                    </div>
                </div>
            </div>

            <div class="canvas-area">
                <div class="harmony-display" id="harmonyDisplay">
                    <div class="color-note" data-note="C" data-key="1"></div>
                    <div class="color-note" data-note="E" data-key="2"></div>
                    <div class="color-note" data-note="G" data-key="3"></div>
                    <div class="color-note" data-note="B" data-key="4"></div>
                </div>
                
                <div class="keyboard-hint">
                    <div class="key-hint">1 - Play C</div>
                    <div class="key-hint">2 - Play E</div>
                    <div class="key-hint">3 - Play G</div>
                    <div class="key-hint">4 - Play B</div>
                    <div class="key-hint">Space - Play Chord</div>
                </div>

                <div class="volume-indicator" id="volumeIndicator"></div>
            </div>

            <div class="panels-section">
                <div class="export-panel">
                    <h3>Export Colors</h3>
                    <div class="color-codes" id="colorCodes">
                        <div class="color-code-item">
                            <div>
                                <div class="color-code-label">HEX</div>
                                <div class="color-code-value">#4285F4</div>
                            </div>
                            <button class="copy-btn">Copy</button>
                        </div>
                        <div class="color-code-item">
                            <div>
                                <div class="color-code-label">RGB</div>
                                <div class="color-code-value">66, 133, 244</div>
                            </div>
                            <button class="copy-btn">Copy</button>
                        </div>
                        <div class="color-code-item">
                            <div>
                                <div class="color-code-label">HSL</div>
                                <div class="color-code-value">220°, 89%, 61%</div>
                            </div>
                            <button class="copy-btn">Copy</button>
                        </div>
                    </div>
                </div>

                <div class="presets-section">
                    <h3>Saved Harmonies</h3>
                    <div class="preset-grid">
                        <div class="preset-item">
                            <div class="preset-colors">
                                <div class="preset-color" style="background: #FF6B6B;"></div>
                                <div class="preset-color" style="background: #4ECDC4;"></div>
                                <div class="preset-color" style="background: #45B7D1;"></div>
                                <div class="preset-color" style="background: #96CEB4;"></div>
                            </div>
                            <div class="preset-name">Ocean Breeze</div>
                        </div>
                        <div class="preset-item">
                            <div class="preset-colors">
                                <div class="preset-color" style="background: #F38BA8;"></div>
                                <div class="preset-color" style="background: #FAB387;"></div>
                                <div class="preset-color" style="background: #F9E2AF;"></div>
                                <div class="preset-color" style="background: #A6E3A1;"></div>
                            </div>
                            <div class="preset-name">Sunset Glow</div>
                        </div>
                        <div class="preset-item">
                            <div class="preset-colors">
                                <div class="preset-color" style="background: #B4BEFE;"></div>
                                <div class="preset-color" style="background: #CBA6F7;"></div>
                                <div class="preset-color" style="background: #F5C2E7;"></div>
                                <div class="preset-color" style="background: #94E2D5;"></div>
                            </div>
                            <div class="preset-name">Cosmic Dream</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ChromonicApp {
            constructor() {
                this.currentHue = 220;
                this.currentSat = 75;
                this.currentLight = 50;
                this.harmonyMode = 'complementary';
                this.audioContext = null;
                this.init();
            }

            init() {
                this.setupAudio();
                this.bindEvents();
                this.updateHarmony();
                this.updateWheelPointer();
            }

            setupAudio() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    console.log('Audio not supported');
                }
            }

            bindEvents() {
                // Harmony mode buttons
                document.querySelectorAll('.harmony-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelector('.harmony-btn.active')?.classList.remove('active');
                        btn.classList.add('active');
                        this.harmonyMode = btn.dataset.harmony;
                        this.updateHarmony();
                    });
                });

                // Color wheel interaction
                document.getElementById('colorWheel').addEventListener('click', (e) => {
                    this.handleWheelClick(e);
                });

                // Sliders
                document.getElementById('satSlider').addEventListener('input', (e) => {
                    this.currentSat = parseInt(e.target.value);
                    document.getElementById('satValue').textContent = this.currentSat + '%';
                    this.updateHarmony();
                });

                document.getElementById('lightSlider').addEventListener('input', (e) => {
                    this.currentLight = parseInt(e.target.value);
                    document.getElementById('lightValue').textContent = this.currentLight + '%';
                    this.updateHarmony();
                });

                // Color note clicks
                document.querySelectorAll('.color-note').forEach(note => {
                    note.addEventListener('click', () => {
                        this.playNote(note);
                    });
                });

                // Keyboard events
                document.addEventListener('keydown', (e) => {
                    this.handleKeyPress(e);
                });

                // Copy buttons
                document.querySelectorAll('.copy-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const value = e.target.parentElement.querySelector('.color-code-value').textContent;
                        navigator.clipboard.writeText(value);
                        e.target.textContent = 'Copied!';
                        setTimeout(() => e.target.textContent = 'Copy', 1000);
                    });
                });
            }

            handleWheelClick(e) {
                const rect = e.target.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const x = e.clientX - centerX;
                const y = e.clientY - centerY;
                
                const angle = Math.atan2(y, x) * 180 / Math.PI;
                this.currentHue = ((angle + 90) % 360 + 360) % 360;
                
                this.updateWheelPointer();
                this.updateHarmony();
            }

            updateWheelPointer() {
                const pointer = document.getElementById('wheelPointer');
                const angle = (this.currentHue - 90) * Math.PI / 180;
                const radius = 70;
                const x = Math.cos(angle) * radius + 100;
                const y = Math.sin(angle) * radius + 100;
                
                pointer.style.left = x + 'px';
                pointer.style.top = y + 'px';
                pointer.style.background = `hsl(${this.currentHue}, ${this.currentSat}%, ${this.currentLight}%)`;
            }

            generateHarmony() {
                const hues = [];
                const baseHue = this.currentHue;

                switch(this.harmonyMode) {
                    case 'complementary':
                        hues.push(baseHue, (baseHue + 180) % 360);
                        break;
                    case 'triadic':
                        hues.push(baseHue, (baseHue + 120) % 360, (baseHue + 240) % 360);
                        break;
                    case 'tetradic':
                        hues.push(baseHue, (baseHue + 90) % 360, (baseHue + 180) % 360, (baseHue + 270) % 360);
                        break;
                    case 'analogous':
                        hues.push((baseHue - 30 + 360) % 360, baseHue, (baseHue + 30) % 360, (baseHue + 60) % 360);
                        break;
                    case 'split':
                        hues.push(baseHue, (baseHue + 150) % 360, (baseHue + 210) % 360);
                        break;
                    case 'monochromatic':
                        hues.push(baseHue, baseHue, baseHue, baseHue);
                        break;
                }

                return hues.map((hue, i) => {
                    let sat = this.currentSat;
                    let light = this.currentLight;
                    
                    if (this.harmonyMode === 'monochromatic') {
                        light = Math.max(20, Math.min(80, this.currentLight + (i - 1) * 20));
                    }
                    
                    return { h: hue, s: sat, l: light };
                });
            }

            updateHarmony() {
                const colors = this.generateHarmony();
                const notes = document.querySelectorAll('.color-note');
                
                notes.forEach((note, i) => {
                    if (i < colors.length) {
                        const color = colors[i];
                        const hsl = `hsl(${color.h}, ${color.s}%, ${color.l}%)`;
                        note.style.background = hsl;
                        note.style.display = 'block';
                        note.dataset.color = JSON.stringify(color);
                    } else {
                        note.style.display = 'none';
                    }
                });

                this.updateColorCodes(colors[0]);
            }

            updateColorCodes(color) {
                const hsl = `hsl(${color.h}, ${color.s}%, ${color.l}%)`;
                const hex = this.hslToHex(color.h, color.s, color.l);
                const rgb = this.hslToRgb(color.h, color.s, color.l);
                
                const codes = document.querySelectorAll('.color-code-value');
                codes[0].textContent = hex;
                codes[1].textContent = `${rgb.r}, ${rgb.g}, ${rgb.b}`;
                codes[2].textContent = `${Math.round(color.h)}°, ${color.s}%, ${color.l}%`;
            }

            playNote(noteElement) {
                if (!this.audioContext) return;
                
                noteElement.classList.add('playing');
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                const noteIndex = parseInt(noteElement.dataset.key) - 1;
                const frequency = 261.63 * Math.pow(1.26, noteIndex); // C major scale
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                oscillator.frequency.setValueAtTime(frequency, this.audioContext.currentTime);
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0, this.audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, this.audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.001, this.audioContext.currentTime + 0.5);
                
                oscillator.start(this.audioContext.currentTime);
                oscillator.stop(this.audioContext.currentTime + 0.5);
                
                setTimeout(() => noteElement.classList.remove('playing'), 500);
                
                this.showVolumeIndicator();
            }

            playChord() {
                document.querySelectorAll('.color-note').forEach((note, i) => {
                    if (note.style.display !== 'none') {
                        setTimeout(() => this.playNote(note), i * 50);
                    }
                });
            }

            showVolumeIndicator() {
                const indicator = document.getElementById('volumeIndicator');
                indicator.classList.add('active');
                setTimeout(() => indicator.classList.remove('active'), 300);
            }

            handleKeyPress(e) {
                if (this.audioContext?.state === 'suspended') {
                    this.audioContext.resume();
                }
                
                const key = e.key;
                if (['1', '2', '3', '4'].includes(key)) {
                    const noteIndex = parseInt(key) - 1;
                    const note = document.querySelectorAll('.color-note')[noteIndex];
                    if (note?.style.display !== 'none') {
                        this.playNote(note);
                    }
                } else if (key === ' ') {
                    e.preventDefault();
                    this.playChord();
                }
            }

            hslToHex(h, s, l) {
                l /= 100;
                const a = s * Math.min(l, 1 - l) / 100;
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color).toString(16).padStart(2, '0');
                };
                return `#${f(0)}${f(8)}${f(4)}`;
            }

            hslToRgb(h, s, l) {
                l /= 100;
                const a = s * Math.min(l, 1 - l) / 100;
                const f = n => {
                    const k = (n + h / 30) % 12;
                    const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                    return Math.round(255 * color);
                };
                return { r: f(0), g: f(8), b: f(4) };
            }
        }

        // Initialize app
        new ChromonicApp();
    </script>
</body>
</html>
