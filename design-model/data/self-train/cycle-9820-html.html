<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Argument Settler</title>
    <style>
        :root {
            --grid-blue: #0066CC;
            --grid-orange: #FF6600;
            --solid-black: #000000;
            --ghost-gray: #E0E0E0;
            --paper-cream: #FFFEF8;
            --confidence-green: #00AA44;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--paper-cream);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .blueprint-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent 39px, #F0F0F0 39px, #F0F0F0 40px),
                repeating-linear-gradient(90deg, transparent, transparent 39px, #F0F0F0 39px, #F0F0F0 40px);
        }

        .person-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .person-layer.active {
            pointer-events: all;
        }

        #person-a-layer {
            mix-blend-mode: multiply;
        }

        #person-b-layer {
            mix-blend-mode: multiply;
        }

        .memory-fragment {
            position: absolute;
            cursor: grab;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .memory-fragment.dragging {
            cursor: grabbing;
            z-index: 1000;
        }

        .memory-fragment.locked {
            cursor: default;
            animation: lock-click 0.4s ease-out;
        }

        @keyframes lock-click {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.05) rotate(-1deg); }
            40% { transform: scale(0.98) rotate(1deg); }
            60% { transform: scale(1.02) rotate(0deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .fragment-shape {
            stroke-width: 2px;
            fill-opacity: 0.1;
        }

        .person-a .fragment-shape {
            stroke: var(--grid-blue);
            fill: var(--grid-blue);
        }

        .person-b .fragment-shape {
            stroke: var(--grid-orange);
            fill: var(--grid-orange);
        }

        .locked .fragment-shape {
            stroke: var(--solid-black);
            fill: var(--solid-black);
            fill-opacity: 0.05;
            stroke-width: 3px;
        }

        .confidence-meter {
            position: absolute;
            width: 4px;
            background: var(--confidence-green);
            right: -10px;
            bottom: 0;
            transition: height 0.3s ease;
            border-radius: 2px;
        }

        .fragment-label {
            position: absolute;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transform: translate(-50%, -50%);
            white-space: nowrap;
        }

        .person-a .fragment-label {
            color: var(--grid-blue);
        }

        .person-b .fragment-label {
            color: var(--grid-orange);
        }

        .locked .fragment-label {
            color: var(--solid-black);
            font-weight: 600;
        }

        .control-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 280px;
            background: white;
            border: 2px solid var(--solid-black);
            box-shadow: 4px 4px 0 var(--solid-black);
        }

        .panel-header {
            background: var(--solid-black);
            color: white;
            padding: 15px 20px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .person-toggle {
            display: flex;
            margin: 20px;
            border: 2px solid var(--solid-black);
        }

        .toggle-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .toggle-btn:first-child {
            border-right: 2px solid var(--solid-black);
        }

        .toggle-btn.active-a {
            background: var(--grid-blue);
            color: white;
        }

        .toggle-btn.active-b {
            background: var(--grid-orange);
            color: white;
        }

        .consensus-indicator {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 320px;
            background: white;
            border: 2px solid var(--solid-black);
            padding: 20px;
        }

        .consensus-bar {
            height: 8px;
            background: var(--ghost-gray);
            margin-top: 15px;
            position: relative;
            overflow: hidden;
        }

        .consensus-fill {
            height: 100%;
            background: var(--confidence-green);
            width: 0%;
            transition: width 0.5s ease;
        }

        .consensus-label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .timeline-axis {
            position: absolute;
            bottom: 120px;
            left: 360px;
            right: 400px;
            height: 2px;
            background: var(--solid-black);
        }

        .timeline-marker {
            position: absolute;
            top: -8px;
            width: 2px;
            height: 18px;
            background: var(--solid-black);
        }

        .timeline-label {
            position: absolute;
            top: 15px;
            font-size: 10px;
            transform: translateX(-50%);
            font-weight: 500;
        }

        .ghost-fragments {
            opacity: 0.3;
            stroke-dasharray: 5, 5;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(10px, -5px) rotate(1deg); }
            66% { transform: translate(-8px, 3px) rotate(-1deg); }
        }
    </style>
</head>
<body>
    <div class="blueprint-canvas"></div>

    <div class="control-panel">
        <div class="panel-header">MEMORY RECONCILIATION</div>
        <div class="person-toggle">
            <button class="toggle-btn active-a" id="toggleA">PERSON A</button>
            <button class="toggle-btn" id="toggleB">PERSON B</button>
        </div>
    </div>

    <div class="timeline-axis">
        <div class="timeline-marker" style="left: 0%">
            <div class="timeline-label">2:30 PM</div>
        </div>
        <div class="timeline-marker" style="left: 25%">
            <div class="timeline-label">3:00 PM</div>
        </div>
        <div class="timeline-marker" style="left: 50%">
            <div class="timeline-label">3:30 PM</div>
        </div>
        <div class="timeline-marker" style="left: 75%">
            <div class="timeline-label">4:00 PM</div>
        </div>
        <div class="timeline-marker" style="left: 100%">
            <div class="timeline-label">4:30 PM</div>
        </div>
    </div>

    <div class="person-layer active" id="person-a-layer">
        <div class="memory-fragment person-a" style="left: 380px; top: 200px;" data-confidence="85">
            <svg width="140" height="100">
                <rect class="fragment-shape" x="2" y="2" width="136" height="96" />
            </svg>
            <div class="fragment-label" style="left: 70px; top: 50px;">Kitchen</div>
            <div class="confidence-meter" style="height: 68px;"></div>
        </div>

        <div class="memory-fragment person-a ghost-fragments" style="left: 540px; top: 180px;" data-confidence="45">
            <svg width="160" height="120">
                <polygon class="fragment-shape" points="2,60 80,2 158,60 80,118" />
            </svg>
            <div class="fragment-label" style="left: 80px; top: 60px;">Red Shirt</div>
            <div class="confidence-meter" style="height: 36px;"></div>
        </div>

        <div class="memory-fragment person-a" style="left: 720px; top: 240px;" data-confidence="90">
            <svg width="180" height="80">
                <rect class="fragment-shape" x="2" y="2" width="176" height="76" />
            </svg>
            <div class="fragment-label" style="left: 90px; top: 40px;">Coffee Table</div>
            <div class="confidence-meter" style="height: 72px;"></div>
        </div>

        <div class="memory-fragment person-a" style="left: 460px; top: 340px;" data-confidence="70">
            <svg width="120" height="120">
                <circle class="fragment-shape" cx="60" cy="60" r="58" />
            </svg>
            <div class="fragment-label" style="left: 60px; top: 60px;">3:15 PM</div>
            <div class="confidence-meter" style="height: 56px;"></div>
        </div>
    </div>

    <div class="person-layer" id="person-b-layer">
        <div class="memory-fragment person-b" style="left: 400px; top: 220px;" data-confidence="80">
            <svg width="140" height="100">
                <rect class="fragment-shape" x="2" y="2" width="136" height="96" />
            </svg>
            <div class="fragment-label" style="left: 70px; top: 50px;">Kitchen</div>
            <div class="confidence-meter" style="height: 64px;"></div>
        </div>

        <div class="memory-fragment person-b ghost-fragments" style="left: 560px; top: 200px;" data-confidence="40">
            <svg width="160" height="120">
                <polygon class="fragment-shape" points="2,60 80,2 158,60 80,118" />
            </svg>
            <div class="fragment-label" style="left: 80px; top: 60px;">Blue Shirt</div>
            <div class="confidence-meter" style="height: 32px;"></div>
        </div>

        <div class="memory-fragment person-b" style="left: 480px; top: 360px;" data-confidence="75">
            <svg width="120" height="120">
                <circle class="fragment-shape" cx="60" cy="60" r="58" />
            </svg>
            <div class="fragment-label" style="left: 60px; top: 60px;">3:45 PM</div>
            <div class="confidence-meter" style="height: 60px;"></div>
        </div>

        <div class="memory-fragment person-b ghost-fragments" style="left: 740px; top: 400px;" data-confidence="30">
            <svg width="140" height="100">
                <polygon class="fragment-shape" points="70,2 138,50 70,98 2,50" />
            </svg>
            <div class="fragment-label" style="left: 70px; top: 50px;">Phone Call</div>
            <div class="confidence-meter" style="height: 24px;"></div>
        </div>
    </div>

    <div class="consensus-indicator">
        <div class="consensus-label">Consensus Level</div>
        <div class="consensus-bar">
            <div class="consensus-fill" style="width: 25%;"></div>
        </div>
    </div>

    <script>
        let activeLayer = 'a';
        let draggedElement = null;
        let offset = { x: 0, y: 0 };
        let consensusLevel = 25;

        const toggleA = document.getElementById('toggleA');
        const toggleB = document.getElementById('toggleB');
        const layerA = document.getElementById('person-a-layer');
        const layerB = document.getElementById('person-b-layer');
        const consensusFill = document.querySelector('.consensus-fill');

        toggleA.addEventListener('click', () => {
            activeLayer = 'a';
            toggleA.classList.add('active-a');
            toggleB.classList.remove('active-b');
            layerA.classList.add('active');
            layerB.classList.remove('active');
        });

        toggleB.addEventListener('click', () => {
            activeLayer = 'b';
            toggleB.classList.add('active-b');
            toggleA.classList.remove('active-a');
            layerB.classList.add('active');
            layerA.classList.remove('active');
        });

        document.querySelectorAll('.memory-fragment').forEach(fragment => {
            fragment.addEventListener('mousedown', startDrag);
        });

        function startDrag(e) {
            if (e.target.closest('.memory-fragment').classList.contains('locked')) return;
            
            draggedElement = e.target.closest('.memory-fragment');
            draggedElement.classList.add('dragging');
            
            const rect = draggedElement.getBoundingClientRect();
            offset.x = e.clientX - rect.left;
            offset.y = e.clientY - rect.top;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
        }

        function drag(e) {
            if (!draggedElement) return;
            
            draggedElement.style.left = (e.clientX - offset.x) + 'px';
            draggedElement.style.top = (e.clientY - offset.y) + 'px';
            
            checkOverlap();
        }

        function stopDrag() {
            if (draggedElement) {
                draggedElement.classList.remove('dragging');
                draggedElement = null;
            }
            
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
        }

        function checkOverlap() {
            const fragments = document.querySelectorAll('.memory-fragment:not(.locked)');
            
            fragments.forEach((fragment1, i) => {
                fragments.forEach((fragment2, j) => {
                    if (i >= j) return;
                    
                    const label1 = fragment1.querySelector('.fragment-label').textContent;
                    const label2 = fragment2.querySelector('.fragment-label').textContent;
                    
                    if (label1 === label2) {
                        const rect1 = fragment1.getBoundingClientRect();
                        const rect2 = fragment2.getBoundingClientRect();
                        
                        const overlap = !(rect1.right < rect2.left || 
                                        rect2.right < rect1.left || 
                                        rect1.bottom < rect2.top || 
                                        rect2.bottom < rect1.top);
                        
                        if (overlap) {
                            const centerX = (rect1.left + rect2.left) / 2;
                            const centerY = (rect1.top + rect2.top) / 2;
                            
                            fragment1.style.left = centerX + 'px';
                            fragment1.style.top = centerY + 'px';
                            fragment1.classList.add('locked');
                            fragment1.classList.remove('person-a', 'person-b', 'ghost-fragments');
                            
                            fragment2.style.display = 'none';
                            
                            consensusLevel = Math.min(100, consensusLevel + 25);
                            consensusFill.style.width = consensusLevel + '%';
                        }
                    }
                });
            });
        }
    </script>
</body>
</html>
