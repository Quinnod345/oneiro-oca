<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celestial Pod</title>
    <style>
        :root {
            --void-black: #0a0a0f;
            --nebula-purple: #2d1b69;
            --star-dim: #4a5568;
            --star-bright: #f7fafc;
            --star-listened: #ffd700;
            --constellation-line: rgba(255, 255, 255, 0.15);
            --constellation-active: rgba(255, 215, 0, 0.3);
            --ui-surface: rgba(26, 32, 44, 0.8);
            --ui-border: rgba(255, 255, 255, 0.1);
            --text-primary: #e2e8f0;
            --text-secondary: #a0aec0;
            --accent-blue: #63b3ed;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(ellipse at center, var(--nebula-purple) 0%, var(--void-black) 70%);
            overflow: hidden;
            position: relative;
            color: var(--text-primary);
        }

        .stars-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.4;
        }

        .star-field {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .constellation-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .constellation {
            position: absolute;
            transition: all 0.3s ease;
        }

        .constellation.active {
            filter: brightness(1.3);
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: var(--constellation-line);
            transform-origin: left center;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .constellation.active .constellation-line {
            background: var(--constellation-active);
            box-shadow: 0 0 4px var(--star-listened);
        }

        .episode-star {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--star-dim);
            border: 2px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            transform: translate(-50%, -50%);
        }

        .episode-star:hover {
            transform: translate(-50%, -50%) scale(1.3);
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
        }

        .episode-star.listened {
            background: radial-gradient(circle, var(--star-listened) 0%, #ffa500 70%);
            border-color: var(--star-listened);
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            animation: glow 2s infinite ease-in-out alternate;
        }

        .episode-star.playing {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            box-shadow: 0 0 20px rgba(99, 179, 237, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes glow {
            from { box-shadow: 0 0 12px rgba(255, 215, 0, 0.6); }
            to { box-shadow: 0 0 18px rgba(255, 215, 0, 0.9); }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .ui-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            background: linear-gradient(to top, var(--ui-surface) 0%, rgba(26, 32, 44, 0.95) 50%, transparent 100%);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--ui-border);
            z-index: 100;
        }

        .player-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 16px 32px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 64px;
            border: 1px solid var(--ui-border);
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: var(--ui-surface);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .control-btn:hover {
            background: var(--accent-blue);
            transform: scale(1.1);
        }

        .play-btn {
            width: 64px;
            height: 64px;
            background: var(--accent-blue);
            font-size: 24px;
        }

        .episode-info {
            position: absolute;
            bottom: 120px;
            left: 40px;
            max-width: 400px;
        }

        .episode-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .series-name {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .episode-duration {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .series-legend {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--ui-border);
            backdrop-filter: blur(10px);
            min-width: 280px;
        }

        .legend-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s ease;
        }

        .legend-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .legend-text {
            flex: 1;
            font-size: 14px;
        }

        .progress-indicator {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 1000;
            border: 1px solid var(--ui-border);
            max-width: 200px;
        }

        .app-title {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(45deg, var(--star-bright), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body>
    <div class="stars-background"></div>
    
    <h1 class="app-title">Celestial Pod</h1>
    
    <div class="constellation-canvas">
        <!-- Tech Talk Constellation -->
        <div class="constellation" data-series="tech-talk">
            <div class="constellation-line" style="left: 200px; top: 150px; width: 80px; transform: rotate(25deg);"></div>
            <div class="constellation-line" style="left: 280px; top: 170px; width: 60px; transform: rotate(-15deg);"></div>
            <div class="constellation-line" style="left: 340px; top: 165px; width: 70px; transform: rotate(35deg);"></div>
            
            <div class="episode-star listened" style="left: 200px; top: 150px;" data-title="The Future of AI" data-duration="42:15"></div>
            <div class="episode-star listened" style="left: 280px; top: 170px;" data-title="Web3 Explained" data-duration="38:42"></div>
            <div class="episode-star playing" style="left: 340px; top: 165px;" data-title="Quantum Computing Basics" data-duration="45:20"></div>
            <div class="episode-star" style="left: 410px; top: 190px;" data-title="Neural Networks Deep Dive" data-duration="52:18"></div>
        </div>

        <!-- Mindful Moments Constellation -->
        <div class="constellation" data-series="mindful">
            <div class="constellation-line" style="left: 600px; top: 300px; width: 90px; transform: rotate(-20deg);"></div>
            <div class="constellation-line" style="left: 690px; top: 285px; width: 75px; transform: rotate(40deg);"></div>
            <div class="constellation-line" style="left: 765px; top: 315px; width: 65px; transform: rotate(-10deg);"></div>
            
            <div class="episode-star listened" style="left: 600px; top: 300px;" data-title="Morning Meditation" data-duration="15:30"></div>
            <div class="episode-star listened" style="left: 690px; top: 285px;" data-title="Breathing Techniques" data-duration="18:45"></div>
            <div class="episode-star listened" style="left: 765px; top: 315px;" data-title="Stress Relief" data-duration="22:10"></div>
            <div class="episode-star" style="left: 830px; top: 310px;" data-title="Sleep Stories" data-duration="25:33"></div>
        </div>

        <!-- History Mysteries Constellation -->
        <div class="constellation" data-series="history">
            <div class="constellation-line" style="left: 300px; top: 450px; width: 100px; transform: rotate(15deg);"></div>
            <div class="constellation-line" style="left: 400px; top: 465px; width: 85px; transform: rotate(-25deg);"></div>
            <div class="constellation-line" style="left: 485px; top: 445px; width: 70px; transform: rotate(30deg);"></div>
            <div class="constellation-line" style="left: 555px; top: 465px; width: 80px; transform: rotate(-5deg);"></div>
            
            <div class="episode-star listened" style="left: 300px; top: 450px;" data-title="Lost Civilizations" data-duration="48:22"></div>
            <div class="episode-star listened" style="left: 400px; top: 465px;" data-title="Ancient Egypt Secrets" data-duration="51:15"></div>
            <div class="episode-star" style="left: 485px; top: 445px;" data-title="Viking Expeditions" data-duration="44:30"></div>
            <div class="episode-star" style="left: 555px; top: 465px;" data-title="Medieval Mysteries" data-duration="46:18"></div>
            <div class="episode-star" style="left: 635px; top: 460px;" data-title="Renaissance Innovations" data-duration="43:55"></div>
        </div>

        <!-- Space Odyssey Constellation -->
        <div class="constellation" data-series="space">
            <div class="constellation-line" style="left: 900px; top: 200px; width: 120px; transform: rotate(-30deg);"></div>
            <div class="constellation-line" style="left: 1020px; top: 175px; width: 95px; transform: rotate(20deg);"></div>
            <div class="constellation-line" style="left: 1115px; top: 195px; width: 80px; transform: rotate(-40deg);"></div>
            
            <div class="episode-star listened" style="left: 900px; top: 200px;" data-title="Mars Mission Updates" data-duration="35:40"></div>
            <div class="episode-star" style="left: 1020px; top: 175px;" data-title="Black Hole Mysteries" data-duration="41:22"></div>
            <div class="episode-star" style="left: 1115px; top: 195px;" data-title="Space Station Life" data-duration="39:15"></div>
            <div class="episode-star" style="left: 1195px; top: 170px;" data-title="Exoplanet Discoveries" data-duration="37:28"></div>
        </div>
    </div>

    <div class="series-legend">
        <div class="legend-title">Constellations</div>
        <div class="legend-item" data-series="tech-talk">
            <div class="legend-color" style="background: #ff6b6b;"></div>
            <div class="legend-text">Tech Talk</div>
            <div class="progress-indicator">3/4</div>
        </div>
        <div class="legend-item" data-series="mindful">
            <div class="legend-color" style="background: #4ecdc4;"></div>
            <div class="legend-text">Mindful Moments</div>
            <div class="progress-indicator">3/4</div>
        </div>
        <div class="legend-item" data-series="history">
            <div class="legend-color" style="background: #45b7d1;"></div>
            <div class="legend-text">History Mysteries</div>
            <div class="progress-indicator">2/5</div>
        </div>
        <div class="legend-item" data-series="space">
            <div class="legend-color" style="background: #f9ca24;"></div>
            <div class="legend-text">Space Odyssey</div>
            <div class="progress-indicator">1/4</div>
        </div>
    </div>

    <div class="ui-panel">
        <div class="episode-info">
            <div class="series-name">Tech Talk</div>
            <div class="episode-title">Quantum Computing Basics</div>
            <div class="episode-duration">45:20 • Playing</div>
        </div>
        
        <div class="player-controls">
            <button class="control-btn">⏮</button>
            <button class="control-btn">⏪</button>
            <button class="control-btn play-btn">⏸</button>
            <button class="control-btn">⏩</button>
            <button class="control-btn">⏭</button>
        </div>
    </div>

    <div class="tooltip"></div>

    <script>
        // Generate random background stars
        function createStarField() {
            const container = document.querySelector('.stars-background');
            const starCount = 150;
            
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star-field';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random() * 0.8 + 0.2;
                container.appendChild(star);
            }
        }

        // Episode star interactions
        const stars = document.querySelectorAll('.episode-star');
        const tooltip = document.querySelector('.tooltip');
        const episodeInfo = document.querySelector('.episode-info');
        
        stars.forEach(star => {
            star.addEventListener('mouseenter', (e) => {
                const title = e.target.dataset.title;
                const duration = e.target.dataset.duration;
                tooltip.innerHTML = `<strong>${title}</strong><br>${duration}`;
                tooltip.style.opacity = '1';
            });
            
            star.addEventListener('mousemove', (e) => {
                tooltip.style.left = e.pageX + 10 + 'px';
                tooltip.style.top = e.pageY - 10 + 'px';
            });
            
            star.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });
            
            star.addEventListener('click', (e) => {
                // Remove playing class from all stars
                stars.forEach(s => s.classList.remove('playing'));
                // Add playing class to clicked star
                e.target.classList.add('playing');
                // Add listened class if not already present
                e.target.classList.add('listened');
                
                // Update episode info
                const constellation = e.target.closest('.constellation');
                const seriesName = getSeriesName(constellation.dataset.series);
                const title = e.target.dataset.title;
                const duration = e.target.dataset.duration;
                
                document.querySelector('.series-name').textContent = seriesName;
                document.querySelector('.episode-title').textContent = title;
                document.querySelector('.episode-duration').textContent = duration + ' • Playing';
            });
        });

        // Constellation hover effects
        const constellations = document.querySelectorAll('.constellation');
        const legendItems = document.querySelectorAll('.legend-item');
        
        constellations.forEach(constellation => {
            constellation.addEventListener('mouseenter', () => {
                constellation.classList.add('active');
            });
            
            constellation.addEventListener('mouseleave', () => {
                constellation.classList.remove('active');
            });
        });

        legendItems.forEach(item => {
            item.addEventListener('mouseenter', () => {
                const seriesId = item.dataset.series;
                const constellation = document.querySelector(`[data-series="${seriesId}"]`);
                constellation.classList.add('active');
            });
            
            item.addEventListener('mouseleave', () => {
                const seriesId = item.dataset.series;
                const constellation = document.querySelector(`[data-series="${seriesId}"]`);
                constellation.classList.remove('active');
            });
        });

        function getSeriesName(seriesId) {
            const names = {
                'tech-talk': 'Tech Talk',
                'mindful': 'Mindful Moments',
                'history': 'History Mysteries',
                'space': 'Space Odyssey'
            };
            return names[seriesId] || 'Unknown Series';
        }

        // Initialize
        createStarField();
    </script>
</body>
</html>
