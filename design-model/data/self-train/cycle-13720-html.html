<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Argument Settler</title>
    <style>
        :root {
            --membrane-bg: #0a0f14;
            --coral-base-left: #ff6b35;
            --coral-base-right: #4ecdc4;
            --harmony-glow: #f7fff7;
            --tension-red: #ff1744;
            --resolution-gold: #ffd700;
            --interface-text: rgba(255, 255, 255, 0.9);
            --substrate: rgba(255, 255, 255, 0.03);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--membrane-bg);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .ocean-floor {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 25% 60%, rgba(78, 205, 196, 0.05) 0%, transparent 40%),
                radial-gradient(ellipse at 75% 40%, rgba(255, 107, 53, 0.05) 0%, transparent 40%);
            filter: blur(40px);
        }

        .membrane-divide {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: linear-gradient(180deg, 
                transparent 0%, 
                rgba(247, 255, 247, 0.1) 20%,
                rgba(247, 255, 247, 0.3) 50%,
                rgba(247, 255, 247, 0.1) 80%,
                transparent 100%
            );
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 3s ease;
        }

        .membrane-divide.active {
            opacity: 1;
        }

        .coral-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 600px;
        }

        .coral-left {
            left: 120px;
        }

        .coral-right {
            right: 120px;
        }

        .coral-structure {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .coral-branch {
            position: absolute;
            transform-origin: bottom center;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .coral-segment {
            position: absolute;
            border-radius: 50%;
            filter: blur(0.5px);
        }

        .aggressive-growth {
            width: 3px;
            height: 40px;
            background: linear-gradient(to top, var(--tension-red), transparent);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        .conciliatory-growth {
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, var(--coral-base-left) 0%, transparent 70%);
            opacity: 0.8;
        }

        .harmony-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--harmony-glow);
            border-radius: 50%;
            opacity: 0;
            animation: float-harmonize 8s infinite;
        }

        @keyframes float-harmonize {
            0% {
                transform: translate(0, 0);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translate(var(--drift-x), -200px);
                opacity: 0;
            }
        }

        .input-field {
            position: absolute;
            bottom: 80px;
            width: 480px;
            background: var(--substrate);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px 24px;
            backdrop-filter: blur(10px);
        }

        .input-left {
            left: 80px;
        }

        .input-right {
            right: 80px;
        }

        .input-field input {
            width: 100%;
            background: none;
            border: none;
            color: var(--interface-text);
            font-size: 16px;
            line-height: 24px;
            outline: none;
        }

        .input-field input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .tone-indicator {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .tone-aggressive {
            background: var(--tension-red);
            box-shadow: 0 0 20px var(--tension-red);
        }

        .tone-neutral {
            background: rgba(255, 255, 255, 0.5);
        }

        .tone-conciliatory {
            background: var(--coral-base-left);
            box-shadow: 0 0 20px var(--coral-base-left);
        }

        .merger-zone {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(247, 255, 247, 0.05) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 3s ease, transform 3s ease;
        }

        .merger-zone.active {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.5);
        }

        .resolution-burst {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            pointer-events: none;
        }

        .burst-ray {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 2px;
            height: 0;
            background: linear-gradient(to top, transparent, var(--resolution-gold));
            transform-origin: bottom center;
            opacity: 0;
        }

        .burst-active .burst-ray {
            animation: burst-expand 2s ease-out forwards;
        }

        @keyframes burst-expand {
            0% {
                height: 0;
                opacity: 0;
            }
            50% {
                height: 200px;
                opacity: 1;
            }
            100% {
                height: 200px;
                opacity: 0;
            }
        }

        .save-memento {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--resolution-gold);
            color: var(--membrane-bg);
            border: none;
            padding: 12px 32px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .save-memento.visible {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .save-memento:hover {
            transform: translateX(-50%) translateY(0) scale(1.05);
            box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3);
        }

        .growth-indicator {
            position: absolute;
            top: 40px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 0.5px;
        }

        .growth-left {
            left: 120px;
        }

        .growth-right {
            right: 120px;
        }

        .common-ground-text {
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
            font-weight: 300;
            letter-spacing: 1px;
            opacity: 0;
            transition: opacity 2s ease;
        }

        .common-ground-text.visible {
            opacity: 1;
        }

        .coral-tip {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse-grow 3s ease-in-out infinite;
        }

        @keyframes pulse-grow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        .connection-strand {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, var(--coral-base-left), var(--coral-base-right));
            opacity: 0;
            transform-origin: left center;
            transition: all 2s ease;
        }

        .connection-strand.active {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div class="ocean-floor"></div>
    
    <div class="membrane-divide"></div>
    
    <div class="coral-container coral-left">
        <div class="coral-structure" id="coral-left">
            <div class="coral-branch" style="bottom: 0; left: 50%; transform: translateX(-50%);">
                <div class="coral-segment conciliatory-growth"></div>
            </div>
        </div>
    </div>
    
    <div class="coral-container coral-right">
        <div class="coral-structure" id="coral-right">
            <div class="coral-branch" style="bottom: 0; left: 50%; transform: translateX(-50%);">
                <div class="coral-segment conciliatory-growth" style="background: radial-gradient(circle, var(--coral-base-right) 0%, transparent 70%);"></div>
            </div>
        </div>
    </div>
    
    <div class="merger-zone" id="merger-zone"></div>
    
    <div class="resolution-burst" id="resolution-burst">
        <div class="burst-ray" style="transform: rotate(0deg)"></div>
        <div class="burst-ray" style="transform: rotate(30deg)"></div>
        <div class="burst-ray" style="transform: rotate(60deg)"></div>
        <div class="burst-ray" style="transform: rotate(90deg)"></div>
        <div class="burst-ray" style="transform: rotate(120deg)"></div>
        <div class="burst-ray" style="transform: rotate(150deg)"></div>
        <div class="burst-ray" style="transform: rotate(180deg)"></div>
        <div class="burst-ray" style="transform: rotate(210deg)"></div>
        <div class="burst-ray" style="transform: rotate(240deg)"></div>
        <div class="burst-ray" style="transform: rotate(270deg)"></div>
        <div class="burst-ray" style="transform: rotate(300deg)"></div>
        <div class="burst-ray" style="transform: rotate(330deg)"></div>
    </div>
    
    <div class="growth-indicator growth-left">Person A</div>
    <div class="growth-indicator growth-right">Person B</div>
    
    <div class="common-ground-text" id="common-ground">Finding Common Ground...</div>
    
    <div class="input-field input-left">
        <input type="text" placeholder="Share your perspective..." id="input-left">
        <div class="tone-indicator" id="tone-left"></div>
    </div>
    
    <div class="input-field input-right">
        <input type="text" placeholder="Share your perspective..." id="input-right">
        <div class="tone-indicator" id="tone-right"></div>
    </div>
    
    <button class="save-memento" id="save-btn">Save Our Resolution</button>
    
    <script>
        const leftCoral = document.getElementById('coral-left');
        const rightCoral = document.getElementById('coral-right');
        const leftInput = document.getElementById('input-left');
        const rightInput = document.getElementById('input-right');
        const leftTone = document.getElementById('tone-left');
        const rightTone = document.getElementById('tone-right');
        const mergerZone = document.getElementById('merger-zone');
        const commonGround = document.getElementById('common-ground');
        const saveBtn = document.getElementById('save-btn');
        const membrane = document.querySelector('.membrane-divide');
        const resolutionBurst = document.getElementById('resolution-burst');
        
        let leftGrowthHeight = 50;
        let rightGrowthHeight = 50;
        let commonGroundScore = 0;
        
        const aggressiveWords = ['wrong', 'stupid', 'hate', 'never', 'always', 'fault', 'blame'];
        const conciliatoryWords = ['understand', 'sorry', 'agree', 'together', 'appreciate', 'thank', 'love'];
        
        function analyzeTone(text) {
            const lower = text.toLowerCase();
            let tone = 'neutral';
            
            for (let word of aggressiveWords) {
                if (lower.includes(word)) {
                    tone = 'aggressive';
                    break;
                }
            }
            
            for (let word of conciliatoryWords) {
                if (lower.includes(word)) {
                    tone = 'conciliatory';
                    break;
                }
            }
            
            return tone;
        }
        
        function addCoralGrowth(container, tone, side) {
            const branch = document.createElement('div');
            branch.className = 'coral-branch';
            
            const angle = (Math.random() - 0.5) * 60;
            const height = side === 'left' ? leftGrowthHeight : rightGrowthHeight;
            
            branch.style.bottom = `${height}px`;
            branch.style.left = '50%';
            branch.style.transform = `translateX(-50%) rotate(${angle}deg)`;
            
            const segment = document.createElement('div');
            segment.className = `coral-segment ${tone}-growth`;
            
            if (tone === 'conciliatory') {
                segment.style.background = `radial-gradient(circle, var(--coral-base-${side}) 0%, transparent 70%)`;
                
                if (side === 'left') {
                    leftGrowthHeight += 30;
                } else {
                    rightGrowthHeight += 30;
                }
                
                commonGroundScore += 10;
            } else if (tone === 'aggressive') {
                if (side === 'left') {
                    leftGrowthHeight += 20;
                } else {
                    rightGrowthHeight += 20;
                }
                
                commonGroundScore = Math.max(0, commonGroundScore - 5);
            }
            
            branch.appendChild(segment);
            container.appendChild(branch);
            
            // Add floating harmony particles for conciliatory growth
            if (tone === 'conciliatory') {
                for (let i = 0; i < 3; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'harmony-particle';
                    particle.style.left = `${50 + (Math.random() - 0.5) * 40}%`;
                    particle.style.bottom = `${height}px`;
                    particle.style.setProperty('--drift-x', `${(Math.random() - 0.5) * 100}px`);
                    particle.style.animationDelay = `${i * 0.3}s`;
                    container.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 8000);
                }
            }
            
            // Check for merger
            if (commonGroundScore >= 30) {
                membrane.classList.add('active');
                mergerZone.classList.add('active');
                commonGround.classList.add('visible');
                
                // Create connection strands
                if (commonGroundScore === 30) {
                    createConnectionStrands();
                }
                
                if (commonGroundScore >= 50) {
                    saveBtn.classList.add('visible');
                    resolutionBurst.classList.add('burst-active');
                }
            }
        }
        
        function createConnectionStrands() {
            for (let i = 0; i < 5; i++) {
                const strand = document.createElement('div');
                strand.className = 'connection-strand';
                strand.style.top = `${300 + i * 50}px`;
                strand.style.left = '520px';
                strand.style.width = '400px';
                strand.style.transformOrigin = 'center center';
                strand.style.transform = `rotate(${(Math.random() - 0.5) * 20}deg)`;
                document.body.appendChild(strand);
                
                setTimeout(() => strand.classList.add('active'), i * 200);
            }
        }
        
        leftInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const tone = analyzeTone(e.target.value);
                leftTone.className = `tone-indicator tone-${tone}`;
                addCoralGrowth(leftCoral, tone, 'left');
                e.target.value = '';
                
                setTimeout(() => {
                    leftTone.className = 'tone-indicator';
                }, 2000);
            }
        });
        
        rightInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && e.target.value.trim()) {
                const tone = analyzeTone(e.target.value);
                rightTone.className = `tone-indicator tone-${tone}`;
                addCoralGrowth(rightCoral, tone, 'right');
                e.target.value = '';
                
                setTimeout(() => {
                    rightTone.className = 'tone-indicator';
                }, 2000);
            }
        });
        
        saveBtn.addEventListener('click', () => {
            // In a real implementation, this would save the canvas as an image
            alert('Your resolution artwork has been saved as a memento of this moment.');
        });
        
        // Add initial coral tips
        setTimeout(() => {
            const leftTip = document.createElement('div');
            leftTip.className = 'coral-tip';
            leftTip.style.background = var('--coral-base-left');
            leftTip.style.bottom = '60px';
            leftTip.style.left = '50%';
            leftTip.style.transform = 'translateX(-50%)';
            leftCoral.appendChild(leftTip);
            
            const rightTip = document.createElement('div');
            rightTip.className = 'coral-tip';
            rightTip.style.background = var('--coral-base-right');
            rightTip.style.bottom = '60px';
            rightTip.style.left = '50%';
            rightTip.style.transform = 'translateX(-50%)';
            rightCoral.appendChild(rightTip);
        }, 1000);
    </script>
</body>
</html>
