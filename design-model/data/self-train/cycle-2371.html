<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Cast</title>
    <style>
        :root {
            --space-black: #0a0a0f;
            --deep-purple: #1a1625;
            --stellar-blue: #2d4a87;
            --cosmic-violet: #4c3a7d;
            --nebula-pink: #8b5a8c;
            --star-white: #f8f9fa;
            --listened-glow: #64ffda;
            --progress-amber: #ffc947;
            --series-line: #4a5568;
            --constellation-glow: rgba(100, 255, 218, 0.3);
            --episode-size: 8px;
            --series-size: 12px;
            --major-size: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--space-black);
            color: var(--star-white);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .starfield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, var(--cosmic-violet) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, var(--stellar-blue) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, var(--deep-purple) 0%, transparent 50%),
                var(--space-black);
        }

        .starfield::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(1px 1px at 100px 150px, var(--star-white), transparent),
                radial-gradient(1px 1px at 300px 80px, var(--star-white), transparent),
                radial-gradient(1px 1px at 500px 200px, var(--star-white), transparent),
                radial-gradient(1px 1px at 800px 120px, var(--star-white), transparent),
                radial-gradient(1px 1px at 1200px 180px, var(--star-white), transparent),
                radial-gradient(1px 1px at 200px 350px, var(--star-white), transparent),
                radial-gradient(1px 1px at 700px 400px, var(--star-white), transparent),
                radial-gradient(1px 1px at 1100px 320px, var(--star-white), transparent);
            opacity: 0.6;
        }

        .constellation-map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .constellation {
            position: absolute;
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: var(--series-line);
            transform-origin: left center;
            opacity: 0.4;
            transition: opacity 0.3s ease;
        }

        .constellation.active .constellation-line {
            opacity: 0.8;
            box-shadow: 0 0 4px var(--constellation-glow);
        }

        .episode {
            position: absolute;
            width: var(--episode-size);
            height: var(--episode-size);
            border-radius: 50%;
            background: var(--star-white);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.7;
        }

        .episode.series-start {
            width: var(--series-size);
            height: var(--series-size);
            background: var(--stellar-blue);
            box-shadow: 0 0 8px rgba(45, 74, 135, 0.5);
        }

        .episode.major {
            width: var(--major-size);
            height: var(--major-size);
            background: var(--nebula-pink);
            box-shadow: 0 0 12px rgba(139, 90, 140, 0.6);
        }

        .episode.listened {
            background: var(--listened-glow);
            box-shadow: 0 0 16px var(--constellation-glow);
            opacity: 1;
            animation: pulse 2s infinite;
        }

        .episode.playing {
            background: var(--progress-amber);
            box-shadow: 0 0 20px rgba(255, 201, 71, 0.8);
            animation: playing-pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes playing-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .episode:hover {
            transform: scale(1.5);
            opacity: 1;
            z-index: 10;
        }

        .player-hud {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 22, 37, 0.9);
            border: 1px solid var(--cosmic-violet);
            border-radius: 20px;
            padding: 20px 30px;
            backdrop-filter: blur(20px);
            min-width: 400px;
            text-align: center;
        }

        .episode-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--listened-glow);
        }

        .series-name {
            font-size: 14px;
            color: var(--nebula-pink);
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--cosmic-violet);
            border-radius: 2px;
            margin: 15px 0;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--progress-amber);
            border-radius: 2px;
            width: 34%;
            box-shadow: 0 0 8px rgba(255, 201, 71, 0.4);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: var(--stellar-blue);
            color: var(--star-white);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn.play {
            width: 50px;
            height: 50px;
            background: var(--listened-glow);
            color: var(--space-black);
        }

        .control-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 12px rgba(100, 255, 218, 0.4);
        }

        .legend {
            position: absolute;
            top: 40px;
            right: 40px;
            background: rgba(26, 22, 37, 0.8);
            border: 1px solid var(--cosmic-violet);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(15px);
        }

        .legend-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--star-white);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 24px;
            font-weight: 700;
            color: var(--listened-glow);
            text-shadow: 0 0 10px var(--constellation-glow);
        }

        .constellation-name {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--nebula-pink);
            opacity: 0;
            transition: opacity 0.3s ease;
            font-weight: 500;
        }

        .constellation:hover .constellation-name {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="starfield"></div>
    
    <div class="logo">✦ Constellation Cast</div>

    <div class="constellation-map">
        <!-- Tech Talks Constellation -->
        <div class="constellation" style="top: 150px; left: 200px;">
            <div class="constellation-name">Tech Talks</div>
            <div class="constellation-line" style="width: 80px; transform: rotate(25deg);"></div>
            <div class="constellation-line" style="width: 60px; transform: rotate(-15deg); top: 20px; left: 70px;"></div>
            <div class="constellation-line" style="width: 90px; transform: rotate(45deg); top: 15px; left: 120px;"></div>
            
            <div class="episode series-start listened" style="top: 0; left: 0;"></div>
            <div class="episode listened" style="top: 15px; left: 75px;"></div>
            <div class="episode listened" style="top: 8px; left: 125px;"></div>
            <div class="episode major playing" style="top: 35px; left: 200px;"></div>
        </div>

        <!-- Storytelling Constellation -->
        <div class="constellation active" style="top: 300px; left: 500px;">
            <div class="constellation-name">Storytelling Masters</div>
            <div class="constellation-line" style="width: 120px; transform: rotate(-30deg);"></div>
            <div class="constellation-line" style="width: 100px; transform: rotate(10deg); top: 25px; left: 100px;"></div>
            <div class="constellation-line" style="width: 70px; transform: rotate(-45deg); top: 20px; left: 180px;"></div>
            <div class="constellation-line" style="width: 85px; transform: rotate(60deg); top: 50px; left: 230px;"></div>
            
            <div class="episode series-start listened" style="top: 0; left: 0;"></div>
            <div class="episode listened" style="top: 30px; left: 95px;"></div>
            <div class="episode listened" style="top: 25px; left: 175px;"></div>
            <div class="episode listened" style="top: 15px; left: 240px;"></div>
            <div class="episode major listened" style="top: 65px; left: 310px;"></div>
            <div class="episode" style="top: 45px; left: 280px;"></div>
        </div>

        <!-- Science Deep Dive Constellation -->
        <div class="constellation" style="top: 100px; left: 800px;">
            <div class="constellation-name">Science Deep Dive</div>
            <div class="constellation-line" style="width: 95px; transform: rotate(75deg);"></div>
            <div class="constellation-line" style="width: 110px; transform: rotate(15deg); top: 80px; left: 20px;"></div>
            <div class="constellation-line" style="width: 75px; transform: rotate(-60deg); top: 75px; left: 120px;"></div>
            
            <div class="episode series-start listened" style="top: 0; left: 0;"></div>
            <div class="episode listened" style="top: 85px; left: 25px;"></div>
            <div class="episode major listened" style="top: 80px; left: 125px;"></div>
            <div class="episode listened" style="top: 105px; left: 185px;"></div>
            <div class="episode" style="top: 65px; left: 95px;"></div>
        </div>

        <!-- History Chronicles Constellation -->
        <div class="constellation" style="top: 450px; left: 900px;">
            <div class="constellation-name">History Chronicles</div>
            <div class="constellation-line" style="width: 130px; transform: rotate(-20deg);"></div>
            <div class="constellation-line" style="width: 80px; transform: rotate(40deg); top: -15px; left: 120px;"></div>
            <div class="constellation-line" style="width: 90px; transform: rotate(-70deg); top: 35px; left: 180px;"></div>
            
            <div class="episode series-start" style="top: 0; left: 0;"></div>
            <div class="episode" style="top: -20px; left: 125px;"></div>
            <div class="episode" style="top: 10px; left: 185px;"></div>
            <div class="episode major" style="top: 60px; left: 240px;"></div>
            <div class="episode" style="top: 35px; left: 170px;"></div>
        </div>

        <!-- Comedy Hour Constellation -->
        <div class="constellation" style="top: 550px; left: 300px;">
            <div class="constellation-name">Comedy Hour</div>
            <div class="constellation-line" style="width: 100px; transform: rotate(0deg);"></div>
            <div class="constellation-line" style="width: 85px; transform: rotate(30deg); top: 0; left: 95px;"></div>
            <div class="constellation-line" style="width: 70px; transform: rotate(-45deg); top: 25px; left: 170px;"></div>
            
            <div class="episode series-start listened" style="top: 0; left: 0;"></div>
            <div class="episode listened" style="top: 0; left: 100px;"></div>
            <div class="episode" style="top: 25px; left: 175px;"></div>
            <div class="episode" style="top: 50px; left: 230px;"></div>
        </div>

        <!-- Philosophy Talks Constellation -->
        <div class="constellation" style="top: 200px; left: 1100px;">
            <div class="constellation-name">Philosophy Talks</div>
            <div class="constellation-line" style="width: 75px; transform: rotate(90deg);"></div>
            <div class="constellation-line" style="width: 60px; transform: rotate(45deg); top: 70px; left: -10px;"></div>
            <div class="constellation-line" style="width: 85px; transform: rotate(-30deg); top: 110px; left: 35px;"></div>
            
            <div class="episode series-start listened" style="top: 0; left: 0;"></div>
            <div class="episode listened" style="top: 75px; left: 0;"></div>
            <div class="episode" style="top: 115px; left: 40px;"></div>
            <div class="episode major" style="top: 135px; left: 115px;"></div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-title">Navigation</div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--star-white);"></div>
            <span>Unplayed Episode</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--listened-glow); box-shadow: 0 0 8px var(--constellation-glow);"></div>
            <span>Listened</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--stellar-blue); width: 14px; height: 14px;"></div>
            <span>Series Start</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--nebula-pink); width: 16px; height: 16px;"></div>
            <span>Special Episode</span>
        </div>
        <div class="legend-item">
            <div class="legend-dot" style="background: var(--progress-amber); box-shadow: 0 0 8px rgba(255, 201, 71, 0.4);"></div>
            <span>Currently Playing</span>
        </div>
    </div>

    <div class="player-hud">
        <div class="episode-title">The Future of AI in Creative Industries</div>
        <div class="series-name">Tech Talks • Episode 15</div>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="controls">
            <button class="control-btn">⏮</button>
            <button class="control-btn">⏪</button>
            <button class="control-btn play">⏸</button>
            <button class="control-btn">⏩</button>
            <button class="control-btn">⏭</button>
        </div>
    </div>
</body>
</html>
