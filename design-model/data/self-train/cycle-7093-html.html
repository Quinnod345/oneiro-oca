<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Weather System</title>
    <style>
        :root {
            --terrain: #0f0e0c;
            --mist: #2a2824;
            --clay: #d4c5b9;
            --storm: #8b5a3c;
            --sun: #f4d35e;
            --rain: #4a7c7e;
            --fog: rgba(212, 197, 185, 0.08);
            --lightning: #fff8dc;
            --shadow: rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--terrain);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--clay);
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .temporal-landscape {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 1200px;
            transform-style: preserve-3d;
        }

        .time-horizon {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65%;
            background: linear-gradient(to top, var(--mist) 0%, transparent 60%);
            transform: rotateX(70deg) translateZ(-200px);
            opacity: 0.9;
        }

        .hour-marker {
            position: absolute;
            width: 100%;
            height: 2px;
            background: var(--fog);
            transform-origin: center;
            opacity: 0.3;
        }

        .hour-marker:nth-child(1) { bottom: 10%; }
        .hour-marker:nth-child(2) { bottom: 20%; }
        .hour-marker:nth-child(3) { bottom: 30%; }
        .hour-marker:nth-child(4) { bottom: 40%; }
        .hour-marker:nth-child(5) { bottom: 50%; }
        .hour-marker:nth-child(6) { bottom: 60%; }

        .emotional-sculptor {
            position: absolute;
            left: 3rem;
            top: 3rem;
            width: 320px;
            height: 320px;
            background: var(--mist);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px var(--shadow);
            z-index: 100;
        }

        .sculptor-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }

        .mood-forms {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .mood-form {
            height: 80px;
            background: var(--terrain);
            border-radius: 8px;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .mood-form:hover {
            transform: scale(1.05);
        }

        .mood-form.active {
            box-shadow: 0 0 0 2px var(--storm);
        }

        .form-angry {
            background: linear-gradient(135deg, transparent 40%, var(--storm) 40%, var(--storm) 60%, transparent 60%);
        }

        .form-angry::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                var(--storm) 10px,
                var(--storm) 12px
            );
            opacity: 0.3;
        }

        .form-calm {
            background: radial-gradient(circle at center, var(--rain) 30%, transparent 70%);
        }

        .form-calm::before {
            content: '';
            position: absolute;
            width: 60%;
            height: 60%;
            background: var(--rain);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.5;
        }

        .form-confused {
            background: conic-gradient(from 45deg, var(--clay) 0deg, transparent 120deg, var(--clay) 240deg, transparent 360deg);
        }

        .form-confused::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-conic-gradient(from 0deg at 50% 50%, transparent 0deg, var(--clay) 30deg, transparent 60deg);
            opacity: 0.3;
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        .intensity-slider {
            width: 100%;
            height: 40px;
            background: var(--terrain);
            border-radius: 20px;
            position: relative;
            cursor: pointer;
        }

        .intensity-track {
            position: absolute;
            height: 4px;
            background: var(--fog);
            top: 50%;
            left: 20px;
            right: 20px;
            transform: translateY(-50%);
            border-radius: 2px;
        }

        .intensity-fill {
            position: absolute;
            height: 100%;
            background: var(--storm);
            width: 30%;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .intensity-handle {
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--clay);
            border-radius: 50%;
            top: 50%;
            left: 30%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px var(--shadow);
            transition: left 0.3s ease;
        }

        .weather-phenomena {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .storm-system {
            position: absolute;
            width: 300px;
            height: 200px;
            right: 20%;
            top: 25%;
            animation: drift 20s ease-in-out infinite;
        }

        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-50px, 20px); }
        }

        .storm-cloud {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, var(--mist) 0%, transparent 70%);
            filter: blur(20px);
            opacity: 0.8;
        }

        .lightning-bolt {
            position: absolute;
            width: 2px;
            height: 80px;
            background: var(--lightning);
            top: 80%;
            left: 50%;
            transform: translateX(-50%);
            opacity: 0;
            animation: flash 4s infinite;
        }

        @keyframes flash {
            0%, 90%, 100% { opacity: 0; }
            95% { opacity: 1; }
        }

        .fog-bank {
            position: absolute;
            width: 400px;
            height: 150px;
            left: 10%;
            bottom: 30%;
            background: linear-gradient(to right, transparent, var(--fog), transparent);
            filter: blur(40px);
            animation: fogDrift 15s ease-in-out infinite;
        }

        @keyframes fogDrift {
            0%, 100% { transform: translateX(0) scaleX(1); }
            50% { transform: translateX(100px) scaleX(1.2); }
        }

        .sun-break {
            position: absolute;
            width: 200px;
            height: 200px;
            right: 15%;
            top: 15%;
            background: radial-gradient(circle, var(--sun) 0%, transparent 60%);
            filter: blur(30px);
            opacity: 0.6;
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        .intervention-panel {
            position: absolute;
            right: 3rem;
            top: 3rem;
            width: 280px;
            background: var(--mist);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 8px 32px var(--shadow);
            z-index: 100;
        }

        .intervention-title {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }

        .intervention-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .intervention {
            background: var(--terrain);
            padding: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .intervention:hover {
            transform: translateX(-4px);
        }

        .intervention-icon {
            width: 24px;
            height: 24px;
            display: inline-block;
            margin-right: 0.75rem;
            vertical-align: middle;
        }

        .tree-icon {
            background: conic-gradient(from 180deg at 50% 100%, var(--storm) 0deg, var(--storm) 20deg, transparent 20deg, transparent 340deg, var(--storm) 340deg);
            clip-path: polygon(50% 0%, 20% 100%, 80% 100%);
        }

        .bridge-icon {
            background: var(--clay);
            height: 12px;
            position: relative;
            top: 6px;
        }

        .bridge-icon::before,
        .bridge-icon::after {
            content: '';
            position: absolute;
            width: 4px;
            height: 24px;
            background: var(--clay);
            top: -6px;
        }

        .bridge-icon::before { left: 20%; }
        .bridge-icon::after { right: 20%; }

        .timeline-view {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 800px;
            height: 120px;
            background: rgba(42, 40, 36, 0.9);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .timeline-hours {
            display: grid;
            grid-template-columns: repeat(24, 1fr);
            height: 100%;
            gap: 2px;
        }

        .hour-block {
            background: var(--terrain);
            border-radius: 4px;
            position: relative;
            transition: transform 0.3s ease;
        }

        .hour-block:hover {
            transform: translateY(-4px);
        }

        .hour-emotion {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: var(--storm);
            border-radius: 4px;
            transition: height 0.5s ease;
            opacity: 0.7;
        }

        .hour-emotion.calm { background: var(--rain); height: 30%; }
        .hour-emotion.anxious { background: var(--storm); height: 70%; }
        .hour-emotion.joyful { background: var(--sun); height: 50%; }
        .hour-emotion.uncertain { background: var(--fog); height: 40%; }

        .planted-tree {
            position: absolute;
            width: 40px;
            height: 60px;
            bottom: 25%;
            left: 35%;
            z-index: 60;
            animation: grow 1s ease-out;
        }

        @keyframes grow {
            from { transform: scale(0) translateY(20px); }
            to { transform: scale(1) translateY(0); }
        }

        .tree-trunk {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 8px;
            height: 30px;
            background: var(--storm);
            transform: translateX(-50%);
        }

        .tree-crown {
            position: absolute;
            bottom: 25px;
            left: 50%;
            width: 30px;
            height: 30px;
            background: radial-gradient(circle, var(--rain) 30%, transparent 70%);
            border-radius: 50%;
            transform: translateX(-50%);
            filter: blur(2px);
        }

        .emotional-readout {
            position: absolute;
            left: 3rem;
            bottom: 160px;
            font-size: 0.875rem;
            opacity: 0.7;
            letter-spacing: 0.1em;
        }

        .readout-current {
            margin-bottom: 0.5rem;
        }

        .readout-trajectory {
            color: var(--storm);
        }
    </style>
</head>
<body>
    <div class="temporal-landscape">
        <div class="time-horizon">
            <div class="hour-marker"></div>
            <div class="hour-marker"></div>
            <div class="hour-marker"></div>
            <div class="hour-marker"></div>
            <div class="hour-marker"></div>
            <div class="hour-marker"></div>
        </div>

        <div class="weather-phenomena">
            <div class="storm-system">
                <div class="storm-cloud"></div>
                <div class="lightning-bolt"></div>
            </div>
            <div class="fog-bank"></div>
            <div class="sun-break"></div>
        </div>

        <div class="planted-tree">
            <div class="tree-trunk"></div>
            <div class="tree-crown"></div>
        </div>
    </div>

    <div class="emotional-sculptor">
        <div class="sculptor-title">Current Emotional Form</div>
        <div class="mood-forms">
            <div class="mood-form form-angry"></div>
            <div class="mood-form form-calm active"></div>
            <div class="mood-form form-confused"></div>
            <div class="mood-form"></div>
            <div class="mood-form"></div>
            <div class="mood-form"></div>
        </div>
        <div class="intensity-slider">
            <div class="intensity-track">
                <div class="intensity-fill"></div>
            </div>
            <div class="intensity-handle"></div>
        </div>
    </div>

    <div class="intervention-panel">
        <div class="intervention-title">Environmental Modifiers</div>
        <div class="intervention-options">
            <div class="intervention">
                <span class="intervention-icon tree-icon"></span>
                <span>Plant Meditation Grove</span>
            </div>
            <div class="intervention">
                <span class="intervention-icon bridge-icon"></span>
                <span>Build Connection Bridge</span>
            </div>
            <div class="intervention">
                <span class="intervention-icon"></span>
                <span>Create Clarity Clearing</span>
            </div>
        </div>
    </div>

    <div class="timeline-view">
        <div class="timeline-hours">
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion uncertain"></div></div>
            <div class="hour-block"><div class="hour-emotion anxious"></div></div>
            <div class="hour-block"><div class="hour-emotion anxious"></div></div>
            <div class="hour-block"><div class="hour-emotion uncertain"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion joyful"></div></div>
            <div class="hour-block"><div class="hour-emotion joyful"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion uncertain"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion anxious"></div></div>
            <div class="hour-block"><div class="hour-emotion uncertain"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion joyful"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion uncertain"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
            <div class="hour-block"><div class="hour-emotion calm"></div></div>
        </div>
    </div>

    <div class="emotional-readout">
        <div class="readout-current">CURRENT STATE: CALM WITH UNDERLYING TENSION</div>
        <div class="readout-trajectory">TRAJECTORY: INCREASING CLARITY → AFTERNOON STORM → EVENING PEACE</div>
    </div>
</body>
</html>
