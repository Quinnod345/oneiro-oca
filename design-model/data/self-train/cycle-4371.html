<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Podcasts</title>
    <style>
        :root {
            --void-black: #0a0a0f;
            --deep-space: #1a1a2e;
            --cosmic-blue: #16213e;
            --star-white: #f8f9ff;
            --listened-gold: #ffd700;
            --listened-glow: #ffed4a;
            --constellation-line: #4a5568;
            --nebula-purple: #6b46c1;
            --orbit-silver: #94a3b8;
            --ui-overlay: rgba(26, 26, 46, 0.95);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
            width: 1440px;
            height: 900px;
            background: var(--void-black);
            overflow: hidden;
            position: relative;
        }

        .cosmic-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, var(--nebula-purple) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 30%, var(--cosmic-blue) 0%, transparent 50%),
                var(--void-black);
            opacity: 0.3;
        }

        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .constellation {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .constellation:hover {
            transform: scale(1.05);
        }

        .episode {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--star-white);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
        }

        .episode::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .episode:hover {
            transform: scale(1.2);
            box-shadow: 0 0 20px var(--star-white);
        }

        .episode.listened {
            background: var(--listened-gold);
            box-shadow: 
                0 0 15px var(--listened-glow),
                0 0 30px var(--listened-gold),
                0 0 45px var(--listened-gold);
            animation: pulse-glow 2s ease-in-out infinite alternate;
        }

        .episode.listened::before {
            background: radial-gradient(circle, var(--listened-glow) 0%, transparent 70%);
            opacity: 0.6;
        }

        @keyframes pulse-glow {
            0% { 
                box-shadow: 
                    0 0 15px var(--listened-glow),
                    0 0 30px var(--listened-gold),
                    0 0 45px var(--listened-gold);
            }
            100% { 
                box-shadow: 
                    0 0 20px var(--listened-glow),
                    0 0 40px var(--listened-gold),
                    0 0 60px var(--listened-gold);
            }
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: var(--constellation-line);
            transform-origin: left center;
            opacity: 0.6;
            transition: all 0.3s ease;
        }

        .constellation:hover .constellation-line {
            background: var(--orbit-silver);
            opacity: 1;
            box-shadow: 0 0 3px var(--orbit-silver);
        }

        .constellation.has-listened .constellation-line {
            background: linear-gradient(90deg, var(--listened-gold), var(--constellation-line));
            opacity: 0.8;
        }

        .player-interface {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 180px;
            background: var(--ui-overlay);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--constellation-line);
            display: flex;
            align-items: center;
            padding: 0 40px;
        }

        .current-episode {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .episode-artwork {
            width: 120px;
            height: 120px;
            border-radius: 16px;
            background: linear-gradient(135deg, var(--cosmic-blue), var(--nebula-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .episode-artwork::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 30%, var(--listened-glow) 0%, transparent 50%);
            opacity: 0.3;
        }

        .artwork-symbol {
            color: var(--star-white);
            font-size: 48px;
            font-weight: 300;
        }

        .episode-info h3 {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .episode-info p {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 4px;
        }

        .play-controls {
            display: flex;
            align-items: center;
            gap: 24px;
            margin: 0 60px;
        }

        .play-button {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--listened-gold);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--void-black);
            font-size: 24px;
        }

        .play-button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px var(--listened-glow);
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--orbit-silver);
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: var(--orbit-silver);
            color: var(--void-black);
        }

        .progress-section {
            flex: 1;
            max-width: 300px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--constellation-line);
            border-radius: 2px;
            margin-bottom: 12px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: var(--listened-gold);
            border-radius: 2px;
            width: 34%;
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -4px;
            width: 12px;
            height: 12px;
            background: var(--listened-gold);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--listened-glow);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .series-legend {
            position: absolute;
            top: 40px;
            left: 40px;
            background: var(--ui-overlay);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--constellation-line);
            min-width: 280px;
        }

        .legend-title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-item:nth-child(2) .legend-dot { background: var(--star-white); }
        .legend-item:nth-child(3) .legend-dot { 
            background: var(--listened-gold);
            box-shadow: 0 0 10px var(--listened-glow);
        }
        .legend-item:nth-child(4) .legend-dot { background: var(--nebula-purple); }
        .legend-item:nth-child(5) .legend-dot { background: var(--orbit-silver); }

        .legend-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .constellation-label {
            position: absolute;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 0 10px var(--void-black);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .constellation:hover .constellation-label {
            opacity: 1;
        }
    </style>
</head>
<body>
