<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=900">
    <title>Focus State Menu Bar</title>
    <style>
        :root {
            --primary-text: #1d1d1f;
            --secondary-text: #86868b;
            --tertiary-text: #c7c7cc;
            --divider: rgba(0, 0, 0, 0.1);
            --background: #f5f5f7;
            --menubar-bg: rgba(246, 246, 246, 0.8);
            --focus-active: #007aff;
            --focus-glow: rgba(0, 122, 255, 0.15);
            --accent-warm: #ff9500;
            --accent-cool: #30d158;
            --pulse-duration: 4s;
            --breathe-duration: 6s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            background: linear-gradient(135deg, #f5f5f7 0%, #fafafa 50%, #f0f0f0 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            font-size: 13px;
            color: var(--primary-text);
            overflow: hidden;
            position: relative;
        }

        .menubar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: var(--menubar-bg);
            backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 0.5px solid var(--divider);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .menubar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .apple-logo {
            font-size: 14px;
            font-weight: 400;
            color: var(--primary-text);
        }

        .menubar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .focus-indicator {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--focus-active);
            box-shadow: 0 0 0 2px var(--focus-glow);
            animation: focus-pulse var(--pulse-duration) ease-in-out infinite;
        }

        .focus-indicator.deep-focus {
            background: var(--accent-cool);
            box-shadow: 0 0 0 2px rgba(48, 209, 88, 0.2);
            animation: deep-breathe var(--breathe-duration) ease-in-out infinite;
        }

        .focus-indicator.break-mode {
            background: var(--accent-warm);
            box-shadow: 0 0 0 2px rgba(255, 149, 0, 0.2);
            animation: gentle-fade 3s ease-in-out infinite alternate;
        }

        .menubar-item {
            font-size: 13px;
            color: var(--primary-text);
            padding: 2px 6px;
            border-radius: 4px;
            transition: background 0.15s ease;
        }

        .menubar-item:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .main-content {
            margin-top: 24px;
            height: calc(100vh - 24px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .focus-visualization {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .focus-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid;
        }

        .focus-ring.outer {
            width: 360px;
            height: 360px;
            border-color: rgba(0, 122, 255, 0.1);
            animation: ring-rotate 20s linear infinite;
        }

        .focus-ring.middle {
            width: 260px;
            height: 260px;
            border-color: rgba(0, 122, 255, 0.15);
            animation: ring-rotate 15s linear infinite reverse;
        }

        .focus-ring.inner {
            width: 160px;
            height: 160px;
            border-color: rgba(0, 122, 255, 0.2);
            animation: ring-breathe 8s ease-in-out infinite;
        }

        .focus-core {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(0, 122, 255, 0.8) 0%, 
                rgba(0, 122, 255, 0.4) 50%, 
                rgba(0, 122, 255, 0.1) 100%);
            box-shadow: 
                0 0 20px rgba(0, 122, 255, 0.3),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
            animation: core-pulse var(--pulse-duration) ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .focus-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            animation: dot-float 3s ease-in-out infinite;
        }

        .ambient-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            border-radius: 50%;
            background: var(--focus-active);
            opacity: 0;
        }

        .particle:nth-child(1) {
            top: 20%;
            left: 30%;
            animation: particle-float 12s ease-in-out infinite;
            animation-delay: 0s;
        }

        .particle:nth-child(2) {
            top: 40%;
            right: 25%;
            animation: particle-float 15s ease-in-out infinite;
            animation-delay: 2s;
        }

        .particle:nth-child(3) {
            bottom: 30%;
            left: 40%;
            animation: particle-float 18s ease-in-out infinite;
            animation-delay: 4s;
        }

        .particle:nth-child(4) {
            top: 60%;
            right: 40%;
            animation: particle-float 14s ease-in-out infinite;
            animation-delay: 6s;
        }

        .status-text {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 500;
            color: var(--secondary-text);
            letter-spacing: 0.3px;
            animation: text-breathe 4s ease-in-out infinite;
        }

        @keyframes focus-pulse {
            0%, 100% { 
                box-shadow: 0 0 0 2px var(--focus-glow);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 0 4px var(--focus-glow);
                transform: scale(1.1);
            }
        }

        @keyframes deep-breathe {
            0%, 100% { 
                box-shadow: 0 0 0 2px rgba(48, 209, 88, 0.2);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 0 6px rgba(48, 209, 88, 0.1);
                transform: scale(1.2);
            }
        }

        @keyframes gentle-fade {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        @keyframes ring-rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes ring-breathe {
            0%, 100% { 
                transform: scale(1);
                opacity: 0.2;
            }
            50% { 
                transform: scale(1.1);
                opacity: 0.4;
            }
        }

        @keyframes core-pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px rgba(0, 122, 255, 0.3);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(0, 122, 255, 0.4);
            }
        }

        @keyframes dot-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }

        @keyframes particle-float {
            0%, 100% { 
                opacity: 0;
                transform: translateY(0px) scale(0.8);
            }
            25% { 
                opacity: 0.4;
                transform: translateY(-20px) scale(1);
            }
            50% { 
                opacity: 0.6;
                transform: translateY(-10px) scale(1.2);
            }
            75% { 
                opacity: 0.3;
                transform: translateY(-30px) scale(1);
            }
        }

        @keyframes text-breathe {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .focus-mode-selector {
            position: absolute;
            top: 60px;
            right: 40px;
            display: flex;
            gap: 8px;
        }

        .mode-button {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 1px solid var(--divider);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .mode-button.active.focus {
            background: var(--focus-active);
            border-color: var(--focus-active);
            box-shadow: 0 0 0 2px var(--focus-glow);
        }

        .mode-button.active.deep {
            background: var(--accent-cool);
            border-color: var(--accent-cool);
            box-shadow: 0 0 0 2px rgba(48, 209, 88, 0.2);
        }

        .mode-button.active.break {
            background: var(--accent-warm);
            border-color: var(--accent-warm);
            box-shadow: 0 0 0 2px rgba(255, 149, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="menubar">
        <div class="menubar-left">
            <div class="apple-logo"></div>
        </div>
        <div class="menubar-right">
            <div class="focus-indicator"></div>
            <div class="menubar-item">2:47 PM</div>
            <div class="menubar-item">100%</div>
            <div class="menubar-item">🔋</div>
            <div class="menubar-item">📶</div>
            <div class="menubar-item">🔍</div>
            <div class="menubar-item">⌃</div>
        </div>
    </div>

    <div class="main-content">
        <div class="focus-visualization">
            <div class="focus-ring outer"></div>
            <div class="focus-ring middle"></div>
            <div class="focus-ring inner"></div>
            <div class="focus-core">
                <div class="focus-dot"></div>
            </div>
        </div>

        <div class="ambient-particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="status-text">Focus Active</div>

        <div class="focus-mode-selector">
            <div class="mode-button active focus"></div>
            <div class="mode-button"></div>
            <div class="mode-button"></div>
        </div>
    </div>
</body>
</html>
