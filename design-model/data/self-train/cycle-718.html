<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Levels Calendar</title>
    <style>
        :root {
            --energy-high: #2ecc71;
            --energy-medium: #f39c12;
            --energy-low: #e74c3c;
            --energy-valley: #8e44ad;
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --text-primary: #eee;
            --text-secondary: #bbb;
            --border: #334155;
            --accent: #64ffda;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            padding: 32px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .current-month {
            font-size: 20px;
            font-weight: 600;
            min-width: 140px;
            text-align: center;
        }

        .calendar {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border);
        }

        .day-header {
            padding: 16px;
            text-align: center;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .calendar-body {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(5, 1fr);
            height: calc(100% - 60px);
        }

        .day-cell {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            position: relative;
            transition: all 0.2s ease;
        }

        .day-cell:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .day-number {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .energy-chart {
            height: 80px;
            position: relative;
            margin-top: 4px;
        }

        .energy-line {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100%;
        }

        .energy-curve {
            width: 100%;
            height: 100%;
            fill: none;
            stroke-width: 2;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
        }

        .energy-area {
            width: 100%;
            height: 100%;
            opacity: 0.2;
        }

        .energy-high-curve { stroke: var(--energy-high); }
        .energy-medium-curve { stroke: var(--energy-medium); }
        .energy-low-curve { stroke: var(--energy-low); }
        .energy-valley-curve { stroke: var(--energy-valley); }

        .energy-high-area { fill: var(--energy-high); }
        .energy-medium-area { fill: var(--energy-medium); }
        .energy-low-area { fill: var(--energy-low); }
        .energy-valley-area { fill: var(--energy-valley); }

        .energy-legend {
            display: flex;
            justify-content: center;
            gap: 32px;
            margin-top: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .dot-high { background: var(--energy-high); }
        .dot-medium { background: var(--energy-medium); }
        .dot-low { background: var(--energy-low); }
        .dot-valley { background: var(--energy-valley); }

        .other-month {
            opacity: 0.3;
        }

        .weekend {
            background: rgba(255, 255, 255, 0.02);
        }
    </style>
</head>
