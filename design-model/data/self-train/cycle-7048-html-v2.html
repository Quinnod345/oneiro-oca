<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Baggage Claim</title>
    <style>
        :root {
            --bg-light: #f5f5f5;
            --bg-dark: #1a1a1a;
            --accent: #d32f2f;
            --text-primary: #333;
            --text-secondary: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-light);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 90%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 4rem;
            font-weight: 400;
        }

        .baggage-area {
            position: relative;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .suitcase {
            position: absolute;
            width: 120px;
            height: 160px;
            background: var(--bg-dark);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .suitcase:nth-child(1) {
            transform: translateX(-200px) scale(0.8);
            opacity: 0.7;
        }

        .suitcase:nth-child(2) {
            transform: translateX(-100px) scale(0.9);
            opacity: 0.85;
        }

        .suitcase:nth-child(3) {
            z-index: 10;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
        }

        .suitcase:nth-child(4) {
            transform: translateX(100px) scale(0.9);
            opacity: 0.85;
        }

        .suitcase:nth-child(5) {
            transform: translateX(200px) scale(0.8);
            opacity: 0.7;
        }

        .suitcase-label {
            color: white;
            font-size: 0.875rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0 1rem;
            text-align: center;
            line-height: 1.4;
        }

        .suitcase-handle {
            position: absolute;
            top: -10px;
            width: 40px;
            height: 20px;
            border: 3px solid var(--bg-dark);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            background: transparent;
        }

        .suitcase:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .suitcase:nth-child(1):hover,
        .suitcase:nth-child(2):hover,
        .suitcase:nth-child(4):hover,
        .suitcase:nth-child(5):hover {
            opacity: 1;
        }

        .claim-button {
            margin-top: 4rem;
            padding: 1rem 3rem;
            font-size: 1rem;
            font-weight: 500;
            color: white;
            background: var(--accent);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .claim-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(211, 47, 47, 0.3);
        }

        .claim-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .suitcase {
                width: 80px;
                height: 110px;
            }
            
            .suitcase:nth-child(1) {
                transform: translateX(-120px) scale(0.8);
            }
            
            .suitcase:nth-child(2) {
                transform: translateX(-60px) scale(0.9);
            }
            
            .suitcase:nth-child(4) {
                transform: translateX(60px) scale(0.9);
            }
            
            .suitcase:nth-child(5) {
                transform: translateX(120px) scale(0.8);
            }
            
            .suitcase-label {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Emotional Baggage Claim</h1>
        <p class="subtitle">What are you ready to let go?</p>
        
        <div class="baggage-area">
            <div class="suitcase">
                <div class="suitcase-handle"></div>
                <div class="suitcase-label">Past Regrets</div>
            </div>
            <div class="suitcase">
                <div class="suitcase-handle"></div>
                <div class="suitcase-label">Self Doubt</div>
            </div>
            <div class="suitcase">
                <div class="suitcase-handle"></div>
                <div class="suitcase-label">Old Grudges</div>
            </div>
            <div class="suitcase">
                <div class="suitcase-handle"></div>
                <div class="suitcase-label">Fear of Change</div>
            </div>
            <div class="suitcase">
                <div class="suitcase-handle"></div>
                <div class="suitcase-label">Toxic Habits</div>
            </div>
        </div>
        
        <button class="claim-button">Claim & Release</button>
    </div>
</body>
</html>
