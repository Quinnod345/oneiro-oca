<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Auction House</title>
    <style>
        :root {
            --void: #0a0a0f;
            --mist: #1a1a2e;
            --glow: #4a7c7e;
            --pulse: #7ec8e3;
            --drain: #ff6b6b;
            --crystal: #e0f7fa;
            --time: #ffd93d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--void);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-balance {
            position: fixed;
            top: 2rem;
            left: 2rem;
            z-index: 100;
            color: var(--time);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.125rem;
            text-transform: uppercase;
        }

        .time-value {
            font-size: 3rem;
            font-weight: 100;
            display: block;
            margin-top: 0.5rem;
            transition: color 0.3s;
        }

        .time-value.draining {
            color: var(--drain);
        }

        .memory-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 4rem;
            width: 90%;
            max-width: 1200px;
            padding: 4rem 2rem;
        }

        .memory-orb {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(126, 200, 227, 0.08), transparent 60%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(126, 200, 227, 0.15);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            overflow: hidden;
            animation: gentleDrift 20s ease-in-out infinite;
        }

        @keyframes gentleDrift {
            0%, 100% { transform: translateY(0) scale(1); }
            25% { transform: translateY(-10px) scale(1.02); }
            50% { transform: translateY(5px) scale(0.98); }
            75% { transform: translateY(-5px) scale(1.01); }
        }

        .memory-orb:nth-child(2) { animation-delay: -7s; }
        .memory-orb:nth-child(3) { animation-delay: -14s; }

        .memory-content {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background-size: cover;
            background-position: center;
            border-radius: 50%;
        }

        .memory-orb:hover {
            transform: scale(1.1);
            border-color: rgba(126, 200, 227, 0.6);
            box-shadow: 
                0 0 30px rgba(126, 200, 227, 0.3),
                inset 0 0 20px rgba(126, 200, 227, 0.1);
        }

        .memory-orb:hover .memory-content {
            opacity: 0.7;
        }

        .memory-price {
            position: absolute;
            bottom: -2.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: var(--time);
            font-size: 0.875rem;
            font-weight: 300;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
        }

        .memory-orb:hover .memory-price {
            opacity: 1;
        }

        .memory-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--crystal);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            opacity: 0.6;
            transition: opacity 0.3s;
            text-align: center;
        }

        .memory-orb:hover .memory-label {
            opacity: 0;
        }

        .bid-interface {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(126, 200, 227, 0.2);
            border-radius: 1rem;
            padding: 1.5rem 3rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .bid-interface.active {
            opacity: 1;
        }

        .bid-button {
            background: transparent;
            border: 1px solid var(--pulse);
            color: var(--pulse);
            padding: 0.5rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .bid-button:hover {
            background: var(--pulse);
            color: var(--void);
        }

        .selected-memory {
            color: var(--crystal);
            font-size: 0.875rem;
            opacity: 0.8;
        }

        @media (max-width: 768px) {
            .memory-container {
                grid-template-columns: 1fr;
                gap: 3rem;
            }
            
            .time-balance {
                top: 1rem;
                left: 1rem;
            }
            
            .time-value {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="time-balance">
        Time Balance
        <div class="time-value" id="timeValue">47:32</div>
    </div>

    <div class="memory-container">
        <div class="memory-orb" data-price="12:30" data-memory="childhood">
            <div class="memory-content" style="background-image: linear-gradient(135deg, rgba(126, 200, 227, 0.2), rgba(74, 124, 126, 0.3))"></div>
            <div class="memory-label">Childhood</div>
            <div class="memory-price">12:30 minutes</div>
        </div>

        <div class="memory-orb" data-price="08:45" data-memory="first-love">
            <div class="memory-content" style="background-image: linear-gradient(135deg, rgba(255, 107, 107, 0.2), rgba(255, 217, 61, 0.2))"></div>
            <div class="memory-label">First Love</div>
            <div class="memory-price">08:45 minutes</div>
        </div>

        <div class="memory-orb" data-price="15:00" data-memory="achievement">
            <div class="memory-content" style="background-image: linear-gradient(135deg, rgba(255, 217, 61, 0.3), rgba(224, 247, 250, 0.2))"></div>
            <div class="memory-label">Achievement</div>
            <div class="memory-price">15:00 minutes</div>
        </div>
    </div>

    <div class="bid-interface" id="bidInterface">
        <div class="selected-memory" id="selectedMemory"></div>
        <button class="bid-button">Place Bid</button>
    </div>

    <script>
        const timeValue = document.getElementById('timeValue');
        const bidInterface = document.getElementById('bidInterface');
        const selectedMemory = document.getElementById('selectedMemory');
        let currentTime = 47 * 60 + 32;
        let selectedOrb = null;

        setInterval(() => {
            currentTime = Math.max(0, currentTime - 1);
            const minutes = Math.floor(currentTime / 60);
            const seconds = currentTime % 60;
            timeValue.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            if (currentTime < 600) {
                timeValue.classList.add('draining');
            }
        }, 1000);

        document.querySelectorAll('.memory-orb').forEach(orb => {
            orb.addEventListener('click', () => {
                selectedOrb = orb;
                const memoryType = orb.dataset.memory;
                const price = orb.dataset.price;
                selectedMemory.textContent = `${memoryType.replace('-', ' ')} - ${price}`;
                bidInterface.classList.add('active');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.memory-orb') && !e.target.closest('.bid-interface')) {
                bidInterface.classList.remove('active');
            }
        });
    </script>
</body>
</html>
