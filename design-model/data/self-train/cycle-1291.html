<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stellar - Constellation Podcast Player</title>
    <style>
        :root {
            --space-deep: #0a0b1a;
            --space-void: #030408;
            --star-glow: #e8f4f8;
            --star-core: #ffffff;
            --constellation-line: rgba(168, 198, 255, 0.3);
            --constellation-active: rgba(255, 255, 255, 0.6);
            --nebula-purple: rgba(138, 43, 226, 0.1);
            --nebula-blue: rgba(65, 105, 225, 0.08);
            --listened-glow: #4fd1c7;
            --listening-pulse: #ff6b6b;
            --unplayed-dim: rgba(255, 255, 255, 0.4);
            --ui-glass: rgba(255, 255, 255, 0.05);
            --ui-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: rgba(248, 250, 252, 0.7);
            --text-muted: rgba(248, 250, 252, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: radial-gradient(ellipse at 20% 30%, var(--nebula-purple) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, var(--nebula-blue) 0%, transparent 50%),
                        var(--space-deep);
            color: var(--text-primary);
            overflow: hidden;
            width: 1440px;
            height: 900px;
            position: relative;
        }

        .stellar-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .constellation {
            position: absolute;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--constellation-line), transparent);
            transform-origin: left center;
            opacity: 0.6;
            transition: all 0.4s ease;
        }

        .constellation.active .constellation-line {
            background: linear-gradient(90deg, transparent, var(--constellation-active), transparent);
            opacity: 1;
            box-shadow: 0 0 4px var(--constellation-active);
        }

        .episode-star {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--unplayed-dim);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid transparent;
        }

        .episode-star:hover {
            transform: scale(1.4);
            z-index: 10;
        }

        .episode-star.listened {
            background: radial-gradient(circle, var(--star-core) 20%, var(--listened-glow) 100%);
            box-shadow: 
                0 0 12px var(--listened-glow),
                0 0 24px rgba(79, 209, 199, 0.4),
                inset 0 1px 2px rgba(255, 255, 255, 0.3);
            animation: gentle-pulse 3s ease-in-out infinite;
        }

        .episode-star.listening {
            background: radial-gradient(circle, var(--star-core) 20%, var(--listening-pulse) 100%);
            box-shadow: 
                0 0 16px var(--listening-pulse),
                0 0 32px rgba(255, 107, 107, 0.6);
            animation: active-pulse 2s ease-in-out infinite;
            transform: scale(1.2);
        }

        .episode-star.featured {
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, var(--star-core) 10%, #ffd700 60%, #ff8c00 100%);
            box-shadow: 
                0 0 20px #ffd700,
                0 0 40px rgba(255, 215, 0, 0.3);
        }

        @keyframes gentle-pulse {
            0%, 100% { 
                box-shadow: 
                    0 0 12px var(--listened-glow),
                    0 0 24px rgba(79, 209, 199, 0.4);
            }
            50% { 
                box-shadow: 
                    0 0 16px var(--listened-glow),
                    0 0 32px rgba(79, 209, 199, 0.6);
            }
        }

        @keyframes active-pulse {
            0%, 100% { 
                box-shadow: 
                    0 0 16px var(--listening-pulse),
                    0 0 32px rgba(255, 107, 107, 0.6);
            }
            50% { 
                box-shadow: 
                    0 0 24px var(--listening-pulse),
                    0 0 48px rgba(255, 107, 107, 0.8);
            }
        }

        .series-label {
            position: absolute;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
        }

        .constellation:hover .series-label {
            opacity: 1;
        }

        .control-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--ui-glass);
            backdrop-filter: blur(20px) saturate(1.5);
            border: 1px solid var(--ui-border);
            border-radius: 24px;
            padding: 24px 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            min-width: 480px;
        }

        .current-episode {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .episode-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .series-name {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .play-button {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--listened-glow) 0%, rgba(79, 209, 199, 0.8) 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(79, 209, 199, 0.3);
        }

        .play-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(79, 209, 199, 0.4);
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-left: 12px solid var(--star-core);
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            margin-left: 2px;
        }

        .progress-container {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--listened-glow), var(--star-core));
            border-radius: 2px;
            width: 34%;
            transition: width 0.3s ease;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        .navigation {
            position: absolute;
            top: 40px;
            left: 40px;
            display: flex;
            gap: 32px;
        }

        .nav-item {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.2s ease;
            letter-spacing: 0.2px;
        }

        .nav-item:hover,
        .nav-item.active {
            color: var(--text-primary);
            background: var(--ui-glass);
            backdrop-filter: blur(12px);
        }

        .search-container {
            position: absolute;
            top: 40px;
            right: 40px;
        }

        .search-input {
            background: var(--ui-glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--ui-border);
            border-radius: 16px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 13px;
            width: 240px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-input:focus {
            border-color: var(--listened-glow);
            box-shadow: 0 0 0 2px rgba(79, 209, 199, 0.2);
        }

        .episode-tooltip {
            position: absolute;
            background: var(--space-void);
            border: 1px solid var(--ui-border);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: var(--text-primary);
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -100%) translateY(-8px);
            transition: opacity 0.2s ease;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            z-index: 20;
            white-space: nowrap;
        }

        .episode-star:hover + .episode-tooltip {
            opacity: 1;
        }

        .floating-particles {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--star-core);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 8s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(900px) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-50px) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stellar-field">
        <!-- Tech Deep Dive Constellation -->
        <div class="constellation" style="top: 180px; left: 200px;">
            <div class="constellation-line" style="width: 120px; transform: rotate(25deg);"></div>
            <div class="constellation-line" style="width: 90px; left: 85px; top: 45px; transform: rotate(-15deg);"></div>
            <div class="constellation-line" style="width: 100px; left: 120px; top: 80px; transform: rotate(45deg);"></div>
            
            <div class="episode-star listened" style="left: 0; top: 0;"></div>
            <div class="episode-star listened" style="left: 95px; top: 35px;"></div>
            <div class="episode-star listening" style="left: 150px; top: 70px;"></div>
            <div class="episode-star" style="left: 180px; top: 120px;"></div>
            
            <div class="series-label" style="left: 0; top: -25px;">Tech Deep Dive</div>
        </div>

        <!-- Creative Process Constellation -->
        <div class="constellation active" style="top: 120px; right: 180px;">
            <div class="constellation-line" style="width: 80px; transform: rotate(-35deg);"></div>
            <div class="constellation-line" style="width: 110px; left: 60px; top: 60px; transform: rotate(20deg);"></div>
            <div class="constellation-line" style="width: 70px; left: 140px; top: 100px; transform: rotate(-60deg);"></div>
            
            <div class="episode-star featured listened" style="left: 0; top: 0;"></div>
            <div class="episode-star listened" style="left: 65px; top: 50px;"></div>
            <div class="episode-star listened" style="left: 130px; top: 85px;"></div>
            <div class="episode-star" style="left: 170px; top: 125px;"></div>
            <div class="episode-star" style="left: 190px; top: 160px;"></div>
            
            <div class="series-label" style="right: 0; top: -25px;">Creative Process</div>
        </div>

        <!-- Science Stories Constellation -->
        <div class="constellation" style="bottom: 200px; left: 150px;">
            <div class="constellation-line" style="width: 140px; transform: rotate(15deg);"></div>
            <div class="constellation-line" style="width: 95px; left: 100px; top: -30px; transform: rotate(-45deg);"></div>
            <div class="constellation-line" style="width: 85px; left: 180px; top: 10px; transform: rotate(70deg);"></div>
            
            <div class="episode-star listened" style="left: 0; top: 0;"></div>
            <div class="episode-star listened" style="left: 110px; top: -40px;"></div>
            <div class="episode-star listened" style="left: 140px; top: 35px;"></div>
            <div class="episode-star" style="left: 200px; top: 15px;"></div>
            <div class="episode-star" style="left: 220px; top: 75px;"></div>
            <div class="episode-star" style="left: 280px; top: 45px;"></div>
            
            <div class="series-label" style="left: 0; bottom: 25px;">Science Stories</div>
        </div>

        <!-- Philosophy Hour Constellation -->
        <div class="constellation" style="top: 350px; right: 120px;">
            <div class="constellation-line" style="width: 130px; transform: rotate(-20deg);"></div>
            <div class="constellation-line" style="width: 105px; left: 90px; top: 45px; transform: rotate(35deg);"></div>
            
            <div class="episode-star listened" style="left: 0; top: 0;"></div>
            <div class="episode-star listened" style="left: 100px; top: 30px;"></div>
            <div class="episode-star" style="left: 160px; top: 75px;"></div>
            <div class="episode-star" style="left: 210px; top: 110px;"></div>
            
            <div class="series-label" style="right: 0; top: -25px;">Philosophy Hour</div>
        </div>

        <!-- History Uncovered Constellation -->
        <div class="constellation" style="bottom: 250px; right: 200px;">
            <div class="constellation-line" style="width: 100px; transform: rotate(60deg);"></div>
            <div class="constellation-line" style="width: 120px; left: 70px; top: -20px; transform: rotate(-30deg);"></div>
            <div class="constellation-line" style="width: 80px; left: 150px; top: 40px; transform: rotate(10deg);"></div>
            
            <div class="episode-star featured listened" style="left: 0; top: 0;"></div>
            <div class="episode-star listened" style="left: 80px; top: -30px;"></div>
            <div class="episode-star listened" style="left: 160px; top: 20px;"></div>
            <div class="episode-star listened" style="left: 220px; top: 50px;"></div>
            <div class="episode-star" style="left: 280px; top: 65px;"></div>
            
            <div class="series-label" style="right: 0; bottom: 25px;">History Uncovered</div>
        </div>

        <!-- Floating particles for ambiance -->
        <div class="floating-particles" style="left: 10%; animation-delay: 0s;"></div>
        <div class="floating-particles" style="left: 25%; animation-delay: 2s;"></div>
        <div class="floating-particles" style="left: 45%; animation-delay: 4s;"></div>
        <div class="floating-particles" style="left: 65%; animation-delay: 6s;"></div>
        <div class="floating-particles" style="left: 80%; animation-delay: 3s;"></div>
        <div class="floating-particles" style="left: 90%; animation-delay: 5s;"></div>
    </div>

    <nav class="navigation">
        <a href="#" class="nav-item active">Explore</a>
        <a href="#" class="nav-item">Library</a>
        <a href="#" class="nav-item">Discover</a>
        <a href="#" class="nav-item">Following</a>
    </nav>

    <div class="search-container">
        <input type="text" class="search-input" placeholder="Search across the cosmos...">
    </div>

    <div class="control-panel">
        <button class="play-button"></button>
        
        <div class="current-episode">
            <div class="episode-title">The Future of Quantum Computing</div>
            <div class="series-name">Tech Deep Dive</div>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="time-display">
                <span>18:42</span>
                <span>54:30</span>
            </div>
        </div>
    </div>

    <!-- Episode tooltips -->
    <div class="episode-tooltip">The Future of Quantum Computing</div>

    <script>
        // Add interactive hover effects for episode stars
        const episodeStars = document.querySelectorAll('.episode-star');
        
        episodeStars.forEach(star => {
            star.addEventListener('mouseenter', (e) => {
                const constellation = star.closest('.constellation');
                constellation.classList.add('active');
            });
            
            star.addEventListener('mouseleave', (e) => {
                // Keep constellation active if it contains the currently playing episode
                if (!star.classList.contains('listening')) {
                    const constellation = star.closest('.constellation');
                    constellation.classList.remove('active');
                }
            });
        });

        // Play button interaction
        const playButton = document.querySelector('.play-button');
        let isPlaying = false;
        
        playButton.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playButton.style.background = 'linear-gradient(135deg, #ff6b6b 0%, rgba(255, 107, 107, 0.8) 100%)';
                playButton.innerHTML = '<div style="width: 12px; height: 12px; background: white; margin: 0;"></div>';
            } else {
                playButton.style.background = 'linear-gradient(135deg, var(--listened-glow) 0%, rgba(79, 209, 199, 0.8) 100%)';
                playButton.innerHTML = '';
            }
        });
    </script>
</body>
</html>
