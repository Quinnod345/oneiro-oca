<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Limb Piano</title>
    <style>
        :root {
            --void: #0a0a0f;
            --memory: #1a1a2e;
            --neural: #16213e;
            --phantom-glow: #4a5fc1;
            --sensation: #7b8ff7;
            --pulse: #a8b9ff;
            --echo: rgba(123, 143, 247, 0.1);
            --whisper: rgba(168, 185, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--void);
            color: var(--pulse);
            overflow: hidden;
            position: relative;
            height: 100vh;
            width: 100vw;
        }

        .neural-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--memory) 0%, var(--void) 100%);
        }

        .phantom-space {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
        }

        .phantom-hand {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .finger-zone {
            position: absolute;
            background: radial-gradient(circle, var(--echo) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .finger-zone::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, var(--whisper) 0%, transparent 100%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .finger-zone:hover::before {
            opacity: 1;
        }

        .finger-zone.thumb {
            width: 120px;
            height: 120px;
            bottom: 150px;
            left: 100px;
        }

        .finger-zone.index {
            width: 100px;
            height: 100px;
            top: 120px;
            left: 150px;
        }

        .finger-zone.middle {
            width: 100px;
            height: 100px;
            top: 100px;
            left: 250px;
        }

        .finger-zone.ring {
            width: 100px;
            height: 100px;
            top: 120px;
            left: 350px;
        }

        .finger-zone.pinky {
            width: 80px;
            height: 80px;
            top: 180px;
            left: 420px;
        }

        .finger-zone:active {
            transform: scale(0.95);
        }

        .finger-zone.active {
            animation: phantom-touch 0.6s ease-out;
        }

        @keyframes phantom-touch {
            0% {
                box-shadow: 0 0 0 0 var(--sensation);
            }
            100% {
                box-shadow: 0 0 0 40px transparent;
            }
        }

        .control-panel {
            position: fixed;
            top: 50%;
            right: 40px;
            transform: translateY(-50%);
            background: rgba(26, 26, 46, 0.3);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            border: 1px solid var(--echo);
            min-width: 200px;
        }

        .control-panel h3 {
            font-size: 14px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 20px;
        }

        .control-item {
            margin-bottom: 25px;
        }

        .control-label {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 8px;
            display: block;
        }

        .slider {
            width: 100%;
            height: 4px;
            background: var(--echo);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--sensation);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            background: var(--pulse);
        }

        .slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--sensation);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-button {
            background: transparent;
            border: 1px solid var(--echo);
            color: var(--sensation);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .toggle-button:hover {
            background: var(--echo);
            border-color: var(--sensation);
            color: var(--pulse);
        }

        .toggle-button.active {
            background: var(--sensation);
            color: var(--void);
            border-color: var(--sensation);
        }

        .sensation-indicator {
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .sensation-indicator.visible {
            opacity: 0.6;
        }

        .neural-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--sensation);
            border-radius: 50%;
            opacity: 0;
        }

        @keyframes drift {
            0% {
                opacity: 0;
                transform: translate(0, 0);
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 0;
                transform: translate(var(--dx), var(--dy));
            }
        }
    </style>
</head>
<body>
    <div class="neural-field"></div>
    
    <div class="sensation-indicator" id="sensationIndicator">PHANTOM SENSATION DETECTED</div>
    
    <div class="phantom-space">
        <div class="neural-particles" id="neuralParticles"></div>
        <div class="phantom-hand">
            <div class="finger-zone thumb" data-note="C3"></div>
            <div class="finger-zone index" data-note="E3"></div>
            <div class="finger-zone middle" data-note="G3"></div>
            <div class="finger-zone ring" data-note="B3"></div>
            <div class="finger-zone pinky" data-note="D4"></div>
        </div>
    </div>

    <div class="control-panel">
        <h3>Neural Interface</h3>
        
        <div class="control-item">
            <label class="control-label">Sensitivity</label>
            <input type="range" class="slider" id="sensitivity" min="0" max="100" value="70">
        </div>
        
        <div class="control-item">
            <label class="control-label">Resonance</label>
            <input type="range" class="slider" id="resonance" min="0" max="100" value="50">
        </div>
        
        <div class="control-item">
            <button class="toggle-button" id="calibrateBtn">Calibrate</button>
        </div>
    </div>

    <script>
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const fingerZones = document.querySelectorAll('.finger-zone');
        const sensationIndicator = document.getElementById('sensationIndicator');
        const neuralParticles = document.getElementById('neuralParticles');
        const calibrateBtn = document.getElementById('calibrateBtn');
        const sensitivitySlider = document.getElementById('sensitivity');
        const resonanceSlider = document.getElementById('resonance');
        
        let isCalibrating = false;

        const noteFrequencies = {
            'C3': 130.81,
            'E3': 164.81,
            'G3': 196.00,
            'B3': 246.94,
            'D4': 293.66
        };

        function createPhantomTone(frequency, sensitivity, resonance) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            oscillator.type = 'sine';
            oscillator.frequency.value = frequency;
            
            filter.type = 'lowpass';
            filter.frequency.value = 2000 + (resonance * 30);
            filter.Q.value = resonance / 10;
            
            gainNode.gain.value = 0;
            gainNode.gain.linearRampToValueAtTime(sensitivity / 200, audioContext.currentTime + 0.1);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 2);
            
            oscillator.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + 2);
        }

        function createNeuralParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            
            const angle = Math.random() * Math.PI * 2;
            const distance = 50 + Math.random() * 100;
            const dx = Math.cos(angle) * distance;
            const dy = Math.sin(angle) * distance;
            
            particle.style.setProperty('--dx', dx + 'px');
            particle.style.setProperty('--dy', dy + 'px');
            particle.style.animation = 'drift 2s ease-out';
            
            neuralParticles.appendChild(particle);
            
            setTimeout(() => particle.remove(), 2000);
        }

        fingerZones.forEach(zone => {
            zone.addEventListener('click', (e) => {
                if (isCalibrating) return;
                
                const note = zone.dataset.note;
                const frequency = noteFrequencies[note];
                const sensitivity = sensitivitySlider.value;
                const resonance = resonanceSlider.value;
                
                createPhantomTone(frequency, sensitivity, resonance);
                
                zone.classList.add('active');
                setTimeout(() => zone.classList.remove('active'), 600);
                
                sensationIndicator.classList.add('visible');
                setTimeout(() => sensationIndicator.classList.remove('visible'), 2000);
                
                const rect = zone.getBoundingClientRect();
                const parentRect = zone.parentElement.getBoundingClientRect();
                const x = rect.left + rect.width / 2 - parentRect.left;
                const y = rect.top + rect.height / 2 - parentRect.top;
                
                for (let i = 0; i < 5; i++) {
                    setTimeout(() => {
                        createNeuralParticle(
                            x + (Math.random() - 0.5) * 20,
                            y + (Math.random() - 0.5) * 20
                        );
                    }, i * 100);
                }
            });
        });

        calibrateBtn.addEventListener('click', () => {
            isCalibrating = !isCalibrating;
            calibrateBtn.classList.toggle('active');
            calibrateBtn.textContent = isCalibrating ? 'Calibrating...' : 'Calibrate';
            
            if (isCalibrating) {
                fingerZones.forEach((zone, index) => {
                    setTimeout(() => {
                        zone.classList.add('active');
                        const note = zone.dataset.note;
                        createPhantomTone(noteFrequencies[note], 50, 50);
                        setTimeout(() => zone.classList.remove('active'), 600);
                    }, index * 500);
                });
                
                setTimeout(() => {
                    isCalibrating = false;
                    calibrateBtn.classList.remove('active');
                    calibrateBtn.textContent = 'Calibrate';
                }, fingerZones.length * 500 + 1000);
            }
        });
    </script>
</body>
</html>
