<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Player</title>
    <style>
        :root {
            --void-black: #0a0a0f;
            --stellar-white: #f8f9ff;
            --nebula-blue: #1a1f3a;
            --cosmic-purple: #2d1b69;
            --star-gold: #ffd700;
            --listened-glow: #00d4ff;
            --constellation-line: rgba(248, 249, 255, 0.2);
            --glow-radius: 0.5rem;
            --orbit-duration: 120s;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: radial-gradient(ellipse at 20% 80%, var(--cosmic-purple) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, var(--nebula-blue) 0%, transparent 50%),
                        var(--void-black);
            color: var(--stellar-white);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            position: relative;
            z-index: 100;
            padding: 2rem;
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--constellation-line);
        }
        
        .header h1 {
            font-size: 2rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            text-align: center;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            text-align: center;
            opacity: 0.7;
            font-size: 0.875rem;
            letter-spacing: 0.05em;
        }
        
        .constellation-field {
            flex: 1;
            position: relative;
            overflow: hidden;
            perspective: 1000px;
        }
        
        .constellation {
            position: absolute;
            transform-style: preserve-3d;
        }
        
        .constellation.series-tech {
            top: 15%;
            left: 10%;
            animation: drift 80s infinite linear;
        }
        
        .constellation.series-history {
            top: 25%;
            right: 15%;
            animation: drift 100s infinite linear reverse;
        }
        
        .constellation.series-science {
            bottom: 20%;
            left: 20%;
            animation: drift 90s infinite linear;
        }
        
        .constellation.series-culture {
            top: 40%;
            left: 45%;
            animation: drift 110s infinite linear reverse;
        }
        
        .constellation-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--constellation-line), transparent);
            transform-origin: left center;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }
        
        .constellation:hover .constellation-line {
            opacity: 0.8;
        }
        
        .episode {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--stellar-white);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 2px solid transparent;
            box-shadow: 0 0 8px rgba(248, 249, 255, 0.4);
        }
        
        .episode::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: transparent;
            transition: all 0.4s ease;
        }
        
        .episode:hover {
            transform: scale(1.3);
            box-shadow: 0 0 20px var(--stellar-white);
        }
        
        .episode.listened {
            background: var(--listened-glow);
            box-shadow: 0 0 var(--glow-radius) var(--listened-glow),
                        0 0 calc(var(--glow-radius) * 2) var(--listened-glow),
                        0 0 calc(var(--glow-radius) * 3) rgba(0, 212, 255, 0.3);
            animation: pulse 3s ease-in-out infinite;
        }
        
        .episode.listened::before {
            background: radial-gradient(circle, var(--listened-glow) 0%, transparent 70%);
            animation: glow-ring 4s ease-in-out infinite;
        }
        
        .episode.playing {
            background: var(--star-gold);
            box-shadow: 0 0 var(--glow-radius) var(--star-gold),
                        0 0 calc(var(--glow-radius) * 2) var(--star-gold),
                        0 0 calc(var(--glow-radius) * 4) rgba(255, 215, 0, 0.4);
            animation: stellar-pulse 1.5s ease-in-out infinite;
        }
        
        .series-label {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            opacity: 0.8;
            text-transform: uppercase;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        
        .constellation:hover .series-label {
            opacity: 1;
        }
        
        .player-interface {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(180deg, transparent 0%, rgba(10, 10, 15, 0.95) 30%, rgba(10, 10, 15, 0.98) 100%);
            backdrop-filter: blur(40px);
            border-top: 1px solid var(--constellation-line);
            display: flex;
            align-items: center;
            padding: 0 3rem;
            transform: translateY(120px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .player-interface.active {
            transform: translateY(0);
        }
        
        .episode-info {
            flex: 1;
            margin-right: 2rem;
        }
        
        .episode-title {
            font-size: 1.125rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            line-height: 1.4;
        }
        
        .episode-series {
            font-size: 0.875rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        
        .control-btn {
            background: none;
            border: none;
            color: var(--stellar-white);
            cursor: pointer;
            padding: 0.75rem;
            border-radius: 50%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .control-btn:hover {
            background: rgba(248, 249, 255, 0.1);
            transform: scale(1.1);
        }
        
        .control-btn.play-pause {
            background: var(--stellar-white);
            color: var(--void-black);
            width: 48px;
            height: 48px;
        }
        
        .control-btn.play-pause:hover {
            background: var(--listened-glow);
            color: var(--void-black);
        }
        
        .progress-bar {
            width: 200px;
            height: 4px;
            background: rgba(248, 249, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--listened-glow), var(--star-gold));
            width: 35%;
            transition: width 0.1s ease;
        }
        
        .constellation-info {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 10;
        }
        
        .constellation-info.visible {
            opacity: 1;
        }
        
        .constellation-info h3 {
            font-size: 1.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }
        
        .constellation-info p {
            font-size: 0.875rem;
            opacity: 0.8;
            line-height: 1.6;
            max-width: 400px;
        }
        
        @keyframes drift {
            0% { transform: rotate(0deg) translateX(20px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(20px) rotate(-360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { 
                box-shadow: 0 0 var(--glow-radius) var(--listened-glow),
                           0 0 calc(var(--glow-radius) * 2) var(--listened-glow),
                           0 0 calc(var(--glow-radius) * 3) rgba(0, 212, 255, 0.3);
            }
            50% { 
                box-shadow: 0 0 calc(var(--glow-radius) * 1.5) var(--listened-glow),
                           0 0 calc(var(--glow-radius) * 3) var(--listened-glow),
                           0 0 calc(var(--glow-radius) * 5) rgba(0, 212, 255, 0.5);
            }
        }
        
        @keyframes glow-ring {
            0%, 100% { 
                transform: scale(1); 
                opacity: 0.6;
            }
            50% { 
                transform: scale(2.5); 
                opacity: 0;
            }
        }
        
        @keyframes stellar-pulse {
            0%, 100% { 
                box-shadow: 0 0 var(--glow-radius) var(--star-gold),
                           0 0 calc(var(--glow-radius) * 2) var(--star-gold),
                           0 0 calc(var(--glow-radius) * 4) rgba(255, 215, 0, 0.4);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 calc(var(--glow-radius) * 2) var(--star-gold),
                           0 0 calc(var(--glow-radius) * 4) var(--star-gold),
                           0 0 calc(var(--glow-radius) * 6) rgba(255, 215, 0, 0.6);
                transform: scale(1.2);
            }
        }
        
        .tech-episodes { --series-color: #00d4ff; }
        .history-episodes { --series-color: #ff6b35; }
        .science-episodes { --series-color: #4ecdc4; }
        .culture-episodes { --series-color: #ffe66d; }
        
        .series-tech .constellation-line { background: linear-gradient(90deg, transparent, rgba(0, 212, 255, 0.3), transparent); }
        .series-history .constellation-line { background: linear-gradient(90deg, transparent, rgba(255, 107, 53, 0.3), transparent); }
        .series-science .constellation-line { background: linear-gradient(90deg, transparent, rgba(78, 205, 196, 0.3), transparent); }
        .series-culture .constellation-line { background: linear-gradient(90deg, transparent, rgba(255, 230, 109, 0.3), transparent); }
    </style>
</head>
<body>
    <header class="header">
        <h1>Constellation Player</h1>
        <p>Navigate the cosmos of knowledge • Each star tells a story</p>
    </header>
    
    <main class="constellation-field">
        <!-- Technology Constellation -->
        <div class="constellation series-tech">
            <div class="series-label">Future Tech</div>
            <div class="constellation-line" style="width: 80px; top: 40px; left: 20px; transform: rotate(25deg);"></div>
            <div class="constellation-line" style="width: 60px; top: 20px; left: 80px; transform: rotate(-30deg);"></div>
            <div class="constellation-line" style="width: 90px; top: 60px; left: 40px; transform: rotate(45deg);"></div>
            <div class="episode listened" style="top: 40px; left: 20px;" data-title="The Future of AI" data-series="Future Tech"></div>
            <div class="episode listened" style="top: 20px; left: 100px;" data-title="Quantum Computing Explained" data-series="Future Tech"></div>
            <div class="episode playing" style="top: 80px; left: 50px;" data-title="Blockchain Revolution" data-series="Future Tech"></div>
            <div class="episode" style="top: 60px; left: 130px;" data-title="Neural Interfaces" data-series="Future Tech"></div>
        </div>
        
        <!-- History Constellation -->
        <div class="constellation series-history">
            <div class="series-label">Ancient Echoes</div>
            <div class="constellation-line" style="width: 70px; top: 30px; left: 10px; transform: rotate(-45deg);"></div>
            <div class="constellation-line" style="width: 85px; top: 50px; left: 60px; transform: rotate(20deg);"></div>
            <div class="constellation-line" style="width: 50px; top: 10px; left: 70px; transform: rotate(60deg);"></div>
            <div class="episode listened" style="top: 30px; left: 10px;" data-title="Rise of Rome" data-series="Ancient Echoes"></div>
            <div class="episode listened" style="top: 70px; left: 70px;" data-title="Egyptian Mysteries" data-series="Ancient Echoes"></div>
            <div class="episode" style="top: 10px; left: 120px;" data-title="Viking Sagas" data-series="Ancient Echoes"></div>
            <div class="episode" style="top: 90px; left: 140px;" data-title="Mayan Calendar" data-series="Ancient Echoes"></div>
            <div class="episode listened" style="top: 50px; left: 30px;" data-title="Silk Road Stories" data-series="Ancient Echoes"></div>
        </div>
        
        <!-- Science Constellation -->
        <div class="constellation series-science">
            <div class="series-label">Cosmic Insights</div>
            <div class="constellation-line" style="width: 95px; top: 20px; left: 15px; transform: rotate(15deg);"></div>
            <div class="constellation-line" style="width: 75px; top: 60px; left: 30px; transform: rotate(-25deg);"></div>
            <div class="constellation-line" style="width: 55px; top: 40px; left: 90px; transform: rotate(70deg);"></div>
            <div class="episode listened" style="top: 20px; left: 15px;" data-title="Black Holes Unveiled" data-series="Cosmic Insights"></div>
            <div class="episode" style="top: 35px; left: 110px;" data-title="Dark Matter Mystery" data-series="Cosmic Insights"></div>
            <div class="episode listened" style="top: 80px; left: 40px;" data-title="Exoplanet Hunters" data-series="Cosmic Insights"></div>
            <div class="episode" style="top: 60px; left: 100px;" data-title="Gravitational Waves" data-series="Cosmic Insights"></div>
            <div class="episode listened" style="top: 50px; left: 60px;" data-title="Mars Expedition" data-series="Cosmic Insights"></div>
            <div class="episode" style="top: 90px; left: 120px;" data-title="Time Travel Theory" data-series="Cosmic Insights"></div>
        </div>
        
        <!-- Culture Constellation -->
        <div class="constellation series-culture">
            <div class="series-label">Human Stories</div>
            <div class="constellation-line" style="width: 65px; top: 25px; left: 20px; transform: rotate(-15deg);"></div>
            <div class="constellation-line" style="width: 80px; top: 45px; left: 50px; transform: rotate(35deg);"></div>
            <div class="constellation-line" style="width: 40px; top: 75px; left: 25px; transform: rotate(-60deg);"></div>
            <div class="episode listened" style="top: 25px; left: 20px;" data-title="Music of the Spheres" data-series="Human Stories"></div>
            <div class="episode" style="top: 15px; left: 85px;" data-title="Language Evolution" data-series="Human Stories"></div>
            <div class="episode listened" style="top: 75px; left: 70px;" data-title="Art Through Ages" data-series="Human Stories"></div>
            <div class="episode" style="top: 95px; left: 30px;" data-title="Culinary Journeys" data-series="Human Stories"></div>
            <div class="episode" style="top: 55px; left: 120px;" data-title="Mythologies Compared" data-series="Human Stories"></div>
        </div>
    </main>
    
    <div class="constellation-info" id="constellationInfo">
        <h3 id="infoTitle">Select a constellation</h3>
        <p id="infoDescription">Hover over episode clusters to explore different podcast series</p>
    </div>
    
    <div class="player-interface" id="playerInterface">
        <div class="episode-info">
            <div class="episode-title" id="currentTitle">Blockchain Revolution</div>
            <div class="episode-series" id="currentSeries">Future Tech</div>
        </div>
        
        <div class="player-controls">
            <button class="control-btn" id="prevBtn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M3.5 8l8-6v12l-8-6z"/>
                </svg>
            </button>
            
            <button class="control-btn play-pause" id="playPauseBtn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M6 4v12l10-6L6 4z"/>
                </svg>
            </button>
            
            <button class="control-btn" id="nextBtn">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M12.5 8l-8-6v12l8-6z"/>
                </svg>
            </button>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>
    </div>
    
    <script>
        const episodes = document.querySelectorAll('.episode');
        const playerInterface = document.getElementById('playerInterface');
        const currentTitle = document.getElementById('currentTitle');
        const currentSeries = document.getElementById('currentSeries');
        const playPauseBtn = document.getElementById('playPauseBtn');
        
        let isPlaying = true;
        let currentEpisode = document.querySelector('.episode.playing');
        
        // Show player interface on load
        setTimeout(() => {
            playerInterface.classList.add('active');
        }, 1000);
        
        episodes.forEach(episode => {
            episode.addEventListener('click', () => {
                // Remove playing class from current episode
                const currentPlaying = document.querySelector('.episode.playing');
                if (currentPlaying) {
                    currentPlaying.classList.remove('playing');
                    if (!currentPlaying.classList.contains('listened')) {
                        currentPlaying.classList.add('listened');
                    }
                }
                
                // Set new playing episode
                episode.classList.add('playing');
                episode.classList.remove('listened');
                currentEpisode = episode;
                
                // Update player interface
                currentTitle.textContent = episode.dataset.title;
                currentSeries.textContent = episode.dataset.series;
                playerInterface.classList.add('active');
                
                isPlaying = true;
                updatePlayButton();
            });
        });
        
        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            updatePlayButton();
        });
        
        function updatePlayButton() {
            if (isPlaying) {
                playPauseBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M6 4h3v12H6V4zm5 0h3v12h-3V4z"/></svg>';
            } else {
                playPauseBtn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path d="M6 4v12l10-6L6 4z"/></svg>';
            }
        }
        
        // Constellation hover effects
        const constellations = document.querySelectorAll('.constellation');
        const infoPanel = document.getElementById('constellationInfo');
        const infoTitle = document.getElementById('infoTitle');
        const infoDescription = document.getElementById('infoDescription');
        
        const seriesInfo = {
            'series-tech': {
                title: 'Future Tech',
                description: 'Exploring the cutting edge of technology and its impact on humanity'
            },
            'series-history': {
                title: 'Ancient Echoes', 
                description: 'Stories from the past that shape our understanding of civilization'
            },
            'series-science': {
                title: 'Cosmic Insights',
                description: 'Journey through space, time, and the mysteries of the universe'
            },
            'series-culture': {
                title: 'Human Stories',
                description: 'The art, music, and traditions that define who we are'
            }
        };
        
        constellations.forEach(constellation => {
            constellation.addEventListener('mouseenter', () => {
                const seriesClass = Array.from(constellation.classList).find(cls => cls.startsWith('series-'));
                if (seriesClass && seriesInfo[seriesClass]) {
                    infoTitle.textContent = seriesInfo[seriesClass].title;
                    infoDescription.textContent = seriesInfo[seriesClass].description;
                    infoPanel.classList.add('visible');
                }
            });
            
            constellation.addEventListener('mouseleave', () => {
                infoPanel.classList.remove('visible');
            });
        });
        
        updatePlayButton();
    </script>
</body>
</html>
