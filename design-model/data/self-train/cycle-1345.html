<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Habit Tracker</title>
    <style>
        :root {
            --soil-dark: #2d1810;
            --soil-medium: #4a2c1a;
            --soil-light: #6b3e28;
            --grass-base: #3a5f3a;
            --grass-vibrant: #4d7f4d;
            --water-drop: #4fb3d9;
            --water-glow: #87ceeb;
            --bloom-red: #e74c3c;
            --bloom-yellow: #f1c40f;
            --bloom-purple: #9b59b6;
            --bloom-pink: #ff6b9d;
            --stem-green: #27ae60;
            --leaf-green: #2ecc71;
            --wilt-brown: #8b4513;
            --wilt-yellow: #daa520;
            --sky-gradient-start: #87ceeb;
            --sky-gradient-end: #e0f6ff;
            --text-primary: #2c3e50;
            --text-secondary: #7f8c8d;
            --white: #ffffff;
            --shadow-soft: rgba(0, 0, 0, 0.1);
            --shadow-medium: rgba(0, 0, 0, 0.15);
            --border-light: rgba(255, 255, 255, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(to bottom, var(--sky-gradient-start) 0%, var(--sky-gradient-end) 100%);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .garden-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 0%, transparent 60%, var(--soil-light) 60%, var(--soil-medium) 80%, var(--soil-dark) 100%);
        }

        .header {
            position: absolute;
            top: 40px;
            left: 60px;
            right: 60px;
            z-index: 100;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-shadow: 0 2px 4px var(--shadow-soft);
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .controls {
            position: absolute;
            top: 40px;
            right: 60px;
            display: flex;
            gap: 16px;
            z-index: 100;
        }

        .water-button {
            background: var(--water-drop);
            border: none;
            border-radius: 50%;
            width: 56px;
            height: 56px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-medium);
        }

        .water-button:hover {
            background: var(--water-glow);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--shadow-medium);
        }

        .water-button::before {
            content: "💧";
            font-size: 24px;
        }

        .add-habit-button {
            background: var(--stem-green);
            border: none;
            border-radius: 28px;
            padding: 16px 24px;
            color: var(--white);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow-medium);
        }

        .add-habit-button:hover {
            background: var(--leaf-green);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px var(--shadow-medium);
        }

        .garden-grid {
            position: absolute;
            bottom: 120px;
            left: 60px;
            right: 60px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 40px;
            height: 400px;
            align-items: end;
        }

        .plant-slot {
            position: relative;
            height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .plant-slot:hover {
            transform: translateY(-4px);
        }

        .plant {
            position: relative;
            transition: all 0.5s ease;
        }

        .plant.seedling {
            height: 30px;
            width: 20px;
        }

        .plant.growing {
            height: 80px;
            width: 40px;
        }

        .plant.blooming {
            height: 120px;
            width: 60px;
        }

        .plant.wilted {
            height: 60px;
            width: 40px;
            opacity: 0.6;
        }

        .stem {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            background: var(--stem-green);
            border-radius: 2px;
            transition: all 0.5s ease;
        }

        .seedling .stem {
            width: 3px;
            height: 20px;
        }

        .growing .stem {
            width: 4px;
            height: 60px;
        }

        .blooming .stem {
            width: 6px;
            height: 90px;
        }

        .wilted .stem {
            width: 4px;
            height: 40px;
            background: var(--wilt-brown);
        }

        .leaves {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .leaf {
            position: absolute;
            width: 12px;
            height: 8px;
            background: var(--leaf-green);
            border-radius: 50% 0;
            transform-origin: bottom left;
        }

        .leaf:nth-child(1) {
            transform: translateX(-50%) rotate(-30deg);
            left: -8px;
        }

        .leaf:nth-child(2) {
            transform: translateX(50%) rotate(30deg) scaleX(-1);
            right: -8px;
        }

        .growing .leaf, .blooming .leaf {
            width: 16px;
            height: 12px;
        }

        .wilted .leaf {
            background: var(--wilt-yellow);
            transform: translateX(-50%) rotate(-60deg) !important;
        }

        .flower {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            opacity: 0;
            transition: all 0.5s ease;
        }

        .blooming .flower {
            opacity: 1;
            animation: bloom 2s ease-in-out infinite alternate;
        }

        .flower.red { background: var(--bloom-red); }
        .flower.yellow { background: var(--bloom-yellow); }
        .flower.purple { background: var(--bloom-purple); }
        .flower.pink { background: var(--bloom-pink); }

        @keyframes bloom {
            0% { transform: translateX(-50%) scale(1); }
            100% { transform: translateX(-50%) scale(1.1); }
        }

        .streak-counter {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            border-radius: 12px;
            padding: 4px 8px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            box-shadow: 0 2px 8px var(--shadow-soft);
            border: 1px solid var(--border-light);
        }

        .habit-label {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            text-align: center;
            white-space: nowrap;
        }

        .water-animation {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            opacity: 0;
        }

        .water-drop {
            width: 8px;
            height: 12px;
            background: var(--water-drop);
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
            animation: waterfall 1s ease-in-out;
        }

        @keyframes waterfall {
            0% {
                opacity: 1;
                transform: translateX(-50%) translateY(-20px) rotate(45deg);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(40px) rotate(45deg);
            }
        }

        .stats-panel {
            position: absolute;
            bottom: 40px;
            left: 60px;
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px var(--shadow-medium);
            border: 1px solid var(--border-light);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .clouds {
            position: absolute;
            top: 60px;
            left: 0;
            right: 0;
            height: 100px;
            overflow: hidden;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: var(--white);
            border-radius: 50px;
            opacity: 0.7;
            animation: float 20s linear infinite;
        }

        .cloud:before {
            content: '';
            position: absolute;
            background: var(--white);
            border-radius: 50px;
        }

        .cloud:after {
            content: '';
            position: absolute;
            background: var(--white);
            border-radius: 50px;
        }

        .cloud.cloud1 {
            width: 80px;
            height: 40px;
            top: 20px;
            animation-delay: 0s;
        }

        .cloud1:before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1:after {
            width: 60px;
            height: 30px;
            top: -15px;
            right: 10px;
        }

        .cloud.cloud2 {
            width: 60px;
            height: 30px;
            top: 50px;
            animation-delay: 10s;
        }

        .cloud2:before {
            width: 40px;
            height: 40px;
            top: -20px;
            left: 5px;
        }

        .cloud2:after {
            width: 50px;
            height: 25px;
            top: -10px;
            right: 5px;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(1540px); }
        }
    </style>
</head>
<body>
    <div class="garden-container">
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
        </div>

        <div class="header">
            <h1 class="title">Garden Habit Tracker</h1>
            <p class="subtitle">Nurture your habits, watch your garden bloom</p>
        </div>

        <div class="controls">
            <button class="water-button" onclick="waterPlants()"></button>
            <button class="add-habit-button" onclick="addHabit()">Plant New Habit</button>
        </div>

        <div class="garden-grid">
            <div class="plant-slot" onclick="toggleHabit(this)">
                <div class="plant blooming">
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower red"></div>
                </div>
                <div class="streak-counter">12 days</div>
                <div class="habit-label">Morning Run</div>
                <div class="water-animation">
                    <div class="water-drop"></div>
                </div>
            </div>

            <div class="plant-slot" onclick="toggleHabit(this)">
                <div class="plant growing">
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower yellow"></div>
                </div>
                <div class="streak-counter">5 days</div>
                <div class="habit-label">Meditation</div>
                <div class="water-animation">
                    <div class="water-drop"></div>
                </div>
            </div>

            <div class="plant-slot" onclick="toggleHabit(this)">
                <div class="plant wilted">
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower purple"></div>
                </div>
                <div class="streak-counter">0 days</div>
                <div class="habit-label">Read Daily</div>
                <div class="water-animation">
                    <div class="water-drop"></div>
                </div>
            </div>

            <div class="plant-slot" onclick="toggleHabit(this)">
                <div class="plant blooming">
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower pink"></div>
                </div>
                <div class="streak-counter">8 days</div>
                <div class="habit-label">Water Intake</div>
                <div class="water-animation">
                    <div class="water-drop"></div>
                </div>
            </div>

            <div class="plant-slot" onclick="toggleHabit(this)">
                <div class="plant seedling">
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower red"></div>
                </div>
                <div class="streak-counter">2 days</div>
                <div class="habit-label">Gratitude Journal</div>
                <div class="water-animation">
                    <div class="water-drop"></div>
                </div>
            </div>

            <div class="plant-slot" onclick="addHabit()">
                <div class="habit-label">+ Add Habit</div>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-value">27</div>
                    <div class="stat-label">Total Streak</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">5</div>
                    <div class="stat-label">Active Habits</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">3</div>
                    <div class="stat-label">Blooming</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleHabit(slot) {
            const plant = slot.querySelector('.plant');
            const animation = slot.querySelector('.water-animation');
            
            if (plant) {
                // Trigger water animation
                animation.style.animation = 'none';
                animation.offsetHeight; // Force reflow
                animation.style.animation = 'waterfall 1s ease-in-out';
                
                // Cycle through plant states
                if (plant.classList.contains('wilted')) {
                    plant.className = 'plant seedling';
                    updateStreak(slot, 1);
                } else if (plant.classList.contains('seedling')) {
                    plant.className = 'plant growing';
                    updateStreak(slot, Math.floor(Math.random() * 3) + 3);
                } else if (plant.classList.contains('growing')) {
                    plant.className = 'plant blooming';
                    updateStreak(slot, Math.floor(Math.random() * 5) + 7);
                } else {
                    // Randomly assign flower color for blooming plants
                    const colors = ['red', 'yellow', 'purple', 'pink'];
                    const flower = plant.querySelector('.flower');
                    flower.className = `flower ${colors[Math.floor(Math.random() * colors.length)]}`;
                    updateStreak(slot, parseInt(slot.querySelector('.streak-counter').textContent) + 1);
                }
            }
        }

        function updateStreak(slot, days) {
            const counter = slot.querySelector('.streak-counter');
            counter.textContent = `${days} days`;
        }

        function waterPlants() {
            const plants = document.querySelectorAll('.plant-slot .plant');
            plants.forEach((plant, index) => {
                setTimeout(() => {
                    const slot = plant.closest('.plant-slot');
                    const animation = slot.querySelector('.water-animation');
                    
                    animation.style.animation = 'none';
                    animation.offsetHeight;
                    animation.style.animation = 'waterfall 1s ease-in-out';
                    
                    if (plant.classList.contains('wilted')) {
                        plant.className = 'plant seedling';
                        updateStreak(slot, 1);
                    }
                }, index * 200);
            });
        }

        function addHabit() {
            const habitNames = ['Exercise', 'Coding', 'Stretching', 'Cooking', 'Learning'];
            const colors = ['red', 'yellow', 'purple', 'pink'];
            const randomName = habitNames[Math.floor(Math.random() * habitNames.length)];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            
            alert(`New habit "${randomName}" planted! 🌱`);
        }
    </script>
</body>
</html>
