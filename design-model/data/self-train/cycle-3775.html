<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic System Monitor</title>
    <style>
        :root {
            --primary-bg: #0a0e1a;
            --secondary-bg: #1a1f2e;
            --accent-bg: #252b3d;
            --healthy-pulse: #00ff88;
            --warning-pulse: #ffaa00;
            --critical-pulse: #ff3366;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --text-muted: #495670;
            --border-subtle: #2a3441;
            --shadow-glow: rgba(0, 255, 136, 0.1);
            --membrane-healthy: rgba(0, 255, 136, 0.05);
            --membrane-stressed: rgba(255, 170, 0, 0.08);
            --membrane-critical: rgba(255, 51, 102, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            background: var(--primary-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            color: var(--text-primary);
            overflow: hidden;
            position: relative;
        }

        .monitor-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas:
                "header header"
                "cpu memory"
                "footer footer";
            gap: 2px;
            background: var(--border-subtle);
        }

        .header {
            grid-area: header;
            background: var(--secondary-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .system-status {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--healthy-pulse);
            animation: pulse-healthy 2s ease-in-out infinite;
        }

        .organism-container {
            background: var(--secondary-bg);
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 32px;
            overflow: hidden;
        }

        .organism-header {
            margin-bottom: 24px;
            z-index: 10;
            position: relative;
        }

        .organism-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: -0.01em;
        }

        .organism-metrics {
            display: flex;
            gap: 24px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .metric {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .metric-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .organism-body {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .organism {
            width: 280px;
            height: 280px;
            position: relative;
            filter: drop-shadow(0 0 20px var(--shadow-glow));
        }

        .cell-membrane {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: var(--membrane-healthy);
            border: 2px solid var(--healthy-pulse);
            animation: breathe-healthy 3s ease-in-out infinite;
        }

        .cell-nucleus {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--healthy-pulse), transparent 70%);
            opacity: 0.6;
            animation: nucleus-pulse-healthy 2.5s ease-in-out infinite;
        }

        .organelles {
            position: absolute;
            inset: 20px;
            border-radius: 50%;
        }

        .organelle {
            position: absolute;
            border-radius: 50%;
            background: var(--healthy-pulse);
            opacity: 0.4;
        }

        .organelle:nth-child(1) {
            top: 25%;
            left: 15%;
            width: 16px;
            height: 16px;
            animation: float-1 4s ease-in-out infinite;
        }

        .organelle:nth-child(2) {
            top: 60%;
            right: 20%;
            width: 12px;
            height: 12px;
            animation: float-2 3.5s ease-in-out infinite reverse;
        }

        .organelle:nth-child(3) {
            bottom: 30%;
            left: 25%;
            width: 14px;
            height: 14px;
            animation: float-3 4.5s ease-in-out infinite;
        }

        .organelle:nth-child(4) {
            top: 15%;
            right: 35%;
            width: 10px;
            height: 10px;
            animation: float-4 3s ease-in-out infinite reverse;
        }

        .data-streams {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .data-particle {
            position: absolute;
            width: 3px;
            height: 3px;
            background: var(--healthy-pulse);
            border-radius: 50%;
            opacity: 0;
            animation: data-flow 6s linear infinite;
        }

        .data-particle:nth-child(1) { animation-delay: 0s; top: 20%; }
        .data-particle:nth-child(2) { animation-delay: 1s; top: 40%; }
        .data-particle:nth-child(3) { animation-delay: 2s; top: 60%; }
        .data-particle:nth-child(4) { animation-delay: 3s; top: 80%; }

        .footer {
            grid-area: footer;
            background: var(--secondary-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
        }

        /* Stressed State */
        .organism-container.stressed .cell-membrane {
            border-color: var(--warning-pulse);
            background: var(--membrane-stressed);
            animation: breathe-stressed 1.5s ease-in-out infinite;
        }

        .organism-container.stressed .cell-nucleus {
            background: radial-gradient(circle at 30% 30%, var(--warning-pulse), transparent 70%);
            animation: nucleus-pulse-stressed 1.2s ease-in-out infinite;
        }

        .organism-container.stressed .organelle {
            background: var(--warning-pulse);
        }

        .organism-container.stressed .data-particle {
            background: var(--warning-pulse);
            animation-duration: 3s;
        }

        /* Critical State */
        .organism-container.critical .cell-membrane {
            border-color: var(--critical-pulse);
            background: var(--membrane-critical);
            animation: breathe-critical 0.8s ease-in-out infinite;
        }

        .organism-container.critical .cell-nucleus {
            background: radial-gradient(circle at 30% 30%, var(--critical-pulse), transparent 70%);
            animation: nucleus-pulse-critical 0.6s ease-in-out infinite;
        }

        .organism-container.critical .organelle {
            background: var(--critical-pulse);
        }

        .organism-container.critical .data-particle {
            background: var(--critical-pulse);
            animation-duration: 1.5s;
        }

        /* Animations */
        @keyframes breathe-healthy {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.03); opacity: 0.8; }
        }

        @keyframes breathe-stressed {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.06); opacity: 0.9; }
        }

        @keyframes breathe-critical {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.08); opacity: 1; }
        }

        @keyframes nucleus-pulse-healthy {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes nucleus-pulse-stressed {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.15); }
        }

        @keyframes nucleus-pulse-critical {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
        }

        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(8px, -12px); }
            66% { transform: translate(-6px, 10px); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-10px, 8px); }
            66% { transform: translate(12px, -6px); }
        }

        @keyframes float-3 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(6px, 10px); }
            66% { transform: translate(-8px, -12px); }
        }

        @keyframes float-4 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-12px, -8px); }
            66% { transform: translate(10px, 14px); }
        }

        @keyframes data-flow {
            0% { left: -10px; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 100%; opacity: 0; }
        }

        @keyframes pulse-healthy {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="monitor-container">
        <header class="header">
            <h1>Organic System Monitor</h1>
            <div class="system-status">
                <div class="status-indicator"></div>
                <span>System Healthy</span>
                <span>Uptime: 2d 14h 32m</span>
            </div>
        </header>

        <div class="organism-container" id="cpu-organism">
            <div class="organism-header">
                <h2 class="organism-title">CPU Organism</h2>
                <div class="organism-metrics">
                    <div class="metric">
                        <span>Usage</span>
                        <span class="metric-value" id="cpu-usage">23%</span>
                    </div>
                    <div class="metric">
                        <span>Temperature</span>
                        <span class="metric-value" id="cpu-temp">52°C</span>
                    </div>
                    <div class="metric">
                        <span>Frequency</span>
                        <span class="metric-value" id="cpu-freq">2.8 GHz</span>
                    </div>
                </div>
            </div>
            <div class="organism-body">
                <div class="organism">
                    <div class="cell-membrane"></div>
                    <div class="cell-nucleus"></div>
                    <div class="organelles">
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                    </div>
                    <div class="data-streams">
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="organism-container stressed" id="memory-organism">
            <div class="organism-header">
                <h2 class="organism-title">Memory Organism</h2>
                <div class="organism-metrics">
                    <div class="metric">
                        <span>Usage</span>
                        <span class="metric-value" id="memory-usage">78%</span>
                    </div>
                    <div class="metric">
                        <span>Available</span>
                        <span class="metric-value" id="memory-available">3.2 GB</span>
                    </div>
                    <div class="metric">
                        <span>Cached</span>
                        <span class="metric-value" id="memory-cached">2.1 GB</span>
                    </div>
                </div>
            </div>
            <div class="organism-body">
                <div class="organism">
                    <div class="cell-membrane"></div>
                    <div class="cell-nucleus"></div>
                    <div class="organelles">
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                        <div class="organelle"></div>
                    </div>
                    <div class="data-streams">
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                        <div class="data-particle"></div>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div>
                <span>Processes: 324</span>
                <span style="margin-left: 24px;">Threads: 2,847</span>
            </div>
            <div>
                <span>Load Average: 1.2, 0.8, 0.6</span>
            </div>
        </footer>
    </div>

    <script>
        // Simulate real-time data updates
        function updateSystemMetrics() {
            const cpuUsage = Math.floor(Math.random() * 100);
            const memoryUsage = Math.floor(Math.random() * 100);
            
            document.getElementById('cpu-usage').textContent = cpuUsage + '%';
            document.getElementById('memory-usage').textContent = memoryUsage + '%';
            
            const cpuOrganism = document.getElementById('cpu-organism');
            const memoryOrganism = document.getElementById('memory-organism');
            
            // Update CPU organism state
            cpuOrganism.className = 'organism-container';
            if (cpuUsage > 80) cpuOrganism.classList.add('critical');
            else if (cpuUsage > 50) cpuOrganism.classList.add('stressed');
            
            // Update Memory organism state
            memoryOrganism.className = 'organism-container';
            if (memoryUsage > 85) memoryOrganism.classList.add('critical');
            else if (memoryUsage > 60) memoryOrganism.classList.add('stressed');
        }
        
        // Update every 3 seconds
        setInterval(updateSystemMetrics, 3000);
        updateSystemMetrics();
    </script>
</body>
</html>
