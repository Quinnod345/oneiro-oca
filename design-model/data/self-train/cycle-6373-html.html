<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=900">
    <title>Linguistic Decay Chamber</title>
    <style>
        :root {
            --chamber-void: #0a0909;
            --substrate-dark: #191716;
            --erosion-amber: #c47e3a;
            --semantic-rust: #8b4513;
            --phonetic-ash: #6e6b68;
            --drift-blue: #4a5d73;
            --origin-text: #f4f0e8;
            --decay-green: #5a6650;
            --etymon-purple: #6b5b7b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            background: var(--chamber-void);
            font-family: Garamond, Georgia, serif;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        #chamber-container {
            width: 100%;
            min-height: 3600px;
            position: relative;
            background: linear-gradient(180deg, 
                var(--chamber-void) 0%,
                var(--substrate-dark) 15%,
                #2a1f1a 30%,
                #3d2820 45%,
                #4a3528 60%,
                #574030 75%,
                #1a1918 100%);
        }

        #input-membrane {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 220px;
            background: radial-gradient(ellipse at center bottom, 
                rgba(244, 240, 232, 0.05) 0%, 
                transparent 70%);
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        #message-input {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            padding: 24px 32px;
            background: rgba(25, 23, 22, 0.9);
            border: 1px solid rgba(244, 240, 232, 0.15);
            border-radius: 0;
            color: var(--origin-text);
            font-size: 21px;
            line-height: 1.6;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        #message-input:focus {
            border-color: rgba(244, 240, 232, 0.4);
        }

        #descent-trigger {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 48px;
            background: transparent;
            border: 1px solid rgba(244, 240, 232, 0.3);
            color: var(--origin-text);
            font-size: 16px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.4s;
            letter-spacing: 0.05em;
        }

        #descent-trigger:hover {
            background: rgba(244, 240, 232, 0.05);
            border-color: rgba(244, 240, 232, 0.5);
        }

        .stratum {
            position: relative;
            width: 100%;
            height: 450px;
            overflow: hidden;
        }

        .stratum::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%, 
                rgba(244, 240, 232, 0.1) 20%,
                rgba(244, 240, 232, 0.05) 50%,
                rgba(244, 240, 232, 0.1) 80%,
                transparent 100%);
        }

        .stratum-label {
            position: absolute;
            top: 20px;
            right: 40px;
            font-size: 13px;
            color: var(--phonetic-ash);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.6;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }

        .decay-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            font-size: 14px;
            color: var(--phonetic-ash);
            opacity: 0;
            animation: particleDrift 8s infinite;
            pointer-events: none;
        }

        @keyframes particleDrift {
            0% {
                opacity: 0;
                transform: translateY(0) translateX(0) rotate(0deg);
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.1;
            }
            100% {
                opacity: 0;
                transform: translateY(150px) translateX(var(--drift-x)) rotate(var(--rotation));
            }
        }

        #decaying-message {
            position: absolute;
            top: 300px;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            min-height: 2800px;
            padding: 0 60px;
        }

        .message-fragment {
            position: relative;
            margin: 120px 0;
            font-size: 24px;
            line-height: 1.8;
            color: var(--origin-text);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .erosion-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .char-decay {
            display: inline-block;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .char-decay.eroding {
            color: var(--phonetic-ash);
            transform: translateY(2px) rotate(var(--rot));
            opacity: 0.7;
        }

        .char-decay.drifting {
            color: var(--drift-blue);
            transform: translateX(var(--drift)) translateY(4px);
            opacity: 0.5;
        }

        .char-decay.bleaching {
            color: var(--semantic-rust);
            filter: blur(0.5px);
            opacity: 0.4;
        }

        .char-decay.etymological {
            color: var(--etymon-purple);
            font-style: italic;
            transform: scale(0.9);
            opacity: 0.3;
        }

        .char-decay.vanished {
            opacity: 0;
            transform: translateY(10px) scale(0.8);
        }

        .word-ghost {
            position: absolute;
            font-size: 11px;
            color: var(--decay-green);
            opacity: 0;
            font-style: italic;
            animation: ghostReveal 3s ease-out forwards;
            pointer-events: none;
        }

        @keyframes ghostReveal {
            0% {
                opacity: 0;
                transform: translateY(-10px);
            }
            50% {
                opacity: 0.4;
            }
            100% {
                opacity: 0.2;
                transform: translateY(0);
            }
        }

        .linguistic-residue {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 280px;
            background: rgba(25, 23, 22, 0.8);
            border: 1px solid rgba(244, 240, 232, 0.1);
            padding: 20px;
            font-size: 12px;
            color: var(--phonetic-ash);
            backdrop-filter: blur(4px);
            max-height: 300px;
            overflow-y: auto;
        }

        .residue-entry {
            margin: 8px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(244, 240, 232, 0.05);
        }

        .residue-original {
            color: var(--origin-text);
            opacity: 0.7;
        }

        .residue-transformed {
            color: var(--erosion-amber);
            font-style: italic;
            margin-left: 8px;
        }

        #depth-indicator {
            position: fixed;
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 300px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(244, 240, 232, 0.1) 50%,
                transparent 100%);
        }

        #depth-marker {
            position: absolute;
            top: 50%;
            left: -4px;
            width: 9px;
            height: 9px;
            background: var(--erosion-amber);
            border-radius: 50%;
            transform: translateY(-50%);
            transition: top 0.3s ease-out;
        }

        .stratum-interference {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent 0,
                transparent 2px,
                rgba(196, 126, 58, 0.03) 2px,
                rgba(196, 126, 58, 0.03) 4px
            );
            opacity: 0;
            animation: interference 4s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes interference {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 0.4;
            }
        }
    </style>
</head>
<body>
    <div id="chamber-container">
        <div id="input-membrane">
            <textarea id="message-input" placeholder="Enter your message to witness its linguistic decay..." rows="3"></textarea>
            <button id="descent-trigger">Begin Descent</button>
        </div>

        <div id="decaying-message"></div>

        <div class="stratum" data-layer="1" style="margin-top: 220px;">
            <span class="stratum-label">Surface Perturbations</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>

        <div class="stratum" data-layer="2">
            <span class="stratum-label">Phonetic Erosion</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>

        <div class="stratum" data-layer="3">
            <span class="stratum-label">Semantic Bleaching</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>

        <div class="stratum" data-layer="4">
            <span class="stratum-label">Syntactic Drift</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>

        <div class="stratum" data-layer="5">
            <span class="stratum-label">Etymological Reversion</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>

        <div class="stratum" data-layer="6">
            <span class="stratum-label">Linguistic Void</span>
            <div class="decay-particles"></div>
            <div class="stratum-interference"></div>
        </div>
    </div>

    <div id="depth-indicator">
        <div id="depth-marker"></div>
    </div>

    <div class="linguistic-residue" id="residue-log">
        <div style="font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 12px; opacity: 0.6;">Linguistic Residue</div>
    </div>

    <script>
        const decayPatterns = {
            phonetic: [
                ['th', 'f'], ['ing', 'in'], ['er', 'a'], ['tion', 'shun'],
                ['ph', 'f'], ['gh', ''], ['ough', 'uff'], ['ight', 'ite']
            ],
            semantic: {
                'awesome': 'fearsome', 'terrible': 'great', 'nice': 'precise',
                'literally': 'actually', 'very': 'truly', 'amazing': 'surprising'
            },
            etymological: {
                'message': 'missive', 'decay': 'decline', 'witness': 'see',
                'travel': 'journey', 'different': 'diverse', 'create': 'make'
            }
        };

        let currentMessage = '';
        let scrollPosition = 0;
        let decayInterval = null;

        document.getElementById('descent-trigger').addEventListener('click', () => {
            const input = document.getElementById('message-input').value;
            if (!input) return;
            
            currentMessage = input;
            startDecay();
        });

        function startDecay() {
            const container = document.getElementById('decaying-message');
            container.innerHTML = '';
            
            // Create initial fragment
            const fragment = document.createElement('div');
            fragment.className = 'message-fragment';
            fragment.dataset.depth = '0';
            fragment.innerHTML = wrapCharsInSpans(currentMessage);
            container.appendChild(fragment);
            
            // Clone for each stratum
            for (let i = 1; i <= 6; i++) {
                const clone = fragment.cloneNode(true);
                clone.dataset.depth = i;
                clone.style.top = `${i * 450}px`;
                container.appendChild(clone);
            }
            
            // Start scroll and decay
            animateScroll();
            if (decayInterval) clearInterval(decayInterval);
            decayInterval = setInterval(applyDecay, 100);
        }

        function wrapCharsInSpans(text) {
            return text.split('').map((char, i) => {
                return `<span class="char-decay" data-index="${i}" style="--rot: ${Math.random() * 4 - 2}deg; --drift: ${Math.random() * 8 - 4}px">${char}</span>`;
            }).join('');
        }

        function animateScroll() {
            const targetScroll = 2700;
            const duration = 15000;
            const start = performance.now();
            const startScroll = window.scrollY;
            
            function scroll(now) {
                const elapsed = now - start;
                const progress = Math.min(elapsed / duration, 1);
                const easing = 1 - Math.pow(1 - progress, 3);
                
                window.scrollTo(0, startScroll + (targetScroll - startScroll) * easing);
                updateDepthMarker();
                
                if (progress < 1) {
                    requestAnimationFrame(scroll);
                }
            }
            
            requestAnimationFrame(scroll);
        }

        function applyDecay() {
            const scrollPercent = window.scrollY / 2700;
            const fragments = document.querySelectorAll('.message-fragment');
            
            fragments.forEach((fragment, i) => {
                const depth = parseInt(fragment.dataset.depth);
                const depthFactor = depth / 6;
                
                if (scrollPercent < depthFactor - 0.2) return;
                
                const chars = fragment.querySelectorAll('.char-decay');
                chars.forEach((char, j) => {
                    const rand = Math.random();
                    
                    if (depth === 1 && rand < 0.02) {
                        char.classList.add('eroding');
                        createParticle(char.textContent, fragment.getBoundingClientRect());
                    } else if (depth === 2 && rand < 0.03) {
                        applyPhoneticErosion(char);
                    } else if (depth === 3 && rand < 0.02) {
                        char.classList.add('bleaching');
                        applySemanticBleaching(fragment, j);
                    } else if (depth === 4 && rand < 0.025) {
                        char.classList.add('drifting');
                    } else if (depth === 5 && rand < 0.02) {
                        char.classList.add('etymological');
                        applyEtymologicalReversion(fragment, j);
                    } else if (depth === 6 && rand < 0.04) {
                        char.classList.add('vanished');
                    }
                });
            });
        }

        function applyPhoneticErosion(char) {
            const text = char.textContent;
            decayPatterns.phonetic.forEach(([from, to]) => {
                if (text === from[0]) {
                    const nextChar = char.nextElementSibling;
                    if (nextChar && from.length > 1) {
                        let match = true;
                        for (let i = 1; i < from.length; i++) {
                            if (!nextChar || nextChar.textContent !== from[i]) {
                                match = false;
                                break;
                            }
                        }
                        if (match) {
                            char.textContent = to[0] || '';
                            char.classList.add('eroding');
                            logResidue(from, to);
                        }
                    }
                }
            });
        }

        function applySemanticBleaching(fragment, charIndex) {
            // Find word boundaries
            const chars = fragment.querySelectorAll('.char-decay');
            let word = '';
            let startIndex = charIndex;
            
            // Find word start
            while (startIndex > 0 && chars[startIndex - 1].textContent !== ' ') {
                startIndex--;
            }
            
            // Build word
            let i = startIndex;
            while (i < chars.length && chars[i].textContent !== ' ') {
                word += chars[i].textContent;
                i++;
            }
            
            if (decayPatterns.semantic[word.toLowerCase()]) {
                const replacement = decayPatterns.semantic[word.toLowerCase()];
                const ghost = document.createElement('span');
                ghost.className = 'word-ghost';
                ghost.textContent = replacement;
                ghost.style.left = `${startIndex * 14}px`;
                ghost.style.top = `${Math.random() * 20 + 20}px`;
                fragment.appendChild(ghost);
                logResidue(word, replacement);
            }
        }

        function applyEtymologicalReversion(fragment, charIndex) {
            // Similar word detection as semantic bleaching
            const chars = fragment.querySelectorAll('.char-decay');
            let word = '';
            let startIndex = charIndex;
            
            while (startIndex > 0 && chars[startIndex - 1].textContent !== ' ') {
                startIndex--;
            }
            
            let i = startIndex;
            while (i < chars.length && chars[i].textContent !== ' ') {
                word += chars[i].textContent;
                i++;
            }
            
            if (decayPatterns.etymological[word.toLowerCase()]) {
                const etymon = decayPatterns.etymological[word.toLowerCase()];
                for (let j = startIndex; j < i; j++) {
                    if (j - startIndex < etymon.length) {
                        chars[j].textContent = etymon[j - startIndex];
                        chars[j].classList.add('etymological');
                    } else {
                        chars[j].classList.add('vanished');
                    }
                }
                logResidue(word, etymon);
            }
        }

        function createParticle(char, rect) {
            const stratum = document.querySelector(`[data-layer="${Math.ceil(window.scrollY / 450)}"] .decay-particles`);
            if (!stratum) return;
            
            const particle = document.createElement('span');
            particle.className = 'particle';
            particle.textContent = char;
            particle.style.left = `${Math.random() * 1000 + 200}px`;
            particle.style.top = `${Math.random() * 400}px`;
            particle.style.setProperty('--drift-x', `${Math.random() * 100 - 50}px`);
            particle.style.setProperty('--rotation', `${Math.random() * 360}deg`);
            particle.style.animationDelay = `${Math.random() * 2}s`;
            
            stratum.appendChild(particle);
            
            setTimeout(() => particle.remove(), 8000);
        }

        function logResidue(original, transformed) {
            const log = document.getElementById('residue-log');
            const entry = document.createElement('div');
            entry.className = 'residue-entry';
            entry.innerHTML = `<span class="residue-original">${original}</span> → <span class="residue-transformed">${transformed}</span>`;
            
            log.insertBefore(entry, log.children[1]);
            
            if (log.children.length > 15) {
                log.removeChild(log.lastElementChild);
            }
        }

        function updateDepthMarker() {
            const marker = document.getElementById('depth-marker');
            const progress = Math.min(window.scrollY / 2700, 1);
            marker.style.top = `${progress * 100}%`;
        }

        window.addEventListener('scroll', updateDepthMarker);
    </script>
</body>
</html>
