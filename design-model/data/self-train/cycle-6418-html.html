<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=900">
    <title>Memory Deterioration Simulator</title>
    <style>
        :root {
            --intact: #2a1810;
            --wood-grain: #4a3426;
            --brass-tarnish: #7c6a4f;
            --wallpaper-rose: #a67c7c;
            --dust-mote: #e8dcc4;
            --void-edge: #0a0806;
            --fragment-blue: #384858;
            --coordinate-green: #00ff41;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            overflow: hidden;
            background: var(--void-edge);
            font-family: Baskerville, 'Times New Roman', serif;
            position: relative;
            perspective: 1200px;
        }

        #memory-field {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: rotateX(12deg) translateZ(-100px);
        }

        .room-fragment {
            position: absolute;
            transform-style: preserve-3d;
            transition: all 2.3s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #parlor {
            left: 420px;
            top: 200px;
            width: 600px;
            height: 500px;
        }

        .memory-solid {
            position: absolute;
            background: var(--wood-grain);
            box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
        }

        #piano {
            width: 280px;
            height: 160px;
            left: 40px;
            top: 240px;
            background: linear-gradient(180deg, var(--intact) 0%, var(--wood-grain) 100%);
            transform: rotateY(-15deg);
            clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 5% 100%);
        }

        #piano::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 40px;
            background: var(--dust-mote);
            top: 30%;
            opacity: 0.9;
        }

        .dissolving-furniture {
            position: absolute;
            pointer-events: all;
        }

        #grandmother-chair {
            width: 120px;
            height: 180px;
            right: 80px;
            bottom: 60px;
            transform: rotateY(25deg);
        }

        .chair-fragment {
            position: absolute;
            background: var(--wallpaper-rose);
            transition: all 1.8s ease-out;
            cursor: pointer;
        }

        .chair-fragment:nth-child(1) {
            width: 100%;
            height: 80px;
            bottom: 0;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        .chair-fragment:nth-child(2) {
            width: 100%;
            height: 100px;
            top: 0;
            clip-path: polygon(20% 0%, 80% 0%, 70% 100%, 30% 100%);
            transform: translateZ(20px);
        }

        .chair-fragment:nth-child(3) {
            width: 15px;
            height: 80px;
            left: 10px;
            bottom: -80px;
            background: var(--wood-grain);
        }

        .chair-fragment:nth-child(4) {
            width: 15px;
            height: 80px;
            right: 10px;
            bottom: -80px;
            background: var(--wood-grain);
        }

        #grandmother-chair:hover .chair-fragment {
            transform: translateX(0) translateY(0) translateZ(0) !important;
            opacity: 1 !important;
        }

        #grandmother-chair.deteriorating .chair-fragment:nth-child(1) {
            transform: translateX(-30px) translateY(40px) rotateZ(-15deg);
            opacity: 0.6;
        }

        #grandmother-chair.deteriorating .chair-fragment:nth-child(2) {
            transform: translateX(25px) translateY(-35px) rotateZ(20deg);
            opacity: 0.5;
        }

        #grandmother-chair.deteriorating .chair-fragment:nth-child(3) {
            transform: translateY(15px) rotateX(90deg);
            opacity: 0.4;
        }

        .wireframe-ghost {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1.2s ease-in;
        }

        #chair-wireframe {
            width: 120px;
            height: 180px;
            right: 80px;
            bottom: 60px;
            transform: rotateY(25deg);
        }

        #chair-wireframe svg {
            width: 100%;
            height: 100%;
        }

        #chair-wireframe line {
            stroke: var(--coordinate-green);
            stroke-width: 0.5;
            opacity: 0.7;
        }

        #grandmother-chair.fading ~ #chair-wireframe {
            opacity: 1;
        }

        .coordinate-label {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-size: 9px;
            color: var(--coordinate-green);
            opacity: 0;
            transition: opacity 0.8s ease-in;
            pointer-events: none;
        }

        #chair-coords {
            right: 60px;
            bottom: 40px;
        }

        #grandmother-chair.coordinates ~ #chair-coords {
            opacity: 0.8;
        }

        .tessellation-field {
            position: absolute;
            pointer-events: none;
        }

        #floor-tessellation {
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in;
        }

        .floor-polygon {
            position: absolute;
            border: 1px solid var(--fragment-blue);
            background: rgba(56, 72, 88, 0.05);
            transform-origin: center;
        }

        .floor-polygon:nth-child(odd) {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        .floor-polygon:nth-child(even) {
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }

        #memory-compass {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 200px;
            height: 200px;
            border: 1px solid var(--brass-tarnish);
            border-radius: 50%;
            background: radial-gradient(circle, transparent 40%, var(--void-edge) 100%);
        }

        .compass-memory {
            position: absolute;
            width: 8px;
            height: 8px;
            background: var(--dust-mote);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.6s ease-out;
        }

        .compass-memory.fading {
            background: var(--fragment-blue);
            width: 4px;
            height: 4px;
        }

        .compass-memory.lost {
            background: none;
            border: 1px solid var(--coordinate-green);
        }

        #story-fragments {
            position: fixed;
            bottom: 40px;
            right: 40px;
            width: 320px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--dust-mote);
            opacity: 0;
            transition: opacity 1s ease-in;
        }

        #story-fragments.revealed {
            opacity: 0.9;
        }

        .story-line {
            margin-bottom: 8px;
            transform: translateX(20px);
            opacity: 0;
            transition: all 0.8s ease-out;
        }

        #story-fragments.revealed .story-line {
            transform: translateX(0);
            opacity: 1;
        }

        #story-fragments.revealed .story-line:nth-child(1) { transition-delay: 0.2s; }
        #story-fragments.revealed .story-line:nth-child(2) { transition-delay: 0.4s; }
        #story-fragments.revealed .story-line:nth-child(3) { transition-delay: 0.6s; }

        #reconstruction-prompt {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            letter-spacing: 2px;
            color: var(--brass-tarnish);
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.8s ease-in;
            pointer-events: none;
        }

        .deteriorating ~ #reconstruction-prompt {
            opacity: 0.7;
        }

        #wallpaper-memory {
            position: absolute;
            width: 100%;
            height: 300px;
            top: 0;
            background: repeating-linear-gradient(
                90deg,
                var(--wallpaper-rose),
                var(--wallpaper-rose) 40px,
                rgba(166, 124, 124, 0.6) 40px,
                rgba(166, 124, 124, 0.6) 80px
            );
            opacity: 0.3;
            mask-image: linear-gradient(180deg, black 0%, transparent 100%);
        }

        .memory-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--dust-mote);
            opacity: 0.6;
            animation: drift 12s infinite linear;
        }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-200px) translateX(50px); opacity: 0; }
        }

        .interaction-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--brass-tarnish);
            opacity: 0.5;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="memory-field">
        <div id="wallpaper-memory"></div>
        
        <div class="room-fragment" id="parlor">
            <div class="memory-solid" id="piano"></div>
            
            <div class="dissolving-furniture deteriorating" id="grandmother-chair">
                <div class="chair-fragment"></div>
                <div class="chair-fragment"></div>
                <div class="chair-fragment"></div>
                <div class="chair-fragment"></div>
            </div>
            
            <div class="wireframe-ghost" id="chair-wireframe">
                <svg>
                    <line x1="10" y1="180" x2="10" y2="100" />
                    <line x1="110" y1="180" x2="110" y2="100" />
                    <line x1="10" y1="100" x2="110" y2="100" />
                    <line x1="20" y1="80" x2="100" y2="80" />
                    <line x1="20" y1="80" x2="20" y2="0" />
                    <line x1="100" y1="80" x2="100" y2="0" />
                    <line x1="20" y1="0" x2="100" y2="0" />
                </svg>
            </div>
            
            <div class="coordinate-label" id="chair-coords">
                [42.3821, 71.0589, 0.2847]
            </div>
        </div>
        
        <div class="tessellation-field" id="floor-tessellation">
            <div class="floor-polygon" style="width: 60px; height: 60px; left: 300px; top: 400px;"></div>
            <div class="floor-polygon" style="width: 80px; height: 80px; left: 360px; top: 380px;"></div>
            <div class="floor-polygon" style="width: 50px; height: 50px; left: 440px; top: 420px;"></div>
            <div class="floor-polygon" style="width: 70px; height: 70px; left: 380px; top: 460px;"></div>
        </div>
    </div>
    
    <div id="memory-compass">
        <div class="compass-memory" style="top: 30%; left: 60%;"></div>
        <div class="compass-memory fading" style="top: 50%; left: 80%;"></div>
        <div class="compass-memory lost" style="top: 70%; left: 40%;"></div>
        <div class="compass-memory" style="top: 45%; left: 30%;"></div>
    </div>
    
    <div id="story-fragments">
        <div class="story-line">She would sit there every evening after supper,</div>
        <div class="story-line">humming songs from the old country while</div>
        <div class="story-line">the velvet grew thin beneath her fingers.</div>
    </div>
    
    <div id="reconstruction-prompt">Click fragments to reassemble</div>
    
    <div class="memory-particle" style="left: 20%; animation-delay: 0s;"></div>
    <div class="memory-particle" style="left: 40%; animation-delay: 3s;"></div>
    <div class="memory-particle" style="left: 60%; animation-delay: 6s;"></div>
    <div class="memory-particle" style="left: 80%; animation-delay: 9s;"></div>
    
    <div class="interaction-hint">Navigate fading memories • Reconstruct to remember</div>
    
    <script>
        const chair = document.getElementById('grandmother-chair');
        const storyFragments = document.getElementById('story-fragments');
        const floorTessellation = document.getElementById('floor-tessellation');
        let clickCount = 0;
        
        chair.addEventListener('click', () => {
            clickCount++;
            if (clickCount === 1) {
                chair.classList.remove('deteriorating');
                storyFragments.classList.add('revealed');
            } else if (clickCount === 3) {
                chair.classList.add('fading');
                setTimeout(() => {
                    chair.classList.add('coordinates');
                    floorTessellation.style.opacity = '0.3';
                }, 1000);
            }
        });
        
        document.addEventListener('mousemove', (e) => {
            const particles = document.querySelectorAll('.memory-particle');
            particles.forEach((p, i) => {
                const offsetX = (e.clientX - 720) * 0.02 * (i + 1);
                const offsetY = (e.clientY - 450) * 0.02 * (i + 1);
                p.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
            });
        });
    </script>
</body>
</html>
