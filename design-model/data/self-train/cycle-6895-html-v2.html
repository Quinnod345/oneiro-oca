<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silence Auction House</title>
    <style>
        :root {
            --void: #0a0a0a;
            --ash: #1a1a1a;
            --smoke: #2a2a2a;
            --pearl: #f0f0f0;
            --whisper: #666;
            --accent: #0066ff;
            --accent-dim: #0055dd;
            --accent-faint: rgba(0, 102, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--void);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
            color: var(--pearl);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .ambient-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, var(--ash) 0%, var(--void) 70%);
            opacity: 0.5;
        }

        .main-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            padding: 20px;
            z-index: 1;
        }

        .auction-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .site-title {
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--whisper);
            margin-bottom: 12px;
        }

        .current-time {
            font-size: 48px;
            font-weight: 100;
            letter-spacing: -0.02em;
            color: var(--pearl);
        }

        .auction-card {
            background: var(--ash);
            border: 1px solid var(--smoke);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 24px;
            transition: border-color 0.3s ease;
        }

        .auction-card:hover {
            border-color: var(--whisper);
        }

        .silence-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 32px;
        }

        .silence-duration {
            font-size: 36px;
            font-weight: 200;
            color: var(--pearl);
        }

        .silence-unit {
            font-size: 14px;
            font-weight: 400;
            color: var(--whisper);
            margin-left: 8px;
        }

        .current-bid {
            text-align: right;
        }

        .bid-label {
            font-size: 12px;
            color: var(--whisper);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 4px;
        }

        .bid-amount {
            font-size: 24px;
            font-weight: 300;
            color: var(--pearl);
        }

        .timeline-visual {
            height: 60px;
            background: var(--smoke);
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
        }

        .silence-block {
            position: absolute;
            height: 100%;
            background: var(--accent-faint);
            border-left: 2px solid var(--accent);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bid-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            align-items: center;
        }

        .bid-input {
            background: var(--smoke);
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 16px 20px;
            color: var(--pearl);
            font-size: 16px;
            font-weight: 300;
            transition: border-color 0.2s;
        }

        .bid-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .bid-input::placeholder {
            color: var(--whisper);
        }

        .place-bid {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 16px 32px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .place-bid:hover {
            background: var(--accent-dim);
        }

        .place-bid:active {
            transform: scale(0.98);
        }

        .status-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
        }

        .status-item {
            text-align: center;
        }

        .status-value {
            font-size: 20px;
            font-weight: 200;
            color: var(--pearl);
            margin-bottom: 4px;
        }

        .status-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--whisper);
        }

        @media (max-width: 640px) {
            .auction-card {
                padding: 24px;
            }

            .current-time {
                font-size: 36px;
            }

            .silence-duration {
                font-size: 28px;
            }

            .bid-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="ambient-layer"></div>
    
    <div class="main-container">
        <header class="auction-header">
            <div class="site-title">Silence Auction House</div>
            <div class="current-time">14:32:18</div>
        </header>

        <div class="auction-card">
            <div class="silence-header">
                <div>
                    <span class="silence-duration">30</span>
                    <span class="silence-unit">minutes</span>
                </div>
                <div class="current-bid">
                    <div class="bid-label">Current Bid</div>
                    <div class="bid-amount">$45.00</div>
                </div>
            </div>

            <div class="timeline-visual">
                <div class="silence-block" style="left: 20%; width: 30%;"></div>
            </div>

            <div class="bid-controls">
                <input type="text" class="bid-input" placeholder="Enter your bid">
                <button class="place-bid">Place Bid</button>
            </div>
        </div>

        <div class="auction-card">
            <div class="silence-header">
                <div>
                    <span class="silence-duration">60</span>
                    <span class="silence-unit">minutes</span>
                </div>
                <div class="current-bid">
                    <div class="bid-label">Current Bid</div>
                    <div class="bid-amount">$120.00</div>
                </div>
            </div>

            <div class="timeline-visual">
                <div class="silence-block" style="left: 50%; width: 25%;"></div>
            </div>

            <div class="bid-controls">
                <input type="text" class="bid-input" placeholder="Enter your bid">
                <button class="place-bid">Place Bid</button>
            </div>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-value">12</div>
                <div class="status-label">Active Auctions</div>
            </div>
            <div class="status-item">
                <div class="status-value">3.5h</div>
                <div class="status-label">Total Silence</div>
            </div>
            <div class="status-item">
                <div class="status-value">87%</div>
                <div class="status-label">Quiet Index</div>
            </div>
        </div>
    </div>
</body>
</html>
