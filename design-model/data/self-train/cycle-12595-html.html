<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Architecture Blueprints</title>
    <style>
        :root {
            --blueprint-navy: #0a1628;
            --blueprint-deep: #061119;
            --line-primary: rgba(255, 255, 255, 0.9);
            --line-secondary: rgba(255, 255, 255, 0.4);
            --line-tertiary: rgba(255, 255, 255, 0.15);
            --memory-gold: #d4a574;
            --memory-glow: rgba(212, 165, 116, 0.3);
            --grid-size: 20px;
            --consciousness-blue: #1e3a5f;
            --breathe-amplitude: 3px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--blueprint-deep);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }

        .consciousness-field {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 40%, var(--consciousness-blue) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 60%, var(--blueprint-navy) 0%, transparent 50%),
                var(--blueprint-deep);
        }

        .grid-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(var(--line-tertiary) 1px, transparent 1px),
                linear-gradient(90deg, var(--line-tertiary) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            opacity: 0.5;
        }

        .blueprint-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1200px;
            height: 750px;
        }

        .layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .layer.interactive {
            pointer-events: all;
        }

        .impossible-room {
            position: absolute;
            stroke: var(--line-primary);
            stroke-width: 1.5;
            fill: none;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.1));
        }

        .room-fill {
            fill: rgba(30, 58, 95, 0.1);
            stroke: none;
        }

        .breathing-wall {
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(var(--breathe-amplitude), 0); }
        }

        .escher-stairs {
            stroke: var(--line-secondary);
            stroke-width: 1;
            stroke-dasharray: 3 2;
            opacity: 0.8;
        }

        .recursive-door {
            stroke: var(--line-primary);
            stroke-width: 1.5;
            fill: rgba(10, 22, 40, 0.7);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .recursive-door:hover {
            fill: rgba(30, 58, 95, 0.5);
            stroke-width: 2;
            filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.3));
        }

        .memory-chamber {
            stroke: var(--memory-gold);
            stroke-width: 1.5;
            fill: var(--memory-glow);
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }

        .memory-chamber.discovered {
            opacity: 1;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 3px var(--memory-glow)); }
            50% { filter: drop-shadow(0 0 8px var(--memory-gold)); }
        }

        .dimension-label {
            position: absolute;
            font-size: 10px;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--line-secondary);
            writing-mode: vertical-rl;
            transform-origin: center;
        }

        .folding-section {
            cursor: grab;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center;
        }

        .folding-section:active {
            cursor: grabbing;
        }

        .folding-section.folded {
            transform: rotateY(180deg) scale(0.8);
            opacity: 0.6;
        }

        .navigation-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--line-tertiary);
            text-align: center;
        }

        .consciousness-state {
            position: absolute;
            top: 40px;
            right: 60px;
            font-size: 13px;
            letter-spacing: 1px;
            color: var(--line-secondary);
            text-align: right;
        }

        .state-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--line-primary);
            border-radius: 50%;
            margin-left: 10px;
            animation: blink 3s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .floating-annotation {
            position: absolute;
            font-size: 9px;
            color: var(--line-tertiary);
            letter-spacing: 1px;
            font-weight: 300;
        }

        .perspective-shift {
            animation: shift-perspective 8s ease-in-out infinite alternate;
        }

        @keyframes shift-perspective {
            0% { transform: perspective(1000px) rotateX(0deg) rotateY(0deg); }
            100% { transform: perspective(1000px) rotateX(2deg) rotateY(-3deg); }
        }

        .temporal-fold {
            stroke: var(--line-primary);
            stroke-width: 0.5;
            stroke-dasharray: 1 3;
            opacity: 0.5;
        }

        .hidden-passage {
            opacity: 0;
            transition: opacity 0.4s ease-out;
        }

        .hidden-passage.revealed {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="consciousness-field"></div>
    <div class="grid-overlay"></div>
    
    <div class="blueprint-container perspective-shift">
        <div class="layer">
            <svg width="100%" height="100%" viewBox="0 0 1200 750">
                <!-- Base floor plan -->
                <g class="folding-section" id="section-alpha">
                    <rect class="room-fill" x="200" y="150" width="250" height="200"/>
                    <rect class="impossible-room breathing-wall" x="200" y="150" width="250" height="200"/>
                    
                    <!-- Escher stairs -->
                    <path class="escher-stairs" d="M 300 250 L 350 200 L 400 250 L 350 300 Z"/>
                    <path class="escher-stairs" d="M 325 225 L 375 225 L 375 275 L 325 275 Z"/>
                </g>
                
                <!-- Recursive door system -->
                <g id="door-paradox">
                    <rect class="recursive-door" x="440" y="200" width="30" height="80" rx="2"/>
                    <rect class="recursive-door" x="445" y="210" width="20" height="60" rx="1" opacity="0.7"/>
                    <rect class="recursive-door" x="450" y="220" width="10" height="40" rx="1" opacity="0.4"/>
                </g>
                
                <!-- Hidden memory chamber -->
                <g id="memory-alpha">
                    <polygon class="memory-chamber" points="500,100 600,150 600,250 500,300 400,250 400,150"/>
                    <circle cx="500" cy="200" r="3" fill="var(--memory-gold)" opacity="0.8"/>
                </g>
                
                <!-- Inverted space -->
                <g class="folding-section" id="section-beta">
                    <path class="impossible-room" d="M 600 350 L 800 350 L 850 400 L 850 500 L 600 500 Z"/>
                    <path class="room-fill" d="M 600 350 L 800 350 L 850 400 L 850 500 L 600 500 Z" opacity="0.1"/>
                    
                    <!-- Breathing walls -->
                    <line class="breathing-wall" x1="725" y1="350" x2="725" y2="500" style="--breathe-amplitude: -5px;"/>
                    <line class="breathing-wall" x1="675" y1="350" x2="675" y2="500" style="--breathe-amplitude: 4px;"/>
                </g>
                
                <!-- Temporal folds -->
                <g opacity="0.6">
                    <path class="temporal-fold" d="M 200 350 L 600 350 M 450 150 L 450 550"/>
                    <path class="temporal-fold" d="M 300 450 Q 500 400 700 450"/>
                </g>
                
                <!-- Hidden passages -->
                <g class="hidden-passage" id="passage-1">
                    <path class="impossible-room" d="M 350 400 L 450 350 L 500 400 L 400 450 Z" stroke-dasharray="5 3"/>
                </g>
                
                <!-- Dimensional annotations -->
                <text class="dimension-label" x="180" y="250" transform="rotate(-90, 180, 250)">CONSCIOUS</text>
                <text class="dimension-label" x="870" y="425" transform="rotate(-90, 870, 425)">SUBCONSCIOUS</text>
            </svg>
        </div>
        
        <!-- Interactive overlay -->
        <div class="layer interactive">
            <svg width="100%" height="100%" viewBox="0 0 1200 750">
                <rect class="recursive-door" x="700" y="250" width="40" height="100" rx="3" 
                      onclick="this.classList.toggle('folded')"/>
                <rect class="recursive-door" x="300" y="400" width="50" height="80" rx="2" 
                      onclick="document.getElementById('memory-alpha').querySelector('.memory-chamber').classList.add('discovered')"/>
            </svg>
        </div>
        
        <!-- Floating annotations -->
        <div class="floating-annotation" style="top: 180px; left: 520px;">∞ RECURSION</div>
        <div class="floating-annotation" style="top: 380px; left: 720px;">⟳ TIME FOLD</div>
        <div class="floating-annotation" style="top: 460px; left: 380px;">◈ MEMORY NODE</div>
    </div>
    
    <div class="consciousness-state">
        STATE: LIMINAL
        <span class="state-indicator"></span>
    </div>
    
    <div class="navigation-hint">
        Click doors to fold reality • Hover to reveal hidden chambers
    </div>
    
    <script>
        // Reveal hidden passages on proximity
        document.addEventListener('mousemove', (e) => {
            const passages = document.querySelectorAll('.hidden-passage');
            passages.forEach(passage => {
                const rect = passage.getBoundingClientRect();
                const distance = Math.sqrt(
                    Math.pow(e.clientX - (rect.left + rect.width/2), 2) + 
                    Math.pow(e.clientY - (rect.top + rect.height/2), 2)
                );
                
                if (distance < 150) {
                    passage.classList.add('revealed');
                } else {
                    passage.classList.remove('revealed');
                }
            });
        });
        
        // Folding sections
        document.querySelectorAll('.folding-section').forEach(section => {
            section.addEventListener('click', () => {
                section.classList.toggle('folded');
                
                // Update consciousness state
                const folded = document.querySelectorAll('.folded').length;
                const state = document.querySelector('.consciousness-state');
                const states = ['LIMINAL', 'FRACTAL', 'RECURSIVE', 'INFINITE'];
                state.innerHTML = `STATE: ${states[folded % states.length]}<span class="state-indicator"></span>`;
            });
        });
        
        // Breathing animation variation
        const walls = document.querySelectorAll('.breathing-wall');
        walls.forEach((wall, i) => {
            wall.style.animationDelay = `${i * 0.5}s`;
        });
    </script>
</body>
</html>
