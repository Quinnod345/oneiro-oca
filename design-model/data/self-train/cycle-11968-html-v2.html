<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Drift Calibrator</title>
    <style>
        :root {
            --primary-dark: #0a0a0f;
            --primary-accent: #4cc9f0;
            --secondary-accent: #ff8c42;
            --ui-surface: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: var(--primary-dark);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            position: relative;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .interface-container {
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-track {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--ui-surface);
            top: 50%;
            transform: translateY(-50%);
            border-radius: 2px;
        }

        .timeline-progress {
            position: absolute;
            height: 100%;
            background: var(--primary-accent);
            border-radius: 2px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .time-markers {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time-marker {
            width: 2px;
            height: 20px;
            background: var(--ui-surface);
            position: relative;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-marker:hover {
            height: 30px;
            background: var(--primary-accent);
        }

        .time-marker::after {
            content: attr(data-time);
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .time-marker:hover::after {
            opacity: 1;
        }

        .body-clock {
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, var(--primary-accent) 0%, transparent 70%);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            cursor: grab;
            transition: transform 0.2s ease;
            z-index: 10;
        }

        .body-clock:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .body-clock:active {
            cursor: grabbing;
            transform: translateY(-50%) scale(0.95);
        }

        .body-clock::after {
            content: '';
            position: absolute;
            width: 30px;
            height: 30px;
            background: white;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 20px var(--primary-accent);
        }

        .event-markers {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .event-marker {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--secondary-accent);
            border-radius: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 140, 66, 0.1);
            pointer-events: auto;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .event-marker:hover {
            transform: translate(-50%, -50%) scale(1.2);
            background: rgba(255, 140, 66, 0.3);
        }

        .event-tooltip {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px 16px;
            border-radius: 4px;
            font-size: 14px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .event-marker:hover .event-tooltip {
            opacity: 1;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
        }

        .control-button {
            padding: 12px 24px;
            background: var(--ui-surface);
            border: 1px solid var(--primary-accent);
            border-radius: 4px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-button:hover {
            background: var(--primary-accent);
            transform: translateY(-2px);
        }

        .control-button:active {
            transform: translateY(0);
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--ui-surface);
            width: 250px;
        }

        .info-title {
            font-size: 18px;
            margin-bottom: 12px;
            color: var(--primary-accent);
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-value {
            color: white;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .interface-container {
                width: 95vw;
                height: 70vh;
            }

            .info-panel {
                position: relative;
                top: auto;
                right: auto;
                margin: 20px auto;
                width: 90%;
            }

            .controls {
                bottom: 10px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .control-button {
                padding: 10px 20px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="interface-container">
        <div class="timeline-track">
            <div class="timeline-progress"></div>
        </div>
        
        <div class="time-markers">
            <div class="time-marker" data-time="00:00"></div>
            <div class="time-marker" data-time="06:00"></div>
            <div class="time-marker" data-time="12:00"></div>
            <div class="time-marker" data-time="18:00"></div>
            <div class="time-marker" data-time="24:00"></div>
        </div>

        <div class="body-clock" draggable="true"></div>

        <div class="event-markers">
            <div class="event-marker" style="left: 25%;">
                🌙
                <div class="event-tooltip">Sleep Phase</div>
            </div>
            <div class="event-marker" style="left: 50%;">
                🍽️
                <div class="event-tooltip">Meal Time</div>
            </div>
            <div class="event-marker" style="left: 75%;">
                👥
                <div class="event-tooltip">Social Activity</div>
            </div>
        </div>
    </div>

    <div class="info-panel">
        <h3 class="info-title">Temporal Status</h3>
        <div class="info-item">
            <span>Current Drift</span>
            <span class="info-value">+2.5 hours</span>
        </div>
        <div class="info-item">
            <span>Target Phase</span>
            <span class="info-value">23:00 - 07:00</span>
        </div>
        <div class="info-item">
            <span>Resistance</span>
            <span class="info-value">Medium</span>
        </div>
    </div>

    <div class="controls">
        <button class="control-button">Reset Schedule</button>
        <button class="control-button">Apply Drift</button>
        <button class="control-button">View History</button>
    </div>

    <script>
        const bodyClock = document.querySelector('.body-clock');
        const timelineProgress = document.querySelector('.timeline-progress');
        const container = document.querySelector('.interface-container');
        
        let isDragging = false;
        let currentX = 0;
        
        bodyClock.addEventListener('mousedown', (e) => {
            isDragging = true;
            bodyClock.style.transition = 'none';
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            
            const rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            
            bodyClock.style.left = x + 'px';
            timelineProgress.style.width = (x / rect.width * 100) + '%';
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
            bodyClock.style.transition = 'transform 0.2s ease';
        });
        
        document.querySelectorAll('.time-marker').forEach(marker => {
            marker.addEventListener('click', function() {
                const rect = container.getBoundingClientRect();
                const markerRect = this.getBoundingClientRect();
                const x = markerRect.left - rect.left + markerRect.width / 2;
                
                bodyClock.style.left = x + 'px';
                timelineProgress.style.width = (x / rect.width * 100) + '%';
            });
        });
        
        document.querySelectorAll('.event-marker').forEach(marker => {
            marker.addEventListener('click', function() {
                this.style.animation = 'pulse 0.5s ease';
                setTimeout(() => {
                    this.style.animation = '';
                }, 500);
            });
        });
    </script>
</body>
</html>
