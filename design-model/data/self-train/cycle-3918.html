    <style>
        :root {
            --peak-green: #22c55e;
            --high-green: #4ade80;
            --mid-green: #86efac;
            --low-yellow: #fbbf24;
            --valley-orange: #f97316;
            --deep-red: #dc2626;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --border: #e5e7eb;
            --surface: #ffffff;
            --background: #f9fafb;
            --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--background);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 32px 40px;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .month-display {
            font-size: 18px;
            font-weight: 600;
            min-width: 140px;
            text-align: center;
        }

        .nav-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: var(--surface);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: var(--border);
        }

        .legend {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .calendar {
            flex: 1;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .calendar-header {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid var(--border);
        }

        .day-header {
            padding: 20px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            height: calc(100% - 65px);
        }

        .day-cell {
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            padding: 16px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .day-cell:nth-child(7n) {
            border-right: none;
        }

        .day-number {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-primary);
        }

        .other-month {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        .energy-bars {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .time-slot {
            height: 8px;
            border-radius: 4px;
            position: relative;
        }

        .morning { background: var(--peak-green); }
        .late-morning { background: var(--high-green); }
        .pre-lunch { background: var(--mid-green); }
        .lunch-dip { background: var(--low-yellow); }
        .afternoon-low { background: var(--valley-orange); }
        .evening-recovery { background: var(--high-green); }
        .night { background: var(--deep-red); }

        .today {
            background: rgba(34, 197, 94, 0.05);
        }

        .today .day-number {
            background: var(--peak-green);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .energy-tooltip {
            position: absolute;
            bottom: -2px;
            right: 4px;
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .weekend {
            background: rgba(251, 191, 36, 0.02);
        }

        .peak-day .energy-bars .time-slot {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
