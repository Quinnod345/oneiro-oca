<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Constellation Podcasts</title>
    <style>
        :root {
            --star-primary: #FFE5B4;
            --star-listened: #FFA500;
            --star-active: #FF6B35;
            --constellation-line: rgba(255, 229, 180, 0.3);
            --constellation-active: rgba(255, 107, 53, 0.6);
            --nebula-1: rgba(138, 43, 226, 0.1);
            --nebula-2: rgba(30, 144, 255, 0.08);
            --nebula-3: rgba(255, 20, 147, 0.06);
            --cosmic-bg: #0B0E1A;
            --text-primary: #E8E8E8;
            --text-secondary: #A0A0A0;
            --player-bg: rgba(20, 25, 40, 0.9);
            --control-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            background: var(--cosmic-bg);
            color: var(--text-primary);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .cosmic-background {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse 800px 600px at 20% 30%, var(--nebula-1) 0%, transparent 50%),
                radial-gradient(ellipse 600px 400px at 80% 70%, var(--nebula-2) 0%, transparent 50%),
                radial-gradient(ellipse 400px 300px at 50% 20%, var(--nebula-3) 0%, transparent 50%);
        }

        .constellation-canvas {
            position: absolute;
            inset: 0;
            z-index: 1;
        }

        .constellation {
            position: absolute;
        }

        .constellation-line {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, var(--constellation-line), transparent);
            transform-origin: left center;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .constellation.active .constellation-line {
            background: linear-gradient(90deg, var(--constellation-active), transparent);
            box-shadow: 0 0 8px var(--constellation-active);
        }

        .episode {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--star-primary);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2;
            border: 2px solid transparent;
        }

        .episode::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--star-primary) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .episode:hover {
            transform: scale(1.3);
            box-shadow: 0 0 20px var(--star-primary);
        }

        .episode:hover::before {
            opacity: 1;
        }

        .episode.listened {
            background: var(--star-listened);
            box-shadow: 0 0 16px var(--star-listened);
            animation: pulse 3s ease-in-out infinite;
        }

        .episode.listened::before {
            background: radial-gradient(circle, var(--star-listened) 0%, transparent 70%);
        }

        .episode.active {
            background: var(--star-active);
            border-color: var(--star-active);
            box-shadow: 0 0 24px var(--star-active);
            transform: scale(1.4);
            animation: activeGlow 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.1); }
        }

        @keyframes activeGlow {
            0%, 100% { box-shadow: 0 0 24px var(--star-active); }
            50% { box-shadow: 0 0 36px var(--star-active); }
        }

        .series-label {
            position: absolute;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 3;
        }

        .constellation.active .series-label {
            color: var(--star-active);
            text-shadow: 0 0 12px var(--star-active);
        }

        .episode-tooltip {
            position: absolute;
            background: var(--player-bg);
            backdrop-filter: blur(16px);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            color: var(--text-primary);
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }

        .episode-tooltip.show {
            opacity: 1;
            transform: translateY(0);
        }

        .tooltip-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .tooltip-duration {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .player-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 160px;
            background: var(--player-bg);
            backdrop-filter: blur(24px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 5;
            display: flex;
            align-items: center;
            padding: 0 40px;
            gap: 32px;
        }

        .episode-artwork {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--star-listened), var(--star-active));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            flex-shrink: 0;
        }

        .episode-info {
            flex: 1;
            min-width: 0;
        }

        .episode-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .episode-series {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 6px;
            background: var(--control-bg);
            border-radius: 3px;
            cursor: pointer;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--star-listened), var(--star-active));
            border-radius: 3px;
            width: 34%;
            position: relative;
        }

        .progress-handle {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: var(--star-active);
            border-radius: 50%;
            cursor: grab;
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .control-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--control-bg);
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn.play {
            width: 64px;
            height: 64px;
            background: var(--star-active);
            font-size: 24px;
        }

        .control-btn.play:hover {
            background: var(--star-listened);
        }

        .legend {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 4;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .legend-star {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        .legend-star.unplayed {
            background: var(--star-primary);
        }

        .legend-star.listened {
            background: var(--star-listened);
            box-shadow: 0 0 8px var(--star-listened);
        }

        .legend-star.active {
            background: var(--star-active);
            box-shadow: 0 0 12px var(--star-active);
        }

        .title {
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 4;
        }

        .main-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--text-primary), var(--star-listened));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>

    <div class="episode-tooltip" id="tooltip">
        <div class="tooltip-title"></div>
        <div class="tooltip-duration"></div>
    </div>

    <div class="player-panel">
        <div class="episode-artwork">🎙️</div>
        <div class="episode-info">
            <div class="episode-title">Web3 Revolution</div>
            <div class="episode-series">Tech Tales</div>
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-handle"></div>
                </div>
            </div>
            <div class="time-info">
                <span>15:32</span>
                <span>45:33</span>
            </div>
        </div>
        <div class="player-controls">
            <button class="control-btn">⏮</button>
            <button class="control-btn">⏪</button>
            <button class="control-btn play">⏸</button>
            <button class="control-btn">⏩</button>
            <button class="control-btn">⏭</button>
        </div>
    </div>

    <script>
        const episodes = document.querySelectorAll('.episode');
        const tooltip = document.getElementById('tooltip');
        const constellations = document.querySelectorAll('.constellation');

        episodes.forEach(episode => {
            episode.addEventListener('mouseenter', (e) => {
                const title = e.target.dataset.episode;
                const duration = e.target.dataset.duration;
                
                tooltip.querySelector('.tooltip-title').textContent = title;
                tooltip.querySelector('.tooltip-duration').textContent = duration;
                
                const rect = e.target.getBoundingClientRect();
                tooltip.style.left = rect.left + 'px';
                tooltip.style.top = (rect.top - 60) + 'px';
                tooltip.classList.add('show');
            });

            episode.addEventListener('mouseleave', () => {
                tooltip.classList.remove('show');
            });

            episode.addEventListener('click', (e) => {
                // Remove active from all episodes
                episodes.forEach(ep => ep.classList.remove('active'));
                constellations.forEach(con => con.classList.remove('active'));
                
                // Add active to clicked episode
                e.target.classList.add('active');
                e.target.classList.add('listened');
                
                // Find parent constellation and make it active
                const parentConstellation = e.target.closest('.constellation');
                if (parentConstellation) {
                    parentConstellation.classList.add('active');
                }

                // Update player info
                const playerTitle = document.querySelector('.episode-title');
                const playerSeries = document.querySelector('.episode-series');
                const seriesName = parentConstellation.dataset.series.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
                
                playerTitle.textContent = e.target.dataset.episode;
                playerSeries.textContent = seriesName;
            });
        });

        // Animate progress bar
        const progressBar = document.querySelector('.progress-bar');
        let progress = 34;
        
        setInterval(() => {
            if (document.querySelector('.episode.active')) {
                progress += 0.1;
                if (progress > 100) progress = 0;
                progressBar.style.width = progress + '%';
            }
        }, 1000);
    </script>
</body>
</html>
