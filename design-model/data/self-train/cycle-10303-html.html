<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Terrain Navigator</title>
    <style>
        :root {
            --terrain-deep: #1a2332;
            --terrain-mid: #2d3e50;
            --terrain-high: #4a5f7a;
            --valley-shadow: #0f141c;
            --peak-light: #e8d5b7;
            --anxiety-cloud: #3e4c59;
            --joy-glow: #f4a460;
            --stress-red: #8b4513;
            --calm-blue: #4682b4;
            --energy-yellow: #daa520;
            --grid-line: rgba(255, 255, 255, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--valley-shadow);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
            cursor: crosshair;
        }

        .terrain-container {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            perspective: 1200px;
        }

        .terrain-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotateX(45deg) translateZ(-200px);
        }

        .mesh-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(0deg, var(--grid-line) 0px, transparent 1px, transparent 40px, var(--grid-line) 40px),
                repeating-linear-gradient(90deg, var(--grid-line) 0px, transparent 1px, transparent 40px, var(--grid-line) 40px);
        }

        .elevation-wave {
            position: absolute;
            width: 100%;
            height: 300px;
            background: linear-gradient(180deg, transparent, var(--terrain-deep));
            clip-path: polygon(
                0% 80%,
                10% 65%,
                20% 70%,
                30% 45%,
                40% 20%,
                50% 15%,
                60% 25%,
                70% 50%,
                80% 75%,
                90% 85%,
                100% 80%,
                100% 100%,
                0% 100%
            );
            opacity: 0.8;
            animation: undulate 20s ease-in-out infinite;
        }

        .elevation-wave:nth-child(2) {
            top: 50px;
            background: linear-gradient(180deg, transparent, var(--terrain-mid));
            clip-path: polygon(
                0% 85%,
                15% 75%,
                25% 60%,
                35% 35%,
                45% 25%,
                55% 30%,
                65% 45%,
                75% 65%,
                85% 80%,
                95% 90%,
                100% 85%,
                100% 100%,
                0% 100%
            );
            animation-delay: -5s;
        }

        .elevation-wave:nth-child(3) {
            top: 100px;
            background: linear-gradient(180deg, transparent, var(--terrain-high));
            clip-path: polygon(
                0% 90%,
                12% 80%,
                22% 65%,
                32% 50%,
                42% 40%,
                52% 45%,
                62% 55%,
                72% 70%,
                82% 85%,
                92% 92%,
                100% 90%,
                100% 100%,
                0% 100%
            );
            animation-delay: -10s;
        }

        @keyframes undulate {
            0%, 100% { transform: translateY(0) scaleY(1); }
            25% { transform: translateY(-10px) scaleY(1.05); }
            50% { transform: translateY(5px) scaleY(0.95); }
            75% { transform: translateY(-5px) scaleY(1.02); }
        }

        .emotional-peak {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .peak-joy {
            background: radial-gradient(circle at 30% 30%, var(--joy-glow), transparent 70%);
            box-shadow: 0 0 40px var(--joy-glow);
            left: 30%;
            top: 35%;
        }

        .valley-stress {
            background: radial-gradient(circle at 70% 70%, var(--stress-red), transparent 60%);
            box-shadow: inset 0 0 30px var(--valley-shadow);
            left: 70%;
            top: 65%;
        }

        .plateau-calm {
            background: radial-gradient(circle at 50% 50%, var(--calm-blue), transparent 65%);
            box-shadow: 0 0 25px var(--calm-blue);
            left: 50%;
            top: 50%;
        }

        .emotional-peak:hover {
            transform: translate(-50%, -50%) scale(1.2);
        }

        .weather-system {
            position: absolute;
            pointer-events: none;
        }

        .anxiety-cloud {
            width: 180px;
            height: 80px;
            background: var(--anxiety-cloud);
            border-radius: 100px;
            opacity: 0.6;
            filter: blur(15px);
            animation: drift 15s ease-in-out infinite;
        }

        .anxiety-cloud:nth-child(1) {
            left: 20%;
            top: 20%;
            animation-delay: 0s;
        }

        .anxiety-cloud:nth-child(2) {
            left: 60%;
            top: 30%;
            animation-delay: -5s;
        }

        @keyframes drift {
            0%, 100% { transform: translateX(0) translateY(0); }
            33% { transform: translateX(30px) translateY(-10px); }
            66% { transform: translateX(-20px) translateY(10px); }
        }

        .timeline-river {
            position: absolute;
            bottom: 120px;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--grid-line) 0%, var(--energy-yellow) 50%, var(--grid-line) 100%);
            opacity: 0.3;
        }

        .day-marker {
            position: absolute;
            bottom: 100px;
            width: 2px;
            height: 40px;
            background: var(--peak-light);
            opacity: 0.5;
        }

        .day-marker::after {
            content: attr(data-day);
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: var(--peak-light);
            opacity: 0.7;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .control-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            background: rgba(26, 35, 50, 0.8);
            padding: 25px;
            border-radius: 2px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--grid-line);
            width: 280px;
        }

        .panel-title {
            color: var(--peak-light);
            font-size: 14px;
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .metric {
            margin-bottom: 18px;
        }

        .metric-label {
            color: var(--peak-light);
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .metric-bar {
            height: 6px;
            background: var(--valley-shadow);
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }

        .metric-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .elevation-fill {
            width: 65%;
            background: linear-gradient(90deg, var(--calm-blue), var(--joy-glow));
        }

        .volatility-fill {
            width: 40%;
            background: linear-gradient(90deg, var(--stress-red), var(--anxiety-cloud));
        }

        .energy-fill {
            width: 75%;
            background: linear-gradient(90deg, var(--energy-yellow), var(--peak-light));
        }

        .breath-detector {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 120px;
            height: 120px;
            border: 2px solid var(--grid-line);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .breath-detector:hover {
            border-color: var(--calm-blue);
            transform: scale(1.05);
        }

        .breath-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--calm-blue), transparent);
            opacity: 0.3;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.8); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        .tooltip {
            position: absolute;
            background: var(--terrain-deep);
            color: var(--peak-light);
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            border: 1px solid var(--grid-line);
            max-width: 200px;
            line-height: 1.5;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .coping-strategy {
            position: absolute;
            width: 40px;
            height: 40px;
            background: rgba(232, 213, 183, 0.1);
            border: 1px solid var(--peak-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        .coping-strategy.active {
            opacity: 0.8;
            transform: scale(1);
        }

        .coping-strategy:hover {
            opacity: 1;
            transform: scale(1.2);
        }

        .navigation-hint {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--peak-light);
            font-size: 12px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="terrain-container">
        <div class="terrain-layer">
            <div class="mesh-grid"></div>
            <div class="elevation-wave"></div>
            <div class="elevation-wave"></div>
            <div class="elevation-wave"></div>
        </div>
        
        <div class="emotional-peak peak-joy" data-emotion="joy" data-intensity="8"></div>
        <div class="emotional-peak valley-stress" data-emotion="stress" data-intensity="6"></div>
        <div class="emotional-peak plateau-calm" data-emotion="calm" data-intensity="7"></div>
        
        <div class="weather-system">
            <div class="anxiety-cloud"></div>
            <div class="anxiety-cloud"></div>
        </div>
        
        <div class="timeline-river"></div>
        <div class="day-marker" style="left: 14.28%;" data-day="MON"></div>
        <div class="day-marker" style="left: 28.56%;" data-day="TUE"></div>
        <div class="day-marker" style="left: 42.84%;" data-day="WED"></div>
        <div class="day-marker" style="left: 57.12%;" data-day="THU"></div>
        <div class="day-marker" style="left: 71.4%;" data-day="FRI"></div>
        <div class="day-marker" style="left: 85.68%;" data-day="SAT"></div>
    </div>
    
    <div class="control-panel">
        <h2 class="panel-title">Emotional Topography</h2>
        <div class="metric">
            <div class="metric-label">
                <span>Elevation</span>
                <span>65%</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill elevation-fill"></div>
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">
                <span>Volatility</span>
                <span>40%</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill volatility-fill"></div>
            </div>
        </div>
        <div class="metric">
            <div class="metric-label">
                <span>Energy Reserves</span>
                <span>75%</span>
            </div>
            <div class="metric-bar">
                <div class="metric-fill energy-fill"></div>
            </div>
        </div>
    </div>
    
    <div class="breath-detector">
        <div class="breath-circle"></div>
    </div>
    
    <div class="tooltip">Drag across terrain to explore your emotional landscape</div>
    
    <div class="coping-strategy" style="left: 35%; top: 40%;">✧</div>
    <div class="coping-strategy" style="left: 65%; top: 60%;">◈</div>
    <div class="coping-strategy" style="left: 50%; top: 45%;">◉</div>
    
    <div class="navigation-hint">DRAG TO NAVIGATE YOUR EMOTIONAL WEEK</div>
    
    <script>
        const peaks = document.querySelectorAll('.emotional-peak');
        const copingStrategies = document.querySelectorAll('.coping-strategy');
        const breathDetector = document.querySelector('.breath-detector');
        const anxietyClouds = document.querySelectorAll('.anxiety-cloud');
        
        peaks.forEach(peak => {
            peak.addEventListener('click', function() {
                copingStrategies.forEach(strategy => {
                    strategy.classList.add('active');
                    setTimeout(() => {
                        strategy.style.left = (Math.random() * 20 - 10 + parseFloat(this.style.left)) + '%';
                        strategy.style.top = (Math.random() * 20 - 10 + parseFloat(this.style.top)) + '%';
                    }, 100);
                });
            });
        });
        
        breathDetector.addEventListener('click', function() {
            anxietyClouds.forEach(cloud => {
                cloud.style.transition = 'all 2s ease-out';
                cloud.style.opacity = '0';
                cloud.style.transform = 'translateY(-100px)';
                setTimeout(() => {
                    cloud.style.transition = 'all 0.6s ease';
                    cloud.style.opacity = '0.6';
                    cloud.style.transform = 'translateY(0)';
                }, 2000);
            });
        });
        
        let isDragging = false;
        let startX, startY;
        
        document.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (isDragging) {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;
                const waves = document.querySelectorAll('.elevation-wave');
                waves.forEach((wave, index) => {
                    wave.style.transform = `translateX(${deltaX * 0.1 * (index + 1)}px)`;
                });
            }
        });
        
        document.addEventListener('mouseup', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
