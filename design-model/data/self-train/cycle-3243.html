<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>River Schedule</title>
    <style>
        :root {
            --river-blue: #1e3a5f;
            --water-light: #3a7ba8;
            --foam-white: #e8f4f8;
            --bridge-stone: #6b5b73;
            --bridge-shadow: #4a3f52;
            --earth-brown: #8b7355;
            --grass-green: #7a9471;
            --mist-gray: #b8c5d1;
            --current-gold: #d4af37;
            --rapids-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, var(--foam-white) 0%, var(--mist-gray) 100%);
            overflow: hidden;
            position: relative;
        }

        .river-container {
            position: relative;
            width: 100%;
            height: 100%;
            perspective: 1200px;
        }

        .river-surface {
            position: absolute;
            width: 120%;
            height: 400px;
            left: -10%;
            top: 250px;
            background: linear-gradient(45deg, 
                var(--river-blue) 0%, 
                var(--water-light) 30%, 
                var(--river-blue) 60%, 
                var(--water-light) 100%);
            transform: rotateX(65deg) rotateY(-2deg);
            transform-origin: center bottom;
            border-radius: 0 0 50px 50px;
            box-shadow: 
                0 20px 40px rgba(30, 58, 95, 0.4),
                inset 0 -20px 40px rgba(58, 123, 168, 0.3);
        }

        .water-flow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                rgba(255, 255, 255, 0.1) 20px,
                transparent 40px,
                rgba(255, 255, 255, 0.05) 60px
            );
            animation: flow 8s linear infinite;
        }

        @keyframes flow {
            0% { transform: translateX(-60px); }
            100% { transform: translateX(0px); }
        }

        .riverbank {
            position: absolute;
            width: 100%;
            height: 120px;
            background: linear-gradient(180deg, var(--grass-green) 0%, var(--earth-brown) 100%);
        }

        .riverbank.top {
            top: 180px;
            border-radius: 0 0 30px 30px;
        }

        .riverbank.bottom {
            bottom: 180px;
            border-radius: 30px 30px 0 0;
        }

        .schedule-header {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 100;
        }

        .schedule-title {
            font-size: 42px;
            font-weight: 700;
            color: var(--river-blue);
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .schedule-date {
            font-size: 18px;
            color: var(--bridge-stone);
            font-weight: 500;
        }

        .time-markers {
            position: absolute;
            top: 140px;
            left: 100px;
            right: 100px;
            display: flex;
            justify-content: space-between;
            z-index: 50;
        }

        .time-marker {
            font-size: 14px;
            color: var(--bridge-stone);
            font-weight: 600;
            background: var(--foam-white);
            padding: 6px 12px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .bridge {
            position: absolute;
            width: 240px;
            height: 80px;
            background: linear-gradient(135deg, var(--bridge-stone) 0%, var(--bridge-shadow) 100%);
            top: 280px;
            border-radius: 15px 15px 5px 5px;
            transform: perspective(800px) rotateX(25deg);
            box-shadow: 
                0 15px 30px rgba(75, 63, 82, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.2);
            z-index: 80;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .bridge:hover {
            transform: perspective(800px) rotateX(25deg) translateY(-5px);
            box-shadow: 
                0 20px 40px rgba(75, 63, 82, 0.5),
                inset 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .bridge::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 20px;
            background: var(--bridge-shadow);
            top: 100%;
            left: 0;
            border-radius: 0 0 8px 8px;
            transform: perspective(400px) rotateX(-15deg);
        }

        .bridge::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 120px;
            background: linear-gradient(180deg, var(--bridge-stone) 0%, var(--bridge-shadow) 100%);
            left: 20px;
            top: 100%;
            border-radius: 4px;
            box-shadow: 
                200px 0 0 var(--bridge-shadow),
                100px 0 0 var(--bridge-stone);
        }

        .meeting-1 {
            left: 200px;
        }

        .meeting-2 {
            left: 520px;
            width: 180px;
        }

        .meeting-3 {
            left: 820px;
            width: 200px;
        }

        .meeting-4 {
            left: 1100px;
            width: 160px;
        }

        .meeting-info {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
        }

        .meeting-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--foam-white);
            margin-bottom: 4px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .meeting-time {
            font-size: 12px;
            color: var(--mist-gray);
            font-weight: 500;
        }

        .current-time-indicator {
            position: absolute;
            width: 4px;
            height: 600px;
            background: linear-gradient(180deg, var(--current-gold) 0%, transparent 100%);
            left: 680px;
            top: 150px;
            border-radius: 2px;
            box-shadow: 0 0 20px var(--current-gold);
            z-index: 90;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 1; }
        }

        .current-time-indicator::before {
            content: 'NOW';
            position: absolute;
            top: -30px;
            left: -15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--current-gold);
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 8px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(212, 175, 55, 0.3);
        }

        .free-slot {
            position: absolute;
            width: 120px;
            height: 40px;
            background: rgba(255, 255, 255, 0.6);
            top: 300px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--river-blue);
            cursor: pointer;
            z-index: 70;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .free-slot:hover {
            background: rgba(255, 255, 255, 0.8);
            transform: translateY(-3px);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .free-slot-1 { left: 460px; }
        .free-slot-2 { left: 720px; }
        .free-slot-3 { left: 1040px; }

        .water-ripples {
            position: absolute;
            width: 60px;
            height: 60px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            top: 320px;
            animation: ripple 3s ease-out infinite;
        }

        @keyframes ripple {
            0% {
                transform: scale(0.5);
                opacity: 1;
            }
            100% {
                transform: scale(2);
                opacity: 0;
            }
        }

        .ripple-1 { left: 300px; animation-delay: 0s; }
        .ripple-2 { left: 600px; animation-delay: 1s; }
        .ripple-3 { left: 900px; animation-delay: 2s; }

        .add-meeting-btn {
            position: absolute;
            bottom: 60px;
            right: 60px;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--current-gold) 0%, #b8941f 100%);
            border: none;
            border-radius: 50%;
            font-size: 24px;
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
        }

        .add-meeting-btn:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 12px 28px rgba(212, 175, 55, 0.5);
        }

        .schedule-controls {
            position: absolute;
            top: 60px;
            right: 60px;
            display: flex;
            gap: 12px;
            z-index: 100;
        }

        .control-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px solid rgba(30, 58, 95, 0.2);
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            color: var(--river-blue);
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--river-blue);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="river-container">
        <div class="riverbank top"></div>
        <div class="riverbank bottom"></div>
        
        <div class="river-surface">
            <div class="water-flow"></div>
        </div>

        <div class="schedule-header">
            <h1 class="schedule-title">River Schedule</h1>
            <p class="schedule-date">Monday, December 11, 2023</p>
        </div>

        <div class="schedule-controls">
            <button class="control-btn">Week</button>
            <button class="control-btn">Day</button>
            <button class="control-btn">Month</button>
        </div>

        <div class="time-markers">
            <div class="time-marker">9:00</div>
            <div class="time-marker">10:00</div>
            <div class="time-marker">11:00</div>
            <div class="time-marker">12:00</div>
            <div class="time-marker">13:00</div>
            <div class="time-marker">14:00</div>
            <div class="time-marker">15:00</div>
            <div class="time-marker">16:00</div>
            <div class="time-marker">17:00</div>
        </div>

        <div class="current-time-indicator"></div>

        <div class="bridge meeting-1">
            <div class="meeting-info">
                <div class="meeting-title">Team Standup</div>
                <div class="meeting-time">9:00 - 9:30</div>
            </div>
        </div>

        <div class="bridge meeting-2">
            <div class="meeting-info">
                <div class="meeting-title">Design Review</div>
                <div class="meeting-time">11:00 - 12:00</div>
            </div>
        </div>

        <div class="bridge meeting-3">
            <div class="meeting-info">
                <div class="meeting-title">Client Presentation</div>
                <div class="meeting-time">14:00 - 15:00</div>
            </div>
        </div>

        <div class="bridge meeting-4">
            <div class="meeting-info">
                <div class="meeting-title">Sprint Planning</div>
                <div class="meeting-time">16:00 - 17:00</div>
            </div>
        </div>

        <div class="free-slot free-slot-1">Available</div>
        <div class="free-slot free-slot-2">Free Slot</div>
        <div class="free-slot free-slot-3">Open</div>

        <div class="water-ripples ripple-1"></div>
        <div class="water-ripples ripple-2"></div>
        <div class="water-ripples ripple-3"></div>

        <button class="add-meeting-btn">+</button>
    </div>
</body>
</html>
