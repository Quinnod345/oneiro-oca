<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus Presence</title>
    <style>
        :root {
            --focus-active: #007AFF;
            --focus-deep: #5856D6;
            --focus-break: #FF9500;
            --focus-idle: #8E8E93;
            --surface-primary: rgba(255, 255, 255, 0.85);
            --surface-secondary: rgba(242, 242, 247, 0.6);
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #C7C7CC;
            --shadow-subtle: 0 2px 16px rgba(0, 0, 0, 0.12);
            --shadow-elevated: 0 8px 32px rgba(0, 0, 0, 0.16);
            --border-light: rgba(0, 0, 0, 0.04);
            --blur-bg: blur(20px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: linear-gradient(135deg, #F5F7FA 0%, #C3CFE2 100%);
            overflow: hidden;
            position: relative;
        }

        .desktop {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .menu-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: var(--blur-bg);
            border-bottom: 1px solid var(--border-light);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
        }

        .menu-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .apple-logo {
            width: 14px;
            height: 14px;
            background: var(--text-primary);
            mask: url("data:image/svg+xml,%3Csvg viewBox='0 0 814 1000' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76.5 0-103.7 40.8-165.9 40.8s-105.6-57-155.5-127C46.7 790.7 0 663 0 541.8c0-194.4 126.4-297.5 250.8-297.5 65.6 0 120.5 43.9 162.2 43.9 40.8 0 101.7-46.4 177.2-46.4 29.6 0 135.2 2.6 200.6 99.3zm-234-181.5c31.1-36.9 53.1-88.1 53.1-139.3 0-7.1-.6-14.3-1.9-20.1-50.6 1.9-110.8 33.7-147.1 75.8-28.5 32.4-55.1 83.6-55.1 135.5 0 7.8 1.3 15.6 2.6 18.1 4.2.6 10.4 1.3 16.6 1.3 45.4 0 102.5-30.4 131.8-71.3z'/%3E%3C/svg%3E") no-repeat center;
            mask-size: contain;
        }

        .menu-items {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 13px;
            font-weight: 400;
            color: var(--text-primary);
        }

        .menu-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .focus-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--focus-active);
            position: relative;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: focusPulse 4s ease-in-out infinite;
        }

        .focus-indicator::before {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            right: -4px;
            bottom: -4px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.2) 0%, transparent 70%);
            animation: focusRipple 3s ease-in-out infinite;
        }

        .focus-indicator.deep {
            background: var(--focus-deep);
            animation: deepFocusPulse 6s ease-in-out infinite;
        }

        .focus-indicator.break {
            background: var(--focus-break);
            animation: breakPulse 2s ease-in-out infinite;
        }

        .focus-indicator.idle {
            background: var(--focus-idle);
            animation: none;
            opacity: 0.6;
        }

        .menu-time {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .focus-panel {
            position: absolute;
            top: 32px;
            right: 16px;
            width: 320px;
            background: var(--surface-primary);
            backdrop-filter: var(--blur-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-elevated);
            border: 1px solid var(--border-light);
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 999;
        }

        .focus-panel.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: all;
        }

        .focus-header {
            padding: 20px 20px 0 20px;
            border-bottom: 1px solid var(--border-light);
            margin-bottom: 16px;
        }

        .focus-title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .focus-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .focus-states {
            display: flex;
            gap: 12px;
            padding-bottom: 16px;
        }

        .state-option {
            flex: 1;
            padding: 12px;
            background: var(--surface-secondary);
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
        }

        .state-option.active {
            background: rgba(0, 122, 255, 0.1);
            border-color: var(--focus-active);
        }

        .state-option .state-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin: 0 auto 6px;
            background: var(--focus-idle);
        }

        .state-option.active.focus .state-dot { background: var(--focus-active); }
        .state-option.active.deep .state-dot { background: var(--focus-deep); }
        .state-option.active.break .state-dot { background: var(--focus-break); }

        .state-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ambient-display {
            padding: 0 20px 20px 20px;
        }

        .breathing-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            position: relative;
        }

        .breathing-circle .circle {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 122, 255, 0.1) 0%, rgba(0, 122, 255, 0.05) 50%, transparent 70%);
            animation: breathe 4s ease-in-out infinite;
        }

        .breathing-circle .circle:nth-child(2) {
            animation-delay: -1s;
        }

        .breathing-circle .circle:nth-child(3) {
            animation-delay: -2s;
        }

        .focus-status {
            text-align: center;
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .status-subtext {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @keyframes focusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes deepFocusPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            33% { transform: scale(1.05); opacity: 0.9; }
            66% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes breakPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.6; }
        }

        @keyframes focusRipple {
            0% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(0.9); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.1; }
        }
    </style>
</head>
<body>
    <div class="desktop">
        <div class="menu-bar">
            <div class="menu-left">
                <div class="apple-logo"></div>
                <div class="menu-items">
                    <span>Focus</span>
                    <span>File</span>
                    <span>Edit</span>
                    <span>View</span>
                    <span>Window</span>
                    <span>Help</span>
                </div>
            </div>
            <div class="menu-right">
                <div class="focus-indicator" id="focusIndicator"></div>
                <div class="menu-time" id="menuTime">2:47 PM</div>
            </div>
        </div>

        <div class="focus-panel" id="focusPanel">
            <div class="focus-header">
                <div class="focus-title">Focus Presence</div>
                <div class="focus-subtitle">Ambient awareness of your flow state</div>
                <div class="focus-states">
                    <div class="state-option active focus" data-state="focus">
                        <div class="state-dot"></div>
                        <div class="state-label">Focus</div>
                    </div>
                    <div class="state-option deep" data-state="deep">
                        <div class="state-dot"></div>
                        <div class="state-label">Deep</div>
                    </div>
                    <div class="state-option break" data-state="break">
                        <div class="state-dot"></div>
                        <div class="state-label">Break</div>
                    </div>
                </div>
            </div>
            
            <div class="ambient-display">
                <div class="breathing-circle">
                    <div class="circle"></div>
                    <div class="circle"></div>
                    <div class="circle"></div>
                </div>
                <div class="focus-status">
                    <div class="status-text">In Flow</div>
                    <div class="status-subtext">Present and engaged</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const focusIndicator = document.getElementById('focusIndicator');
        const focusPanel = document.getElementById('focusPanel');
        const stateOptions = document.querySelectorAll('.state-option');
        const statusText = document.querySelector('.status-text');
        const statusSubtext = document.querySelector('.status-subtext');
        
        let panelVisible = false;
        
        focusIndicator.addEventListener('click', () => {
            panelVisible = !panelVisible;
            focusPanel.classList.toggle('visible', panelVisible);
        });
        
        document.addEventListener('click', (e) => {
            if (!focusPanel.contains(e.target) && !focusIndicator.contains(e.target)) {
                panelVisible = false;
                focusPanel.classList.remove('visible');
            }
        });
        
        const states = {
            focus: { 
                text: 'In Flow', 
                subtext: 'Present and engaged',
                class: 'focus' 
            },
            deep: { 
                text: 'Deep Focus', 
                subtext: 'Immersed in complex work',
                class: 'deep' 
            },
            break: { 
                text: 'Taking Break', 
                subtext: 'Recharging energy',
                class: 'break' 
            }
        };
        
        stateOptions.forEach(option => {
            option.addEventListener('click', () => {
                const state = option.dataset.state;
                
                stateOptions.forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                
                focusIndicator.className = `focus-indicator ${states[state].class}`;
                statusText.textContent = states[state].text;
                statusSubtext.textContent = states[state].subtext;
            });
        });
        
        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: 'numeric', 
                minute: '2-digit',
                hour12: true 
            });
            document.getElementById('menuTime').textContent = time;
        }
        
        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
