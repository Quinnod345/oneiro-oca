<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=900">
    <title>Memory Decay Archive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');
        
        :root {
            --void: #0a0a0a;
            --glass-edge: #f8f9fa;
            --fracture: #e3e7eb;
            --dust: #9ca3af;
            --ember: #fbbf24;
            --ice: #60a5fa;
            --moss: #34d399;
            --wine: #f472b6;
            --grid-size: 120px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            overflow: hidden;
            background: var(--void);
            font-family: 'Crimson Pro', serif;
            position: relative;
            cursor: crosshair;
            display: grid;
            grid-template-columns: repeat(12, var(--grid-size));
            grid-template-rows: repeat(7, var(--grid-size));
            gap: 0;
            padding: 30px;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(248, 249, 250, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(248, 249, 250, 0.02) 1px, transparent 1px);
            background-size: var(--grid-size) var(--grid-size);
            pointer-events: none;
            opacity: 0;
            transition: opacity 2s ease;
        }

        body:hover::before {
            opacity: 1;
        }

        #particle-field {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .memory-container {
            grid-column: span 2;
            grid-row: span 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: fade-in 0.8s ease-out forwards;
            animation-delay: var(--delay, 0s);
        }

        .memory-shard {
            position: absolute;
            transform-origin: center;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .memory-shard::before {
            content: '';
            position: absolute;
            inset: -20px;
            background: radial-gradient(circle, transparent 40%, rgba(248, 249, 250, 0.03) 70%, transparent 100%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .memory-shard:hover::before {
            opacity: 1;
        }

        .memory-content {
            position: relative;
            padding: 20px;
            background: rgba(248, 249, 250, 0.02);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(248, 249, 250, 0.05);
            transition: all 0.6s ease;
            clip-path: polygon(
                0 0,
                calc(100% - 10px) 0,
                100% 10px,
                100% 100%,
                10px 100%,
                0 calc(100% - 10px)
            );
        }

        .memory-shard.decaying .memory-content {
            animation: fragment 20s ease-in-out forwards;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fragment {
            0% {
                clip-path: polygon(
                    0 0,
                    calc(100% - 10px) 0,
                    100% 10px,
                    100% 100%,
                    10px 100%,
                    0 calc(100% - 10px)
                );
                opacity: 1;
                filter: blur(0);
            }
            50% {
                clip-path: polygon(
                    5% 5%,
                    calc(95% - 10px) 2%,
                    98% 15px,
                    95% 95%,
                    15px 98%,
                    2% calc(95% - 10px)
                );
                opacity: 0.7;
                filter: blur(0.5px);
            }
            100% {
                clip-path: polygon(
                    20% 20%,
                    calc(60% - 10px) 25%,
                    65% 30px,
                    60% 60%,
                    30px 65%,
                    25% calc(60% - 10px)
                );
                opacity: 0;
                filter: blur(3px);
                transform: scale(0.8);
            }
        }

        .thought-text {
            font-size: 16px;
            color: var(--glass-edge);
            opacity: 0.9;
            text-align: center;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.03em;
            line-height: 1.6;
            max-width: 200px;
        }

        .fracture-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .fracture-lines::before,
        .fracture-lines::after {
            content: '';
            position: absolute;
            background: linear-gradient(45deg, transparent 48%, var(--fracture) 49%, var(--fracture) 51%, transparent 52%);
            opacity: 0;
            transition: opacity 3s ease;
        }

        .memory-shard.decaying .fracture-lines::before,
        .memory-shard.decaying .fracture-lines::after {
            opacity: 0.3;
        }

        .fracture-lines::before {
            inset: 0;
            transform: rotate(15deg);
        }

        .fracture-lines::after {
            inset: 0;
            transform: rotate(-20deg);
        }

        .dust-particle {
            position: absolute;
            width: 1px;
            height: 1px;
            background: var(--dust);
            pointer-events: none;
            opacity: 0;
        }

        .dissolve {
            animation: particle-float 4s ease-out forwards;
        }

        @keyframes particle-float {
            0% {
                opacity: 0.4;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--float-x), var(--float-y)) scale(0);
            }
        }

        #archive-title {
            position: fixed;
            bottom: 40px;
            right: 40px;
            font-size: 12px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--dust);
            opacity: 0.4;
            font-weight: 300;
        }

        #input-portal {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 300px;
            opacity: 0;
            animation: fade-in 1s ease-out forwards;
            animation-delay: 0.5s;
        }

        #thought-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--glass-edge);
            font-family: 'Crimson Pro', serif;
            font-size: 18px;
            font-weight: 300;
            padding: 20px 0;
            outline: none;
            position: relative;
            transition: all 0.3s ease;
        }

        #thought-input::placeholder {
            color: rgba(248, 249, 250, 0.3);
            font-style: italic;
        }

        #thought-input::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--glass-edge);
            transition: width 0.3s ease;
        }

        #thought-input:focus::after {
            width: 100%;
        }

        .input-hint {
            font-size: 12px;
            color: rgba(248, 249, 250, 0.4);
            margin-top: 10px;
            font-style: italic;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #input-portal:hover .input-hint {
            opacity: 1;
        }

        .crystallizing {
            position: relative;
            overflow: hidden;
        }

        .crystallizing::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle, rgba(248, 249, 250, 0.1) 0%, transparent 70%);
            animation: pulse 2s ease-out;
        }

        @keyframes pulse {
            from {
                transform: scale(0);
                opacity: 1;
            }
            to {
                transform: scale(2);
                opacity: 0;
            }
        }

        #grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: 
                repeating-linear-gradient(0deg, transparent, transparent calc(var(--grid-size) - 1px), rgba(248, 249, 250, 0.02) var(--grid-size)),
                repeating-linear-gradient(90deg, transparent, transparent calc(var(--grid-size) - 1px), rgba(248, 249, 250, 0.02) var(--grid-size));
        }
    </style>
</head>
<body>
    <div id="grid-overlay"></div>
    <canvas id="particle-field"></canvas>
    
    <div id="input-portal">
        <input type="text" id="thought-input" placeholder="hold to crystallize memory" maxlength="50">
        <div class="input-hint">press and hold to preserve</div>
    </div>
    
    <div id="archive-title">memory · decay · archive</div>
    
    <script>
        const thoughtInput = document.getElementById('thought-input');
        const body = document.body;
        const particleCanvas = document.getElementById('particle-field');
        const ctx = particleCanvas.getContext('2d');
        
        particleCanvas.width = 1440;
        particleCanvas.height = 900;
        
        let memories = [];
        let gridPositions = [];
        for (let i = 0; i < 84; i++) {
            gridPositions.push({ used: false, index: i });
        }
        
        let holdTimer = null;
        let isHolding = false;
        let holdProgress = 0;
        
        thoughtInput.addEventListener('mousedown', startHold);
        thoughtInput.addEventListener('mouseup', endHold);
        thoughtInput.addEventListener('mouseleave', endHold);
        thoughtInput.addEventListener('touchstart', startHold);
        thoughtInput.addEventListener('touchend', endHold);
        
        function startHold() {
            if (thoughtInput.value.trim() === '') return;
            
            isHolding = true;
            thoughtInput.classList.add('crystallizing');
            
            holdTimer = setTimeout(() => {
                crystallizeMemory(thoughtInput.value.trim());
                thoughtInput.value = '';
                thoughtInput.classList.remove('crystallizing');
            }, 2000);
        }
        
        function endHold() {
            isHolding = false;
            clearTimeout(holdTimer);
            thoughtInput.classList.remove('crystallizing');
        }
        
        function crystallizeMemory(text) {
            const availablePositions = gridPositions.filter(pos => !pos.used);
            if (availablePositions.length === 0) return;
            
            const position = availablePositions[Math.floor(Math.random() * availablePositions.length)];
            position.used = true;
            
            const container = document.createElement('div');
            container.className = 'memory-container';
            container.style.setProperty('--delay', Math.random() * 0.5 + 's');
            
            const gridX = position.index % 12;
            const gridY = Math.floor(position.index / 12);
            container.style.gridColumn = `${gridX + 1} / span 2`;
            container.style.gridRow = `${gridY + 1} / span 1`;
            
            const memoryShard = document.createElement('div');
            memoryShard.className = 'memory-shard';
            
            const memoryContent = document.createElement('div');
            memoryContent.className = 'memory-content';
            
            const thoughtText = document.createElement('div');
            thoughtText.className = 'thought-text';
            thoughtText.textContent = text;
            
            const fractureLines = document.createElement('div');
            fractureLines.className = 'fracture-lines';
            
            memoryContent.appendChild(thoughtText);
            memoryShard.appendChild(memoryContent);
            memoryShard.appendChild(fractureLines);
            container.appendChild(memoryShard);
            
            body.insertBefore(container, body.firstChild);
            
            const decayTime = 8000 + Math.random() * 12000;
            setTimeout(() => {
                memoryShard.classList.add('decaying');
                createDustParticles(memoryShard);
                
                setTimeout(() => {
                    container.remove();
                    position.used = false;
                }, 20000);
            }, decayTime);
            
            memories.push({ element: memoryShard, text, position });
        }
        
        function createDustParticles(element) {
            const rect = element.getBoundingClientRect();
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    const particle = document.createElement('div');
                    particle.className = 'dust-particle dissolve';
                    
                    const x = rect.left + Math.random() * rect.width;
                    const y = rect.top + Math.random() * rect.height;
                    
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.setProperty('--float-x', (Math.random() - 0.5) * 100 + 'px');
                    particle.style.setProperty('--float-y', (Math.random() - 0.5) * 100 - 50 + 'px');
                    
                    body.appendChild(particle);
                    
                    setTimeout(() => particle.remove(), 4000);
                }, i * 100);
            }
        }
        
        // Initialize with sample memories
        setTimeout(() => {
            crystallizeMemory('fragments of yesterday');
        }, 1000);
        
        setTimeout(() => {
            crystallizeMemory('echoes in the void');
        }, 2000);
        
        setTimeout(() => {
            crystallizeMemory('dissolving certainties');
        }, 3000);
    </script>
</body>
</html>
