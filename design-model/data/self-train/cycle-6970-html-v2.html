<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Decay Calculator</title>
    <style>
        :root {
            --void: #0a0a0b;
            --ash: #1a1a1c;
            --bone: #e8e4e1;
            --ember: #ff6b4a;
            --fade: #767676;
            --ghost: rgba(255, 255, 255, 0.03);
            --corruption: #ff00ff;
            --decay-1: rgba(255, 107, 74, 0.1);
            --decay-2: rgba(255, 107, 74, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: var(--void);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--bone);
            position: relative;
            height: 100vh;
        }

        .main-interface {
            display: grid;
            grid-template-columns: minmax(280px, 320px) 1fr minmax(240px, 280px);
            height: 100vh;
            position: relative;
            max-width: 100vw;
        }

        @media (max-width: 768px) {
            .main-interface {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr auto;
            }
        }

        .memory-input {
            background: var(--ash);
            border-right: 1px solid var(--ghost);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
            overflow-x: hidden;
        }

        @media (max-width: 768px) {
            .memory-input {
                border-right: none;
                border-bottom: 1px solid var(--ghost);
                padding: 2rem 1.5rem;
            }
        }

        .input-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--fade);
            margin-bottom: 1.5rem;
        }

        .memory-field {
            position: relative;
        }

        .memory-textarea {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--fade);
            color: var(--bone);
            font-size: 1.125rem;
            line-height: 1.6;
            padding: 0.75rem 0;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
            cursor: text;
        }

        .memory-textarea:focus {
            border-bottom-color: var(--ember);
        }

        .memory-label {
            position: absolute;
            left: 0;
            top: 0.75rem;
            font-size: 0.875rem;
            color: var(--fade);
            transition: all 0.3s;
            pointer-events: none;
        }

        .memory-textarea:focus + .memory-label,
        .memory-textarea:not(:placeholder-shown) + .memory-label {
            top: -1rem;
            font-size: 0.75rem;
            color: var(--ember);
        }

        .decay-factors {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .factor {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .factor-label {
            font-size: 0.875rem;
            color: var(--fade);
        }

        .factor-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 2px;
            background: var(--fade);
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .factor-slider:hover {
            opacity: 1;
        }

        .factor-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--ember);
            cursor: pointer;
            border-radius: 50%;
        }

        .factor-value {
            font-size: 0.75rem;
            color: var(--ember);
            text-align: right;
        }

        .visualization-area {
            position: relative;
            background: var(--void);
            overflow: hidden;
        }

        .memory-organism {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .memory-core {
            position: relative;
            width: min(400px, 80vw);
            height: min(400px, 80vw);
            filter: blur(0px);
            transition: filter 0.5s;
        }

        .memory-fragment {
            position: absolute;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, var(--ember) 0%, transparent 70%);
            border-radius: 50%;
            opacity: 0.8;
            filter: blur(1px);
            transition: all 0.8s ease-in-out;
        }

        .memory-fragment[data-decay="low"] {
            transform: scale(1);
            opacity: 0.8;
        }

        .memory-fragment[data-decay="medium"] {
            transform: scale(0.7);
            opacity: 0.5;
        }

        .memory-fragment[data-decay="high"] {
            transform: scale(0.4);
            opacity: 0.2;
        }

        .memory-fragment:nth-child(1) { top: 10%; left: 10%; }
        .memory-fragment:nth-child(2) { top: 10%; right: 10%; }
        .memory-fragment:nth-child(3) { bottom: 10%; left: 10%; }
        .memory-fragment:nth-child(4) { bottom: 10%; right: 10%; }
        .memory-fragment:nth-child(5) { top: 50%; left: 50%; transform: translate(-50%, -50%); }

        .memory-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            color: var(--bone);
            text-align: center;
            padding: 2rem;
            max-width: 300px;
            opacity: 1;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .preservation-panel {
            background: var(--ash);
            border-left: 1px solid var(--ghost);
            padding: 3rem 2rem;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .preservation-panel {
                border-left: none;
                border-top: 1px solid var(--ghost);
                padding: 2rem 1.5rem;
            }
        }

        .decay-result {
            text-align: center;
            padding: 2rem 0;
        }

        .decay-percentage {
            font-size: 3rem;
            font-weight: 300;
            color: var(--ember);
            margin-bottom: 0.5rem;
        }

        .decay-label {
            font-size: 0.875rem;
            color: var(--fade);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .timeline-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--fade);
            margin-bottom: 1rem;
        }

        .timeline-entry {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: var(--ghost);
            border-radius: 4px;
            transition: background 0.3s;
        }

        .timeline-entry:hover {
            background: var(--decay-2);
        }

        .timeline-marker {
            width: 8px;
            height: 8px;
            background: var(--ember);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .timeline-content {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            flex: 1;
        }

        .timeline-time {
            font-size: 0.875rem;
            color: var(--fade);
        }

        .timeline-retention {
            font-size: 1rem;
            color: var(--bone);
        }

        .action-button {
            background: var(--ember);
            border: none;
            color: var(--void);
            padding: 1rem 2rem;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
            font-weight: 500;
        }

        .action-button:hover {
            background: var(--bone);
            transform: translateY(-1px);
        }

        .action-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="main-interface">
        <section class="memory-input">
            <h1 class="input-title">Memory Inscription</h1>
            
            <div class="memory-field">
                <textarea class="memory-textarea" id="memory-text" placeholder=" " rows="4"></textarea>
                <label class="memory-label" for="memory-text">What do you wish to remember?</label>
            </div>
            
            <div class="decay-factors">
                <div class="factor">
                    <label class="factor-label" for="importance">Emotional Weight</label>
                    <input type="range" class="factor-slider" id="importance" min="0" max="100" value="50">
                    <span class="factor-value" id="importance-value">50%</span>
                </div>
                
                <div class="factor">
                    <label class="factor-label" for="repetition">Repetition Cycles</label>
                    <input type="range" class="factor-slider" id="repetition" min="0" max="100" value="30">
                    <span class="factor-value" id="repetition-value">30%</span>
                </div>
                
                <div class="factor">
                    <label class="factor-label" for="association">Neural Associations</label>
                    <input type="range" class="factor-slider" id="association" min="0" max="100" value="40">
                    <span class="factor-value" id="association-value">40%</span>
                </div>
            </div>
            
            <button class="action-button" onclick="calculateDecay()">Simulate Decay</button>
        </section>
        
        <section class="visualization-area">
            <div class="memory-organism">
                <div class="memory-core" id="memory-core">
                    <div class="memory-fragment" data-decay="low"></div>
                    <div class="memory-fragment" data-decay="low"></div>
                    <div class="memory-fragment" data-decay="low"></div>
                    <div class="memory-fragment" data-decay="low"></div>
                    <div class="memory-fragment" data-decay="low"></div>
                    <div class="memory-text" id="memory-display"></div>
                </div>
            </div>
        </section>
        
        <section class="preservation-panel">
            <h2 class="input-title">Decay Analysis</h2>
            
            <div class="decay-result">
                <div class="decay-percentage" id="decay-rate">0%</div>
                <div class="decay-label">Initial Decay Rate</div>
            </div>
            
            <div class="timeline">
                <h3 class="timeline-title">Retention Timeline</h3>
                
                <div class="timeline-entry">
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <span class="timeline-time">1 hour</span>
                        <span class="timeline-retention" id="retention-1h">100%</span>
                    </div>
                </div>
                
                <div class="timeline-entry">
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <span class="timeline-time">1 day</span>
                        <span class="timeline-retention" id="retention-1d">100%</span>
                    </div>
                </div>
                
                <div class="timeline-entry">
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <span class="timeline-time">1 week</span>
                        <span class="timeline-retention" id="retention-1w">100%</span>
                    </div>
                </div>
                
                <div class="timeline-entry">
                    <div class="timeline-marker"></div>
                    <div class="timeline-content">
                        <span class="timeline-time">1 month</span>
                        <span class="timeline-retention" id="retention-1m">100%</span>
                    </div>
                </div>
            </div>
        </section>
    </div>
    
    <script>
        // Update slider values
        document.querySelectorAll('.factor-slider').forEach(slider => {
            const updateValue = () => {
                const valueDisplay = document.getElementById(slider.id + '-value');
                valueDisplay.textContent = slider.value + '%';
            };
            slider.addEventListener('input', updateValue);
        });
        
        // Update memory display
        document.getElementById('memory-text').addEventListener('input', (e) => {
            document.getElementById('memory-display').textContent = e.target.value;
        });
        
        function calculateDecay() {
            const importance = parseInt(document.getElementById('importance').value);
            const repetition = parseInt(document.getElementById('repetition').value);
            const association = parseInt(document.getElementById('association').value);
            
            // Calculate composite decay rate
            const decayRate = 100 - (importance * 0.4 + repetition * 0.3 + association * 0.3);
            
            // Update decay percentage
            document.getElementById('decay-rate').textContent = Math.round(decayRate) + '%';
            
            // Calculate retention over time
            const retentions = {
                '1h': 100 - (decayRate * 0.1),
                '1d': 100 - (decayRate * 0.4),
                '1w': 100 - (decayRate * 0.7),
                '1m': 100 - (decayRate * 0.9)
            };
            
            // Update timeline
            Object.entries(retentions).forEach(([time, value]) => {
                document.getElementById(`retention-${time}`).textContent = Math.round(value) + '%';
            });
            
            // Update visual decay
            const fragments = document.querySelectorAll('.memory-fragment');
            fragments.forEach((fragment, index) => {
                const decayLevel = decayRate > 70 ? 'high' : decayRate > 40 ? 'medium' : 'low';
                fragment.setAttribute('data-decay', decayLevel);
            });
            
            // Update text opacity
            const textDisplay = document.getElementById('memory-display');
            textDisplay.style.opacity = (100 - decayRate) / 100;
            
            // Update core blur
            const core = document.getElementById('memory-core');
            core.style.filter = `blur(${decayRate / 20}px)`;
        }
    </script>
</body>
</html>
