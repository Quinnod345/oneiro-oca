<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoneme Archive</title>
    <style>
        :root {
            --void: #0a0e1a;
            --glass: rgba(255, 255, 255, 0.08);
            --frost: rgba(255, 255, 255, 0.04);
            --crack: rgba(255, 255, 255, 0.2);
            --constellation: #e0f4ff;
            --extinct: #3a4558;
            --sediment: #1a2234;
            --glow: #a6d8ff;
            --whisper: rgba(166, 216, 255, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--void);
            color: white;
            font-family: Georgia, serif;
            overflow: hidden;
            height: 100vh;
            cursor: grab;
            position: relative;
        }

        body:active {
            cursor: grabbing;
        }

        .snow-globe {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 1200px;
        }

        .globe-interior {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: subtle-drift 30s infinite ease-in-out;
        }

        @keyframes subtle-drift {
            0%, 100% { transform: rotateY(0deg) rotateX(0deg); }
            50% { transform: rotateY(10deg) rotateX(5deg); }
        }

        .shake-active .globe-interior {
            animation: shake 0.5s ease-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0) translateY(0) rotateZ(0); }
            20% { transform: translateX(-20px) translateY(10px) rotateZ(-5deg); }
            40% { transform: translateX(20px) translateY(-15px) rotateZ(3deg); }
            60% { transform: translateX(-10px) translateY(5px) rotateZ(-2deg); }
            80% { transform: translateX(5px) translateY(-5px) rotateZ(1deg); }
        }

        .phoneme-field {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .phoneme-orb {
            position: absolute;
            transform-style: preserve-3d;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orb-container {
            width: 80px;
            height: 80px;
            position: relative;
            transform: translateZ(var(--depth, 0));
            animation: float var(--float-time, 8s) infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateZ(var(--depth, 0)) translateY(0); }
            50% { transform: translateZ(var(--depth, 0)) translateY(-20px); }
        }

        .orb-glass {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                var(--glass) 0%, 
                transparent 50%);
            border: 1px solid var(--frost);
            box-shadow: 
                inset -10px -10px 20px rgba(0, 0, 0, 0.3),
                inset 10px 10px 20px rgba(255, 255, 255, 0.05),
                0 0 40px var(--whisper);
            position: relative;
            overflow: hidden;
        }

        .orb-glass::before {
            content: '';
            position: absolute;
            top: 10%;
            left: 20%;
            width: 30%;
            height: 30%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            border-radius: 50%;
            filter: blur(5px);
        }

        .phoneme-symbol {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 300;
            color: var(--constellation);
            text-shadow: 0 0 10px var(--glow);
        }

        .crack {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .crack-line {
            position: absolute;
            background: var(--crack);
            transform-origin: center;
        }

        .crack-line:nth-child(1) {
            width: 2px;
            height: 60%;
            top: 20%;
            left: 50%;
            transform: translateX(-50%) rotate(15deg);
        }

        .crack-line:nth-child(2) {
            width: 40%;
            height: 2px;
            top: 40%;
            left: 30%;
            transform: rotate(-20deg);
        }

        .crack-line:nth-child(3) {
            width: 2px;
            height: 30%;
            top: 35%;
            left: 65%;
            transform: rotate(45deg);
        }

        .recording .crack {
            opacity: 1;
        }

        .constellation-line {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--constellation), transparent);
            height: 1px;
            transform-origin: left center;
            opacity: 0;
            transition: opacity 1s;
        }

        .constellation-active {
            opacity: 0.6;
        }

        .sediment-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 200px;
            background: linear-gradient(to top, 
                var(--sediment) 0%, 
                transparent 100%);
            pointer-events: none;
        }

        .extinct-phoneme {
            position: absolute;
            width: 60px;
            height: 60px;
            bottom: var(--sediment-depth, 20px);
            left: var(--sediment-x, 50%);
            transform: translateX(-50%);
            opacity: 0.4;
            transition: all 0.3s;
        }

        .extinct-crystal {
            width: 100%;
            height: 100%;
            background: var(--extinct);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
            position: relative;
        }

        .extinct-crystal::before {
            content: attr(data-phoneme);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            opacity: 0.6;
        }

        .extinct-phoneme:hover {
            transform: translateX(-50%) translateY(-10px);
            opacity: 0.8;
            cursor: pointer;
        }

        .excavation-tool {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .excavating .excavation-tool {
            opacity: 1;
        }

        .excavation-brush {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b6914, #d4a017);
            clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
            transform: rotate(45deg);
        }

        .language-info {
            position: absolute;
            top: 40px;
            left: 40px;
            max-width: 300px;
        }

        .language-name {
            font-size: 32px;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .speaker-count {
            font-size: 14px;
            opacity: 0.6;
            font-style: italic;
        }

        .recording-interface {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .record-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 2px solid var(--constellation);
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .record-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            background: var(--constellation);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s;
        }

        .record-button:hover {
            background: rgba(166, 216, 255, 0.1);
        }

        .recording-active .record-button::before {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            background: #ff4444;
        }

        .waveform {
            width: 200px;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .wave-bar {
            flex: 1;
            background: var(--constellation);
            opacity: 0.3;
            height: 20%;
            transition: height 0.1s;
        }

        .recording-active .wave-bar {
            animation: wave 0.5s infinite ease-in-out;
            animation-delay: calc(var(--i) * 0.1s);
            opacity: 0.8;
        }

        @keyframes wave {
            0%, 100% { height: 20%; }
            50% { height: var(--wave-height, 80%); }
        }

        .snow-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .snow-flake {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            opacity: 0.6;
            animation: snow-fall linear infinite;
        }

        @keyframes snow-fall {
            from {
                transform: translateY(-100vh) translateX(0);
            }
            to {
                transform: translateY(100vh) translateX(100px);
            }
        }

        .globe-reflection {
            position: absolute;
            top: 10%;
            left: 20%;
            width: 60%;
            height: 30%;
            background: radial-gradient(ellipse, rgba(255, 255, 255, 0.1), transparent);
            border-radius: 50%;
            transform: rotate(-15deg);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="snow-globe">
        <div class="globe-interior">
            <div class="phoneme-field" id="phonemeField">
                <!-- Phoneme orbs will be dynamically generated -->
            </div>
            
            <div class="sediment-layer">
                <div class="extinct-phoneme" style="--sediment-depth: 30px; --sediment-x: 20%;">
                    <div class="extinct-crystal" data-phoneme="ɮ"></div>
                </div>
                <div class="extinct-phoneme" style="--sediment-depth: 50px; --sediment-x: 45%;">
                    <div class="extinct-crystal" data-phoneme="ʡ"></div>
                </div>
                <div class="extinct-phoneme" style="--sediment-depth: 40px; --sediment-x: 70%;">
                    <div class="extinct-crystal" data-phoneme="ǃ"></div>
                </div>
            </div>
        </div>
        
        <div class="snow-particles" id="snowParticles"></div>
        <div class="globe-reflection"></div>
    </div>

    <div class="language-info">
        <h1 class="language-name">Ainu</h1>
        <p class="speaker-count">~10 native speakers remaining</p>
    </div>

    <div class="recording-interface">
        <button class="record-button" id="recordButton"></button>
        <div class="waveform">
            <div class="wave-bar" style="--i: 0; --wave-height: 60%;"></div>
            <div class="wave-bar" style="--i: 1; --wave-height: 80%;"></div>
            <div class="wave-bar" style="--i: 2; --wave-height: 40%;"></div>
            <div class="wave-bar" style="--i: 3; --wave-height: 90%;"></div>
            <div class="wave-bar" style="--i: 4; --wave-height: 70%;"></div>
            <div class="wave-bar" style="--i: 5; --wave-height: 50%;"></div>
            <div class="wave-bar" style="--i: 6; --wave-height: 85%;"></div>
            <div class="wave-bar" style="--i: 7; --wave-height: 45%;"></div>
        </div>
    </div>

    <div class="excavation-tool" id="excavationTool">
        <div class="excavation-brush"></div>
    </div>

    <script>
        const phonemes = ['p', 't', 'k', 'ʔ', 'm', 'n', 'r', 'w', 'j', 'a', 'i', 'u', 'e', 'o'];
        const phonemeField = document.getElementById('phonemeField');
        const recordButton = document.getElementById('recordButton');
        const excavationTool = document.getElementById('excavationTool');
        const snowParticles = document.getElementById('snowParticles');
        
        // Create phoneme orbs
        phonemes.forEach((phoneme, index) => {
            const orb = document.createElement('div');
            orb.className = 'phoneme-orb';
            orb.style.left = `${20 + (index % 5) * 20}%`;
            orb.style.top = `${20 + Math.floor(index / 5) * 25}%`;
            orb.style.setProperty('--depth', `${Math.random() * 200 - 100}px`);
            orb.style.setProperty('--float-time', `${6 + Math.random() * 4}s`);
            
            orb.innerHTML = `
                <div class="orb-container">
                    <div class="orb-glass">
                        <span class="phoneme-symbol">${phoneme}</span>
                        <div class="crack">
                            <div class="crack-line"></div>
                            <div class="crack-line"></div>
                            <div class="crack-line"></div>
                        </div>
                    </div>
                </div>
            `;
            
            phonemeField.appendChild(orb);
        });
        
        // Create constellation lines
        const orbs = document.querySelectorAll('.phoneme-orb');
        for (let i = 0; i < orbs.length - 1; i++) {
            if (Math.random() > 0.6) {
                const line = document.createElement('div');
                line.className = 'constellation-line';
                const rect1 = orbs[i].getBoundingClientRect();
                const rect2 = orbs[i + 1].getBoundingClientRect();
                const dx = rect2.left - rect1.left;
                const dy = rect2.top - rect1.top;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx) * (180 / Math.PI);
                
                line.style.width = `${distance}px`;
                line.style.left = `${rect1.left + 40}px`;
                line.style.top = `${rect1.top + 40}px`;
                line.style.transform = `rotate(${angle}deg)`;
                
                phonemeField.appendChild(line);
            }
        }
        
        // Create snow particles
        for (let i = 0; i < 50; i++) {
            const flake = document.createElement('div');
            flake.className = 'snow-flake';
            flake.style.left = `${Math.random() * 100}%`;
            flake.style.animationDuration = `${10 + Math.random() * 20}s`;
            flake.style.animationDelay = `${Math.random() * 10}s`;
            flake.style.opacity = Math.random() * 0.6 + 0.2;
            snowParticles.appendChild(flake);
        }
        
        // Shake detection
        let lastX = null, lastY = null, lastTime = null;
        let shakeThreshold = 15;
        
        document.addEventListener('mousemove', (e) => {
            const currentTime = new Date().getTime();
            
            if (lastTime && currentTime - lastTime > 50) {
                const deltaX = Math.abs(e.clientX - lastX);
                const deltaY = Math.abs(e.clientY - lastY);
                const speed = Math.sqrt(deltaX * deltaX + deltaY * deltaY) / (currentTime - lastTime);
                
                if (speed > shakeThreshold) {
                    document.body.classList.add('shake-active');
                    
                    // Rearrange phonemes
                    orbs.forEach(orb => {
                        orb.style.left = `${Math.random() * 80 + 10}%`;
                        orb.style.top = `${Math.random() * 60 + 20}%`;
                    });
                    
                    // Show constellation lines
                    document.querySelectorAll('.constellation-line').forEach(line => {
                        line.classList.add('constellation-active');
                        setTimeout(() => line.classList.remove('constellation-active'), 2000);
                    });
                    
                    setTimeout(() => document.body.classList.remove('shake-active'), 500);
                }
            }
            
            lastX = e.clientX;
            lastY = e.clientY;
            lastTime = currentTime;
        });
        
        // Recording functionality
        recordButton.addEventListener('click', () => {
            document.body.classList.toggle('recording-active');
            
            if (document.body.classList.contains('recording-active')) {
                // Crack random orbs
                const randomOrbs = Array.from(orbs).sort(() => 0.5 - Math.random()).slice(0, 3);
                randomOrbs.forEach(orb => {
                    orb.querySelector('.orb-container').classList.add('recording');
                });
            } else {
                document.querySelectorAll('.recording').forEach(el => {
                    el.classList.remove('recording');
                });
            }
        });
        
        // Excavation interaction
        document.querySelectorAll('.extinct-phoneme').forEach(extinct => {
            extinct.addEventListener('mouseenter', () => {
                document.body.classList.add('excavating');
            });
            
            extinct.addEventListener('mouseleave', () => {
                document.body.classList.remove('excavating');
            });
            
            extinct.addEventListener('click', () => {
                // Play sound effect (simulated)
                extinct.style.transform = 'translateX(-50%) translateY(-20px) scale(1.1)';
                setTimeout(() => {
                    extinct.style.transform = 'translateX(-50%) translateY(0) scale(1)';
                }, 300);
            });
        });
        
        // Move excavation tool with mouse
        document.addEventListener('mousemove', (e) => {
            excavationTool.style.left = e.clientX + 'px';
            excavationTool.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
