<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Habits</title>
    <style>
        :root {
            --earth-deep: #2d3016;
            --earth-rich: #4a5128;
            --earth-light: #6b7539;
            --grass-fresh: #7eb069;
            --grass-bright: #9bc53d;
            --sky-pale: #e8f4fd;
            --sky-soft: #d1e7f0;
            --water-blue: #4a90b8;
            --stem-green: #5d8a3a;
            --bloom-pink: #e85a4f;
            --bloom-purple: #9b4d96;
            --bloom-yellow: #f4b942;
            --bloom-orange: #e07a5f;
            --wilt-brown: #8b6914;
            --shadow-soft: rgba(45, 48, 22, 0.15);
            --shadow-deep: rgba(45, 48, 22, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
            width: 1440px;
            height: 900px;
            background: linear-gradient(135deg, var(--sky-pale) 0%, var(--sky-soft) 100%);
            overflow: hidden;
            position: relative;
        }

        .garden-container {
            width: 100%;
            height: 100%;
            position: relative;
            background: 
                radial-gradient(ellipse at bottom, var(--earth-light) 0%, var(--earth-rich) 50%, var(--earth-deep) 100%);
            background-position: 0 70%;
            background-size: 100% 40%;
            background-repeat: no-repeat;
        }

        .header {
            position: absolute;
            top: 40px;
            left: 60px;
            z-index: 100;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: var(--earth-deep);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--earth-rich);
            font-weight: 500;
        }

        .habits-grid {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            display: grid;
            grid-template-columns: repeat(6, 180px);
            gap: 40px;
            padding: 0 60px;
        }

        .habit-plant {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .habit-plant:hover {
            transform: translateY(-5px);
        }

        .plant-container {
            width: 120px;
            height: 140px;
            position: relative;
            margin-bottom: 20px;
        }

        .soil {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30px;
            background: var(--earth-rich);
            border-radius: 60px 60px 20px 20px;
            box-shadow: inset 0 2px 8px var(--shadow-deep);
        }

        .stem {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            background: var(--stem-green);
            border-radius: 3px;
            transition: height 0.4s ease;
        }

        .leaves {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
        }

        .leaf {
            position: absolute;
            width: 16px;
            height: 24px;
            background: var(--grass-fresh);
            border-radius: 50% 10px;
            transform-origin: bottom center;
        }

        .leaf:nth-child(1) {
            left: -20px;
            transform: rotate(-45deg);
        }

        .leaf:nth-child(2) {
            right: -20px;
            transform: rotate(45deg);
        }

        .flower {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(-50%) scale(0);
            transition: all 0.5s ease;
        }

        .flower::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            box-shadow: 0 4px 12px var(--shadow-soft);
        }

        .flower-center {
            width: 12px;
            height: 12px;
            background: var(--bloom-yellow);
            border-radius: 50%;
            z-index: 1;
        }

        .droplet {
            position: absolute;
            width: 8px;
            height: 10px;
            background: var(--water-blue);
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            opacity: 0;
            animation: waterDrop 0.6s ease-out;
        }

        .habit-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--earth-deep);
            text-align: center;
            margin-bottom: 8px;
        }

        .streak-count {
            font-size: 12px;
            color: var(--earth-rich);
            background: rgba(255, 255, 255, 0.7);
            padding: 4px 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px var(--shadow-soft);
        }

        .controls {
            position: absolute;
            top: 40px;
            right: 60px;
            display: flex;
            gap: 16px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 24px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px var(--shadow-soft);
        }

        .btn-water {
            background: var(--water-blue);
            color: white;
        }

        .btn-water:hover {
            background: #3a7ca5;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: var(--earth-light);
            color: white;
        }

        .btn-reset:hover {
            background: var(--earth-rich);
            transform: translateY(-2px);
        }

        .weather-info {
            position: absolute;
            bottom: 40px;
            right: 60px;
            text-align: right;
            color: var(--earth-rich);
        }

        .date {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .season {
            font-size: 14px;
        }

        /* Plant states */
        .habit-plant.sprouting .stem {
            height: 40px;
        }

        .habit-plant.growing .stem {
            height: 60px;
        }

        .habit-plant.blooming .stem {
            height: 80px;
        }

        .habit-plant.blooming .flower {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .habit-plant.blooming .flower.pink {
            background: var(--bloom-pink);
        }

        .habit-plant.blooming .flower.purple {
            background: var(--bloom-purple);
        }

        .habit-plant.blooming .flower.orange {
            background: var(--bloom-orange);
        }

        .habit-plant.wilting .stem {
            background: var(--wilt-brown);
            height: 20px;
        }

        .habit-plant.wilting .leaf {
            background: var(--wilt-brown);
        }

        .habit-plant.withering .stem {
            height: 10px;
            background: var(--wilt-brown);
        }

        .habit-plant.withering .leaves {
            opacity: 0.3;
        }

        @keyframes waterDrop {
            0% {
                opacity: 1;
                transform: rotate(-45deg) translateY(-20px);
            }
            100% {
                opacity: 0;
                transform: rotate(-45deg) translateY(0);
            }
        }

        .clouds {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            opacity: 0.7;
        }

        .cloud:before,
        .cloud:after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50px;
        }

        .cloud1 {
            width: 80px;
            height: 40px;
            top: 15%;
            left: 20%;
            animation: float 20s infinite linear;
        }

        .cloud1:before {
            top: -25px;
            left: 10px;
            width: 50px;
            height: 50px;
        }

        .cloud1:after {
            top: -25px;
            right: 15px;
            width: 60px;
            height: 40px;
        }

        .cloud2 {
            width: 60px;
            height: 30px;
            top: 25%;
            right: 15%;
            animation: float 25s infinite linear reverse;
        }

        .cloud2:before {
            top: -20px;
            left: 10px;
            width: 40px;
            height: 40px;
        }

        .cloud2:after {
            top: -15px;
            right: 10px;
            width: 30px;
            height: 30px;
        }

        @keyframes float {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(1540px); }
        }
    </style>
</head>
<body>
    <div class="garden-container">
        <div class="clouds">
            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>
        </div>

        <div class="header">
            <h1 class="title">Garden Habits</h1>
            <p class="subtitle">Nurture your daily rituals</p>
        </div>

        <div class="controls">
            <button class="btn btn-water" onclick="waterPlants()">💧 Water Garden</button>
            <button class="btn btn-reset" onclick="resetGarden()">🌱 New Season</button>
        </div>

        <div class="habits-grid">
            <div class="habit-plant sprouting" onclick="toggleHabit(this)" data-habit="exercise">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower pink">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Exercise</div>
                <div class="streak-count">3 day streak</div>
            </div>

            <div class="habit-plant blooming" onclick="toggleHabit(this)" data-habit="reading">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower purple">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Reading</div>
                <div class="streak-count">12 day streak</div>
            </div>

            <div class="habit-plant wilting" onclick="toggleHabit(this)" data-habit="meditation">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower orange">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Meditation</div>
                <div class="streak-count">Missed 2 days</div>
            </div>

            <div class="habit-plant growing" onclick="toggleHabit(this)" data-habit="writing">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower pink">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Writing</div>
                <div class="streak-count">7 day streak</div>
            </div>

            <div class="habit-plant sprouting" onclick="toggleHabit(this)" data-habit="cooking">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower orange">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Cooking</div>
                <div class="streak-count">2 day streak</div>
            </div>

            <div class="habit-plant withering" onclick="toggleHabit(this)" data-habit="learning">
                <div class="plant-container">
                    <div class="soil"></div>
                    <div class="stem"></div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="flower purple">
                        <div class="flower-center"></div>
                    </div>
                </div>
                <div class="habit-name">Learning</div>
                <div class="streak-count">Missed 5 days</div>
            </div>
        </div>

        <div class="weather-info">
            <div class="date">March 15, 2024</div>
            <div class="season">🌸 Spring Growth Season</div>
        </div>
    </div>

    <script>
        function toggleHabit(plant) {
            const container = plant.querySelector('.plant-container');
            const droplet = document.createElement('div');
            droplet.className = 'droplet';
            droplet.style.top = '60px';
            droplet.style.left = '50%';
            droplet.style.transform = 'translateX(-50%) rotate(-45deg)';
            container.appendChild(droplet);
            
            setTimeout(() => {
                droplet.remove();
            }, 600);

            // Simulate growth
            if (plant.classList.contains('withering')) {
                plant.className = 'habit-plant sprouting';
                plant.querySelector('.streak-count').textContent = '1 day streak';
            } else if (plant.classList.contains('wilting')) {
                plant.className = 'habit-plant growing';
                const current = parseInt(plant.querySelector('.streak-count').textContent.match(/\d+/)[0]);
                plant.querySelector('.streak-count').textContent = `${current + 1} day streak`;
            } else {
                const current = parseInt(plant.querySelector('.streak-count').textContent.match(/\d+/)[0]);
                if (current < 5) {
                    plant.className = 'habit-plant growing';
                } else if (current < 10) {
                    plant.className = 'habit-plant blooming';
                }
                plant.querySelector('.streak-count').textContent = `${current + 1} day streak`;
            }
        }

        function waterPlants() {
            const plants = document.querySelectorAll('.habit-plant');
            plants.forEach((plant, index) => {
                setTimeout(() => {
                    const container = plant.querySelector('.plant-container');
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            const droplet = document.createElement('div');
                            droplet.className = 'droplet';
                            droplet.style.top = '20px';
                            droplet.style.left = (45 + i * 5) + '%';
                            container.appendChild(droplet);
                            
                            setTimeout(() => {
                                droplet.remove();
                            }, 600);
                        }, i * 100);
                    }
                }, index * 200);
            });
        }

        function resetGarden() {
            const plants = document.querySelectorAll('.habit-plant');
            plants.forEach(plant => {
                plant.className = 'habit-plant sprouting';
                plant.querySelector('.streak-count').textContent = '0 day streak';
            });
        }
    </script>
</body>
</html>
