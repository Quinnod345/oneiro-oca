<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1440, height=900">
    <title>Memory Deterioration Simulator</title>
    <style>
        :root {
            --intact: #2a1810;
            --wood-grain: #4a3426;
            --wallpaper-rose: #a67c7c;
            --dust-mote: #e8dcc4;
            --void-edge: #0a0806;
            --memory-fade: #384858;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1440px;
            height: 900px;
            overflow: hidden;
            background: linear-gradient(to bottom, var(--void-edge), #000);
            font-family: Baskerville, 'Times New Roman', serif;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .title {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 42px;
            letter-spacing: 0.05em;
            color: var(--dust-mote);
            opacity: 0.8;
            font-weight: 300;
            text-align: center;
        }

        .subtitle {
            position: absolute;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            color: var(--dust-mote);
            opacity: 0.4;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        #memory-field {
            width: 800px;
            height: 500px;
            position: relative;
            transform: perspective(1200px) rotateX(5deg);
        }

        .memory-solid {
            position: absolute;
            background: var(--wood-grain);
            transition: all 2.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #piano {
            width: 320px;
            height: 180px;
            left: 50px;
            bottom: 80px;
            background: linear-gradient(180deg, var(--intact) 0%, var(--wood-grain) 100%);
            clip-path: polygon(0% 0%, 100% 0%, 95% 100%, 5% 100%);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        #piano::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 50px;
            background: var(--dust-mote);
            top: 35%;
            opacity: 0.85;
        }

        #grandmother-chair {
            width: 140px;
            height: 200px;
            right: 100px;
            bottom: 60px;
            position: absolute;
            cursor: pointer;
        }

        .chair-fragment {
            position: absolute;
            background: var(--wallpaper-rose);
            transition: all 2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .chair-fragment:nth-child(1) {
            width: 100%;
            height: 90px;
            bottom: 0;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .chair-fragment:nth-child(2) {
            width: 100%;
            height: 110px;
            top: 0;
            clip-path: polygon(20% 0%, 80% 0%, 70% 100%, 30% 100%);
            background: linear-gradient(var(--wallpaper-rose), var(--wood-grain));
        }

        .chair-fragment:nth-child(3),
        .chair-fragment:nth-child(4) {
            width: 18px;
            height: 90px;
            bottom: -90px;
            background: var(--wood-grain);
        }

        .chair-fragment:nth-child(3) { left: 15px; }
        .chair-fragment:nth-child(4) { right: 15px; }

        #grandmother-chair:hover .chair-fragment:nth-child(1) {
            transform: translateX(-40px) translateY(50px) rotateZ(-25deg);
            opacity: 0.3;
        }

        #grandmother-chair:hover .chair-fragment:nth-child(2) {
            transform: translateX(35px) translateY(-45px) rotateZ(30deg);
            opacity: 0.2;
        }

        #grandmother-chair:hover .chair-fragment:nth-child(3) {
            transform: translateY(25px) rotateX(90deg);
            opacity: 0.1;
        }

        #grandmother-chair:hover .chair-fragment:nth-child(4) {
            transform: translateY(30px) rotateX(-90deg);
            opacity: 0.1;
        }

        .memory-compass {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 80px;
        }

        .memory-point {
            position: absolute;
            width: 12px;
            height: 12px;
            background: var(--dust-mote);
            border-radius: 50%;
            transition: all 1.5s ease-out;
        }

        .memory-point:nth-child(1) {
            left: 20%;
            top: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.9;
        }

        .memory-point:nth-child(2) {
            left: 40%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.3);
            opacity: 0.7;
        }

        .memory-point:nth-child(3) {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            opacity: 0.5;
        }

        .memory-point:nth-child(4) {
            left: 65%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0.3;
        }

        .memory-point:nth-child(5) {
            left: 80%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            opacity: 0.1;
        }

        .memory-label {
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: var(--dust-mote);
            opacity: 0.5;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @keyframes dust-float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            20% { opacity: 0.3; }
            80% { opacity: 0.3; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }

        .dust-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--dust-mote);
            border-radius: 50%;
            animation: dust-float 8s infinite;
        }

        .dust-particle:nth-child(1) { left: 20%; animation-delay: 0s; }
        .dust-particle:nth-child(2) { left: 35%; animation-delay: 2s; }
        .dust-particle:nth-child(3) { left: 50%; animation-delay: 4s; }
        .dust-particle:nth-child(4) { left: 65%; animation-delay: 6s; }
        .dust-particle:nth-child(5) { left: 80%; animation-delay: 8s; }
    </style>
</head>
<body>
    <h1 class="title">The Parlor Remains</h1>
    <p class="subtitle">Where Memory Dissolves</p>
    
    <div id="memory-field">
        <div class="memory-solid" id="piano"></div>
        
        <div id="grandmother-chair">
            <div class="chair-fragment"></div>
            <div class="chair-fragment"></div>
            <div class="chair-fragment"></div>
            <div class="chair-fragment"></div>
        </div>
        
        <div class="dust-particle"></div>
        <div class="dust-particle"></div>
        <div class="dust-particle"></div>
        <div class="dust-particle"></div>
        <div class="dust-particle"></div>
    </div>
    
    <div class="memory-compass">
        <div class="memory-point"></div>
        <div class="memory-point"></div>
        <div class="memory-point"></div>
        <div class="memory-point"></div>
        <div class="memory-point"></div>
        <span class="memory-label">Clarity of Recall</span>
    </div>
</body>
</html>
