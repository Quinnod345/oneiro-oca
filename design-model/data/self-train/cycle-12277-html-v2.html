<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline Editor</title>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --text-primary: #212529;
            --text-secondary: #6c757d;
            --border-color: #dee2e6;
            --accent-blue: #0066cc;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --hover-bg: #e9ecef;
            --focus-ring: rgba(0, 102, 204, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-green);
        }

        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 2rem;
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .timeline-container {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            flex: 1;
            min-height: 400px;
            position: relative;
            overflow: auto;
        }

        .timeline-grid {
            display: grid;
            grid-template-columns: 120px 1fr;
            height: 100%;
        }

        .track-labels {
            border-right: 1px solid var(--border-color);
            background: var(--bg-primary);
        }

        .track-label {
            height: 60px;
            padding: 0 1rem;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .timeline-content {
            position: relative;
            background-image: repeating-linear-gradient(
                90deg,
                var(--border-color),
                var(--border-color) 1px,
                transparent 1px,
                transparent 100px
            );
        }

        .track {
            height: 60px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .timeline-item {
            position: absolute;
            height: 40px;
            top: 10px;
            background: var(--accent-blue);
            border-radius: 0.25rem;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            color: white;
            font-size: 0.875rem;
            cursor: move;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        }

        .timeline-item:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        }

        .timeline-item.type-event {
            background: var(--accent-green);
        }

        .timeline-item.type-milestone {
            background: var(--accent-red);
        }

        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            padding: 0.5rem 1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
        }

        .button {
            padding: 0.5rem 1rem;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .button:hover {
            background: var(--hover-bg);
            border-color: var(--accent-blue);
        }

        .button:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .button-primary {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
        }

        .button-primary:hover {
            background: #0052a3;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .zoom-control {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .zoom-slider {
            width: 120px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: var(--border-color);
            border-radius: 2px;
            outline: none;
        }

        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
        }

        .zoom-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--accent-blue);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }

        .time-ruler {
            height: 30px;
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1rem;
            }

            .timeline-grid {
                grid-template-columns: 80px 1fr;
            }

            .controls {
                justify-content: center;
            }

            .zoom-control {
                order: -1;
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">Timeline Editor</h1>
        <div class="status">
            <span class="status-dot"></span>
            <span>All changes saved</span>
        </div>
    </header>

    <main class="main-container">
        <div class="controls">
            <div class="control-group">
                <button class="button button-primary">
                    <svg class="icon" viewBox="0 0 16 16">
                        <path d="M8 4v8m-4-4h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Add Item
                </button>
                <button class="button">
                    <svg class="icon" viewBox="0 0 16 16">
                        <path d="M4 8l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                    Save
                </button>
            </div>

            <div class="control-group zoom-control">
                <label for="zoom">Zoom:</label>
                <input type="range" id="zoom" class="zoom-slider" min="50" max="200" value="100">
                <span>100%</span>
            </div>

            <div class="control-group">
                <button class="button" aria-label="Play">
                    <svg class="icon" viewBox="0 0 16 16">
                        <path d="M5 3v10l7-5z" fill="currentColor"/>
                    </svg>
                </button>
                <button class="button" aria-label="Pause">
                    <svg class="icon" viewBox="0 0 16 16">
                        <rect x="5" y="3" width="2" height="10" fill="currentColor"/>
                        <rect x="9" y="3" width="2" height="10" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="timeline-container">
            <div class="time-ruler">
                <span>0:00</span>
            </div>
            <div class="timeline-grid">
                <div class="track-labels">
                    <div class="track-label">Track 1</div>
                    <div class="track-label">Track 2</div>
                    <div class="track-label">Track 3</div>
                </div>
                <div class="timeline-content">
                    <div class="track">
                        <div class="timeline-item" style="left: 20px; width: 150px;">Task A</div>
                        <div class="timeline-item" style="left: 200px; width: 100px;">Task B</div>
                    </div>
                    <div class="track">
                        <div class="timeline-item type-event" style="left: 80px; width: 120px;">Event 1</div>
                    </div>
                    <div class="track">
                        <div class="timeline-item type-milestone" style="left: 150px; width: 80px;">Milestone</div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
