<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus State Menu Bar App</title>
    <style>
        :root {
            --focus-idle: rgba(142, 142, 147, 0.8);
            --focus-light: rgba(52, 199, 89, 0.9);
            --focus-medium: rgba(255, 149, 0, 0.9);
            --focus-deep: rgba(175, 82, 222, 0.9);
            --focus-flow: rgba(64, 156, 255, 0.9);
            
            --bg-primary: rgba(40, 40, 40, 0.95);
            --bg-secondary: rgba(50, 50, 50, 0.8);
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.7);
            --text-tertiary: rgba(255, 255, 255, 0.5);
            
            --border-subtle: rgba(255, 255, 255, 0.1);
            --shadow-ambient: rgba(0, 0, 0, 0.3);
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            
            --spacing-xs: 4px;
            --spacing-sm: 8px;
            --spacing-md: 12px;
            --spacing-lg: 16px;
            --spacing-xl: 24px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1440px;
            height: 900px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        
        .menu-bar-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 24px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            z-index: 1000;
        }
        
        .focus-app {
            position: absolute;
            top: 28px;
            right: var(--spacing-lg);
            width: 280px;
            background: var(--bg-primary);
            backdrop-filter: blur(40px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            box-shadow: 
                0 20px 40px var(--shadow-ambient),
                0 0 0 1px rgba(255, 255, 255, 0.05);
            overflow: hidden;
            transform: translateY(0);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .focus-app:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 24px 48px var(--shadow-ambient),
                0 0 0 1px rgba(255, 255, 255, 0.08);
        }
        
        .app-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .app-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.01em;
        }
        
        .focus-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--focus-deep);
            box-shadow: 0 0 12px var(--focus-deep);
            animation: pulse-focus 3s ease-in-out infinite;
        }
        
        @keyframes pulse-focus {
            0%, 100% { 
                transform: scale(1);
                opacity: 1;
            }
            50% { 
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
        
        .focus-content {
            padding: var(--spacing-lg);
        }
        
        .focus-state {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }
        
        .focus-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto var(--spacing-lg);
            position: relative;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--focus-deep), rgba(175, 82, 222, 0.6));
            display: flex;
            align-items: center;
            justify-content: center;
            animation: breathe 4s ease-in-out infinite;
            box-shadow: 
                0 0 40px rgba(175, 82, 222, 0.4),
                inset 0 2px 4px rgba(255, 255, 255, 0.1);
        }
        
        @keyframes breathe {
            0%, 100% { 
                transform: scale(1);
                filter: brightness(1);
            }
            50% { 
                transform: scale(1.05);
                filter: brightness(1.1);
            }
        }
        
        .focus-icon {
            width: 36px;
            height: 36px;
            color: var(--text-primary);
            opacity: 0.9;
        }
        
        .focus-label {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
            letter-spacing: -0.02em;
        }
        
        .focus-duration {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        .focus-modes {
            display: flex;
            gap: var(--spacing-sm);
            margin-bottom: var(--spacing-lg);
        }
        
        .mode-button {
            flex: 1;
            padding: var(--spacing-sm) var(--spacing-xs);
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            color: var(--text-tertiary);
            font-size: 11px;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative;
            overflow: hidden;
        }
        
        .mode-button:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
            transform: translateY(-1px);
        }
        
        .mode-button.active {
            background: var(--focus-deep);
            color: var(--text-primary);
            border-color: var(--focus-deep);
            box-shadow: 0 0 16px rgba(175, 82, 222, 0.3);
        }
        
        .mode-button.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .ambient-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-md);
        }
        
        .stat-item {
            background: var(--bg-secondary);
            padding: var(--spacing-md);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            transition: all 0.3s ease;
        }
        
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.15);
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
        }
        
        .stat-label {
            font-size: 10px;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        
        .ambient-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.03;
        }
        
        .ambient-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            animation: float 8s ease-in-out infinite;
        }
        
        .ambient-orb:nth-child(1) {
            width: 300px;
            height: 300px;
            background: var(--focus-deep);
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }
        
        .ambient-orb:nth-child(2) {
            width: 200px;
            height: 200px;
            background: var(--focus-flow);
            top: 60%;
            right: 15%;
            animation-delay: -2s;
        }
        
        .ambient-orb:nth-child(3) {
            width: 150px;
            height: 150px;
            background: var(--focus-medium);
            bottom: 30%;
            left: 50%;
            animation-delay: -4s;
        }
        
        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
            }
            33% { 
                transform: translateY(-20px) rotate(120deg);
            }
            66% { 
                transform: translateY(10px) rotate(240deg);
            }
        }
        
        .menu-bar-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--focus-deep);
            box-shadow: 0 0 8px rgba(175, 82, 222, 0.5);
            animation: menu-pulse 2s ease-in-out infinite;
        }
        
        @keyframes menu-pulse {
            0%, 100% { 
                opacity: 0.8;
                transform: translateY(-50%) scale(1);
            }
            50% { 
                opacity: 1;
                transform: translateY(-50%) scale(1.1);
            }
        }
    </style>
</head>
<body>
    <div class="ambient-background">
        <div class="ambient-orb"></div>
        <div class="ambient-orb"></div>
        <div class="ambient-orb"></div>
    </div>
    
    <div class="menu-bar-container">
        <div class="menu-bar-icon"></div>
    </div>
    
    <div class="focus-app">
        <div class="app-header">
            <div class="app-title">Focus</div>
            <div class="focus-indicator"></div>
        </div>
        
        <div class="focus-content">
            <div class="focus-state">
                <div class="focus-circle">
                    <svg class="focus-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </div>
                <div class="focus-label">Deep Focus</div>
                <div class="focus-duration">In flow for 2h 34m</div>
            </div>
            
            <div class="focus-modes">
                <div class="mode-button">Light</div>
                <div class="mode-button active">Deep</div>
                <div class="mode-button">Flow</div>
                <div class="mode-button">Break</div>
            </div>
            
            <div class="ambient-stats">
                <div class="stat-item">
                    <div class="stat-value">87%</div>
                    <div class="stat-label">Today</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">6.2h</div>
                    <div class="stat-label">Weekly Avg</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
