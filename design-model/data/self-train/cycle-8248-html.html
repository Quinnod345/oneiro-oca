<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Decay Simulator</title>
    <style>
        :root {
            --bone: #f9f6f2;
            --ash: #3a3836;
            --fade: #9e9b97;
            --rust: #a67c52;
            --mold: #7a8471;
            --water-damage: #d4cfc7;
            --entropy-rate: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bone);
            color: var(--ash);
            font-family: 'Times New Roman', Times, serif;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .substrate {
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at 17% 23%, rgba(166, 124, 82, 0.08) 0%, transparent 40%),
                radial-gradient(ellipse at 82% 67%, rgba(122, 132, 113, 0.06) 0%, transparent 30%),
                linear-gradient(180deg, var(--bone) 0%, rgba(249, 246, 242, 0.97) 100%);
        }

        .memory-field {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1fr 480px;
            gap: 60px;
            padding: 60px;
        }

        .input-zone {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .prompt {
            font-size: 32px;
            font-weight: normal;
            letter-spacing: -0.02em;
            line-height: 1.3;
            color: var(--ash);
            opacity: 0.9;
        }

        .memory-input {
            position: relative;
            background: transparent;
            border: none;
            font-family: inherit;
            font-size: 20px;
            line-height: 1.6;
            color: var(--ash);
            resize: none;
            outline: none;
            width: 100%;
            height: 300px;
            padding: 20px;
            border: 1px solid rgba(58, 56, 54, 0.2);
            transition: border-color 0.3s;
        }

        .memory-input:focus {
            border-color: rgba(58, 56, 54, 0.4);
        }

        .decay-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .begin-decay {
            background: var(--ash);
            color: var(--bone);
            border: none;
            padding: 14px 32px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.02em;
        }

        .begin-decay:hover {
            background: rgba(58, 56, 54, 0.85);
            transform: translateY(-1px);
        }

        .decay-rate {
            font-size: 14px;
            color: var(--fade);
            letter-spacing: 0.02em;
        }

        .decay-chamber {
            position: relative;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(58, 56, 54, 0.1);
            padding: 40px;
            overflow: hidden;
        }

        .memory-display {
            position: relative;
            min-height: 400px;
            font-size: 18px;
            line-height: 1.8;
            color: var(--ash);
        }

        .memory-fragment {
            display: inline-block;
            position: relative;
            transition: all var(--entropy-rate) ease-out;
            cursor: pointer;
            user-select: none;
        }

        .memory-fragment.decay-1 {
            opacity: 0.85;
            filter: blur(0.3px);
        }

        .memory-fragment.decay-2 {
            opacity: 0.7;
            filter: blur(0.6px);
            transform: translateY(1px);
        }

        .memory-fragment.decay-3 {
            opacity: 0.5;
            filter: blur(1px);
            color: var(--fade);
            transform: translateY(2px) rotate(-0.5deg);
        }

        .memory-fragment.decay-4 {
            opacity: 0.3;
            filter: blur(2px);
            color: var(--water-damage);
            transform: translateY(3px) rotate(-1deg);
            text-shadow: 0 0 8px var(--water-damage);
        }

        .memory-fragment.decay-5 {
            opacity: 0.1;
            filter: blur(4px);
            transform: translateY(5px) rotate(-2deg) scale(0.95);
            pointer-events: none;
        }

        .memory-fragment.refreshing {
            animation: desperate-grasp 0.5s ease-out;
        }

        @keyframes desperate-grasp {
            0% {
                opacity: 1;
                filter: blur(0);
                transform: scale(1.1);
            }
            50% {
                opacity: 1;
                filter: blur(0);
            }
            100% {
                opacity: inherit;
                filter: inherit;
                transform: inherit;
            }
        }

        .erosion-particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--fade);
            pointer-events: none;
            opacity: 0;
        }

        .erosion-particle.active {
            animation: dissolve 2s ease-out forwards;
        }

        @keyframes dissolve {
            0% {
                opacity: 0.6;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--x), var(--y)) scale(0.3);
            }
        }

        .water-damage {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 3s;
        }

        .water-damage.active {
            opacity: 1;
            background: 
                radial-gradient(ellipse at var(--damage-x) var(--damage-y), 
                    rgba(212, 207, 199, 0.3) 0%, 
                    transparent 40%);
        }

        .memory-stats {
            position: absolute;
            bottom: 40px;
            right: 40px;
            font-size: 13px;
            color: var(--fade);
            text-align: right;
            letter-spacing: 0.02em;
            line-height: 1.6;
        }

        .decay-indicator {
            position: absolute;
            top: 40px;
            right: 40px;
            width: 120px;
            height: 4px;
            background: rgba(58, 56, 54, 0.1);
            overflow: hidden;
        }

        .decay-progress {
            height: 100%;
            background: var(--rust);
            width: 0%;
            transition: width 0.5s ease-out;
        }

        .instructions {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 13px;
            color: var(--fade);
            letter-spacing: 0.02em;
            max-width: 300px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="substrate"></div>
    
    <div class="memory-field">
        <div class="input-zone">
            <h1 class="prompt">What do you remember most clearly?</h1>
            
            <textarea class="memory-input" placeholder="Describe a memory you never want to forget..."></textarea>
            
            <div class="decay-controls">
                <button class="begin-decay">Begin Decay</button>
                <span class="decay-rate">Entropy acceleration: 0.3x</span>
            </div>
            
            <div class="instructions">
                Click on fading words to momentarily restore them. 
                Each restoration accelerates decay elsewhere. 
                Nothing can be perfectly preserved.
            </div>
        </div>
        
        <div class="decay-chamber">
            <div class="decay-indicator">
                <div class="decay-progress"></div>
            </div>
            
            <div class="memory-display"></div>
            
            <div class="water-damage"></div>
            
            <div class="memory-stats">
                <div class="clarity">Clarity: <span id="clarity-percent">100</span>%</div>
                <div class="fragments">Intact fragments: <span id="fragment-count">0</span></div>
                <div class="attempts">Restoration attempts: <span id="restore-count">0</span></div>
            </div>
        </div>
    </div>

    <script>
        let decayInterval;
        let globalDecayLevel = 0;
        let restorationCount = 0;
        let entropyRate = 0.3;
        
        const synonymMap = {
            'beautiful': ['lovely', 'nice', 'pleasant', 'something'],
            'remember': ['recall', 'think', 'maybe', 'was'],
            'love': ['care', 'like', 'felt', 'something'],
            'happy': ['glad', 'okay', 'fine', 'was'],
            'always': ['often', 'sometimes', 'maybe', 'once'],
            'never': ['rarely', 'hardly', 'not', 'un'],
            'forever': ['long', 'time', 'while', 'then'],
            'perfect': ['good', 'nice', 'okay', 'was']
        };

        function createMemoryFragments(text) {
            const words = text.split(/(\s+)/);
            const display = document.querySelector('.memory-display');
            display.innerHTML = '';
            
            words.forEach((word, index) => {
                const fragment = document.createElement('span');
                fragment.className = 'memory-fragment';
                fragment.textContent = word;
                fragment.dataset.original = word;
                fragment.dataset.decayLevel = '0';
                
                if (word.trim()) {
                    fragment.addEventListener('click', () => restoreFragment(fragment));
                }
                
                display.appendChild(fragment);
            });
            
            updateStats();
        }

        function decayMemory() {
            const fragments = document.querySelectorAll('.memory-fragment');
            const activeFragments = Array.from(fragments).filter(f => 
                f.dataset.decayLevel < 5 && f.textContent.trim()
            );
            
            if (activeFragments.length === 0) {
                clearInterval(decayInterval);
                return;
            }
            
            // Decay random fragments
            const decayCount = Math.ceil(activeFragments.length * entropyRate * 0.1);
            for (let i = 0; i < decayCount; i++) {
                const fragment = activeFragments[Math.floor(Math.random() * activeFragments.length)];
                degradeFragment(fragment);
            }
            
            // Update global decay
            globalDecayLevel = Math.min(globalDecayLevel + 0.5, 100);
            document.querySelector('.decay-progress').style.width = globalDecayLevel + '%';
            
            // Add water damage
            if (globalDecayLevel > 30 && Math.random() < 0.1) {
                addWaterDamage();
            }
            
            updateStats();
        }

        function degradeFragment(fragment) {
            const currentLevel = parseInt(fragment.dataset.decayLevel);
            const newLevel = Math.min(currentLevel + 1, 5);
            
            fragment.dataset.decayLevel = newLevel;
            fragment.className = `memory-fragment decay-${newLevel}`;
            
            // Word degradation
            if (newLevel === 2 || newLevel === 3) {
                const word = fragment.textContent.toLowerCase();
                const synonyms = synonymMap[word];
                if (synonyms && Math.random() < 0.5) {
                    fragment.textContent = synonyms[Math.min(newLevel - 2, synonyms.length - 1)];
                }
            } else if (newLevel === 4) {
                if (Math.random() < 0.3) {
                    fragment.textContent = '...';
                }
            }
            
            // Create dissolution particles
            createDissolutionParticles(fragment);
        }

        function restoreFragment(fragment) {
            if (fragment.dataset.decayLevel === '5') return;
            
            fragment.classList.add('refreshing');
            const previousLevel = parseInt(fragment.dataset.decayLevel);
            fragment.dataset.decayLevel = Math.max(0, previousLevel - 1);
            fragment.className = `memory-fragment refreshing decay-${fragment.dataset.decayLevel}`;
            
            setTimeout(() => {
                fragment.classList.remove('refreshing');
            }, 500);
            
            restorationCount++;
            
            // Accelerate decay elsewhere
            entropyRate = Math.min(entropyRate * 1.1, 0.8);
            
            // Immediate decay of nearby fragments
            const allFragments = Array.from(document.querySelectorAll('.memory-fragment'));
            const index = allFragments.indexOf(fragment);
            const nearby = [
                allFragments[index - 2],
                allFragments[index - 1],
                allFragments[index + 1],
                allFragments[index + 2]
            ].filter(f => f && f.dataset.decayLevel < 5);
            
            nearby.forEach(f => degradeFragment(f));
            
            updateStats();
        }

        function createDissolutionParticles(fragment) {
            const rect = fragment.getBoundingClientRect();
            const chamber = document.querySelector('.decay-chamber');
            const chamberRect = chamber.getBoundingClientRect();
            
            for (let i = 0; i < 5; i++) {
                const particle = document.createElement('div');
                particle.className = 'erosion-particle';
                particle.style.left = (rect.left - chamberRect.left + Math.random() * rect.width) + 'px';
                particle.style.top = (rect.top - chamberRect.top + Math.random() * rect.height) + 'px';
                particle.style.setProperty('--x', (Math.random() - 0.5) * 100 + 'px');
                particle.style.setProperty('--y', Math.random() * 50 + 'px');
                
                chamber.appendChild(particle);
                
                setTimeout(() => {
                    particle.classList.add('active');
                    setTimeout(() => particle.remove(), 2000);
                }, i * 100);
            }
        }

        function addWaterDamage() {
            const waterDamage = document.querySelector('.water-damage');
            waterDamage.style.setProperty('--damage-x', Math.random() * 100 + '%');
            waterDamage.style.setProperty('--damage-y', Math.random() * 100 + '%');
            waterDamage.classList.add('active');
            
            setTimeout(() => {
                waterDamage.classList.remove('active');
            }, 3000);
        }

        function updateStats() {
            const fragments = document.querySelectorAll('.memory-fragment');
            const intactCount = Array.from(fragments).filter(f => 
                f.dataset.decayLevel === '0' && f.textContent.trim()
            ).length;
            const totalCount = Array.from(fragments).filter(f => f.textContent.trim()).length;
            
            const clarity = totalCount > 0 ? Math.round((intactCount / totalCount) * 100) : 0;
            
            document.getElementById('clarity-percent').textContent = clarity;
            document.getElementById('fragment-count').textContent = intactCount;
            document.getElementById('restore-count').textContent = restorationCount;
        }

        document.querySelector('.begin-decay').addEventListener('click', function() {
            const memoryText = document.querySelector('.memory-input').value;
            if (!memoryText.trim()) return;
            
            createMemoryFragments(memoryText);
            
            this.disabled = true;
            this.textContent = 'Decay in progress...';
            
            clearInterval(decayInterval);
            decayInterval = setInterval(decayMemory, 1000);
        });

        document.querySelector('.decay-rate').addEventListener('click', function() {
            entropyRate = entropyRate === 0.3 ? 0.5 : entropyRate === 0.5 ? 0.7 : 0.3;
            this.textContent = `Entropy acceleration: ${entropyRate}x`;
        });
    </script>
</body>
</html>
