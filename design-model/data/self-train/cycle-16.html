<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromaphone - Color Harmony Generator</title>
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #2a2a38;
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
            --accent-blue: #4a9eff;
            --accent-purple: #8b5cf6;
            --border-subtle: #3a3a4f;
            --glow-intensity: 0.6;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-spring: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
        }

        .chromaphone {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100vh;
            gap: 0;
        }

        /* Control Panel */
        .control-panel {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-subtle);
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .harmony-selector {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .harmony-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .harmony-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .harmony-btn {
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-smooth);
            text-align: center;
        }

        .harmony-btn:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--accent-blue);
        }

        .harmony-btn.active {
            background: var(--accent-blue);
            color: white;
            border-color: var(--accent-blue);
            box-shadow: 0 4px 20px rgba(74, 158, 255, 0.3);
        }

        .controls-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .slider-container {
            position: relative;
        }

        .slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: var(--bg-tertiary);
            outline: none;
            -webkit-appearance: none;
            cursor: pointer;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(74, 158, 255, 0.4);
            transition: var(--transition-smooth);
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 16px rgba(74, 158, 255, 0.6);
        }

        /* Instrument Interface */
        .instrument-area {
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            position: relative;
            overflow: hidden;
        }

        .instrument-header {
            padding: 32px 40px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }

        .instrument-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .instrument-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
        }

        .keyboard-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            position: relative;
        }

        /* Chromatic Keyboard */
        .keyboard {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 200px;
            gap: 2px;
            margin-bottom: 40px;
        }

        .key {
            position: relative;
            cursor: pointer;
            transition: var(--transition-spring);
            border-radius: 0 0 8px 8px;
            user-select: none;
        }

        .key.white {
            width: 60px;
            height: 200px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            z-index: 1;
        }

        .key.black {
            width: 36px;
            height: 130px;
            background: #1a1a24;
            border: 1px solid #2a2a38;
            position: absolute;
            z-index: 2;
            margin-left: -18px;
        }

        .key:hover {
            transform: translateY(4px) scale(1.02);
        }

        .key.active {
            transform: translateY(8px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .key.playing {
            animation: keyPress 0.6s ease-out;
        }

        @keyframes keyPress {
            0% { transform: translateY(8px) scale(1.05); }
            50% { transform: translateY(12px) scale(1.08); }
            100% { transform: translateY(0) scale(1); }
        }

        /* Harmony Display */
        .harmony-display {
            display: flex;
            justify-content: center;
            gap: 16px;
            min-height: 120px;
            align-items: center;
        }

        .harmony-color {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            transition: var(--transition-spring);
            cursor: pointer;
            border: 2px solid transparent;
        }

        .harmony-color:hover {
            transform: scale(1.1) translateY(-4px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .harmony-color.root {
            width: 100px;
            height: 100px;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        /* Background Pattern */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.03;
            background-image: radial-gradient(circle at 25% 25%, var(--accent-blue) 2px, transparent 2px),
                              radial-gradient(circle at 75% 75%, var(--accent-purple) 2px, transparent 2px);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            pointer-events: none;
        }

        /* Responsive adjustments for exact 1440x900 */
        @media (width: 1440px) and (height: 900px) {
            .keyboard-container {
                padding: 60px 80px;
            }
            
            .harmony-display {
                margin-top: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="chromaphone">
        <div class="control-panel">
            <div>
                <h1 class="logo">Chromaphone</h1>
                <p class="subtitle">Color Harmony Generator</p>
            </div>

            <div class="harmony-selector">
                <h3 class="harmony-title">Harmony Type</h3>
                <div class="harmony-buttons">
                    <button class="harmony-btn active" data-harmony="complementary">Complementary</button>
                    <button class="harmony-btn" data-harmony="triadic">Triadic</button>
                    <button class="harmony-btn" data-harmony="analogous">Analogous</button>
                    <button class="harmony-btn" data-harmony="tetradic">Tetradic</button>
                    <button class="harmony-btn" data-harmony="monochromatic">Monochromatic</button>
                    <button class="harmony-btn" data-harmony="split">Split-Comp</button>
                </div>
            </div>

            <div class="controls-section">
                <div class="control-group">
                    <label class="control-label">Saturation</label>
                    <input type="range" class="slider" id="saturation" min="20" max="100" value="75">
                </div>

                <div class="control-group">
                    <label class="control-label">Lightness</label>
                    <input type="range" class="slider" id="lightness" min="30" max="80" value="55">
                </div>

                <div class="control-group">
                    <label class="control-label">Harmony Strength</label>
                    <input type="range" class="slider" id="strength" min="1" max="10" value="5">
                </div>
            </div>
        </div>

        <div class="instrument-area">
            <div class="bg-pattern"></div>
            
            <div class="instrument-header">
                <h2 class="instrument-title">Color Keyboard</h2>
                <p class="instrument-subtitle">Click keys to play colors • Hold to lock harmonies</p>
            </div>

            <div class="keyboard-container">
                <div class="keyboard" id="keyboard">
                    <div class="key white" data-note="C" data-hue="0"></div>
                    <div class="key black" data-note="C#" data-hue="15"></div>
                    <div class="key white" data-note="D" data-hue="30"></div>
                    <div class="key black" data-note="D#" data-hue="45"></div>
                    <div class="key white" data-note="E" data-hue="60"></div>
                    <div class="key white" data-note="F" data-hue="90"></div>
                    <div class="key black" data-note="F#" data-hue="105"></div>
                    <div class="key white" data-note="G" data-hue="120"></div>
                    <div class="key black" data-note="G#" data-hue="135"></div>
                    <div class="key white" data-note="A" data-hue="150"></div>
                    <div class="key black" data-note="A#" data-hue="165"></div>
                    <div class="key white" data-note="B" data-hue="180"></div>
                    <div class="key white" data-note="C" data-hue="210"></div>
                    <div class="key black" data-note="C#" data-hue="225"></div>
                    <div class="key white" data-note="D" data-hue="240"></div>
                    <div class="key black" data-note="D#" data-hue="255"></div>
                    <div class="key white" data-note="E" data-hue="270"></div>
                    <div class="key white" data-note="F" data-hue="300"></div>
                    <div class="key black" data-note="F#" data-hue="315"></div>
                    <div class="key white" data-note="G" data-hue="330"></div>
                </div>

                <div class="harmony-display" id="harmonyDisplay">
                    <div class="harmony-color root" id="rootColor">Root</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class Chromaphone {
            constructor() {
                this.currentHarmony = 'complementary';
                this.saturation = 75;
                this.lightness = 55;
                this.strength = 5;
                this.activeColors = [];
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                // Harmony type selection
                document.querySelectorAll('.harmony-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.harmony-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.currentHarmony = e.target.dataset.harmony;
                        this.clearHarmony();
                    });
                });

                // Control sliders
                document.getElementById('saturation').addEventListener('input', (e) => {
                    this.saturation = parseInt(e.target.value);
                    this.updateActiveColors();
                });

                document.getElementById('lightness').addEventListener('input', (e) => {
                    this.lightness = parseInt(e.target.value);
                    this.updateActiveColors();
                });

                document.getElementById('strength').addEventListener('input', (e) => {
                    this.strength = parseInt(e.target.value);
                    this.updateActiveColors();
                });

                // Keyboard interaction
                document.querySelectorAll('.key').forEach(key => {
                    key.addEventListener('click', (e) => {
                        this.playColor(parseInt(e.target.dataset.hue));
                        e.target.classList.add('playing');
                        setTimeout(() => e.target.classList.remove('playing'), 600);
                    });
                });
            }

            playColor(hue) {
                const harmony = this.generateHarmony(hue);
                this.displayHarmony(harmony);
                this.activeColors = harmony;
            }

            generateHarmony(rootHue) {
                const colors = [{ hue: rootHue, role: 'root' }];

                switch (this.currentHarmony) {
                    case 'complementary':
                        colors.push({ hue: (rootHue + 180) % 360, role: 'complement' });
                        break;
                    case 'triadic':
                        colors.push({ hue: (rootHue + 120) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue + 240) % 360, role: 'harmony' });
                        break;
                    case 'analogous':
                        colors.push({ hue: (rootHue + 30) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue + 60) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue - 30 + 360) % 360, role: 'harmony' });
                        break;
                    case 'tetradic':
                        colors.push({ hue: (rootHue + 90) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue + 180) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue + 270) % 360, role: 'harmony' });
                        break;
                    case 'monochromatic':
                        colors.push({ hue: rootHue, role: 'light', lightness: this.lightness + 20 });
                        colors.push({ hue: rootHue, role: 'dark', lightness: this.lightness - 20 });
                        colors.push({ hue: rootHue, role: 'muted', saturation: this.saturation - 30 });
                        break;
                    case 'split':
                        colors.push({ hue: (rootHue + 150) % 360, role: 'harmony' });
                        colors.push({ hue: (rootHue + 210) % 360, role: 'harmony' });
                        break;
                }

                return colors;
            }

            displayHarmony(colors) {
                const display = document.getElementById('harmonyDisplay');
                display.innerHTML = '';

                colors.forEach((color, index) => {
                    const colorDiv = document.createElement('div');
                    colorDiv.className = `harmony-color ${color.role}`;
                    
                    const saturation = color.saturation || this.saturation;
                    const lightness = color.lightness || this.lightness;
                    const hslColor = `hsl(${color.hue}, ${saturation}%, ${lightness}%)`;
                    
                    colorDiv.style.background = hslColor;
                    colorDiv.textContent = color.role === 'root' ? 'Root' : `H${index}`;
                    
                    // Add copy to clipboard functionality
                    colorDiv.addEventListener('click', () => {
                        navigator.clipboard.writeText(hslColor);
                        colorDiv.textContent = 'Copied!';
                        setTimeout(() => {
                            colorDiv.textContent = color.role === 'root' ? 'Root' : `H${index}`;
                        }, 1000);
                    });

                    display.appendChild(colorDiv);
                });
            }

            updateActiveColors() {
                if (this.activeColors.length > 0) {
                    this.displayHarmony(this.activeColors);
                }
            }

            clearHarmony() {
                document.getElementById('harmonyDisplay').innerHTML = '<div class="harmony-color root">Root</div>';
                this.activeColors = [];
            }
        }

        // Initialize the application
        new Chromaphone();
    </script>
</body>
</html>
