<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Archaeology</title>
    <style>
        :root {
            --primary: #1a1a2e;
            --secondary: #16213e;
            --accent: #e94560;
            --highlight: #f39c12;
            --text: #f1f1f1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--primary);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            padding: 2rem;
            background: rgba(22, 33, 62, 0.3);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: rgba(241, 241, 241, 0.7);
            font-weight: 400;
        }

        .excavation-site {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .strata-container {
            width: 100%;
            max-width: 1200px;
            height: 80%;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .geological-layer {
            position: absolute;
            width: 100%;
            transition: transform 0.6s ease;
        }

        .layer-1 {
            height: 35%;
            top: 0;
            background: linear-gradient(180deg, var(--secondary) 0%, rgba(22, 33, 62, 0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        .layer-2 {
            height: 35%;
            top: 35%;
            background: linear-gradient(180deg, rgba(22, 33, 62, 0.8) 0%, rgba(26, 26, 46, 0.9) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        .layer-3 {
            height: 30%;
            top: 70%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .layer-label {
            font-size: 1.25rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.3;
        }

        .artifact {
            position: absolute;
            width: 60px;
            height: 60px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
        }

        .artifact:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(233, 69, 96, 0.6);
        }

        .artifact-1 {
            top: 15%;
            left: 20%;
        }

        .artifact-2 {
            top: 45%;
            right: 30%;
            background: var(--highlight);
            box-shadow: 0 4px 20px rgba(243, 156, 18, 0.4);
        }

        .artifact-2:hover {
            box-shadow: 0 6px 30px rgba(243, 156, 18, 0.6);
        }

        .artifact-3 {
            bottom: 15%;
            left: 40%;
        }

        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(22, 33, 62, 0.9);
            padding: 1rem 2rem;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        button {
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: var(--text);
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--highlight), transparent);
            top: 0;
            animation: scan 3s linear infinite;
            opacity: 0.6;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .info-panel {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(22, 33, 62, 0.9);
            padding: 1.5rem;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            min-width: 250px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .info-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.75rem;
            font-size: 0.875rem;
        }

        .info-label {
            color: rgba(241, 241, 241, 0.6);
        }

        .info-value {
            font-weight: 500;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            
            .info-panel {
                position: static;
                margin: 1rem;
                order: -1;
            }
            
            .excavation-site {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Dream Archaeology</h1>
        <p class="subtitle">Excavating layers of subconscious memory</p>
    </header>

    <div class="excavation-site">
        <div class="strata-container">
            <div class="scan-line"></div>
            
            <div class="geological-layer layer-1">
                <span class="layer-label">Recent Dreams</span>
                <div class="artifact artifact-1">💭</div>
            </div>
            
            <div class="geological-layer layer-2">
                <span class="layer-label">Deep Memory</span>
                <div class="artifact artifact-2">✨</div>
            </div>
            
            <div class="geological-layer layer-3">
                <span class="layer-label">Core Formation</span>
                <div class="artifact artifact-3">🔮</div>
            </div>
        </div>

        <div class="info-panel">
            <h2 class="info-title">Current Analysis</h2>
            <div class="info-item">
                <span class="info-label">Depth</span>
                <span class="info-value">142m</span>
            </div>
            <div class="info-item">
                <span class="info-label">Artifacts Found</span>
                <span class="info-value">3</span>
            </div>
            <div class="info-item">
                <span class="info-label">Time Period</span>
                <span class="info-value">2-5 years</span>
            </div>
            <div class="info-item">
                <span class="info-label">Integrity</span>
                <span class="info-value">87%</span>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="excavate()">Excavate</button>
        <button onclick="analyze()">Analyze</button>
        <button onclick="preserve()">Preserve</button>
    </div>

    <script>
        function excavate() {
            document.querySelectorAll('.geological-layer').forEach((layer, index) => {
                layer.style.transform = `translateY(${index * 10}px)`;
            });
        }

        function analyze() {
            document.querySelectorAll('.artifact').forEach(artifact => {
                artifact.style.animation = 'pulse 1s ease-in-out';
            });
        }

        function preserve() {
            document.querySelector('.scan-line').style.animationDuration = '1s';
        }

        document.querySelectorAll('.artifact').forEach(artifact => {
            artifact.addEventListener('click', function() {
                this.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    this.style.transform = 'scale(1)';
                }, 300);
            });
        });
    </script>
</body>
</html>
