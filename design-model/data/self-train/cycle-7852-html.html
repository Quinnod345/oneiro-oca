<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporal Fragrance Composer</title>
    <style>
        :root {
            --void: #0a0608;
            --timeline-core: #1a1618;
            --shard-base: #2a2825;
            --iridescent-1: #ff6b9d;
            --iridescent-2: #c44569;
            --iridescent-3: #9a1750;
            --aurora-cyan: #4ecdc4;
            --aurora-mint: #44a08d;
            --temporal-gold: #f7b731;
            --paradox-crimson: #ee5a6f;
            --glitch-violet: #8854d0;
            --smoke-opacity: 0.15;
            --text-primary: #f4f1ed;
            --text-secondary: #a8a29e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--void);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        .temporal-canvas {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spiral-timeline {
            position: absolute;
            width: 800px;
            height: 800px;
            transform: rotate(-15deg);
        }

        .timeline-path {
            fill: none;
            stroke: var(--timeline-core);
            stroke-width: 2;
            opacity: 0.4;
        }

        .era-marker {
            position: absolute;
            font-size: 11px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-secondary);
            transform-origin: center;
        }

        .era-marker.permian {
            top: 45%;
            left: 20%;
            transform: rotate(25deg);
        }

        .era-marker.jurassic {
            top: 25%;
            right: 35%;
            transform: rotate(-30deg);
        }

        .era-marker.cretaceous {
            bottom: 35%;
            right: 25%;
            transform: rotate(45deg);
        }

        .era-marker.devonian {
            bottom: 20%;
            left: 30%;
            transform: rotate(-60deg);
        }

        .time-shard {
            position: absolute;
            cursor: grab;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .time-shard:active {
            cursor: grabbing;
        }

        .shard-crystal {
            width: 80px;
            height: 120px;
            position: relative;
            transform-style: preserve-3d;
        }

        .shard-face {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, 
                rgba(255, 107, 157, 0.1) 0%,
                rgba(196, 69, 105, 0.2) 50%,
                rgba(154, 23, 80, 0.1) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            clip-path: polygon(50% 0%, 85% 25%, 85% 75%, 50% 100%, 15% 75%, 15% 25%);
            backdrop-filter: blur(10px);
        }

        .shard-face::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .olfactory-smoke {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        .smoke-particle {
            position: absolute;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            filter: blur(20px);
            opacity: var(--smoke-opacity);
            animation: drift 8s ease-in-out infinite;
        }

        .smoke-particle:nth-child(1) {
            background: radial-gradient(circle, var(--iridescent-1), transparent);
            animation-delay: 0s;
            left: 30%;
        }

        .smoke-particle:nth-child(2) {
            background: radial-gradient(circle, var(--aurora-cyan), transparent);
            animation-delay: 2s;
            left: 50%;
        }

        .smoke-particle:nth-child(3) {
            background: radial-gradient(circle, var(--aurora-mint), transparent);
            animation-delay: 4s;
            left: 70%;
        }

        @keyframes drift {
            0%, 100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            20% {
                opacity: var(--smoke-opacity);
            }
            50% {
                transform: translateY(-80px) translateX(20px) scale(1.5);
                opacity: 0.3;
            }
            80% {
                transform: translateY(-120px) translateX(-10px) scale(2);
                opacity: 0.1;
            }
        }

        .shard-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 0.05em;
            white-space: nowrap;
            color: var(--text-secondary);
        }

        .shard-1 {
            top: 30%;
            left: 25%;
        }

        .shard-2 {
            top: 45%;
            right: 30%;
        }

        .shard-3 {
            bottom: 35%;
            left: 35%;
        }

        .shard-4 {
            bottom: 25%;
            right: 25%;
        }

        .temporal-paradox {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .temporal-paradox.active {
            opacity: 1;
        }

        .glitch-line {
            position: absolute;
            height: 1px;
            background: var(--paradox-crimson);
            transform-origin: left center;
            animation: glitch-scan 0.5s linear infinite;
        }

        @keyframes glitch-scan {
            0% {
                transform: scaleX(0);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: scaleX(1);
                opacity: 0;
            }
        }

        .glitch-line:nth-child(1) {
            top: 30%;
            left: 20%;
            width: 200px;
            transform: rotate(25deg);
        }

        .glitch-line:nth-child(2) {
            top: 50%;
            right: 30%;
            width: 150px;
            transform: rotate(-45deg);
            animation-delay: 0.2s;
        }

        .glitch-line:nth-child(3) {
            bottom: 40%;
            left: 40%;
            width: 180px;
            transform: rotate(60deg);
            animation-delay: 0.4s;
        }

        .prismatic-warning {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 300px;
            pointer-events: none;
        }

        .prism-face {
            position: absolute;
            inset: 20%;
            border: 2px solid var(--glitch-violet);
            transform: rotate(45deg);
            animation: prism-rotate 2s linear infinite;
        }

        .prism-face:nth-child(2) {
            transform: rotate(30deg);
            border-color: var(--paradox-crimson);
            animation-delay: 0.3s;
        }

        .prism-face:nth-child(3) {
            transform: rotate(60deg);
            border-color: var(--temporal-gold);
            animation-delay: 0.6s;
        }

        @keyframes prism-rotate {
            0% {
                transform: rotate(45deg) scale(1);
                opacity: 0;
            }
            50% {
                transform: rotate(225deg) scale(1.2);
                opacity: 0.8;
            }
            100% {
                transform: rotate(405deg) scale(1);
                opacity: 0;
            }
        }

        .composition-panel {
            position: absolute;
            top: 40px;
            left: 40px;
            width: 300px;
            background: rgba(26, 22, 24, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .fragrance-note {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .fragrance-note.active {
            opacity: 1;
        }

        .note-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 12px;
            background: var(--aurora-cyan);
        }

        .note-name {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .note-era {
            font-size: 11px;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-left: auto;
        }

        .harmony-meter {
            position: absolute;
            bottom: 40px;
            right: 40px;
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }

        .harmony-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--aurora-mint), var(--aurora-cyan));
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .harmony-label {
            position: absolute;
            bottom: 12px;
            right: 0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-secondary);
        }

        .aurora-blend {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .aurora-blend.active {
            opacity: 1;
        }

        .aurora-layer {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            filter: blur(60px);
            mix-blend-mode: screen;
        }

        .aurora-layer:nth-child(1) {
            background: radial-gradient(circle at 30% 30%, var(--iridescent-1) 0%, transparent 70%);
            animation: aurora-shift 8s ease-in-out infinite;
        }

        .aurora-layer:nth-child(2) {
            background: radial-gradient(circle at 70% 70%, var(--aurora-cyan) 0%, transparent 70%);
            animation: aurora-shift 8s ease-in-out infinite reverse;
            animation-delay: 2s;
        }

        .aurora-layer:nth-child(3) {
            background: radial-gradient(circle at 50% 50%, var(--aurora-mint) 0%, transparent 70%);
            animation: aurora-pulse 4s ease-in-out infinite;
        }

        @keyframes aurora-shift {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }
            33% {
                transform: translate(20px, -20px) scale(1.1);
            }
            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        @keyframes aurora-pulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.2);
                opacity: 0.8;
            }
        }
    </style>
</head>
<body>
    <div class="temporal-canvas">
        <svg class="spiral-timeline" viewBox="0 0 800 800">
            <path class="timeline-path" d="M400,400 Q400,200 600,200 T600,600 Q400,600 400,400 Q400,300 500,300 T500,500 Q400,500 400,400" />
        </svg>

        <div class="era-marker permian">Permian</div>
        <div class="era-marker jurassic">Jurassic</div>
        <div class="era-marker cretaceous">Cretaceous</div>
        <div class="era-marker devonian">Devonian</div>

        <div class="time-shard shard-1">
            <div class="shard-crystal">
                <div class="shard-face"></div>
                <div class="olfactory-smoke">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
            </div>
            <div class="shard-label">Ancient Jasmine</div>
        </div>

        <div class="time-shard shard-2">
            <div class="shard-crystal">
                <div class="shard-face"></div>
                <div class="olfactory-smoke">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
            </div>
            <div class="shard-label">Moss Rose</div>
        </div>

        <div class="time-shard shard-3">
            <div class="shard-crystal">
                <div class="shard-face"></div>
                <div class="olfactory-smoke">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
            </div>
            <div class="shard-label">Primal Orchid</div>
        </div>

        <div class="time-shard shard-4">
            <div class="shard-crystal">
                <div class="shard-face"></div>
                <div class="olfactory-smoke">
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                    <div class="smoke-particle"></div>
                </div>
            </div>
            <div class="shard-label">Dawn Lily</div>
        </div>

        <div class="temporal-paradox">
            <div class="glitch-line"></div>
            <div class="glitch-line"></div>
            <div class="glitch-line"></div>
            <div class="prismatic-warning">
                <div class="prism-face"></div>
                <div class="prism-face"></div>
                <div class="prism-face"></div>
            </div>
        </div>

        <div class="aurora-blend">
            <div class="aurora-layer"></div>
            <div class="aurora-layer"></div>
            <div class="aurora-layer"></div>
        </div>
    </div>

    <div class="composition-panel">
        <h2 class="panel-title">Temporal Blend</h2>
        <div class="fragrance-note active">
            <div class="note-indicator"></div>
            <span class="note-name">Ancient Jasmine</span>
            <span class="note-era">Cretaceous</span>
        </div>
        <div class="fragrance-note">
            <div class="note-indicator"></div>
            <span class="note-name">Moss Rose</span>
            <span class="note-era">Permian</span>
        </div>
        <div class="fragrance-note">
            <div class="note-indicator"></div>
            <span class="note-name">Primal Orchid</span>
            <span class="note-era">Jurassic</span>
        </div>
    </div>

    <div class="harmony-meter">
        <div class="harmony-fill" style="width: 35%"></div>
    </div>
    <div class="harmony-label">Temporal Harmony</div>

    <script>
        const shards = document.querySelectorAll('.time-shard');
        const paradox = document.querySelector('.temporal-paradox');
        const aurora = document.querySelector('.aurora-blend');
        const harmonyFill = document.querySelector('.harmony-fill');
        let draggedShard = null;
        let positions = new Map();

        shards.forEach((shard, index) => {
            const rect = shard.getBoundingClientRect();
            positions.set(shard, { x: rect.left, y: rect.top });
            
            shard.addEventListener('mousedown', (e) => {
                draggedShard = shard;
                const rect = shard.getBoundingClientRect();
                shard.dataset.offsetX = e.clientX - rect.left;
                shard.dataset.offsetY = e.clientY - rect.top;
                shard.style.zIndex = '10';
                shard.style.transform = 'scale(1.1)';
            });
        });

        document.addEventListener('mousemove', (e) => {
            if (draggedShard) {
                const x = e.clientX - parseFloat(draggedShard.dataset.offsetX);
                const y = e.clientY - parseFloat(draggedShard.dataset.offsetY);
                draggedShard.style.left = x + 'px';
                draggedShard.style.top = y + 'px';
                draggedShard.style.position = 'fixed';
                
                checkProximity();
            }
        });

        document.addEventListener('mouseup', () => {
            if (draggedShard) {
                draggedShard.style.zIndex = '';
                draggedShard.style.transform = '';
                draggedShard = null;
            }
        });

        function checkProximity() {
            let closeShards = 0;
            let tooClose = false;
            
            shards.forEach((shard1) => {
                shards.forEach((shard2) => {
                    if (shard1 !== shard2) {
                        const rect1 = shard1.getBoundingClientRect();
                        const rect2 = shard2.getBoundingClientRect();
                        const distance = Math.sqrt(
                            Math.pow(rect1.left - rect2.left, 2) + 
                            Math.pow(rect1.top - rect2.top, 2)
                        );
                        
                        if (distance < 150) {
                            closeShards++;
                            if (distance < 80) {
                                tooClose = true;
                            }
                        }
                    }
                });
            });
            
            paradox.classList.toggle('active', tooClose);
            aurora.classList.toggle('active', closeShards > 2 && !tooClose);
            
            const harmony = Math.min(100, Math.max(0, (closeShards * 20) - (tooClose ? 50 : 0)));
            harmonyFill.style.width = harmony + '%';
        }
    </script>
</body>
</html>
