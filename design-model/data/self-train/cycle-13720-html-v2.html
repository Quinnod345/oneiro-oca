<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Argument Settler</title>
    <style>
        :root {
            --bg: #0a0f14;
            --coral-left: #ff6b35;
            --coral-right: #4ecdc4;
            --text: rgba(255, 255, 255, 0.9);
            --text-muted: rgba(255, 255, 255, 0.5);
            --border: rgba(255, 255, 255, 0.1);
            --spacing-unit: 1rem;
            --max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(var(--spacing-unit) * 2);
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
            flex: 1;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: calc(var(--spacing-unit) * 3);
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.02em;
            margin-bottom: calc(var(--spacing-unit) * 0.5);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: clamp(1rem, 2vw, 1.25rem);
        }

        .visualization {
            position: relative;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(var(--spacing-unit) * 4);
            align-items: center;
            min-height: 300px;
        }

        .coral-growth {
            position: relative;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: calc(var(--spacing-unit) * 2);
        }

        .coral {
            width: 100%;
            max-width: 300px;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .coral-left .coral {
            background: var(--coral-left);
        }

        .coral-right .coral {
            background: var(--coral-right);
        }

        .coral-growth.active .coral {
            height: var(--growth-height, 4px);
            box-shadow: 0 0 20px currentColor;
        }

        .divider {
            position: absolute;
            left: 50%;
            top: 20%;
            bottom: 20%;
            width: 1px;
            background: var(--border);
            transform: translateX(-50%);
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        .divider.visible {
            opacity: 1;
        }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: calc(var(--spacing-unit) * 4);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-unit);
        }

        label {
            font-size: 0.875rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: calc(var(--spacing-unit) * 1.5) calc(var(--spacing-unit) * 2);
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus {
            border-color: var(--text-muted);
            background: rgba(255, 255, 255, 0.02);
        }

        input::placeholder {
            color: var(--text-muted);
        }

        .tone-indicator {
            position: absolute;
            top: 50%;
            right: calc(var(--spacing-unit) * 1.5);
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border);
            transition: all 0.3s ease;
        }

        .status {
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
            min-height: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .visualization,
            .inputs {
                grid-template-columns: 1fr;
                gap: calc(var(--spacing-unit) * 2);
            }

            .divider {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Argument Settler</h1>
            <p class="subtitle">Watch your words grow into understanding</p>
        </header>

        <div class="visualization">
            <div class="coral-growth coral-left" data-side="left">
                <div class="coral"></div>
            </div>
            <div class="coral-growth coral-right" data-side="right">
                <div class="coral"></div>
            </div>
            <div class="divider"></div>
        </div>

        <div class="inputs">
            <div class="input-group">
                <label for="left-input">First Perspective</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="left-input" 
                        placeholder="Share your viewpoint..."
                        autocomplete="off"
                    >
                    <span class="tone-indicator" data-side="left"></span>
                </div>
            </div>
            <div class="input-group">
                <label for="right-input">Second Perspective</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="right-input" 
                        placeholder="Share your viewpoint..."
                        autocomplete="off"
                    >
                    <span class="tone-indicator" data-side="right"></span>
                </div>
            </div>
        </div>

        <div class="status">Begin typing to see your conversation take shape</div>
    </div>

    <script>
        const leftInput = document.getElementById('left-input');
        const rightInput = document.getElementById('right-input');
        const leftCoral = document.querySelector('.coral-left');
        const rightCoral = document.querySelector('.coral-right');
        const leftIndicator = document.querySelector('[data-side="left"]');
        const rightIndicator = document.querySelector('[data-side="right"]');
        const divider = document.querySelector('.divider');
        const status = document.querySelector('.status');

        function analyzeInput(text) {
            const length = text.length;
            const hasExclamation = text.includes('!');
            const hasQuestion = text.includes('?');
            const capsRatio = (text.match(/[A-Z]/g) || []).length / Math.max(length, 1);
            
            return {
                intensity: Math.min(length * 2, 200),
                aggressive: hasExclamation || capsRatio > 0.3,
                questioning: hasQuestion,
                empty: length === 0
            };
        }

        function updateCoral(input, coral, indicator) {
            const analysis = analyzeInput(input.value);
            
            if (analysis.empty) {
                coral.classList.remove('active');
                coral.style.setProperty('--growth-height', '4px');
                indicator.style.background = 'var(--border)';
                indicator.style.boxShadow = 'none';
            } else {
                coral.classList.add('active');
                coral.style.setProperty('--growth-height', `${analysis.intensity}px`);
                
                if (analysis.aggressive) {
                    indicator.style.background = 'var(--coral-left)';
                    indicator.style.boxShadow = '0 0 10px var(--coral-left)';
                } else if (analysis.questioning) {
                    indicator.style.background = 'var(--coral-right)';
                    indicator.style.boxShadow = '0 0 10px var(--coral-right)';
                } else {
                    indicator.style.background = 'var(--text-muted)';
                    indicator.style.boxShadow = '0 0 5px var(--text-muted)';
                }
            }
            
            updateStatus();
        }

        function updateStatus() {
            const leftAnalysis = analyzeInput(leftInput.value);
            const rightAnalysis = analyzeInput(rightInput.value);
            
            if (leftAnalysis.empty && rightAnalysis.empty) {
                status.textContent = 'Begin typing to see your conversation take shape';
                divider.classList.remove('visible');
            } else if (!leftAnalysis.empty && !rightAnalysis.empty) {
                if (leftAnalysis.aggressive && rightAnalysis.aggressive) {
                    status.textContent = 'High tension detected - consider calmer language';
                } else if (leftAnalysis.questioning || rightAnalysis.questioning) {
                    status.textContent = 'Questions open pathways to understanding';
                } else {
                    status.textContent = 'Balanced dialogue in progress';
                }
                divider.classList.add('visible');
            } else {
                status.textContent = 'Waiting for both perspectives...';
                divider.classList.remove('visible');
            }
        }

        leftInput.addEventListener('input', () => updateCoral(leftInput, leftCoral, leftIndicator));
        rightInput.addEventListener('input', () => updateCoral(rightInput, rightCoral, rightIndicator));
    </script>
</body>
</html>
