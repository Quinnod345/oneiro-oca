<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Decay</title>
    <style>
        :root {
            --primary: #1a1a1a;
            --accent: #e8d5d5;
            --fade: #f5f5f5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--primary);
            height: 100vh;
            font-family: Georgia, serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .memory-container {
            position: relative;
            width: 90vw;
            max-width: 1200px;
            height: 80vh;
        }

            background-size: cover;
            background-position: center;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .photograph::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 0%, rgba(26, 26, 26, 0.2) 100%);
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photograph:hover::before {
            opacity: 1;
        }

        .text-fragment {
            position: absolute;
            color: var(--accent);
            font-size: 18px;
            line-height: 1.6;
            opacity: 0;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fragment-1 {
            right: 20%;
            top: 25%;
            max-width: 280px;
            text-align: left;
        }

        .fragment-2 {
            left: 20%;
            bottom: 15%;
            max-width: 320px;
            font-size: 16px;
            color: var(--fade);
        }

        .photograph:hover ~ .text-fragment,
        .text-fragment:hover {
            opacity: 1;
        }

        .time-marker {
            position: absolute;
            bottom: 40px;
            right: 40px;
            color: var(--accent);
            font-size: 14px;
            opacity: 0.4;
            letter-spacing: 2px;
        }

        @media (max-width: 768px) {
            .photograph {
                left: 10%;
                top: 15%;
                width: 80%;
                height: auto;
                aspect-ratio: 3/2;
            }

            .fragment-1 {
                right: 10%;
                top: auto;
                bottom: 25%;
            }

            .fragment-2 {
                left: 10%;
                bottom: 10%;
            }
        }
    </style>
</head>
<body>
    <div class="memory-container">
        <div class="photograph"></div>
        
        <div class="text-fragment fragment-1">
            The edges blur where memory meets imagination. Each glance erodes another detail, replacing substance with suggestion.
        </div>
        
        <div class="text-fragment fragment-2">
            Time doesn't preserve; it selects. What remains is not truth but the story we've chosen to remember.
        </div>
        
        <div class="time-marker">1987—2024</div>
    </div>
</body>
</html>
