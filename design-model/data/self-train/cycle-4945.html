<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Habit Tracker</title>
    <style>
        :root {
            --earth-dark: #2d3b2a;
            --earth-medium: #3e5233;
            --earth-light: #5a7351;
            --soil: #8b6635;
            --water-blue: #4a90c2;
            --water-light: #7bb3d9;
            --leaf-green: #68b368;
            --leaf-vibrant: #4ecb71;
            --bloom-pink: #ff6b9d;
            --bloom-yellow: #ffd93d;
            --bloom-purple: #9b59b6;
            --wilt-brown: #a0724d;
            --wilt-gray: #7a7a7a;
            --sky: #e8f4f8;
            --sun: #ffcd3c;
            --shadow: rgba(45, 59, 42, 0.15);
            --text: #2d3b2a;
            --text-light: #5a7351;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(to bottom, var(--sky) 0%, #b8e2c7 100%);
            width: 1440px;
            height: 900px;
            overflow: hidden;
            position: relative;
            color: var(--text);
        }

        .sun {
            position: absolute;
            top: 40px;
            right: 80px;
            width: 80px;
            height: 80px;
            background: var(--sun);
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(255, 205, 60, 0.4);
            animation: glow 3s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { box-shadow: 0 0 40px rgba(255, 205, 60, 0.4); }
            to { box-shadow: 0 0 60px rgba(255, 205, 60, 0.6); }
        }

        .header {
            position: absolute;
            top: 50px;
            left: 80px;
            z-index: 10;
        }

        .title {
            font-size: 32px;
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-light);
            font-weight: 500;
        }

        .garden-container {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 600px;
        }

        .soil {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 120px;
            background: linear-gradient(to bottom, var(--soil) 0%, #6b4e28 100%);
            border-top: 4px solid var(--earth-medium);
        }

        .habits-grid {
            position: absolute;
            bottom: 120px;
            left: 80px;
            right: 80px;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 40px;
            align-items: end;
        }

        .habit-plant {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .habit-plant:hover {
            transform: translateY(-5px);
        }

        .plant {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 16px;
        }

        .stem {
            width: 6px;
            background: var(--leaf-green);
            border-radius: 3px;
            transition: all 0.4s ease;
        }

        .leaves {
            display: flex;
            gap: 4px;
            margin-bottom: 8px;
            transition: all 0.4s ease;
        }

        .leaf {
            width: 16px;
            height: 24px;
            background: var(--leaf-green);
            border-radius: 50% 10% 50% 10%;
            transform: rotate(-45deg);
            transition: all 0.4s ease;
            animation: sway 4s ease-in-out infinite;
        }

        .leaf:nth-child(2) {
            transform: rotate(45deg) scaleX(-1);
            animation-delay: 0.5s;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-45deg) translateX(0); }
            50% { transform: rotate(-50deg) translateX(2px); }
        }

        .flowers {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            opacity: 0;
            transform: scale(0.3);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .flower {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            position: relative;
        }

        .flower::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 50%;
            background: inherit;
            opacity: 0.3;
        }

        .flower.pink { background: var(--bloom-pink); }
        .flower.yellow { background: var(--bloom-yellow); }
        .flower.purple { background: var(--bloom-purple); }

        .habit-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            margin-bottom: 8px;
            max-width: 120px;
        }

        .streak-counter {
            font-size: 12px;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.8);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .water-button {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: var(--water-blue);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px var(--shadow);
        }

        .habit-plant:hover .water-button {
            opacity: 1;
            transform: translateX(-50%) translateY(-5px);
        }

        .water-button:hover {
            background: var(--water-light);
            transform: translateX(-50%) translateY(-8px);
        }

        .water-drop {
            position: absolute;
            width: 8px;
            height: 12px;
            background: var(--water-light);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: fall 0.8s ease-in;
            pointer-events: none;
        }

        @keyframes fall {
            from {
                transform: translateY(-60px);
                opacity: 1;
            }
            to {
                transform: translateY(20px);
                opacity: 0;
            }
        }

        .stats-panel {
            position: absolute;
            top: 160px;
            right: 80px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 24px;
            width: 280px;
            box-shadow: 0 8px 32px var(--shadow);
        }

        .stats-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--earth-dark);
            margin-bottom: 20px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text);
            font-weight: 500;
        }

        .stat-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--earth-dark);
        }

        /* Plant states */
        .habit-plant.blooming .flowers {
            opacity: 1;
            transform: scale(1);
        }

        .habit-plant.blooming .leaves {
            filter: brightness(1.2);
        }

        .habit-plant.blooming .stem {
            background: var(--leaf-vibrant);
            height: 80px;
        }

        .habit-plant.healthy .stem {
            height: 60px;
            background: var(--leaf-green);
        }

        .habit-plant.wilted .leaves {
            filter: brightness(0.6) sepia(0.3);
            transform: rotate(15deg);
        }

        .habit-plant.wilted .stem {
            height: 30px;
            background: var(--wilt-brown);
        }

        .habit-plant.dead .leaves,
        .habit-plant.dead .flowers {
            filter: grayscale(1) brightness(0.4);
        }

        .habit-plant.dead .stem {
            height: 20px;
            background: var(--wilt-gray);
        }

        .clouds {
            position: absolute;
            top: 100px;
            left: 0;
            right: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50px;
            animation: drift 20s linear infinite;
        }

        .cloud:nth-child(1) {
            width: 80px;
            height: 40px;
            top: 20px;
            left: -100px;
        }

        .cloud:nth-child(2) {
            width: 120px;
            height: 60px;
            top: 80px;
            left: -150px;
            animation-duration: 25s;
            animation-delay: -10s;
        }

        @keyframes drift {
            from { transform: translateX(0); }
            to { transform: translateX(1540px); }
        }
    </style>
</head>
<body>
    <div class="sun"></div>
    
    <div class="clouds">
        <div class="cloud"></div>
        <div class="cloud"></div>
    </div>

    <div class="header">
        <h1 class="title">Garden Habit Tracker</h1>
        <p class="subtitle">Nurture your habits, watch them bloom</p>
    </div>

    <div class="stats-panel">
        <h3 class="stats-title">Garden Overview</h3>
        <div class="stat-item">
            <span class="stat-label">Plants Blooming</span>
            <span class="stat-value">3</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Longest Streak</span>
            <span class="stat-value">15 days</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Garden Health</span>
            <span class="stat-value">85%</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Total Habits</span>
            <span class="stat-value">6</span>
        </div>
    </div>

    <div class="garden-container">
        <div class="soil"></div>
        
        <div class="habits-grid">
            <div class="habit-plant blooming" data-habit="exercise">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower pink"></div>
                        <div class="flower yellow"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Exercise</div>
                <div class="streak-counter">15 day streak</div>
            </div>

            <div class="habit-plant healthy" data-habit="reading">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower purple"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Reading</div>
                <div class="streak-counter">7 day streak</div>
            </div>

            <div class="habit-plant blooming" data-habit="meditation">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower purple"></div>
                        <div class="flower pink"></div>
                        <div class="flower yellow"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Meditation</div>
                <div class="streak-counter">12 day streak</div>
            </div>

            <div class="habit-plant wilted" data-habit="writing">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower yellow"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Writing</div>
                <div class="streak-counter">2 days ago</div>
            </div>

            <div class="habit-plant healthy" data-habit="water">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower pink"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Drink Water</div>
                <div class="streak-counter">3 day streak</div>
            </div>

            <div class="habit-plant dead" data-habit="coding">
                <button class="water-button" onclick="waterPlant(this)">💧</button>
                <div class="plant">
                    <div class="flowers">
                        <div class="flower purple"></div>
                    </div>
                    <div class="leaves">
                        <div class="leaf"></div>
                        <div class="leaf"></div>
                    </div>
                    <div class="stem"></div>
                </div>
                <div class="habit-name">Coding Practice</div>
                <div class="streak-counter">5 days ago</div>
            </div>
        </div>
    </div>

    <script>
        function waterPlant(button) {
            const plant = button.parentElement;
            const drop = document.createElement('div');
            drop.className = 'water-drop';
            drop.style.left = '50%';
            drop.style.top = '-50px';
            drop.style.transform = 'translateX(-50%)';
            
            plant.appendChild(drop);
            
            setTimeout(() => {
                drop.remove();
                
                // Upgrade plant state
                if (plant.classList.contains('dead')) {
                    plant.className = 'habit-plant wilted';
                } else if (plant.classList.contains('wilted')) {
                    plant.className = 'habit-plant healthy';
                } else if (plant.classList.contains('healthy')) {
                    plant.className = 'habit-plant blooming';
                }
                
                // Update streak counter
                const counter = plant.querySelector('.streak-counter');
                const currentStreak = parseInt(counter.textContent) || 1;
                counter.textContent = `${currentStreak + 1} day streak`;
                
            }, 800);
        }

        // Add some natural movement to plants
        document.querySelectorAll('.leaf').forEach((leaf, index) => {
            leaf.style.animationDelay = `${index * 0.2}s`;
        });
    </script>
</body>
</html>
