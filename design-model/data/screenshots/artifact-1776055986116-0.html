<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: radial-gradient(ellipse at 30% 20%, #1a1a2e 0%, #0d0d0d 60%);
    font-family: -apple-system, 'SF Pro Display', 'SF Pro Text', BlinkMacSystemFont, sans-serif;
  }

  .panel {
    width: 320px;
    background: rgba(30, 30, 32, 0.96);
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.10);
    box-shadow:
      0 32px 64px rgba(0,0,0,0.6),
      0 8px 24px rgba(0,0,0,0.4),
      0 1px 0 rgba(255,255,255,0.06) inset;
    overflow: hidden;
    backdrop-filter: blur(40px) saturate(180%);
  }

  .header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    display: flex; align-items: center; gap: 10px;
  }

  .app-icon {
    width: 28px; height: 28px; border-radius: 7px;
    background: linear-gradient(145deg, #2563eb, #7c3aed);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(37,99,235,0.4);
  }

  .header-text { flex: 1; }

  .header-title {
    font-size: 13px; font-weight: 600; letter-spacing: -0.2px;
    color: rgba(255,255,255,0.92);
  }

  .header-sub {
    font-size: 11px; color: rgba(255,255,255,0.38);
    letter-spacing: 0.1px; margin-top: 1px;
  }

  .section-label {
    padding: 14px 18px 6px;
    font-size: 11px; font-weight: 600;
    color: rgba(255,255,255,0.28);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }

  .toggle-row {
    display: flex; align-items: center;
    padding: 11px 18px;
    gap: 12px;
    transition: background 0.15s ease;
    cursor: default;
  }

  .toggle-row:hover { background: rgba(255,255,255,0.035); }

  .toggle-info { flex: 1; min-width: 0; }

  .toggle-title {
    font-size: 13px; font-weight: 450;
    color: rgba(255,255,255,0.88);
    letter-spacing: -0.15px;
  }

  .toggle-desc {
    font-size: 11.5px; color: rgba(255,255,255,0.34);
    margin-top: 2px; line-height: 1.4;
    letter-spacing: 0.05px;
  }

  .toggle { position: relative; flex-shrink: 0; }

  .toggle input { display: none; }

  .toggle-track {
    display: block; width: 40px; height: 24px;
    background: rgba(255,255,255,0.12);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
  }

  .toggle-track::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s ease;
  }

  .toggle input:checked + .toggle-track {
    background: #30d158;
    border-color: transparent;
    box-shadow: 0 0 0 0.5px rgba(48,209,88,0.4);
  }

  .toggle input:checked + .toggle-track::after {
    transform: translateX(16px);
    background: #fff;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.055);
    margin: 0 18px;
  }

  .footer {
    padding: 14px 16px;
    display: flex;
    justify-content: flex-end;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 4px;
  }

  .btn-done {
    height: 28px; padding: 0 16px;
    background: #0a84ff;
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 13px; font-weight: 500;
    font-family: inherit;
    letter-spacing: -0.1px;
    cursor: pointer;
    box-shadow: 0 1px 0 rgba(255,255,255,0.15) inset, 0 2px 8px rgba(10,132,255,0.35);
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn-done:hover { opacity: 0.88; }
  .btn-done:active { transform: scale(0.97); opacity: 0.8; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div class="app-icon">◈</div>
    <div class="header-text">
      <div class="header-title">Alcove</div>
      <div class="header-sub">Menu Bar Preferences</div>
    </div>
  </div>

  <div class="section-label">Appearance</div>

  <div class="toggle-row">
    <div class="toggle-info">
      <div class="toggle-title">Show in Menu Bar</div>
      <div class="toggle-desc">Keep the Alcove icon visible at all times</div>
    </div>
    <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
  </div>
  <div class="divider"></div>
  <div class="toggle-row">
    <div class="toggle-info">
      <div class="toggle-title">Use Compact Layout</div>
      <div class="toggle-desc">Reduce spacing between menu items</div>
    </div>
    <label class="toggle"><input type="checkbox"><span class="toggle-track"></span></label>
  </div>

  <div class="section-label" style="padding-top:12px">Behavior</div>

  <div class="toggle-row">
    <div class="toggle-info">
      <div class="toggle-title">Launch at Login</div>
      <div class="toggle-desc">Start Alcove automatically on sign in</div>
    </div>
    <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
  </div>
  <div class="divider"></div>
  <div class="toggle-row">
    <div class="toggle-info">
      <div class="toggle-title">Focus Mode Sync</div>
      <div class="toggle-desc">Pause notifications during Do Not Disturb</div>
    </div>
    <label class="toggle"><input type="checkbox" checked><span class="toggle-track"></span></label>
  </div>

  <div class="footer">
    <button class="btn-done">Done</button>
  </div>
</div>
</body>
</html>
