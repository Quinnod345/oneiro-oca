<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delete Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Sora:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: #1a1f2e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Backdrop */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(8, 10, 18, 0.82);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 0.18s ease-out forwards;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Card */
  .modal {
    background: #0f1117;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
    width: 100%;
    max-width: 420px;
    padding: 36px 36px 32px;
    position: relative;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04),
      0 24px 64px rgba(0,0,0,0.6),
      0 8px 24px rgba(0,0,0,0.4);
    animation: slideUp 0.22s cubic-bezier(0.34, 1.44, 0.64, 1) forwards;
    overflow: hidden;
  }

  .modal::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
    opacity: 0.025;
    pointer-events: none;
    border-radius: 18px;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Icon */
  .icon-wrap {
    width: 52px;
    height: 52px;
    margin-bottom: 22px;
    position: relative;
  }

  .icon-hex {
    width: 52px;
    height: 52px;
    background: rgba(220, 48, 48, 0.12);
    border: 1.5px solid rgba(220, 48, 48, 0.28);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transform: rotate(0deg);
    position: relative;
  }

  .icon-hex::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 18px;
    border: 1px solid rgba(220, 48, 48, 0.08);
  }

  .icon-hex svg {
    width: 22px;
    height: 22px;
    color: #e84040;
  }

  /* Text content */
  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: #f0f0f2;
    letter-spacing: -0.3px;
    margin-bottom: 10px;
    line-height: 1.2;
  }

  .modal-body {
    font-size: 13.5px;
    line-height: 1.65;
    color: #7c8199;
    font-weight: 300;
    margin-bottom: 6px;
  }

  .modal-body strong {
    color: #9ca3b8;
    font-weight: 500;
  }

  .consequence-list {
    margin: 14px 0 28px;
    padding: 14px 16px;
    background: rgba(220, 48, 48, 0.055);
    border: 1px solid rgba(220, 48, 48, 0.13);
    border-radius: 10px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }

  .consequence-list li {
    font-size: 12.5px;
    color: #8a6868;
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-weight: 400;
    line-height: 1.5;
  }

  .consequence-list li::before {
    content: '';
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #c04040;
    flex-shrink: 0;
    margin-top: 6px;
    opacity: 0.7;
  }

  /* Divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.055);
    margin-bottom: 22px;
  }

  /* Buttons */
  .actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }

  .btn {
    font-family: 'Sora', sans-serif;
    font-size: 13px;
    font-weight: 500;
    padding: 10px 20px;
    border-radius: 9px;
    border: none;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: all 0.15s ease;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: white;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .btn:hover::after { opacity: 0.05; }
  .btn:active { transform: scale(0.975); }

  .btn-cancel {
    background: transparent;
    color: #6b7290;
    border: 1px solid rgba(255,255,255,0.09);
  }

  .btn-cancel:hover {
    color: #9ba2bc;
    border-color: rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.03);
  }

  .btn-delete {
    background: #c03030;
    color: #fff;
    box-shadow: 0 2px 12px rgba(192, 48, 48, 0.35), 0 1px 3px rgba(0,0,0,0.3);
    background-image: linear-gradient(180deg, #d43535 0%, #b82c2c 100%);
  }

  .btn-delete:hover {
    background-image: linear-gradient(180deg, #df3a3a 0%, #c23030 100%);
    box-shadow: 0 4px 18px rgba(192, 48, 48, 0.5), 0 1px 3px rgba(0,0,0,0.3);
    transform: translateY(-1px);
  }

  .btn-delete:active {
    transform: translateY(0) scale(0.975);
    box-shadow: 0 1px 6px rgba(192, 48, 48, 0.3);
  }
</style>
</head>
<body>

<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
  <div class="modal">

    <div class="icon-wrap">
      <div class="icon-hex">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
    </div>

    <h2 class="modal-title" id="modal-title">Delete Project?</h2>
    <p class="modal-body">
      You're about to permanently delete <strong>Oneiro Core</strong>. This action cannot be undone.
    </p>

    <ul class="consequence-list">
      <li>All files, assets, and build history will be erased</li>
      <li>Collaborators will immediately lose access</li>
      <li>Active integrations and webhooks will be disconnected</li>
    </ul>

    <div class="divider"></div>

    <div class="actions">
      <button class="btn btn-cancel" type="button" onclick="this.closest('.overlay').style.opacity=0;setTimeout(()=>this.closest('.overlay').style.display='none',150)">
        Cancel
      </button>
      <button class="btn btn-delete" type="button">
        Delete Project
      </button>
    </div>

  </div>
</div>

</body>
</html>
