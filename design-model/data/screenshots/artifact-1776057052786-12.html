<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111214;
    font-family: 'DM Sans', sans-serif;
    color: #e2e2e2;
  }

  .card {
    width: 340px;
    background: #1a1b1e;
    border: 1px solid #2a2b2f;
    border-radius: 16px;
    padding: 36px 32px 28px;
    text-align: center;
  }

  .avatar {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: 0 auto 20px;
    background: #2a2b2f;
    overflow: hidden;
    border: 2px solid #2e2f34;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .avatar-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: #8b8c91;
    background: linear-gradient(135deg, #232428, #2a2b30);
  }

  .name {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    font-weight: 400;
    color: #f0f0f0;
    margin-bottom: 4px;
    letter-spacing: 0.01em;
  }

  .handle {
    font-size: 13px;
    font-weight: 300;
    color: #5a5b61;
    margin-bottom: 16px;
    letter-spacing: 0.02em;
  }

  .divider {
    height: 1px;
    background: #232428;
    margin: 0 -8px 16px;
  }

  .bio {
    font-size: 14px;
    font-weight: 300;
    line-height: 1.65;
    color: #8b8c91;
    margin-bottom: 24px;
  }

  .stats {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-bottom: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: #d8d8d8;
  }

  .stat-label {
    font-size: 11px;
    font-weight: 500;
    color: #45464c;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 8px;
    background: #222328;
    border: 1px solid #2a2b30;
    color: #7a7b81;
    text-decoration: none;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.02em;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .social-link:hover {
    background: #28292e;
    color: #b0b1b7;
    border-color: #38393f;
  }

  .social-link svg {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
</style>
</head>
<body>
<div class="card">
  <div class="avatar">
    <div class="avatar-fallback">AJ</div>
  </div>
  <div class="name">Alex Jordan</div>
  <div class="handle">@alexjordan</div>
  <div class="divider"></div>
  <p class="bio">Product designer and occasional writer. Interested in interfaces, systems thinking, and the space between them.</p>
  <div class="stats">
    <div class="stat">
      <span class="stat-value">214</span>
      <span class="stat-label">Projects</span>
    </div>
    <div class="stat">
      <span class="stat-value">4.2k</span>
      <span class="stat-label">Followers</span>
    </div>
    <div class="stat">
      <span class="stat-value">312</span>
      <span class="stat-label">Following</span>
    </div>
  </div>
  <div class="social-links">
    <a href="#" class="social-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/></svg>
      GitHub
    </a>
    <a href="#" class="social-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 4s-.7 2.1-2 3.4c1.6 10-9.4 17.3-18 11.6 2.2.1 4.4-.6 6-2C3 15.5.5 9.6 3 5c2.2 2.6 5.6 4.1 9 4-.9-4.2 4-6.6 7-3.8 1.1 0 3-1.2 3-1.2z"/></svg>
      Twitter
    </a>
    <a href="#" class="social-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
      LinkedIn
    </a>
  </div>
</div>
</body>
</html>
