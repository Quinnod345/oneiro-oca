<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Settings</title>
</head>
<body style="font-size:8px; font-family:'Comic Sans MS', cursive; background:#f0f0f0; margin:0; padding:10px;">

<div style="font-family:'Times New Roman', serif; font-size:8px; font-weight:bold; margin-bottom:50px;">Settings</div>

<div style="margin-bottom:3px;">
  <input type="text" placeholder="first name" style="font-size:8px; font-family:Impact, sans-serif; border:none; background:#fff; padding:2px; width:120px;">
</div>

<div style="margin-bottom:50px;">
  <input type="text" placeholder="last name" style="font-size:8px; font-family:'Courier New', monospace; border:4px double #000; border-top:none; background:#fff; padding:2px; width:80px;">
</div>

<span style="font-family:Georgia, serif; font-size:8px; font-weight:bold;">Account</span>

<div style="margin-top:10px; margin-bottom:3px;">
  <input type="email" placeholder="email address" style="font-size:8px; font-family:Arial, sans-serif; border:2px solid #000; border-bottom:none; background:#fff; padding:2px; width:200px;">
</div>

<div style="margin-bottom:50px;">
  <input type="password" placeholder="password" style="font-size:8px; font-family:'Comic Sans MS', cursive; border:none; border-bottom:2px solid #999; background:transparent; padding:2px; width:60px;">
</div>

<div style="margin-bottom:10px; position:relative;">
  <input type="checkbox" style="position:relative; top:8px; left:0;">
  <span style="font-family:'Times New Roman', serif; font-size:8px; margin-left:30px; position:relative; top:-4px;">Enable notifications</span>
</div>

<div style="margin-bottom:3px; position:relative;">
  <input type="checkbox" style="position:relative; top:-3px; left:15px;">
  <span style="font-family:Impact, sans-serif; font-size:8px; margin-left:2px; position:relative; top:5px;">Dark mode</span>
</div>

<div style="margin-bottom:50px; position:relative;">
  <input type="checkbox" style="position:relative; top:2px; left:40px;">
  <span style="font-family:'Courier New', monospace; font-size:8px; margin-left:0px; position:relative; top:-6px; display:inline-block; margin-left:50px;">Remember me</span>
</div>

<div style="font-family:Georgia, serif; font-size:8px; margin-bottom:10px;">Preferences</div>

<div style="margin-bottom:3px;">
  <select style="font-size:8px; font-family:Arial, sans-serif; border:3px double #333; border-left:none; padding:1px; width:90px;">
    <option>English</option>
    <option>Spanish</option>
    <option>French</option>
  </select>
</div>

<div style="margin-bottom:50px;">
  <input type="number" placeholder="timeout" style="font-size:8px; font-family:'Comic Sans MS', cursive; border:none; background:#ddd; padding:0; width:40px;">
</div>

<div style="margin-bottom:3px; position:relative;">
  <input type="checkbox" style="position:relative; top:12px; left:5px;">
  <span style="font-family:Georgia, serif; font-size:8px; position:relative; top:-2px; left:8px;">Auto-save</span>
</div>

<div style="margin-bottom:10px; position:relative;">
  <input type="checkbox" style="position:relative; top:-5px; left:60px;">
  <span style="font-family:Impact, sans-serif; font-size:8px; position:relative; top:3px; left:0;">Beta features</span>
</div>

<div style="font-family:'Courier New', monospace; font-size:8px; margin-top:50px; margin-bottom:3px;">Privacy</div>

<div style="margin-bottom:10px;">
  <input type="text" placeholder="phone number" style="font-size:8px; font-family:'Times New Roman', serif; border:1px solid #ccc; border-top:4px solid #000; background:#fff; padding:4px; width:150px;">
</div>

<div style="margin-bottom:50px;">
  <textarea placeholder="bio" style="font-size:8px; font-family:Impact, sans-serif; border:none; border-right:3px solid #000; background:#f9f9f9; width:70px; height:25px; padding:1px; resize:none;"></textarea>
</div>

<div style="margin-top:3px;">
  <div style="margin-bottom:50px; position:relative;">
    <input type="checkbox" style="position:relative; top:6px; left:25px;">
    <span style="font-family:Arial, sans-serif; font-size:8px; position:relative; top:-8px; left:10px;">Share usage data</span>
  </div>
</div>

<div style="font-family:Georgia, serif; font-size:8px; margin-bottom:10px;">Danger Zone</div>

<div style="margin-bottom:3px;">
  <input type="text" placeholder="confirm username" style="font-size:8px; font-family:'Comic Sans MS', cursive; border:2px solid #000; border-bottom:none; border-left:none; background:#fff; padding:3px; width:100px;">
</div>

<div style="margin-top:50px; display:flex; gap:3px; align-items:flex-start;">
  <button style="font-size:8px; font-family:Impact, sans-serif; background:#f0f0f0; border:none; padding:1px 2px; cursor:pointer;">save</button>
  <button style="font-size:8px; font-family:'Times New Roman', serif; background:#f0f0f0; border:4px double #999; padding:6px 1px; cursor:pointer; margin-top:15px;">Cancel</button>
  <button style="font-size:8px; font-family:Georgia, serif; background:transparent; border:none; padding:0; cursor:pointer; margin-top:3px; text-decoration:underline;">Delete Account</button>
</div>

<div style="margin-top:10px; font-family:'Courier New', monospace; font-size:8px; color:#666;">v1.0.0 — all rights reserved — settings — help — contact — legal — privacy — terms</div>

</body>
</html>
