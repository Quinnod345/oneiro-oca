<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=Fraunces:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --border: #2a2a2e;
    --border-focus: #5a5a6e;
    --text: #d4d4dc;
    --muted: #6b6b7a;
    --accent: #a78bfa;
    --error: #f87171;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 2.5rem 2.25rem;
  }

  .header {
    margin-bottom: 2rem;
  }

  .wordmark {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--accent);
    letter-spacing: -0.02em;
    margin-bottom: 1.25rem;
  }

  h1 {
    font-size: 0.7rem;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .field {
    margin-bottom: 1.1rem;
  }

  label {
    display: block;
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.45rem;
  }

  input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 300;
    font-size: 0.875rem;
    padding: 0.65rem 0.75rem;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }

  input::placeholder { color: var(--muted); opacity: 0.5; }

  input:focus { border-color: var(--border-focus); }

  .forgot {
    display: block;
    text-align: right;
    font-size: 0.65rem;
    letter-spacing: 0.06em;
    color: var(--muted);
    text-decoration: none;
    margin-top: 0.5rem;
    transition: color 0.15s;
  }

  .forgot:hover { color: var(--accent); }

  button {
    width: 100%;
    margin-top: 1.75rem;
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    padding: 0.8rem;
    cursor: pointer;
    transition: opacity 0.15s;
  }

  button:hover { opacity: 0.85; }
  button:active { opacity: 0.7; }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 1.75rem 0;
  }

  .footer {
    font-size: 0.65rem;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-align: center;
  }

  .footer a {
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1px;
    transition: border-color 0.15s;
  }

  .footer a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="wordmark">Oneiro</div>
    <h1>Sign in to your account</h1>
  </div>

  <form>
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <a href="#" class="forgot">Forgot password?</a>
    </div>

    <button type="submit">Continue</button>
  </form>

  <div class="divider"></div>

  <p class="footer">No account? <a href="#">Create one</a></p>
</div>
</body>
</html>
