<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookie Consent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;1,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #111210;
    --surface: #1a1c19;
    --border: #2e3029;
    --text-primary: #d4d5ce;
    --text-muted: #757669;
    --accent: #b8a96a;
    --accent-dim: rgba(184,169,106,0.12);
    --reject-bg: transparent;
    --reject-hover: rgba(255,255,255,0.05);
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: 'Crimson Pro', Georgia, serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 1.2rem;
    padding: 2rem;
  }

  .page-content {
    text-align: center;
    opacity: 0.25;
    user-select: none;
    max-width: 480px;
  }

  .page-content h1 {
    font-size: 2.2rem;
    font-weight: 300;
    letter-spacing: 0.04em;
    margin-bottom: 0.6rem;
  }

  .page-content p {
    font-size: 1.1rem;
    font-style: italic;
    color: var(--text-muted);
    line-height: 1.7;
  }

  /* Banner */
  .cookie-banner {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2rem;
    animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to   { transform: translateY(0);   opacity: 1; }
  }

  .cookie-banner.dismissed {
    animation: slideDown 0.3s ease-in forwards;
  }

  @keyframes slideDown {
    to { transform: translateY(100%); opacity: 0; }
  }

  .banner-text {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    flex: 1;
    min-width: 0;
  }

  .banner-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    font-weight: 300;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.15rem;
  }

  .banner-text p {
    font-size: 1rem;
    font-weight: 300;
    color: var(--text-primary);
    line-height: 1.5;
  }

  .banner-text a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-color: rgba(184,169,106,0.4);
  }

  .banner-actions {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-shrink: 0;
  }

  button {
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 400;
    cursor: pointer;
    border: 1px solid transparent;
    padding: 0.6rem 1.4rem;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .btn-accept {
    background: var(--accent-dim);
    color: var(--accent);
    border-color: rgba(184,169,106,0.3);
  }

  .btn-accept:hover {
    background: rgba(184,169,106,0.22);
    border-color: var(--accent);
  }

  .btn-reject {
    background: var(--reject-bg);
    color: var(--text-muted);
    border-color: var(--border);
  }

  .btn-reject:hover {
    background: var(--reject-hover);
    color: var(--text-primary);
  }

  @media (max-width: 580px) {
    .cookie-banner { flex-direction: column; align-items: flex-start; gap: 1rem; }
    .banner-actions { width: 100%; }
    button { flex: 1; }
  }
</style>
</head>
<body>

<div class="page-content">
  <h1>Your Privacy</h1>
  <p>This site uses cookies to improve your experience and analyze traffic.</p>
</div>

<div class="cookie-banner" id="banner" role="dialog" aria-label="Cookie consent">
  <div class="banner-text">
    <div class="banner-label">Cookie Notice</div>
    <p>We use cookies to understand how you use our site and to improve your experience.
       By continuing, you agree to our <a href="#">privacy policy</a>.</p>
  </div>
  <div class="banner-actions">
    <button class="btn-reject" onclick="dismiss()">Reject</button>
    <button class="btn-accept" onclick="dismiss()">Accept</button>
  </div>
</div>

<script>
  function dismiss() {
    const b = document.getElementById('banner');
    b.classList.add('dismissed');
    b.addEventListener('animationend', () => b.remove(), { once: true });
  }
</script>
</body>
</html>
