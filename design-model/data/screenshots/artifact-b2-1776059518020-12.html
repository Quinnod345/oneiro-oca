<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Indicator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f5f4f0;
    font-family: 'DM Sans', sans-serif;
  }

  .progress-wrapper {
    background: #ffffff;
    border-radius: 16px;
    padding: 48px 64px;
    box-shadow: 0 2px 24px rgba(0,0,0,0.06);
  }

  .steps {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    position: relative;
    z-index: 1;
  }

  .circle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s ease;
    position: relative;
  }

  .step.completed .circle {
    background: #1a1a1a;
    border: 2px solid #1a1a1a;
    color: #ffffff;
  }

  .step.completed .circle::after {
    content: '';
    display: block;
    width: 10px;
    height: 6px;
    border-left: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(-45deg) translateY(-1px);
  }

  .step.completed .circle span { display: none; }

  .step.active .circle {
    background: #ffffff;
    border: 2.5px solid #1a1a1a;
    color: #1a1a1a;
    box-shadow: 0 0 0 4px rgba(26,26,26,0.08);
  }

  .step.pending .circle {
    background: #ffffff;
    border: 2px solid #d4d2cc;
    color: #b0aea8;
  }

  .label {
    font-size: 11.5px;
    letter-spacing: 0.04em;
    white-space: nowrap;
    font-weight: 400;
  }

  .step.completed .label { color: #1a1a1a; font-weight: 500; }
  .step.active .label { color: #1a1a1a; font-weight: 500; }
  .step.pending .label { color: #b0aea8; }

  .connector {
    width: 80px;
    height: 2px;
    margin-bottom: 22px;
    flex-shrink: 0;
  }

  .connector.done {
    background: #1a1a1a;
  }

  .connector.undone {
    background: #d4d2cc;
    background-image: repeating-linear-gradient(
      to right,
      #d4d2cc 0,
      #d4d2cc 4px,
      transparent 4px,
      transparent 8px
    );
  }
</style>
</head>
<body>

<div class="progress-wrapper">
  <div class="steps">

    <div class="step completed">
      <div class="circle"><span>1</span></div>
      <div class="label">Account</div>
    </div>

    <div class="connector done"></div>

    <div class="step active">
      <div class="circle"><span>2</span></div>
      <div class="label">Details</div>
    </div>

    <div class="connector undone"></div>

    <div class="step pending">
      <div class="circle"><span>3</span></div>
      <div class="label">Payment</div>
    </div>

    <div class="connector undone"></div>

    <div class="step pending">
      <div class="circle"><span>4</span></div>
      <div class="label">Confirm</div>
    </div>

  </div>
</div>

</body>
</html>
