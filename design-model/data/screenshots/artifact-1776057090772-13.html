<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nav</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0f;
    --surface: #161618;
    --border: #2a2a2e;
    --text: #e8e8e6;
    --muted: #6b6b72;
    --accent: #c8f060;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
  }

  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.02em;
    color: var(--text);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    background: var(--accent);
    border-radius: 50%;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 4px;
    list-style: none;
  }

  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 6px 12px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }

  .nav-links a:hover { color: var(--text); background: var(--border); }
  .nav-links a.active { color: var(--text); }

  .nav-cta {
    background: var(--accent);
    color: #0e0e0f !important;
    border-radius: 6px;
    padding: 6px 14px !important;
    font-family: 'Space Mono', monospace;
    font-size: 12px !important;
    font-weight: 700;
    letter-spacing: 0.04em;
    transition: opacity 0.15s !important;
  }

  .nav-cta:hover { opacity: 0.85; background: none !important; color: #0e0e0f !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
    background: none;
    border: none;
  }

  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--muted);
    transition: transform 0.2s, opacity 0.2s;
  }

  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); background: var(--text); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); background: var(--text); }

  @media (max-width: 640px) {
    .hamburger { display: flex; }

    .nav-links {
      display: none;
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-direction: column;
      align-items: stretch;
      gap: 2px;
      padding: 12px;
    }

    .nav-links.open { display: flex; }
    .nav-links a { padding: 10px 12px; }
  }

  .page-content {
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(100vh - 60px);
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    font-size: 13px;
  }
</style>
</head>
<body>

<nav>
  <a href="#" class="logo">
    <span class="logo-dot"></span>
    ONEIRO
  </a>

  <ul class="nav-links" id="navLinks">
    <li><a href="#" class="active">Home</a></li>
    <li><a href="#">Work</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Journal</a></li>
    <li><a href="#" class="nav-cta">Contact</a></li>
  </ul>

  <button class="hamburger" id="hamburger" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page-content">page_content_here</div>

<script>
  const btn = document.getElementById('hamburger');
  const links = document.getElementById('navLinks');
  btn.addEventListener('click', () => {
    btn.classList.toggle('open');
    links.classList.toggle('open');
  });
</script>

</body>
</html>
