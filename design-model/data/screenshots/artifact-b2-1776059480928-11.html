<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breadcrumb</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,200&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f5f0e8;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
  }

  nav {
    background: #1a1714;
    padding: 18px 32px;
    border-radius: 2px;
    display: inline-flex;
    align-items: center;
    gap: 0;
    box-shadow: 6px 6px 0 #c8b89a;
  }

  .crumb {
    display: flex;
    align-items: center;
    gap: 0;
  }

  .crumb a {
    color: #8a7a6a;
    text-decoration: none;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  .crumb a:hover {
    color: #e8ddd0;
  }

  .crumb.active span {
    color: #f0e6d3;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    white-space: nowrap;
    font-style: italic;
    font-family: 'Fraunces', serif;
    font-size: 13px;
    letter-spacing: 0.04em;
  }

  .sep {
    color: #4a3f35;
    margin: 0 14px;
    font-size: 10px;
    font-weight: 300;
    user-select: none;
    display: flex;
    align-items: center;
  }

  .sep::before {
    content: '';
    display: block;
    width: 6px;
    height: 6px;
    border-top: 1px solid #6a5a4a;
    border-right: 1px solid #6a5a4a;
    transform: rotate(45deg);
  }
</style>
</head>
<body>

<nav aria-label="Breadcrumb">
  <div class="crumb"><a href="#">Home</a></div>
  <div class="sep"></div>
  <div class="crumb"><a href="#">Products</a></div>
  <div class="sep"></div>
  <div class="crumb"><a href="#">Electronics</a></div>
  <div class="sep"></div>
  <div class="crumb active" aria-current="page"><span>Smartphones</span></div>
</nav>

</body>
</html>
