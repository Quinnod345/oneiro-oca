<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
</head>
<body style="font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px;">
  <h2 style="margin-bottom: 24px;">Contact Us</h2>
  <form>
    <div style="margin-bottom: 16px;">
      <label for="name" style="display: block; margin-bottom: 4px;">Name</label>
      <input type="text" id="name" name="name" style="width: 100%; padding: 8px; border: 1px solid #ccc; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 16px;">
      <label for="email" style="display: block; margin-bottom: 4px;">Email</label>
      <input type="email" id="email" name="email" style="width: 100%; padding: 8px; border: 1px solid #ccc; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 16px;">
      <label for="subject" style="display: block; margin-bottom: 4px;">Subject</label>
      <select id="subject" name="subject" style="width: 100%; padding: 8px; border: 1px solid #ccc; box-sizing: border-box;">
        <option value="">Select a subject</option>
        <option value="general">General Inquiry</option>
        <option value="support">Support</option>
        <option value="billing">Billing</option>
        <option value="feedback">Feedback</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div style="margin-bottom: 16px;">
      <label for="message" style="display: block; margin-bottom: 4px;">Message</label>
      <textarea id="message" name="message" rows="6" style="width: 100%; padding: 8px; border: 1px solid #ccc; box-sizing: border-box; resize: vertical;"></textarea>
    </div>
    <button type="submit" style="padding: 8px 20px; background: #333; color: #fff; border: none; cursor: pointer;">Submit</button>
  </form>
</body>
</html>
