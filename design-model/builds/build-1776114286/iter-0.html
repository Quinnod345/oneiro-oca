<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Focus</title>
    <style>
        :root {
            --charcoal: #2a2a2a;
            --charcoal-light: #3a3a3a;
            --charcoal-dark: #1a1a1a;
            --amber: #ffb000;
            --amber-dim: #cc8800;
            --amber-glow: rgba(255, 176, 0, 0.3);
            --text-primary: #f5f5f5;
            --text-secondary: #999999;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
            background: linear-gradient(135deg, var(--charcoal) 0%, var(--charcoal-dark) 100%);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .timer-container {
            background: rgba(58, 58, 58, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 80px 60px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .timer-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, var(--amber-glow) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .timer-container.active::before {
            opacity: 1;
        }

        .time-display {
            font-size: 120px;
            font-weight: 200;
            letter-spacing: -0.02em;
            color: var(--text-primary);
            margin-bottom: 40px;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s ease;
        }

        .timer-container.active .time-display {
            color: var(--amber);
            text-shadow: 0 0 30px var(--amber-glow);
        }

        .session-type {
            font-size: 18px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .btn {
            background: transparent;
            border: 2px solid var(--text-secondary);
            color: var(--text-secondary);
            border-radius: 50px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            border-color: var(--amber);
            color: var(--amber);
            transform: translateY(-1px);
        }

        .btn.primary {
            background: var(--amber);
            border-color: var(--amber);
            color: var(--charcoal-dark);
            box-shadow: 0 4px 20px var(--amber-glow);
        }

        .btn.primary:hover {
            background: var(--amber-dim);
            border-color: var(--amber-dim);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px var(--amber-glow);
        }

        .session-selector {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .session-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            border-radius: 12px;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .session-btn.active {
            background: rgba(255, 176, 0, 0.1);
            border-color: var(--amber);
            color: var(--amber);
        }

        .session-btn:hover:not(.active) {
            border-color: rgba(255, 255, 255, 0.4);
            color: var(--text-primary);
        }

        .progress-ring {
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border-radius: 26px;
            background: conic-gradient(var(--amber) 0deg, transparent 0deg);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .timer-container.active .progress-ring {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="timer-container" id="timerContainer">
        <div class="progress-ring" id="progressRing"></div>
        <div class="session-type" id="sessionType">Focus Session</div>
        <div class="time-display" id="timeDisplay">25:00</div>
        <div class="controls">
            <button class="btn primary" id="startBtn">Start</button>
            <button class="btn" id="resetBtn">Reset</button>
        </div>
        <div class="session-selector">
            <button class="session-btn active" data-minutes="25">Focus</button>
            <button class="session-btn" data-minutes="5">Short Break</button>
            <button class="session-btn" data-minutes="15">Long Break</button>
        </div>
    </div>

    <script>
        let timer = null;
        let timeLeft = 25 * 60; // 25 minutes in seconds
        let totalTime = 25 * 60;
        let isRunning = false;

        const timerContainer = document.getElementById('timerContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const sessionType = document.getElementById('sessionType');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const progressRing = document.getElementById('progressRing');
        const sessionBtns = document.querySelectorAll('.session-btn');

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}:${remainingSeconds.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            timeDisplay.textContent = formatTime(timeLeft);
            const progress = ((totalTime - timeLeft) / totalTime) * 360;
            progressRing.style.background = `conic-gradient(var(--amber) ${progress}deg, transparent ${progress}deg)`;
        }

        function startTimer() {
            if (!isRunning) {
                isRunning = true;
                startBtn.textContent = 'Pause';
                timerContainer.classList.add('active');
                
                timer = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    if (timeLeft === 0) {
                        stopTimer();
                        // Timer complete - could add notification here
                    }
                }, 1000);
            } else {
                stopTimer();
            }
        }

        function stopTimer() {
            isRunning = false;
            startBtn.textContent = 'Start';
            timerContainer.classList.remove('active');
            clearInterval(timer);
        }

        function resetTimer() {
            stopTimer();
            timeLeft = totalTime;
            updateDisplay();
        }

        function setSession(minutes, type) {
            stopTimer();
            totalTime = minutes * 60;
            timeLeft = totalTime;
            sessionType.textContent = type;
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        sessionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sessionBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const minutes = parseInt(btn.dataset.minutes);
                const type = btn.textContent === 'Focus' ? 'Focus Session' : 
                           btn.textContent === 'Short Break' ? 'Short Break' : 'Long Break';
                setSession(minutes, type);
            });
        });

        updateDisplay();
    </script>
</body>
</html>
