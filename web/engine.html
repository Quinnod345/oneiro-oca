<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OCA Engine</title>
<meta name="description" content="The Oneiro Cognitive Architecture, live: what it wants, what it is worth, the risks it takes, how it feels, and what it built.">
<meta name="theme-color" content="#F7F7F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css?v=10">
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>OCA<small>the engine</small></span></div>
    <nav class="nav" id="nav" aria-label="Sections">
      <a href="#/overview" data-view="overview">Overview</a>
      <a href="#/wants" data-view="wants">Wants <span class="cnt" id="n-wants"></span></a>
      <a href="#/self-build" data-view="self-build">Self-build <span class="cnt" id="n-self"></span></a>
      <div class="sep"></div>
      <a href="#/worth" data-view="worth">Worth</a>
      <a href="#/risk" data-view="risk">Risk <span class="cnt" id="n-held"></span></a>
      <a href="#/affect" data-view="affect">Affect</a>
      <a href="#/thinker" data-view="thinker">Thinker</a>
      <div class="sep"></div>
      <a href="#/meter" data-view="meter">Chinese Room Meter</a>
    </nav>
    <div class="brain" id="brain" aria-label="Which brain the engine thinks with">
      <div class="lbl">Thinks with</div>
      <div class="seg" role="radiogroup" id="inference-seg">
        <button type="button" role="radio" data-mode="local" aria-checked="false" title="WORK's model over Tailscale. Never spends Codex.">Local</button>
        <button type="button" role="radio" data-mode="auto" aria-checked="false" title="Local first. Codex for the hard steps, and for everything while local is unreachable.">Auto</button>
        <button type="button" role="radio" data-mode="cloud" aria-checked="false" title="Codex for every step. Local only while Codex is out.">Cloud</button>
      </div>
      <div class="now" id="brain-now">…</div>
    </div>
    <div class="health" id="health"><div class="row"><span class="dot"></span>connecting…</div></div>
  </aside>
  <main id="main"><div class="page"><div class="empty">Loading…</div></div></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="engine.js?v=10"></script>
</body>
</html>
